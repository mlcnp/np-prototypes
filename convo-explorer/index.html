  font-display: swap;\n  src: url(\"5414f7a3-20f4-4b23-a0fd-4a375b3bb339\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Family tokens (mirror Figma variables font/primary, font/utility, font/mono) */\n  --font-primary: \"IBM Plex Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-utility: \"IBM Plex Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --font-display: \"DM Sans\", \"IBM Plex Sans\", -apple-system, sans-serif;\n\n  /* Semantic family aliases */\n  --psi-font-body: var(--font-primary);\n  --psi-font-label: var(--font-mono);   /* buttons, tags, chrome */\n  --psi-font-display: var(--font-display);\n}\n\n/* --- Type-scale utility classes (mirror the Figma \"Type\" page) -------------- */\n/* Editorial / marketing display — DM Sans */\n.psi-display      { font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 1.0; letter-spacing: -0.01em; }\n\n/* Headings — IBM Plex Sans */\n.psi-heading-lg        { font-family: var(--font-primary); font-weight: 500; font-size: 24px; line-height: 1.25; }   /* Heading large medium */\n.psi-heading-lg-strong { font-family: var(--font-primary); font-weight: 600; font-size: 24px; line-height: 1.25; }\n.psi-heading-md        { font-family: var(--font-primary); font-weight: 500; font-size: 18px; line-height: 1.25; }\n.psi-heading-sm-strong { font-family: var(--font-primary); font-weight: 600; font-size: 16px; line-height: 1.25; }   /* Heading small strong */\n\n/* Paragraph / body — IBM Plex Sans, 150% line-height */\n.psi-paragraph-lg        { font-family: var(--font-primary); font-weight: 400; font-size: 16px; line-height: 1.5; }   /* Paragraph large */\n.psi-paragraph-sm        { font-family: var(--font-primary); font-weight: 400; font-size: 14px; line-height: 1.5; }   /* Paragraph small */\n.psi-paragraph-sm-strong { font-family: var(--font-primary); font-weight: 600; font-size: 14px; line-height: 1.5; }   /* Paragraph small strong */\n\n/* Utility — IBM Plex Sans, 125% line-height (UI text, metadata) */\n.psi-utility-lg          { font-family: var(--font-utility); font-weight: 400; font-size: 16px; line-height: 1.25; }\n.psi-utility-lg-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 16px; line-height: 1.25; }\n.psi-utility-sm          { font-family: var(--font-utility); font-weight: 400; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-sm-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-tiny        { font-family: var(--font-utility); font-weight: 400; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-medium { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-strong { font-family: var(--font-utility); font-weight: 600; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-caps   { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; letter-spacing: 0.04em; text-transform: uppercase; }\n\n/* Data-viz labels — IBM Plex Sans */\n.psi-dataviz-heading { font-family: var(--font-utility); font-weight: 600; font-size: 18px; line-height: 1.25; }\n\n/* Mono / label — IBM Plex Mono (interactive labels, code, counters) */\n.psi-mono     { font-family: var(--font-mono); font-weight: 400; font-size: 14px; line-height: 1.25; }\n.psi-label    { font-family: var(--font-mono); font-weight: 400; font-size: 16px; line-height: 1.25; }   /* button / CTA label */\n.psi-label-sm { font-family: var(--font-mono); font-weight: 500; font-size: 12px; line-height: 1.25; }   /* tag / chip label */\n\n\n/* 4. Brand logo bitmaps (ZDF, RTBF) + illustration bitmaps */\n/* Generated by fig_materialize — background/mask classes for extracted bitmaps.\n * One rule per line; url()s are relative to this file, so it must stay\n * next to the assets/ directory it references. */\n.fig-asset-48866a150d930faa { background: url(./assets/48866a150d930faa.png) center / cover no-repeat; }\n.fig-asset-5e113eed29f430e6 { background: url(./assets/5e113eed29f430e6.png) center / cover no-repeat; }\n.fig-asset-a92e3c291b4c714a { background: url(./assets/a92e3c291b4c714a.png) center / cover no-repeat; }\n.fig-asset-cb898eb11b2dad56 { background: url(./assets/cb898eb11b2dad56.png) center / cover no-repeat; }\n\n/* Generated by fig_materialize — background/mask classes for extracted bitmaps.\n * One rule per line; url()s are relative to this file, so it must stay\n * next to the assets/ directory it references. */\n.fig-asset-48866a150d930faa { background: url(./assets/48866a150d930faa.png) center / cover no-repeat; }\n.fig-asset-5e113eed29f430e6 { background: url(./assets/5e113eed29f430e6.png) center / cover no-repeat; }\n.fig-asset-a92e3c291b4c714a { background: url(./assets/a92e3c291b4c714a.png) center / cover no-repeat; }\n\n<\u002Fstyle>\n<script src=\"cd661474-8601-4304-8911-07c348b1b173\"><\u002Fscript>\n<style>\n  body { margin:0; background:rgb(238,238,240); }\n  a { color: rgb(90,30,245); text-decoration: none; }\n  a:hover { text-decoration: underline; }\n  .cn-scroll::-webkit-scrollbar { width:10px; }\n  .cn-scroll::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.16); border-radius:100px; border:3px solid transparent; background-clip:padding-box; }\n  @keyframes cnUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes cnPop { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }\n  @keyframes cnFade { from { opacity:0; } to { opacity:1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:var(--font-primary);color:var(--colors-text-primary);\">\n\n  <!-- Top toolbar: brand + device toggle -->\n  <div style=\"width:100%;position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.92);backdrop-filter:saturate(1.1) blur(6px);box-shadow:0 1px 0 rgba(0,0,0,0.08);\">\n    <div style=\"max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;\">\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:13px;letter-spacing:0.02em;color:var(--colors-text-primary);\">\n        <span style=\"width:20px;height:20px;border-radius:6px;background:var(--colors-primary-brand-iris);display:inline-block;\"><\u002Fspan>\n        PSI · Conversation navigator\n      <\u002Fspan>\n      <span style=\"margin-left:auto;display:inline-flex;background:var(--colors-grey-scale-grey-2);border-radius:100px;padding:3px;gap:2px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ setDesktop }}\" style=\"{{ deskTabStyle }}\">Desktop<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ setMobile }}\" style=\"{{ mobTabStyle }}\">Mobile<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Stage that holds the (optionally phone-constrained) surface -->\n  <div style=\"width:100%;flex:1;display:flex;justify-content:center;padding:24px 16px 64px;box-sizing:border-box;\">\n    <div style=\"{{ surfaceStyle }}\">\n\n      <!-- ============ QUESTION HEADER (jasper, pinned) ============ -->\n      <div style=\"{{ headerStyle }}\">\n        <h1 style=\"margin:0 0 16px;font-weight:600;font-size:23px;line-height:1.25;letter-spacing:-0.01em;\">{{ question }}<\u002Fh1>\n        <div style=\"display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;color:var(--colors-text-primary);\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\" style=\"flex-shrink:0;\"><circle cx=\"11\" cy=\"9\" r=\"4\"><\u002Fcircle><path d=\"M11 15c-4 0-7 2.5-7 6v2h14v-2c0-3.5-3-6-7-6z\"><\u002Fpath><path d=\"M20 6a4 4 0 0 1 0 8\"><\u002Fpath><path d=\"M22 15c3.5 0.3 6 2.8 6 6v2h-6\"><\u002Fpath><\u002Fsvg>\n          <span>{{ statLine }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ============ SCROLLING CONTENT ============ -->\n      <div style=\"{{ scrollStyle }}\" class=\"cn-scroll\">\n\n      <!-- ============ SCREEN: FEED ============ -->\n      <sc-if value=\"{{ isFeed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:cnFade .2s ease;\">\n\n        <!-- PERSISTENT AFFORDANCE (A) -->\n        \n\n        <!-- sort row -->\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;\">\n          \n          <span style=\"font-family:var(--font-mono);font-size:12px;padding:6px 10px;border-radius:100px;color:var(--colors-text-secondary);\">Best<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;padding:6px 10px;border-radius:100px;background:var(--colors-primary-brand-tanzanite-3);color:var(--colors-text-accent);\">Newest<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- feed posts -->\n        <div style=\"background:var(--colors-primary-brand-tanzanite-3);border-radius:var(--psi-radius-16);padding:18px;margin-bottom:22px;color:var(--colors-text-primary);box-shadow:inset 0 0 0 1px rgba(90,30,245,0.18);\">\n          <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n            <div style=\"flex:1;min-width:200px;\">\n              <div style=\"font-weight:600;font-size:16px;line-height:1.35;\"><span style=\"font-weight: normal; font-size: 14px; width: 314px; height: 38px\">210 responses from CBC readers and counting. Explore this conversation by its themes.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ openBubbles }}\" style=\"flex-shrink:0;display:inline-flex;align-items:center;gap:8px;background:var(--colors-primary-brand-iris);color:#fff;font-family:var(--font-mono);font-weight:500;font-size:14px;border:none;border-radius:var(--psi-radius-8);padding:12px 16px;cursor:pointer;\">\n              Map the conversation →\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <sc-for list=\"{{ feedPosts }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fff;border-radius:var(--psi-radius-12);padding:16px;box-shadow:inset 0 0 0 1px var(--colors-border-primary), var(--psi-shadow-card);display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ p.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:500;font-size:13.5px;\">{{ p.author }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--colors-text-primary);\">{{ p.text }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onUp }}\" style=\"{{ p.upStyle }}\">▲ {{ p.up }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onReply }}\" style=\"margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;\">↩ Reply<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ feedExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:14px;animation:cnFade .2s ease;\">\n          <sc-for list=\"{{ extraFeedPosts }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;border-radius:var(--psi-radius-12);padding:16px;box-shadow:inset 0 0 0 1px var(--colors-border-primary), var(--psi-shadow-card);display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ p.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:500;font-size:13.5px;\">{{ p.author }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--colors-text-primary);\">{{ p.text }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onUp }}\" style=\"{{ p.upStyle }}\">▲ {{ p.up }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onReply }}\" style=\"margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;\">↩ Reply<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:center;margin-top:20px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleFeedExpand }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:13px;background:var(--colors-grey-scale-grey-1);color:var(--colors-text-secondary);box-shadow:inset 0 0 0 1px var(--colors-border-primary);border:none;border-radius:100px;padding:9px 16px;cursor:pointer;\">{{ feedMoreLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SCREEN: BUBBLES ============ -->\n      <sc-if value=\"{{ isBubbles }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:cnFade .2s ease;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"{{ backBtnStyle }}\">← Back to feed<\u002Fbutton>\n        <h2 style=\"margin:8px 0 4px;font-weight:600;font-size:20px;\">The conversation, mapped.<\u002Fh2>\n        <p style=\"margin:0 0 4px;font-size:13.5px;line-height:1.5;color:var(--colors-text-secondary);\"><span style=\"font-size: 13px;\">{{ mapHint }}<\u002Fspan><\u002Fp>\n\n        <!-- desktop: organic bubble cluster -->\n        <sc-if value=\"{{ showCluster }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:relative;margin:0 auto;{{ stageStyle }}\">\n          <sc-for list=\"{{ bubbles }}\" as=\"b\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ b.onClick }}\" style=\"{{ b.style }}\">\n              <span style=\"font-weight:600;font-size:{{ b.fontSize }};line-height:1.15;letter-spacing:-0.01em;text-wrap:balance;\">{{ b.label }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-weight:500;font-size:{{ b.countSize }};opacity:0.9;margin-top:4px;\">~{{ b.count }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- mobile: ranked proportional bars -->\n        <sc-if value=\"{{ showBars }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px;\">\n          <sc-for list=\"{{ themeBars }}\" as=\"b\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ b.onClick }}\" style=\"text-align:left;background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--colors-border-primary), var(--psi-shadow-card);border-radius:var(--psi-radius-12);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:14px;height:14px;border-radius:50%;flex-shrink:0;background:{{ b.color }};\"><\u002Fspan>\n                <span style=\"flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25;color:var(--colors-text-primary);\">{{ b.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-mono);font-weight:500;font-size:13px;color:var(--colors-text-secondary);white-space:nowrap;\">~{{ b.count }}<\u002Fspan>\n                <span style=\"color:var(--colors-text-hint);font-size:16px;line-height:1;\">›<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:8px;border-radius:100px;background:var(--colors-grey-scale-grey-2);overflow:hidden;\">\n                <span style=\"display:block;height:100%;width:{{ b.pct }};background:{{ b.color }};border-radius:100px;\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SCREEN: THEME DETAIL ============ -->\n      <sc-if value=\"{{ isTheme }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:cnFade .2s ease;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ openBubbles }}\" style=\"{{ backBtnStyle }}\">← All themes<\u002Fbutton>\n        <!-- mini bubble map header -->\n        <div style=\"display:flex;align-items:center;gap:10px;margin:10px 0 6px;\">\n          <span style=\"width:16px;height:16px;border-radius:50%;flex-shrink:0;background:{{ theme.color }};\"><\u002Fspan>\n          <h2 style=\"margin:0;font-weight:600;font-size:20px;line-height:1.2;\">{{ theme.label }}<\u002Fh2>\n        <\u002Fdiv>\n        \n\n        <div style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--colors-text-secondary);margin-bottom:10px;\">Representative posts<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <sc-for list=\"{{ theme.reps }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"position:relative;background:#fff;border-radius:var(--psi-radius-12);padding:16px 16px 16px 20px;box-shadow:inset 0 0 0 1px var(--colors-border-primary), var(--psi-shadow-card);display:flex;flex-direction:column;gap:10px;\">\n              <span style=\"position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:100px;background:{{ theme.color }};\"><\u002Fspan>\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ p.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:500;font-size:13.5px;\">{{ p.author }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.55;\">{{ p.text }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onUp }}\" style=\"{{ p.upStyle }}\">▲ {{ p.up }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onReply }}\" style=\"margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;\">↩ Reply<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- progressive disclosure: rest of the theme's responses -->\n        <sc-if value=\"{{ theme.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin:22px 0 10px;\">\n          <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--colors-text-secondary);\">All responses in this theme<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--colors-border-primary);\"><\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ theme.allLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;animation:cnFade .2s ease;\">\n          <sc-for list=\"{{ theme.rest }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border-radius:var(--psi-radius-12);padding:16px;box-shadow:inset 0 0 0 1px var(--colors-border-primary), var(--psi-shadow-card);display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ p.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:500;font-size:13.5px;\">{{ p.author }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ p.metaLine }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.55;\">{{ p.text }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onUp }}\" style=\"{{ p.upStyle }}\">▲ {{ p.up }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onReply }}\" style=\"margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;\">↩ Reply<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ p.replies }}\" as=\"r\" hint-placeholder-count=\"0\">\n                <div style=\"margin-left:14px;padding-left:14px;border-left:2px solid var(--colors-grey-scale-grey-3);display:flex;flex-direction:column;gap:8px;margin-top:2px;\">\n                  <div style=\"display:flex;align-items:center;gap:8px;\">\n                    <span style=\"width:24px;height:24px;border-radius:50%;flex-shrink:0;background:{{ r.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:10px;display:inline-flex;align-items:center;justify-content:center;\">{{ r.initials }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0;\">\n                      <div style=\"font-weight:500;font-size:12.5px;\">{{ r.author }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--colors-text-hint);\">{{ r.metaLine }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:13px;line-height:1.5;color:var(--colors-text-primary);\">{{ r.text }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleThemeExpand }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:14px;background:var(--colors-button-primary);color:var(--colors-text-on-primary-button);border:none;border-radius:var(--psi-radius-8);padding:12px 18px;cursor:pointer;\">{{ theme.expandLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <\u002Fdiv><!-- /cn-scroll -->\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ SCROLL OVERLAY (B) ============ -->\n  <sc-if value=\"{{ showOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,15,15,0.35);animation:cnFade .18s ease;\" sc-camel-on-click=\"{{ dismissOverlay }}\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:520px;margin:0 16px 22px;background:#fff;border-radius:var(--psi-radius-16);padding:22px;box-shadow:var(--psi-shadow-modal);animation:cnUp .28s cubic-bezier(0.2,0,0.1,1);\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;\">\n        <span style=\"width:44px;height:44px;border-radius:12px;flex-shrink:0;background:var(--colors-primary-brand-tanzanite-3);display:inline-flex;align-items:center;justify-content:center;font-size:22px;\">🗺️<\u002Fspan>\n        <div style=\"flex:1;\">\n          <div style=\"font-weight:600;font-size:17px;line-height:1.3;margin-bottom:4px;\">Still 190+ comments to go<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--colors-text-secondary);\">Instead of scrolling, see all 210 responses grouped into 8 themes — and jump straight to the views you care about.<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ dismissOverlay }}\" style=\"flex-shrink:0;width:28px;height:28px;border:none;background:var(--colors-grey-scale-grey-2);border-radius:8px;cursor:pointer;font-size:15px;color:var(--colors-text-secondary);\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;margin-top:16px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ openBubblesFromOverlay }}\" style=\"flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:14px;background:var(--colors-primary-brand-iris);color:#fff;border:none;border-radius:var(--psi-radius-8);padding:12px 16px;cursor:pointer;\">Map the conversation →<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ dismissOverlay }}\" style=\"flex-shrink:0;font-family:var(--font-mono);font-size:13px;background:none;border:none;color:var(--colors-text-secondary);cursor:pointer;padding:0 8px;\">Keep scrolling<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ REPLY COMPOSER ============ -->\n  <sc-if value=\"{{ showComposer }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(15,15,15,0.4);animation:cnFade .16s ease;\" sc-camel-on-click=\"{{ closeComposer }}\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:520px;margin:0 16px;background:#fff;border-radius:var(--psi-radius-16);padding:20px;box-shadow:var(--psi-shadow-modal);animation:cnPop .2s cubic-bezier(0.2,0,0.1,1);\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;\">\n        <span style=\"font-weight:600;font-size:16px;\">Reply<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeComposer }}\" style=\"margin-left:auto;width:28px;height:28px;border:none;background:var(--colors-grey-scale-grey-2);border-radius:8px;cursor:pointer;font-size:15px;color:var(--colors-text-secondary);\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--colors-text-hint);margin-bottom:12px;\">Replying to {{ composerTarget }}<\u002Fdiv>\n      <textarea id=\"cn-composer\" placeholder=\"Share your thoughts…\" style=\"width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:none;box-shadow:inset 0 0 0 1px var(--colors-border-primary);border-radius:var(--psi-radius-8);padding:12px;font-family:var(--font-primary);font-size:14px;line-height:1.5;color:var(--colors-text-primary);outline:none;\"><\u002Ftextarea>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px;\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">Be kind. 1000 characters max.<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ postReply }}\" style=\"margin-left:auto;font-family:var(--font-mono);font-weight:500;font-size:14px;background:var(--colors-primary-brand-iris);color:#fff;border:none;border-radius:var(--psi-radius-8);padding:10px 18px;cursor:pointer;\">Post<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;background:var(--colors-grey-scale-soft-black);color:#fff;font-family:var(--font-mono);font-size:13px;padding:12px 18px;border-radius:100px;box-shadow:var(--psi-shadow-popover);animation:cnUp .22s ease;display:inline-flex;align-items:center;gap:8px;\">\n    <span style=\"color:var(--colors-utility-mum);\">✓<\u002Fspan> {{ toastMsg }}\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'feed',        // feed | bubbles | theme | themeAll\n    device: 'desktop',\n    themeId: null,\n    overlayDismissed: false,\n    showOverlay: false,\n    feedExpanded: false,\n    composerTarget: null,\n    showToast: false,\n    toastMsg: '',\n    reacts: {},          // id -> {up, upMine, chips:{key:count}, mine:{key:true}}\n    extraReplies: {},    // postId -> [reply,...]\n  };\n\n  // ---- static content ----\n  QUESTION = 'What is the one thing you would like all Albertans to consider before voting this fall?';\n\n  STANCES = {\n    'Strongly yes':          { bg: 'var(--colors-tag-success)', color: 'var(--colors-text-success)' },\n    'Yes with reservations': { bg: 'var(--colors-tag-success)', color: 'var(--colors-text-success)' },\n    \"It's complicated\":      { bg: 'var(--colors-grey-scale-grey-2)',   color: 'var(--colors-text-secondary)' },\n    'No with reservations':  { bg: 'var(--colors-utility-kilauea-2)',   color: 'var(--colors-utility-kilauea-1)' },\n    'Strongly no':           { bg: 'var(--colors-utility-kilauea-2)',   color: 'var(--colors-utility-kilauea-1)' },\n  };\n\n  AV = ['rgb(90,30,245)','rgb(5,130,135)','rgb(165,115,40)','rgb(169,88,81)','rgb(195,70,70)','rgb(82,93,207)','rgb(0,175,135)','rgb(190,115,205)','rgb(63,63,128)','rgb(125,100,83)'];\n\n  // post factory — author is the real commenter name from the transcript\n  P(id, author, meta, stance, text, replies) {\n    return { id, author, meta, stance, text, replies: replies || [] };\n  }\n\n  constructor(props) {\n    super(props);\n    this.buildData();\n  }\n\n  buildData() {\n    const P = this.P.bind(this);\n    // ---- THEMES built from the real \"…before voting this fall\" transcript (real names) ----\n    // Every one of the 210 posts+replies was read and tagged individually into one of these\n    // 8 clusters (or excluded). Counts are single-primary-theme tallies; ~30 short one-liners,\n    // corrections, slogans and off-topic asides (CFL teams, moderator note, etc.) didn't\n    // cluster into any theme and are excluded rather than forced in.\n    this.THEMES = [\n      {\n        id: 'unfair', label: \"Alberta's fairness fight with Ottawa\", count: 38,\n        color: 'rgb(165,115,40)', px: 150, py: 260, d: 169,\n        allLabel: '38 responses · 4 replies',\n        posts: [\n          P(14, 'Bill Watson', 'Sep 14', '',\n            'The one thing I would like all Albertans to consider is, if independence from Canada isn\\u2019t the answer, how do you suggest addressing how poorly Alberta has been treated over the past 11 years?',\n            [ { author: 'rayparlour15', desc: 'in reply', text: 'Using Alberta\\u2019s economic weight to build regional trade alliances, ask for regulatory reform, and elect governments that negotiate inside Confederation. Demanding an unconstitutional split doesn\\u2019t solve anything. It would give up leverage.' } ]),\n          P(40, 'truecanadian99', 'Sep 13', '',\n            'But the federal government has no money. Literally they are running deficits. Alberta has a value deficit from the feds of about $30 billion a year. They send $30 billion more than the value of the services they receive. It is time to stop letting Ottawa waste Canadians money. They have been far too good at it for far too long.',\n            []),\n          P(11, 'Mike Mac', 'Sep 14', '',\n            'Even Carney has acknowledged that Alberta has legitimate economic and regional greiviences. Would Ottawa have paid attention were it not for Alberta forcing them to? Not likely.',\n            []),\n          P(16, 'Mark Leenders', 'Sep 13', '',\n            'If Alberta is allowed to keep federal cash, the UCP will just give the money to large oil companies and their other rich friends. Average Albertans will never see a penny of it. Please, Federal Government, don\\u2019t let our MAGA premier get away with this.',\n            [ { author: 'Bill Watson', desc: 'in reply', text: 'It isn\\u2019t federal money. Albertans just want their money returned.' } ]),\n          P(26, 'Eric Maker', 'Sep 13', '',\n            'Why is it that Alberta, which is always bragging about being Canada\\u2019s richest province, is constantly trying to get Canada\\u2019s money without submitting to the conditions that all of the other provinces must follow to receive funding? No conditions? No cash.',\n            [ { author: 'Bill Watson', desc: 'in reply', text: 'We just want our money back to spend on our own programs.' } ]),\n          P(54, 'Jim Howard', 'Sep 12', '',\n            'What specifically would a better relationship with the rest of Canada entail? The media constantly presents broad statements re: imbalances, unfairness, etc. However, I don\\u2019t think I have ever read a clear list of 5, or 15, or 100 issues that precisely define the problems. What would ensure a better relationship and promote national unity?',\n            []),\n          P(60, 'Richard Fryer', 'Sep 12', '',\n            '...the separatists might not win this round, but the sentiment will not die. This is a canary in the coal mine, and Ottawa politicians need to quit listening to wealthy well connected lobbyists and move forward with meaningful reforms that reduce bureaucracy, duplication and costs.',\n            []),\n          P(109, 'Brian Pollock', 'Sep 4', '',\n            'What\\u2019s the cost to stay?',\n            [ { author: 'canadianabroad', desc: 'in reply', text: 'The perpetual feeling that Western Canada has been alienated is supported by political pundits designed to make people feel victimized. When, in fact, it\\u2019s a lack of political willpower to move away from the oil and gas industry and diversify broadly, which is the biggest inhibitor.' } ]),\n        ],\n      },\n      {\n        id: 'legit', label: 'Is the separatist movement itself legitimate?', count: 18,\n        color: 'rgb(195,70,70)', px: 390, py: 150, d: 117,\n        allLabel: '18 responses · 2 replies',\n        posts: [\n          P(87, 'Bill Campbell', 'Sep 9', '',\n            'There are two main players the US and then the rest of the world. US interference has been shown by many journalists exposing the mega right wing millionaires funnelling money into the campaign and social media. CBC had a great story on an American Youtuber who was paid $40 per post by someone in The Netherlands to make pro-separation post. As an Alberta in my eighth decade I have never seen evidence of a separation movement.',\n            [ { author: 'amy', desc: 'in reply', text: 'The entire movement was literally started by an American, and funded by foreign powers. It\\u2019s a ploy to purposefully destabilize our government, helped along by people who think that a separation vote \"sends a message\".' } ]),\n          P(8, 'Andrew Ross', 'Sep 10', '',\n            'As a local activist in the south zone, I have never encountered someone pushing seperation in real life when I am handing out lawn signs...or while speaking as an AFL activist. Not once. Its almost as if they exist stictly online, which raises many red flags. Not one politician in government ran on this issue, so why are we here now?',\n            [ { author: 'amy', desc: 'in reply', text: 'Go see their base out in Mirror. They definitely exist, but they\\u2019ve been sold a lie.' } ]),\n          P(103, 'Iain Basedord', 'Sep 4', '',\n            'The closer we get to the date, the more the narrative...of the independence movement is revealing itself as a bunch of angry good ole boys with no actual plan to keep the US out and what seems to be a suspiciously clandestine plan of self enrichment from its defacto leaders. Before you vote, really consider what their actual plan is.',\n            []),\n          P(82, 'Ellen Simpson', 'Sep 10', '',\n            'I find it interesting that the separatist movement in Alberta doesn\\u2019t seem to offer clarity on what the goal and objectives are for Albertans by separating? It seems more like a grievance movement?',\n            []),\n          P(83, 'David Locontes', 'Sep 10', '',\n            'I think most of those pro-independence accounts are Russian state-sponsored groups and US maga. See Brexit. Canada is not doing a good job in defending against that.',\n            []),\n          P(55, 'Gord Hasay', 'Sep 12', '',\n            'The leadership of the \\u2018separatist\\u2019 factions has serious credibility problems, from a co-writer of the draft constitution making remarks that show support for racism, to a leader convicted of manslaughter, to a lawyer accused of misappropriating First Nation trust funds. Do we really want that running our provincial government?',\n            []),\n        ],\n      },\n      {\n        id: 'economics', label: \"The economics of leaving don't add up\", count: 24,\n        color: 'rgb(5,130,135)', px: 150, py: 110, d: 132,\n        allLabel: '24 responses',\n        posts: [\n          P(101, 'canadianabroad', 'Sep 4', '',\n            'History does not repeat, but it rhymes. Approximately 700 companies left Quebec between 1976 and 1985...Think tanks see the actual loss from Brexit at anywhere between 2% and 9% of GDP. Alberta would have 3 oil pipelines (less than 10% of total current capacity) and 0 gas pipelines to feed the United States. Effectively, you would strangle the oil and gas industry for a decade minimum.',\n            []),\n          P(45, 'nicole scott', 'Sep 13', '',\n            'Alberta Exports $180 Billion/ Year that isn\\u2019t going anywhere, most is OIL to the USA & those profits would stay in Alberta...Alberta gets aprox $20 Billion/Year back from Ottawa, they Fund less than 20% of Healthcare.',\n            []),\n          P(10, 'Ian Canad', 'Sep 14', '',\n            'Separatists will need a new name for themselves because Alberta is the name of a Canadian province in honour of a Princess. There\\u2019s many details that will become exceedingly expensive beyond legal fees, lawsuits, establishing a new currency isn\\u2019t free.',\n            []),\n          P(5, 'Lynda Parks', 'Sep 16', '',\n            'What the financial reports on Separation don\\u2019t take into account is people. A good % of people are risk adverse - especially retired people. They...will move. There will be a vacuum of people and capital that will not take risk. This in turn makes the financial picture on the short term much worse then current estimates.',\n            []),\n          P(84, 'fr2309', 'Sep 10', '',\n            'People need to understand if Alberta becomes a landlocked nation it will have very little negotiating power for any fair deal with the US. The US will be perfectly happy to squeeze Alberta for cheap oil with very little return as we lose our coastal access.',\n            []),\n          P(93, 'Ken Johnson', 'Sep 8', '',\n            'As a native Albertan I say to remember that the oil industry gets a subsidy of a billion dollars a month from the Feds. Most of it goes to the big four who dominate the tar sands and they are up to 73% foreign owned - mostly American. Most of the oil they produce goes to the US for $30 a barrel under the world rate.',\n            []),\n        ],\n      },\n      {\n        id: 'legal', label: \"Separation isn't legally simple\", count: 16,\n        color: 'rgb(90,30,245)', px: 400, py: 360, d: 112,\n        allLabel: '16 responses · 2 replies',\n        posts: [\n          P(13, 'rayparlour15', 'Sep 13', '',\n            'This separation vote is completely pointless because Alberta can legally never leave anyway. The Supreme Court of Canada already ruled that no province can unilaterally secede. To actually separate, you need to amend the Constitution...On top of that, Indigenous treaties are with the Crown. If they legally refuse to leave a breakaway Alberta would look like Swiss cheese on a map.',\n            []),\n          P(39, 'Steven Tyler', 'Sep 12', '',\n            'What is your plan regarding national parks and First Nations. Be specific. Tell us exactly how you envision this \"negotiation\" working out in a way that doesn\\u2019t carve up Alberta into a jigsaw puzzle of regions outside the national parks and First Nations. Because let\\u2019s be clear - those areas are not Alberta.',\n            [ { author: 'Philip Lucas', desc: 'in reply', text: 'The 1st nations have legal ownership of their lands and through any court could claim separation of these lands from an independent Alberta...this would likely be a very long legal and diplomatic struggle.' } ]),\n          P(89, 'jdvanisl', 'Sep 9', '',\n            'First, Alberta can\\u2019t separate without agreement of First Nations as almost all the province is covered by Treatis with the federal government. Second, how do they think they\\u2019re going to get their natural resources to market without going through Canada?',\n            [ { author: 'Jeremy Levi', desc: 'in reply', text: 'First Nations are the elephant in the room that the separatists don\\u2019t want to talk about. Without the support of First Nations seperation is a no go. It was a big issue during Quebec\\u2019s previous seperation attempts and it remains a big issue today.' } ]),\n          P(19, 'JD Skip', 'Sep 13', '',\n            'Consider that this so called referendum is not giving Smith and the UCP any permission to make new laws, it is not giving any permission(s) at all on anything, it\\u2019s simply getting views on subjects of the UCP\\u2019s own interests.',\n            []),\n          P(29, 'Bala Viswa', 'Sep 13', '',\n            'The referendum question on the social programmes is akin to saying, \"I want to be a part of the programme, but I don\\u2019t want to meet any of its objectives\". This may be popular as worded, but has zero chance of passing as a Constitutional Amendment.',\n            []),\n          P(28, 'Deanna Cadoret', 'Sep 13', '',\n            'You are either part of Canada or you stand completely alone. That means no Federal money, no RCMP, no Air Traffic Control...no Federal Safety Regulations, no Federally negotiated Trade Deals. You want out, then you start completely over from scratch.',\n            []),\n        ],\n      },\n      {\n        id: 'votelegit', label: 'The vote itself is contested', count: 16,\n        color: 'rgb(125,100,83)', px: 270, py: 430, d: 112,\n        allLabel: '16 responses · 1 reply',\n        posts: [\n          P(21, 'Jeff Lewis', 'Sep 13', '',\n            'Go look at Brexit in the UK and see how that turned out...it took away rights against the will of almost half of the UK population...much as many Alberta separatists think they\\u2019ll keep their Canadian citizenships. And much like the EU referendum, I suspect a lot of people will make a \"protest\" vote not realising that this is for real and irreversible.',\n            []),\n          P(34, 'Matilda Dillon', 'Sep 15', '',\n            'Albertans need to note well in advance that voting won\\u2019t be easy this year. Last year, nobody was ready for the long lineups at municipal elections and many Albertans left without voting. If you should decide to head out on voting day, bring food, water, a chair, and dress for the weather.',\n            []),\n          P(62, 'Tabby Buxton', 'Sep 12', '',\n            'I can guarantee following a substantial loss that the separatist side will declare a rigged vote. That is the style of their leadership and it is sad that we have come to this given how we have been treated, mocked and frankly lied about repetively.',\n            []),\n          P(43, 'Harry Donnelly', 'Sep 13', '',\n            'Anyone have any doubt that the Alberta Separatists will reject the outcome if they lose?',\n            [ { author: 'Bill Watson', desc: 'in reply', text: 'Do you think the other side would accept the outcome if they lose?' } ]),\n          P(38, 'Ryan Rob', 'Sep 13', '',\n            'It is proufoundly silly to waste time voting on referenda that have no impact. Race baiting questions and unconstitutional demands are beneath the dignity of regular Albertans and are instead the behavior of far right activists who also happen to be in the provincial government.',\n            []),\n          P(90, 'stephanyt', 'Sep 9', '',\n            'So, Albertans are going to vote whether or not to have a vote on separating from Canada? Hey, I am Canadian but not Albertan and I want a vote, too. It is my Canada as well.',\n            []),\n        ],\n      },\n      {\n        id: 'strongertogether', label: 'Canada is stronger together', count: 12,\n        color: 'rgb(0,175,135)', px: 420, py: 260, d: 101,\n        allLabel: '12 responses',\n        posts: [\n          P(63, 'Luc Perrier', 'Sep 12', '',\n            'Dear Albertans, please stay in Canada. We Qu\\u00e9b\\u00e9cois need Alberta more than we sometimes care to admit...I understand why many Albertans are frustrated with Ottawa, but separation would hurt the rest of us as well...Canada needs you\\u2014and Qu\\u00e9bec certainly has no interest in discovering the true cost of doing without you.',\n            []),\n          P(47, 'Ron Aaron', 'Sep 13', '',\n            'All Albertans should consider that unity is strength. Divisiveness is weakness and inefficient. Those things would not be available to an Alberta - or whatever it would become - that is not part of Canada. Vote well.',\n            []),\n          P(74, 'joej', 'Sep 12', '',\n            'People need to realize that, the grass won\\u2019t be greener on the other side. All Provinces need to be working as a collective, to ensure the interests of every Province are taken into account. Alberta is wanted, and valued even if it may SEEM Ottawa doesn\\u2019t.',\n            []),\n          P(76, 'Raymond Gignac', 'Sep 11', '',\n            'Northern Ontario contains 95% of the area of Ontario but only has 5% of Ontario\\u2019s population so we are forgotten about until election time it seems! But we hang in there and progress is slow. Separation may not be good for me or Alberta or Quebec in the long run.',\n            []),\n          P(81, 'Tom Donaghy', 'Sep 10', '',\n            'This is a big and very profound issue and needs to be thought through! This is the best democracy in Canada. Alberta. Love it here. Will deal with the outcome. I just want everyone else to do that too. We are all /canadian.',\n            []),\n          P(49, 'Robert MacMillan', 'Sep 13', '',\n            'Albertans should consider how Canadians in other provinces will react if they vote for Option 2. Will they be considered unreliable partners - a weak link?',\n            []),\n        ],\n      },\n      {\n        id: 'uswallow', label: 'This ends with Alberta absorbed by the U.S.', count: 11,\n        color: 'rgb(82,93,207)', px: 270, py: 80, d: 99,\n        allLabel: '11 responses · 1 reply',\n        posts: [\n          P(78, 'ron2109', 'Sep 11', '',\n            'If Alberta were to somehow distance themselves from Canada the U.S. would swallow it up faster than you could imagine. Consider paying all of your healthcare costs if you can find medical professionals that can help you...The quality of education would plummet.',\n            []),\n          P(106, 'princeofhartes', 'Sep 4', '',\n            'A weaker Canada does not mean a stronger Alberta. If anything, separation makes Alberta a target for US imperialism...Alberta won\\u2019t be a state, it will be a territory like Puerto Rico and none of the money from its resources will go back to Alberta.',\n            []),\n          P(53, 'Charlie Miller', 'Sep 12', '',\n            'I would like everyone to consider what the USA would do if Alberta chooses to separate? I doubt if we would last a year on our own before the States would come in and take us over. That would be disastrous.',\n            [ { author: 'Matilda Dillon', desc: 'in reply', text: 'What many Separatists who have only Cdn citizenship don\\u2019t realize is that with all the wars Trump is starting, the American congress and the president can reactivate conscription. Do we want this for Albertans should we eventually become the 51st State?' } ]),\n          P(94, 'Mike Dixon', 'Sep 8', '',\n            'A separated Alberta will be constantly attacked for annexation by America, and will lack the size and tools to do anything about it.',\n            []),\n        ],\n      },\n      {\n        id: 'realfight', label: 'The referendum is a costly distraction', count: 10,\n        color: 'rgb(169,88,81)', px: 110, py: 400, d: 96,\n        allLabel: '10 responses',\n        posts: [\n          P(96, 'Sofi Jizz', 'Sep 5', '',\n            'I\\u2019m concerned that no one is talking about the Social factors. Homelessness, addictions, food insecurity, no living wage, etc. What will social structure look like in the new Alberta. How many nurses, doctors, teachers, skill trades people, blue collar, white collar workers will we lose. Who will be left.',\n            []),\n          P(75, 'Terry Morrison', 'Sep 12', '',\n            'I cannot believe that the government of Alberta is using our money to fund an advertising campaign to promote their particular bias. This referendum is already costing the taxpayer an incredible amount of money. If they truly want the people of Alberta to voice their own opinions in a vote, then they should not be trying to sway it.',\n            []),\n          P(4, 'John Helm', 'Sep 16', '',\n            'A grossly inappropriate campaign (using our money), and yet completely unsurprising from this government.',\n            []),\n          P(98, 'Anton Pavlenko', 'Sep 5', '',\n            'Why don\\u2019t they simply have the separation voters sign up their numbers and all those that don\\u2019t, are by default, automatically acknowledged patriotic Canadians. Thereby 120-130 million tax payer dollars would be saved and put towards serious pressing Albertan needs.',\n            []),\n          P(7, 'Joel Unrau', 'Sep 15', '',\n            'The Alberta provincial government has been slow to respond to need within healthcare and education...Strain on the system is being felt from emergency rooms to classrooms, but it\\u2019s not the fault of immigrants. It\\u2019s our leadership that ignores experts, tries to divide labour, and won\\u2019t listen to what Albertans are telling them.',\n            []),\n        ],\n      },\n    ];\n\n    // index for lookup + feed\n    this.THEME_BY_ID = {};\n    this.THEMES.forEach(t => { this.THEME_BY_ID[t.id] = t; t.reps = t.posts.slice(0, 2); });\n\n    // FEED = a curated cross-section of the raw conversation\n    this.FEED = [\n      { ...this.THEME_BY_ID.unfair.posts[0] },\n      { ...this.THEME_BY_ID.legit.posts[0] },\n      { ...this.THEME_BY_ID.economics.posts[0] },\n      { ...this.THEME_BY_ID.legal.posts[0] },\n      { ...this.THEME_BY_ID.votelegit.posts[0] },\n      { ...this.THEME_BY_ID.strongertogether.posts[0] },\n      { ...this.THEME_BY_ID.uswallow.posts[0] },\n      { ...this.THEME_BY_ID.realfight.posts[0] },\n    ];\n    const feedIds = new Set(this.FEED.map(p => p.id));\n    const seen = new Set();\n    this.EXTRA_FEED = [];\n    this.THEMES.forEach(t => t.posts.forEach(p => {\n      if (feedIds.has(p.id) || seen.has(p.id)) return;\n      seen.add(p.id); this.EXTRA_FEED.push(p);\n    }));\n  }\n\n  // ---------- reaction state helpers ----------\n  seed(id, k) { return ((id * (k === 'up' ? 7 : k === 'think' ? 5 : k === 'respect' ? 3 : 2) + 11) % 34) + 4; }\n  rec(id) {\n    if (!this.state.reacts[id]) {\n      this.state.reacts[id] = {\n        up: this.seed(id, 'up'), upMine: false,\n        chips: { think: this.seed(id, 'think'), respect: this.seed(id, 'respect'), nuanced: this.seed(id, 'nuanced') },\n        mine: {},\n      };\n    }\n    return this.state.reacts[id];\n  }\n  toggleUp(id) {\n    this.rec(id);\n    this.setState(s => {\n      const r = { ...s.reacts[id] };\n      r.upMine = !r.upMine; r.up += r.upMine ? 1 : -1;\n      return { reacts: { ...s.reacts, [id]: r } };\n    });\n  }\n  toggleChip(id, key) {\n    this.rec(id);\n    this.setState(s => {\n      const r = { ...s.reacts[id], chips: { ...s.reacts[id].chips }, mine: { ...s.reacts[id].mine } };\n      const on = !r.mine[key]; r.mine[key] = on; r.chips[key] += on ? 1 : -1;\n      return { reacts: { ...s.reacts, [id]: r } };\n    });\n  }\n\n  // ---------- navigation ----------\n  go(view) { this.setState({ view }); const el = document.querySelector('.cn-scroll'); if (el) el.scrollTop = 0; }\n  openBubbles = () => this.go('bubbles');\n  openTheme = (id) => this.setState({ view: 'theme', themeExpanded: false, themeId: typeof id === 'string' ? id : this.state.themeId }, () => { const el = document.querySelector('.cn-scroll'); if (el) el.scrollTop = 0; });\n  toggleThemeExpand = () => this.setState(s => ({ themeExpanded: !s.themeExpanded }));\n  toggleFeedExpand = () => this.setState(s => ({ feedExpanded: !s.feedExpanded }));\n  back = () => this.go('feed');\n\n  // scroll overlay trigger\n  componentDidMount() {\n    this.scroller = document.querySelector('.cn-scroll');\n    if (this.scroller) this.scroller.addEventListener('scroll', this.onScroll, { passive: true });\n  }\n  componentWillUnmount() { if (this.scroller) this.scroller.removeEventListener('scroll', this.onScroll); }\n  onScroll = () => {\n    if (this.state.view !== 'feed' || this.state.overlayDismissed || this.state.showOverlay) return;\n    const el = this.scroller;\n    const pct = el.scrollTop / Math.max(1, (el.scrollHeight - el.clientHeight));\n    if (el.scrollTop > 260 || pct > 0.22) this.setState({ showOverlay: true });\n  };\n  dismissOverlay = () => this.setState({ showOverlay: false, overlayDismissed: true });\n  openBubblesFromOverlay = () => this.setState({ showOverlay: false, overlayDismissed: true, view: 'bubbles' }, () => { const el = document.querySelector('.cn-scroll'); if (el) el.scrollTop = 0; });\n\n  // composer\n  openComposer = (target) => this.setState({ composerTarget: target });\n  closeComposer = () => this.setState({ composerTarget: null });\n  postReply = () => {\n    const ta = document.getElementById('cn-composer');\n    const txt = ta && ta.value.trim();\n    this.setState({ composerTarget: null, showToast: true, toastMsg: 'Your response is posted.' });\n    clearTimeout(this._toast);\n    this._toast = setTimeout(() => this.setState({ showToast: false }), 2600);\n  };\n\n  stop = (e) => { e.stopPropagation(); };\n  noop = (e) => { e.preventDefault(); };\n  setDesktop = () => this.setState({ device: 'desktop' });\n  setMobile = () => this.setState({ device: 'mobile' });\n\n  // ---------- view hydration ----------\n  initials(name) {\n    const parts = String(name).trim().split(/\\s+/);\n    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();\n  }\n  avColor(id) { return this.AV[Math.abs(id || 0) % this.AV.length]; }\n  hydrate(p) {\n    const st = this.STANCES[p.stance] || this.STANCES[\"It's complicated\"];\n    const r = this.rec(p.id);\n    const chipDefs = [\n      { key: 'think', label: '💡 Made me think' },\n      { key: 'respect', label: '🤝🏽 Respect' },\n      { key: 'nuanced', label: '⚖️ Nuanced' },\n    ];\n    const chipBase = 'display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11.5px;border-radius:100px;padding:5px 10px;cursor:pointer;transition:all .12s ease;';\n    return {\n      ...p,\n      initials: this.initials(p.author),\n      avColor: this.avColor(p.id),\n      meta: p.meta,\n      metaLine: p.meta,\n      stanceBg: st.bg, stanceColor: st.color,\n      up: r.up,\n      upStyle: chipBase + (r.upMine\n        ? 'background:var(--colors-primary-brand-iris);color:#fff;border:none;'\n        : 'background:var(--colors-grey-scale-grey-1);color:var(--colors-text-secondary);box-shadow:inset 0 0 0 1px var(--colors-border-primary);border:none;'),\n      onUp: () => this.toggleUp(p.id),\n      onReply: () => this.openComposer(p.author),\n      reactChips: chipDefs.map(c => ({\n        label: c.label, count: r.chips[c.key],\n        onClick: () => this.toggleChip(p.id, c.key),\n        style: chipBase + (r.mine[c.key]\n          ? 'background:var(--colors-primary-brand-tanzanite-3);color:var(--colors-text-accent);border:none;'\n          : 'background:none;color:var(--colors-text-hint);border:none;'),\n      })),\n      replies: (p.replies || []).concat(this.state.extraReplies[p.id] || []).map((rp, i) => {\n        const rid = p.id * 13 + i + 1;\n        return { ...rp, initials: this.initials(rp.author), avColor: this.avColor(rid), metaLine: rp.desc === 'follow-up' ? 'Follow-up' : 'Reply' };\n      }),\n    };\n  }\n\n  renderVals() {\n    const device = this.state.device;\n    const colW = device === 'mobile' ? 390 : 660;\n    const t = this.THEME_BY_ID[this.state.themeId] || this.THEMES[0];\n\n    // bubble stage — design grid is 480 x 520, scaled uniformly to colW\n    const s = colW / 545;\n    const stageW = colW;\n    const stageH = Math.round(500 * s);\n    const bubbles = this.THEMES.map(b => {\n      const d = Math.round(b.d * s);\n      const left = Math.round(b.px * s - d / 2);\n      const top = Math.round(b.py * s - d / 2);\n      return {\n        label: b.label, count: b.count,\n        onClick: () => this.openTheme(b.id),\n        fontSize: (d > 130 ? 15 : d > 105 ? 13 : 11.5) + 'px',\n        countSize: (d > 130 ? 13 : 11) + 'px',\n        style: `position:absolute;left:${left}px;top:${top}px;width:${d}px;height:${d}px;border-radius:50%;`\n          + `background:${b.color};color:#fff;border:3px solid rgba(255,255,255,0.55);`\n          + `display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;`\n          + `padding:8px;box-sizing:border-box;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,0.18);`\n          + `transition:transform .16s cubic-bezier(0.2,0,0.1,1), box-shadow .16s ease;`,\n      };\n    });\n\n    // mobile ranked bars\n    const maxCount = Math.max(...this.THEMES.map(b => b.count));\n    const themeBars = this.THEMES.map(b => ({\n      label: b.label, count: b.count, color: b.color,\n      pct: Math.round((b.count / maxCount) * 100) + '%',\n      onClick: () => this.openTheme(b.id),\n    }));\n\n    const tabOn = 'font-family:var(--font-mono);font-size:12px;border:none;border-radius:100px;padding:6px 14px;cursor:pointer;background:var(--colors-grey-scale-soft-black);color:#fff;';\n    const tabOff = 'font-family:var(--font-mono);font-size:12px;border:none;border-radius:100px;padding:6px 14px;cursor:pointer;background:none;color:var(--colors-text-secondary);';\n\n    const restPosts = t.posts.slice(2);\n    const themeHydrated = {\n      label: t.label, count: t.count, color: t.color, spread: t.spread, allLabel: t.allLabel,\n      reps: t.reps.map(p => this.hydrate(p)),\n      rest: restPosts.map(p => this.hydrate(p)),\n      expanded: this.state.themeExpanded,\n      expandLabel: this.state.themeExpanded ? 'Show less ↑' : ('See all ' + t.count + '+ responses in this theme ↓'),\n    };\n\n    return {\n      question: this.QUESTION,\n      statLine: '210 comments · 100+ participants',\n      headerStyle: device === 'mobile'\n        ? 'background:var(--colors-secondary-brand-jasper-3);padding:24px 18px 22px;border-radius:20px 20px 0 0;flex-shrink:0;'\n        : 'background:var(--colors-secondary-brand-jasper-3);padding:32px 32px 28px;border-radius:16px 16px 0 0;flex-shrink:0;',\n      scrollStyle: `flex:1;min-height:0;overflow-y:auto;padding:${device === 'mobile' ? '20px 18px' : '24px 32px 28px'};box-sizing:border-box;`,\n      isFeed: this.state.view === 'feed',\n      showBanner: this.state.view === 'feed',\n      showSlider: this.state.view === 'feed',\n      isBubbles: this.state.view === 'bubbles',\n      isTheme: this.state.view === 'theme',\n      isThemeAll: this.state.view === 'themeAll',\n      feedPosts: this.FEED.map(p => this.hydrate(p)),\n      feedExpanded: this.state.feedExpanded,\n      extraFeedPosts: this.EXTRA_FEED.map(p => this.hydrate(p)),\n      feedMoreLabel: this.state.feedExpanded ? 'Show less ↑' : ('Show all ' + this.EXTRA_FEED.length + ' more responses ↓'),\n      toggleFeedExpand: this.toggleFeedExpand,\n      bubbles,\n      themeBars,\n      showCluster: device !== 'mobile',\n      showBars: device === 'mobile',\n      mapHint: device === 'mobile'\n        ? 'Longer bars mean more people are talking about it. Tap a theme to see its range of views.'\n        : 'Bigger circles mean more people are talking about it. Tap a theme to see its range of views.',\n      theme: themeHydrated,\n      stageStyle: `width:${stageW}px;height:${stageH}px;`,\n      surfaceStyle: `width:100%;max-width:${colW}px;background:var(--colors-surface-primary);border-radius:${device === 'mobile' ? '28px' : '16px'};`\n        + `box-shadow:0 12px 40px rgba(0,0,0,0.12), inset 0 0 0 1px var(--colors-border-primary);`\n        + `display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;`\n        + `${device === 'mobile' ? 'border:8px solid #111;' : ''}`\n        + `height:calc(100vh - 130px);`,\n      backBtnStyle: 'display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:var(--colors-grey-scale-grey-1);box-shadow:inset 0 0 0 1px var(--colors-border-primary);border:none;border-radius:100px;padding:7px 14px;cursor:pointer;',\n      deskTabStyle: device === 'desktop' ? tabOn : tabOff,\n      mobTabStyle: device === 'mobile' ? tabOn : tabOff,\n      showOverlay: this.state.showOverlay,\n      dismissOverlay: this.dismissOverlay,\n      openBubbles: this.openBubbles,\n      openBubblesFromOverlay: this.openBubblesFromOverlay,\n      toggleThemeExpand: this.toggleThemeExpand,\n      openTheme: () => this.openTheme(this.state.themeId),\n      back: this.back,\n      setDesktop: this.setDesktop, setMobile: this.setMobile,\n      stop: this.stop, noop: this.noop,\n      showComposer: !!this.state.composerTarget,\n      composerTarget: this.state.composerTarget,\n      closeComposer: this.closeComposer,\n      postReply: this.postReply,\n      showToast: this.state.showToast,\n      toastMsg: this.state.toastMsg,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
