document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

plaignons de la dépopulation et du dépeuplement, tandis que de l'autre, nous refusons l'intégration même à ceux qui auraient le droit de devenir citoyens. Il y a eu un cas où un maire a été arrêté parce qu'il était accusé de vol, de favoritisme et de népotisme alors qu'il essayait de toutes ses forces de revitaliser une ville relativement petite de Sicile en créant des emplois et en hébergeant des immigrés d'Afrique. Je ne nie pas qu'il ait commis des irrégularités administratives, mais il s'agissait d'irrégularités qui devaient être corrigées afin de poursuivre l'expérience. Au lieu de cela, il a été soumis à une peine inhabituelle et excessive (la peine initiale était de plus de 13 ans, aujourd'hui considérablement réduite). Il est clair que le système politique et - en partie - le système judiciaire cherchaient à expulser les immigrants en quête d'asile et d'intégration. Aujourd'hui, l'expérience est morte. Je parle du maire Domenico Lucano et de la célèbre ville de Riace.\"; /* @kind other */\n  --response-moderated: \"COVID est un faux. Vous êtes nul.\"; /* @kind other */\n  --response-short-1: \"Mon cœur se brise pour les deux femmes âgées de cette histoire. Je ne pourrais pas imaginer vivre dans des conditions aussi difficiles, y compris l'isolement social - qui me semble étrange lorsque je pense aux grandes familles italiennes. Où sont ces familles ?\"; /* @kind other */\n  --response-short-2: \"Il semble que ce soit un endroit idéal pour les nomades numériques ou les retraités.\"; /* @kind other */\n  --response-short-3: \"Je ne comprends pas la stratégie italienne qui consiste à demander aux travailleurs sociaux de contrôler les personnes âgées. Elle ne répond pas au besoin critique de refroidissement de leurs corps et de leurs maisons.\"; /* @kind other */\n  --sidebar-responses-headline: \"Réponses\"; /* @kind other */\n  --sort-all: \"Tous\"; /* @kind other */\n  --sort-filters: \"Filtres\"; /* @kind other */\n  --sort-most-recent: \"Les plus récents\";  --question-question-ai: \"Wie wirkt sich die künstliche Intelligenz auf Ihr Leben aus?\"; /* @kind other */\n  --question-question-europe: \"Wie wird sich Europa mit einer alternden Bevölkerung verändern?\"; /* @kind other */\n  --question-question-generic: \"Was denken Sie über XYZ?\"; /* @kind other */\n  --reaction-changed-my-mind: \"Habe meine Meinung geändert\"; /* @kind other */\n  --reaction-controversial-emoji: \"💬\"; /* @kind other */\n  --reaction-controversial: \"Umstrittene\"; /* @kind other */\n  --reaction-disagree-emoji: \"🤔\"; /* @kind other */\n  --reaction-disagree: \"Nicht einverstanden\"; /* @kind other */\n  --reaction-helpful-emoji: \"➕\"; /* @kind other */\n  --reaction-helpful: \"Hilfreich\"; /* @kind other */\n  --reaction-interesting-emoji: \"💡\"; /* @kind other */\n  --reaction-interesting: \"Interessant\"; /* @kind other */\n  --reaction-made-me-think: \"Hat mich zum Nachdenken gebracht\"; /* @kind other */\n  --reaction-new-to-me-emoji: \"💡\"; /* @kind other */\n  --reaction-new-to-me: \"Neu für mich\"; /* @kind other */\n  --reaction-nuanced-emoji: \"⚖️\"; /* @kind other */\n  --reaction-nuanced: \"Nuanciert\"; /* @kind other */\n  --reaction-relatable-emoji: \"❤️\"; /* @kind other */\n  --reaction-relatable: \"Nachvollziehbar\"; /* @kind other */\n  --reaction-respect-emoji: \"🤝🏽\"; /* @kind other */\n  --reaction-respect: \"Respekt\"; /* @kind other */\n  --reaction-support: \"Unterstützung\"; /* @kind other */\n  --reaction-thank-you-emoji: \"🙏\"; /* @kind other */\n  --reaction-thank-you: \"Danke\"; /* @kind other */\n  --reply-journalist: \"Schauen Sie sich dieses Video an, um Ihre Frage zu beantworten.\"; /* @kind other */\n  --reply-short-1: \"Geschäft ist Geschäft, richtig?\"; /* @kind other */\n  --reply-short-2: \"Das ist ein gutes Argument.\"; /* @kind other */\n  --response-long: \"Die italienische Politik ist sehr widersprüchlich. Einerseits beklagen wir uns über Entvölkerung und Abwanderung, andererseits verweigern wir die Integration selbst denjenigen, die das Recht hätten, Bürger zu werden. Es gab einen Fall, in dem ein Bürgermeister verhaftet wurde, weil er des Diebstahls, der Vetternwirtschaft und des Nepotismus beschuldigt wurde, während er mit all seinen Kräften versuchte, eine relativ kleine Stadt in Sizilien wiederzubeleben, indem er Arbeitsplätze schuf und einige Einwanderer aus Afrika unterbrachte. Ich bestreite nicht, dass er administrative Unregelmäßigkeiten begangen hat, aber es waren Unregelmäßigkeiten, die korrigiert werden mussten, um das Experiment fortsetzen zu können. Stattdessen wurde er einer ungewöhnlichen und übermäßigen Strafe unterworfen (die ursprüngliche Strafe betrug mehr als 13 Jahre, die jetzt erheblich reduziert wurde). Es ist klar, dass die Politik und - teilweise - die Justiz darauf aus waren, die Einwanderer, die Asyl und Integration suchten, auszuweisen. Jetzt ist das Experiment gescheitert. Ich spreche von Bürgermeister Domenico Lucano und der berühmten Stadt Riace.\"; /* @kind other */\n  --response-moderated: \"COVID ist eine Fälschung. Du bist scheiße.\"; /* @kind other */\n  --response-short-1: \"Die beiden älteren Frauen in dieser Geschichte tun mir sehr leid. Ich könnte mir nicht vorstellen, unter solch schlimmen Umständen zu leben, einschließlich der sozialen Isolation - was mir seltsam erscheint, wenn ich an große italienische Familien denke. Wo sind ihre Familien?\"; /* @kind other */\n  --response-short-2: \"Sieht aus wie ein großartiger Ort für den digitalen Nomaden oder Rentner.\"; /* @kind other */\n  --response-short-3: \"Ich verstehe die italienische Strategie nicht, die darin besteht, dass Sozialarbeiter nur nach den älteren Menschen sehen. Sie geht nicht auf die kritische Notwendigkeit ein, ihre Körper und Häuser zu kühlen.\"; /* @kind other */\n  --sidebar-responses-headline: \"Antworten\"; /* @kind other */\n  --sort-all: \"Alle\"; /* @kind other */\n  --sort-filters: \"Filters\"; /* @kind other */\n  --sort-most-recent: \"Neues opover-dark: var(--colors-surface-popover-dark);\n\n  --psi-border: var(--colors-border-primary);\n  --psi-border-selected: var(--colors-border-selected);\n  --psi-border-accent: var(--colors-border-accent);\n\n  --psi-accent: var(--colors-primary-brand-iris);       /* rgb(90,30,245) */\n  --psi-accent-light: var(--colors-primary-brand-lavender);\n  --psi-accent-tint: var(--colors-primary-brand-tanzanite-3);\n\n  --psi-button-primary: var(--colors-button-primary);   /* soft black */\n  --psi-button-accent: var(--colors-button-accent);     /* iris */\n  --psi-button-disabled: var(--colors-button-disabled);\n\n  /* Status / feedback surfaces */\n  --psi-success: var(--colors-utility-mum);             /* green */\n  --psi-warning: var(--colors-utility-kilauea-1);       /* red-orange */\n  --psi-surface-success: var(--colors-surface-banner-success);\n  --psi-surface-warning: var(--colors-surface-banner-warning);\n  --psi-surface-info: var(--colors-surface-banner-info);\n  --psi-surface-suggestion: var(--colors-surface-banner-suggestion);\n\n  /* --- Elevation / shadows --- */\n  --psi-shadow-xs: 0 1px 2px rgba(0,0,0,0.06);\n  --psi-shadow-card: 0 2px 8px rgba(0,0,0,0.08);\n  --psi-shadow-popover: 0 8px 24px rgba(0,0,0,0.12);\n  --psi-shadow-modal: 0 16px 48px rgba(0,0,0,0.18);\n  /* hairline borders are drawn with inset box-shadow in the system */\n  --psi-hairline: inset 0 0 0 1px var(--colors-border-primary);\n\n  /* --- Motion --- */\n  --psi-ease: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --psi-duration-fast: 120ms; /* @kind other */\n  --psi-duration: 180ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ===========================================================================\n   PSI Design System — Typography\n   Product type is IBM Plex Sans (font/primary + font/utility) and IBM Plex Mono\n   (font/mono). Interactive labels — buttons, tags, nav — are set in IBM Plex\n   Mono, a signature of the system. DM Sans is the large editorial / marketing\n   di /* @kind other */\n  --reply-short-2: \"That’s a good point.\"; /* @kind other */\n  --response-long: \"Italian politics is very contradictory. On one hand we complain about depopulation and depopulation, while on the other hand we deny integration even to those who would be entitled to become citizen. There was a case where a mayor was arrested because he was accused of theft, favoritism and nepotism while he was trying with all his forces to revitalize a relatively small town in Sicily creating jobs and housing some immigrants from Africa. I do not deny that he had committed administrative irregularities, but they were irregularities that had to be corrected in order to continue the experiment. Instead, he was subjected to unusual and excessive punishment (the original sentence was more than 13 years long, now substantially reduced). Clearly the political and - partially - the judicial system was looking  for  expelling the immigrants seeking asylum and integration. Now the experiment is dead. I am talking about Mayor Domenico Lucano and the famous town of Riace.\"; /* @kind other */\n  --response-moderated: \"COVID is fake. You suck.\"; /* @kind other */\n  --response-short-1: \"My heart breaks for the two elderly women in this story. I could not imagine living in such dire circumstances, including the social isolation - which to me seems odd when I think of big Italian families. Where are their families?\"; /* @kind other */\n  --response-short-2: \"Looks like a great place for the digital nomad or retiree.\"; /* @kind other */\n  --response-short-3: \"I am not understanding the Italian strategy of just having social workers check on the elderly. It is not addressing the critical need for cooling their bodies and homes.\"; /* @kind other */\n  --sidebar-responses-headline: \"Responses\"; /* @kind other */\n  --sort-all: \"All\"; /* @kind other */\n  --sort-filters: \"Filters\"; /* @kind other */\n  --sort-most-recent: \"Most recent\"; /* @kind other */\n  --sort essayait de toutes ses forces de revitaliser une ville relativement petite de Sicile en créant des emplois et en hébergeant des immigrés d'Afrique. Je ne nie pas qu'il ait commis des irrégularités administratives, mais il s'agissait d'irrégularités qui devaient être corrigées afin de poursuivre l'expérience. Au lieu de cela, il a été soumis à une peine inhabituelle et excessive (la peine initiale était de plus de 13 ans, aujourd'hui considérablement réduite). Il est clair que le système politique et - en partie - le système judiciaire cherchaient à expulser les immigrants en quête d'asile et d'intégration. Aujourd'hui, l'expérience est morte. Je parle du maire Domenico Lucano et de la célèbre ville de Riace.\"; /* @kind other */\n  --response-moderated: \"COVID est un faux. Vous êtes nul.\"; /* @kind other */\n  --response-short-1: \"Mon cœur se brise pour les deux femmes âgées de cette histoire. Je ne pourrais pas imaginer vivre dans des conditions aussi difficiles, y compris l'isolement social - qui me semble étrange lorsque je pense aux grandes familles italiennes. Où sont ces familles ?\"; /* @kind other */\n  --response-short-2: \"Il semble que ce soit un endroit idéal pour les nomades numériques ou les retraités.\"; /* @kind other */\n  --response-short-3: \"Je ne comprends pas la stratégie italienne qui consiste à demander aux travailleurs sociaux de contrôler les personnes âgées. Elle ne répond pas au besoin critique de refroidissement de leurs corps et de leurs maisons.\"; /* @kind other */\n  --sidebar-responses-headline: \"Réponses\"; /* @kind other */\n  --sort-all: \"Tous\"; /* @kind other */\n  --sort-filters: \"Filtres\"; /* @kind other */\n  --sort-most-recent: \"Les plus récents\"; /* @kind other */\n  --sort-top: \"Haut de page\"; /* @kind other */\n  --tag-ai-tag-ai-moderated: \"Modéré par l'IA\"; /* @kind other */\n  --tag-beta-tag-beta: \"Bêta\"; /* @kind other */\n  --tag-beta-tag-labs: \"Laboratoires\"; /* @kind other */\n  --tag-comment-slide ie über XYZ?\"; /* @kind other */\n  --reaction-changed-my-mind: \"Habe meine Meinung geändert\"; /* @kind other */\n  --reaction-controversial-emoji: \"💬\"; /* @kind other */\n  --reaction-controversial: \"Umstrittene\"; /* @kind other */\n  --reaction-disagree-emoji: \"🤔\"; /* @kind other */\n  --reaction-disagree: \"Nicht einverstanden\"; /* @kind other */\n  --reaction-helpful-emoji: \"➕\"; /* @kind other */\n  --reaction-helpful: \"Hilfreich\"; /* @kind other */\n  --reaction-interesting-emoji: \"💡\"; /* @kind other */\n  --reaction-interesting: \"Interessant\"; /* @kind other */\n  --reaction-made-me-think: \"Hat mich zum Nachdenken gebracht\"; /* @kind other */\n  --reaction-new-to-me-emoji: \"💡\"; /* @kind other */\n  --reaction-new-to-me: \"Neu für mich\"; /* @kind other */\n  --reaction-nuanced-emoji: \"⚖️\"; /* @kind other */\n  --reaction-nuanced: \"Nuanciert\"; /* @kind other */\n  --reaction-relatable-emoji: \"❤️\"; /* @kind other */\n  --reaction-relatable: \"Nachvollziehbar\"; /* @kind other */\n  --reaction-respect-emoji: \"🤝🏽\"; /* @kind other */\n  --reaction-respect: \"Respekt\"; /* @kind other */\n  --reaction-support: \"Unterstützung\"; /* @kind other */\n  --reaction-thank-you-emoji: \"🙏\"; /* @kind other */\n  --reaction-thank-you: \"Danke\"; /* @kind other */\n  --reply-journalist: \"Schauen Sie sich dieses Video an, um Ihre Frage zu beantworten.\"; /* @kind other */\n  --reply-short-1: \"Geschäft ist Geschäft, richtig?\"; /* @kind other */\n  --reply-short-2: \"Das ist ein gutes Argument.\"; /* @kind other */\n  --response-long: \"Die italienische Politik ist sehr widersprüchlich. Einerseits beklagen wir uns über Entvölkerung und Abwanderung, andererseits verweigern wir die Integration selbst denjenigen, die das Recht hätten, Bürger zu werden. Es gab einen Fall, in dem ein Bürgermeister verhaftet wurde, weil er des Diebstahls, der Vetternwirtschaft und des Nepotismus beschuldigt wurde, während er mit all seinen Kräften versuchte, eine relativ kleine Stadt in Sizilien wiederzubeleben, indem er Arbeitsplätze schuf und einige Einwanderer aus Afrika unterbrachte. Ich bestreite nicht, dass er administrative Unregelmäßigkeiten begangen hat, aber es waren Unregelmäßigkeiten, die korrigiert werden mussten, um das Experiment fortsetzen zu können. Stattdessen wurde er einer ungewöhnlichen und übermäßigen Strafe unterworfen (die ursprüngliche Strafe betrug mehr als 13 Jahre, die jetzt erheblich reduziert wurde). Es ist klar, dass die Politik und - teilweise - die Justiz darauf aus waren, die Einwanderer, die Asyl und Integration suchten, auszuweisen. Jetzt ist das Experiment gescheitert. Ich spreche von Bürgermeister Domenico Lucano und der berühmten Stadt Riace.\"; /* @kind other */\n  --response-moderated: \"COVID ist eine Fälschung. Du bist scheiße.\"; /* @kind other */\n  --response-short-1: \"Die beiden älteren Frauen in dieser Geschichte tun mir sehr leid. Ich könnte mir nicht vorstellen, unter solch schlimmen Umständen zu leben, einschließlich der sozialen Isolation - was mir seltsam erscheint, wenn ich an große italienische Familien denke. Wo sind ihre Familien?\"; /* @kind other */\n  --response-short-2: \"Sieht aus wie ein großartiger Ort für den digitalen Nomaden oder Rentner.\"; /* @kind other */\n  --response-short-3: \"Ich verstehe die italienische Strategie nicht, die darin besteht, dass Sozialarbeiter nur nach den älteren Menschen sehen. Sie geht nicht auf die kritische Notwendigkeit ein, ihre Körper und Häuser zu kühlen.\"; /* @kind other */\n  --sidebar-responses-headline: \"Antworten\"; /* @kind other */\n  --sort-all: \"Alle\"; /* @kind other */\n  --sort-filters: \"Filters\"; /* @kind other */\n  --sort-most-recent: \"Neueste\"; /* @kind other */\n  --sort-top: \"Top\"; /* @kind other */\n  --tag-ai-tag-ai-moderated: \"KI-moderiert\"; /* @kind other */\n  --tag-beta-tag-beta: \"Beta\"; /* @kind other */\n  --tag-beta-tag-labs: \"Labore\"; /* @kind other */\n  --tag-comment-slider-tag-its-com =====================================================================\n   PSI Design System — Foundations\n   Friendly px-based aliases over the raw Figma variables (which are unitless\n   floats meant for calc()). Components reference these so spacing / radius read\n   as real lengths without per-site calc() wrapping. Colors alias the semantic\n   Figma tokens to short names. Shadows + motion live here too.\n   =========================================================================== */\n\n:root {\n  /* --- Spacing scale (px) --- */\n  --psi-space-0: 0px;\n  --psi-space-4: 4px;\n  --psi-space-8: 8px;\n  --psi-space-12: 12px;\n  --psi-space-16: 16px;\n  --psi-space-20: 20px;\n  --psi-space-24: 24px;\n  --psi-space-32: 32px;\n  --psi-space-40: 40px;\n  --psi-space-48: 48px;\n  --psi-space-80: 80px;\n\n  /* --- Corner radii (px) --- */\n  --psi-radius-4: 4px;     /* tags, chips */\n  --psi-radius-8: 8px;     /* buttons, inputs, banners */\n  --psi-radius-12: 12px;   /* cards */\n  --psi-radius-16: 16px;   /* large cards, modals */\n  --psi-radius-20: 20px;   /* surfaces */\n  --psi-radius-32: 32px;   /* hero surfaces */\n  --psi-radius-pill: 100px;\n\n  /* --- Border --- */\n  --psi-border-width: 1px;\n\n  /* --- Color shortcuts over semantic Figma tokens --- */\n  --psi-text: var(--colors-text-primary);\n  --psi-text-secondary: var(--colors-text-secondary);\n  --psi-text-disabled: var(--colors-text-disabled);\n  --psi-text-hint: var(--colors-text-hint);\n  --psi-text-accent: var(--colors-text-accent);\n  --psi-text-on-dark: var(--colors-text-on-dark-bg);\n\n  --psi-surface: var(--colors-surface-primary);\n  --psi-surface-secondary: var(--colors-surface-secondary);\n  --psi-surface-highlight: var(--colors-surface-highlight);\n  --psi-surface-popover-dark: var(--colors-surface-popover-dark);\n\n  --psi-border: var(--colors-border-primary);\n  --psi-border-selected: var(--colors-border-selected);\n  --psi-border-accent: var(--colors-border-accent);\n\n  --psi-accent: var(--colors-primary-brand-iris);       /* rgb(90,30,245) */\n  --psi-accent-light: var(--colors-primary-brand-lavender);\n  --psi-accent-tint: var(--colors-primary-brand-tanzanite-3);\n\n  --psi-button-primary: var(--colors-button-primary);   /* soft black */\n  --psi-button-accent: var(--colors-button-accent);     /* iris */\n  --psi-button-disabled: var(--colors-button-disabled);\n\n  /* Status / feedback surfaces */\n  --psi-success: var(--colors-utility-mum);             /* green */\n  --psi-warning: var(--colors-utility-kilauea-1);       /* red-orange */\n  --psi-surface-success: var(--colors-surface-banner-success);\n  --psi-surface-warning: var(--colors-surface-banner-warning);\n  --psi-surface-info: var(--colors-surface-banner-info);\n  --psi-surface-suggestion: var(--colors-surface-banner-suggestion);\n\n  /* --- Elevation / shadows --- */\n  --psi-shadow-xs: 0 1px 2px rgba(0,0,0,0.06);\n  --psi-shadow-card: 0 2px 8px rgba(0,0,0,0.08);\n  --psi-shadow-popover: 0 8px 24px rgba(0,0,0,0.12);\n  --psi-shadow-modal: 0 16px 48px rgba(0,0,0,0.18);\n  /* hairline borders are drawn with inset box-shadow in the system */\n  --psi-hairline: inset 0 0 0 1px var(--colors-border-primary);\n\n  /* --- Motion --- */\n  --psi-ease: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --psi-duration-fast: 120ms; /* @kind other */\n  --psi-duration: 180ms; /* @kind other */\n}\n\n\n/* 3. Type scale + webfonts (IBM Plex Sans / Mono, DM Sans) */\n/* ===========================================================================\n   PSI Design System — Typography\n   Product type is IBM Plex Sans (font/primary + font/utility) and IBM Plex Mono\n   (font/mono). Interactive labels — buttons, tags, nav — are set in IBM Plex\n   Mono, a signature of the system. DM Sans is the large editorial / marketing\n   display face. Radio Canada Big & Raleway appear only inside partner logos.\n   PSMs (public-service-media partners) may swap font/primary for their own face.\n   =====================
