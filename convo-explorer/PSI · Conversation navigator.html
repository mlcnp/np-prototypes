  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt.\"; /* @kind other */\n  --response-long: \"La politique italienne est très contradictoire. D'un côté, nous nous plaignons de la dépopulation et du dépeuplement, tandis que de l'autre, nous refusons l'intégration même à ceux qui auraient le droit de devenir citoyens. Il y a eu un cas où un maire a été arrêté parce qu'il était accusé de vol, de favoritisme et de népotisme alors qu'il essayait de toutes ses forces de revitaliser une ville relativement petite de Sicile en créant des emplois et en hébergeant des immigrés d'Afrique. Je ne nie pas qu'il ait commis des irrégularités administratives, mais il s'agissait d'irrégularités qui devaient être corrigées afin de poursuivre l'expérience. Au lieu de cela, il a été soumis à une peine inhabituelle et excessive (la peine initiale était de plus de 13 ans, aujourd'hui considérablement réduite). Il est clair que le système politique et - en partie - le système judiciaire cherchaient à expulser les immigrants en quête d'asile et d'intégration. Aujourd'hui, l'expérience est morte. Je parle du maire Domenico Lucano et de la célèbre ville de Riace.\"; /* @kind other */\n  --response-moderated: \"COVID est un faux. Vous êtes nul.\"; /* @kind other */\n  --response-short-1: \"Mon cœur se brise pour les deux femmes âgées de cette histoire. Je ne pourrais pas imaginer vivre dans des conditions aussi difficiles, y compris l'isolement social - qui me semble étrange lorsque je pense aux grandes familles italiennes. Où sont ces familles ?\"; /* @kind other */\n  --response-short-2: \"Il semble que ce soit un endroit idéal pour les nomades numériques ou les retraités.\"; /* @kind other */\n  --response-short-3: \"Je ne comprends pas la stratégie italienne qui consiste à demander aux travailleurs sociaux de contrôler les personnes âgées. Elle ne répond pas au besoin critique de refroidissement de leurs corps et de leurs maisons.\"; /* @kind other */\n  --sidebar-responses-headline: \"Réponses\"; /* @kind other */\n  --sort-all: \"Tous --navigation-tab-thread: \"Thema\"; /* @kind other */\n  --navigation-tab-updates: \"Updates\"; /* @kind other */\n  --question-question-ai: \"Wie wirkt sich die künstliche Intelligenz auf Ihr Leben aus?\"; /* @kind other */\n  --question-question-europe: \"Wie wird sich Europa mit einer alternden Bevölkerung verändern?\"; /* @kind other */\n  --question-question-generic: \"Was denken Sie über XYZ?\"; /* @kind other */\n  --reaction-changed-my-mind: \"Habe meine Meinung geändert\"; /* @kind other */\n  --reaction-controversial-emoji: \"💬\"; /* @kind other */\n  --reaction-controversial: \"Umstrittene\"; /* @kind other */\n  --reaction-disagree-emoji: \"🤔\"; /* @kind other */\n  --reaction-disagree: \"Nicht einverstanden\"; /* @kind other */\n  --reaction-helpful-emoji: \"➕\"; /* @kind other */\n  --reaction-helpful: \"Hilfreich\"; /* @kind other */\n  --reaction-interesting-emoji: \"💡\"; /* @kind other */\n  --reaction-interesting: \"Interessant\"; /* @kind other */\n  --reaction-made-me-think: \"Hat mich zum Nachdenken gebracht\"; /* @kind other */\n  --reaction-new-to-me-emoji: \"💡\"; /* @kind other */\n  --reaction-new-to-me: \"Neu für mich\"; /* @kind other */\n  --reaction-nuanced-emoji: \"⚖️\"; /* @kind other */\n  --reaction-nuanced: \"Nuanciert\"; /* @kind other */\n  --reaction-relatable-emoji: \"❤️\"; /* @kind other */\n  --reaction-relatable: \"Nachvollziehbar\"; /* @kind other */\n  --reaction-respect-emoji: \"🤝🏽\"; /* @kind other */\n  --reaction-respect: \"Respekt\"; /* @kind other */\n  --reaction-support: \"Unterstützung\"; /* @kind other */\n  --reaction-thank-you-emoji: \"🙏\"; /* @kind other */\n  --reaction-thank-you: \"Danke\"; /* @kind other */\n  --reply-journalist: \"Schauen Sie sich dieses Video an, um Ihre Frage zu beantworten.\"; /* @kind other */\n  --reply-short-1: \"Geschäft ist Geschäft, richtig?\"; /* @kind other */\n  --reply-short-2: \"Das ist ein gutes Argument.\"; /* @kind other */\n  --response-long: \"Die italienische Politik ist sehr widersprüchlich. Einerseits beklagen wir uns über Entvölkerung und Abwanderung, andererseits verweigern wir die Integration selbst denjenigen, die das Recht hätten, Bürger zu werden. Es gab einen Fall, in dem ein Bürgermeister verhaftet wurde, weil er des Diebstahls, der Vetternwirtschaft und des Nepotismus beschuldigt wurde, während er mit all seinen Kräften versuchte, eine relativ kleine Stadt in Sizilien wiederzubeleben, indem er Arbeitsplätze schuf und einige Einwanderer aus Afrika unterbrachte. Ich bestreite nicht, dass er administrative Unregelmäßigkeiten begangen hat, aber es waren Unregelmäßigkeiten, die korrigiert werden mussten, um das Experiment fortsetzen zu können. Stattdessen wurde er einer ungewöhnlichen und übermäßigen Strafe unterworfen (die ursprüngliche Strafe betrug mehr als 13 Jahre, die jetzt erheblich reduziert wurde). Es ist klar, dass die Politik und - teilweise - die Justiz darauf aus waren, die Einwanderer, die Asyl und Integration suchten, auszuweisen. Jetzt ist das Experiment gescheitert. Ich spreche von Bürgermeister Domenico Lucano und der berühmten Stadt Riace.\"; /* @kind other */\n  --response-moderated: \"COVID ist eine Fälschung. Du bist scheiße.\"; /* @kind other */\n  --response-short-1: \"Die beiden älteren Frauen in dieser Geschichte tun mir sehr leid. Ich könnte mir nicht vorstellen, unter solch schlimmen Umständen zu leben, einschließlich der sozialen Isolation - was mir seltsam erscheint, wenn ich an große italienische Familien denke. Wo sind ihre Familien?\"; /* @kind other */\n  --response-short-2: \"Sieht aus wie ein großartiger Ort für den digitalen Nomaden oder Rentner.\"; /* @kind other */\n  --response-short-3: \"Ich verstehe die italienische Strategie nicht, die darin besteht, dass Sozialarbeiter nur nach den älteren Menschen sehen. Sie geht nicht auf die kritische Notwendigkeit ein, ihre Körper und Häuser zu kühlen.\"; /* @kind other */\n  --sidebar-responses-headline: \"Antworten\"; /* @kind other */\n  --so answer-option-1: \"Oui\"; /* @kind other */\n}\n\n:root[data-theme=\"light\"], .light {\n  --label-txt-primary: rgb(19,19,19); /* @kind color */\n}\n\n:root[data-mode=\"mobile\"] {\n  --border-width: 1; /* @kind spacing */\n}\n\n:root[data-mode=\"tablet\"] {\n  --border-width: 1; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ===========================================================================\n   PSI Design System — Foundations\n   Friendly px-based aliases over the raw Figma variables (which are unitless\n   floats meant for calc()). Components reference these so spacing / radius read\n   as real lengths without per-site calc() wrapping. Colors alias the semantic\n   Figma tokens to short names. Shadows + motion live here too.\n   =========================================================================== */\n\n:root {\n  /* --- Spacing scale (px) --- */\n  --psi-space-0: 0px;\n  --psi-space-4: 4px;\n  --psi-space-8: 8px;\n  --psi-space-12: 12px;\n  --psi-space-16: 16px;\n  --psi-space-20: 20px;\n  --psi-space-24: 24px;\n  --psi-space-32: 32px;\n  --psi-space-40: 40px;\n  --psi-space-48: 48px;\n  --psi-space-80: 80px;\n\n  /* --- Corner radii (px) --- */\n  --psi-radius-4: 4px;     /* tags, chips */\n  --psi-radius-8: 8px;     /* buttons, inputs, banners */\n  --psi-radius-12: 12px;   /* cards */\n  --psi-radius-16: 16px;   /* large cards, modals */\n  --psi-radius-20: 20px;   /* surfaces */\n  --psi-radius-32: 32px;   /* hero surfaces */\n  --psi-radius-pill: 100px;\n\n  /* --- Border --- */\n  --psi-border-width: 1px;\n\n  /* --- Color shortcuts over semantic Figma tokens --- */\n  --psi-text: var(--colors-text-primary);\n  --psi-text-secondary: var(--colors-text-secondary);\n  --psi-text-disabled: var(--colors-text-disabled);\n  --psi-text-hint: var(--colors-text-hint);\n  --psi-text-accent: var(--colors-text-accent);\n  --psi-text-on-dark: var(--colors-text-on-dark-bg);\n\n  --psi-surface: var(--colors-surface-primary);\n  --psi-surface-secondary: var(--colors-surface-secondary);\n  --psi-surface-highlight: var(--colors-surface-highlight);\n  --psi-surface-popover-dark: var(--colors-surface-popover-dark);\n\n  --psi-border: var(--colors-border-primary);\n  --psi-border-selected: var(--colors-border-selected);\n  --psi-border-accent: var(--colors-border-accent);\n\n  --psi-accent: var(--colors-primary-brand-iris);       /* rgb(90,30,245) */\n  --psi-accent-light: rgb(125,125,255);\n  --psi-accent-tint: var(--colors-primary-brand-tanzanite-3);\n\n  --psi-button-primary: var(--colors-button-primary);   /* soft black */\n  --psi-button-accent: var(--colors-button-accent);     /* iris */\n  --psi-button-disabled: var(--colors-button-disabled);\n\n  /* Status / feedback surfaces */\n  --psi-success: rgb(0,175,135);             /* green */\n  --psi-warning: var(--colors-utility-kilauea-1);       /* red-orange */\n  --psi-surface-success: var(--colors-surface-banner-success);\n  --psi-surface-warning: var(--colors-surface-banner-warning);\n  --psi-surface-info: var(--colors-surface-banner-info);\n  --psi-surface-suggestion: var(--colors-surface-banner-suggestion);\n\n  /* --- Elevation / shadows --- */\n  --psi-shadow-xs: 0 1px 2px rgba(0,0,0,0.06);\n  --psi-shadow-card: 0 2px 8px rgba(0,0,0,0.08);\n  --psi-shadow-popover: 0 8px 24px rgba(0,0,0,0.12);\n  --psi-shadow-modal: 0 16px 48px rgba(0,0,0,0.18);\n  /* hairline borders are drawn with inset box-shadow in the system */\n  --psi-hairline: inset 0 0 0 1px var(--colors-border-primary);\n\n  /* --- Motion --- */\n  --psi-ease: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --psi-duration-fast: 120ms; /* @kind other */\n  --psi-duration: 180ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ===========================================================================\n   PSI Design System — Typography\n   Product type is IBM Plex Sans (font/primary + font/utility) and IBM Plex Mono\n   (font/mono). Interactive labels — buttons, tags, nav — are set in IBM Plex\n   Mono ight */\n.psi-paragraph-lg        { font-family: var(--font-primary); font-weight: 400; font-size: 16px; line-height: 1.5; }   /* Paragraph large */\n.psi-paragraph-sm        { font-family: var(--font-primary); font-weight: 400; font-size: 14px; line-height: 1.5; }   /* Paragraph small */\n.psi-paragraph-sm-strong { font-family: var(--font-primary); font-weight: 600; font-size: 14px; line-height: 1.5; }   /* Paragraph small strong */\n\n/* Utility — IBM Plex Sans, 125% line-height (UI text, metadata) */\n.psi-utility-lg          { font-family: var(--font-utility); font-weight: 400; font-size: 16px; line-height: 1.25; }\n.psi-utility-lg-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 16px; line-height: 1.25; }\n.psi-utility-sm          { font-family: var(--font-utility); font-weight: 400; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-sm-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-tiny        { font-family: var(--font-utility); font-weight: 400; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-medium { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-strong { font-family: var(--font-utility); font-weight: 600; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-caps   { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; letter-spacing: 0.04em; text-transform: uppercase; }\n\n/* Data-viz labels — IBM Plex Sans */\n.psi-dataviz-heading { font-family: var(--font-utility); font-weight: 600; font-size: 18px; line-height: 1.25; }\n\n/* Mono / label — IBM Plex Mono (interactive labels, code, counters) */\n.psi-mono     { font-family: var(--font-mono); font-weight: 400; font-size: 14px; line-height: 1.25; }\n.psi-label    { font-family: var(--font-mono); font-weight: 400; font-size: 16px; line-height: 1.25; }   /* butto er */\n  --reaction-support: \"Soutien\"; /* @kind other */\n  --reaction-thank-you-emoji: \"🙏\"; /* @kind other */\n  --reaction-thank-you: \"Merci\"; /* @kind other */\n  --reply-journalist: \"Regardez cette vidéo pour répondre à votre question.\"; /* @kind other */\n  --reply-short-1: \"Les affaires sont les affaires, n'est-ce pas ?\"; /* @kind other */\n  --reply-short-2: \"C'est un bon point.\"; /* @kind other */\n  --response-long: \"La politique italienne est très contradictoire. D'un côté, nous nous plaignons de la dépopulation et du dépeuplement, tandis que de l'autre, nous refusons l'intégration même à ceux qui auraient le droit de devenir citoyens. Il y a eu un cas où un maire a été arrêté parce qu'il était accusé de vol, de favoritisme et de népotisme alors qu'il essayait de toutes ses forces de revitaliser une ville relativement petite de Sicile en créant des emplois et en hébergeant des immigrés d'Afrique. Je ne nie pas qu'il ait commis des irrégularités administratives, mais il s'agissait d'irrégularités qui devaient être corrigées afin de poursuivre l'expérience. Au lieu de cela, il a été soumis à une peine inhabituelle et excessive (la peine initiale était de plus de 13 ans, aujourd'hui considérablement réduite). Il est clair que le système politique et - en partie - le système judiciaire cherchaient à expulser les immigrants en quête d'asile et d'intégration. Aujourd'hui, l'expérience est morte. Je parle du maire Domenico Lucano et de la célèbre ville de Riace.\"; /* @kind other */\n  --response-moderated: \"COVID est un faux. Vous êtes nul.\"; /* @kind other */\n  --response-short-1: \"Mon cœur se brise pour les deux femmes âgées de cette histoire. Je ne pourrais pas imaginer vivre dans des conditions aussi difficiles, y compris l'isolement social - qui me semble étrange lorsque je pense aux grandes familles italiennes. Où sont ces familles ?\"; /* @kind other */\n  --response-short-2: \"Il semble que ce soit un endroit idéal pour les nomades numériques ou les retraités.\"; /* @kind other */\n  --response-short-3: \"Je ne comprends pas la stratégie italienne qui consiste à demander aux travailleurs sociaux de contrôler les personnes âgées. Elle ne répond pas au besoin critique de refroidissement de leurs corps et de leurs maisons.\"; /* @kind other */\n  --sidebar-responses-headline: \"Réponses\"; /* @kind other */\n  --sort-all: \"Tous\"; /* @kind other */\n  --sort-filters: \"Filtres\"; /* @kind other */\n  --sort-most-recent: \"Les plus récents\"; /* @kind other */\n  --sort-top: \"Haut de page\"; /* @kind other */\n  --tag-ai-tag-ai-moderated: \"Modéré par l'IA\"; /* @kind other */\n  --tag-beta-tag-beta: \"Bêta\"; /* @kind other */\n  --tag-beta-tag-labs: \"Laboratoires\"; /* @kind other */\n  --tag-comment-slider-tag-its-complicated: \"C'est complexe\"; /* @kind other */\n  --tag-comment-slider-tag-no-with-reservations: \"Plutôt non\"; /* @kind other */\n  --tag-comment-slider-tag-strongly-no: \"Non catégorique\"; /* @kind other */\n  --tag-comment-slider-tag-strongly-yes: \"Oui catégorique\"; /* @kind other */\n  --tag-comment-slider-tag-yes-with-reservations: \"Plutôt oui\"; /* @kind other */\n  --tag-debate-tag-no: \"Non\"; /* @kind other */\n  --tag-debate-tag-yes: \"Oui\"; /* @kind other */\n  --tag-external-mod-tag-approved: \"Approuvé\"; /* @kind other */\n  --tag-external-mod-tag-only-visible-to-you: \"Visible uniquement par vous\"; /* @kind other */\n  --tag-external-mod-tag-rejected-by-moderator: \"Rejeté par le modérateur\"; /* @kind other */\n  --tag-external-mod-tag-under-review: \"En cours d'examen\"; /* @kind other */\n  --tag-internal-mod-tag-automatically-approved: \"Approuvé automatiquement\"; /* @kind other */\n  --tag-internal-mod-tag-awaiting-decision: \"En attente de décision\"; /* @kind other */\n  --tag-internal-mod-tag-blocked: \"Bloqué\"; /* @kind other */\n  --tag-internal-mod-tag-deleted-by-user: \"Supprimé par l'utilisateur\"; /* @kind other */\n  --tag-internal-mod-tag-del -you-emoji: \"🙏\"; /* @kind other */\n  --reaction-thank-you: \"Danke\"; /* @kind other */\n  --reply-journalist: \"Schauen Sie sich dieses Video an, um Ihre Frage zu beantworten.\"; /* @kind other */\n  --reply-short-1: \"Geschäft ist Geschäft, richtig?\"; /* @kind other */\n  --reply-short-2: \"Das ist ein gutes Argument.\"; /* @kind other */\n  --response-long: \"Die italienische Politik ist sehr widersprüchlich. Einerseits beklagen wir uns über Entvölkerung und Abwanderung, andererseits verweigern wir die Integration selbst denjenigen, die das Recht hätten, Bürger zu werden. Es gab einen Fall, in dem ein Bürgermeister verhaftet wurde, weil er des Diebstahls, der Vetternwirtschaft und des Nepotismus beschuldigt wurde, während er mit all seinen Kräften versuchte, eine relativ kleine Stadt in Sizilien wiederzubeleben, indem er Arbeitsplätze schuf und einige Einwanderer aus Afrika unterbrachte. Ich bestreite nicht, dass er administrative Unregelmäßigkeiten begangen hat, aber es waren Unregelmäßigkeiten, die korrigiert werden mussten, um das Experiment fortsetzen zu können. Stattdessen wurde er einer ungewöhnlichen und übermäßigen Strafe unterworfen (die ursprüngliche Strafe betrug mehr als 13 Jahre, die jetzt erheblich reduziert wurde). Es ist klar, dass die Politik und - teilweise - die Justiz darauf aus waren, die Einwanderer, die Asyl und Integration suchten, auszuweisen. Jetzt ist das Experiment gescheitert. Ich spreche von Bürgermeister Domenico Lucano und der berühmten Stadt Riace.\"; /* @kind other */\n  --response-moderated: \"COVID ist eine Fälschung. Du bist scheiße.\"; /* @kind other */\n  --response-short-1: \"Die beiden älteren Frauen in dieser Geschichte tun mir sehr leid. Ich könnte mir nicht vorstellen, unter solch schlimmen Umständen zu leben, einschließlich der sozialen Isolation - was mir seltsam erscheint, wenn ich an große italienische Familien denke. Wo sind ihre Familien?\"; /* @kind other */\n  --response-short-2: \"Sieht aus wie ein großartiger Ort für den digitalen Nomaden oder Rentner.\"; /* @kind other */\n  --response-short-3: \"Ich verstehe die italienische Strategie nicht, die darin besteht, dass Sozialarbeiter nur nach den älteren Menschen sehen. Sie geht nicht auf die kritische Notwendigkeit ein, ihre Körper und Häuser zu kühlen.\"; /* @kind other */\n  --sidebar-responses-headline: \"Antworten\"; /* @kind other */\n  --sort-all: \"Alle\"; /* @kind other */\n  --sort-filters: \"Filters\"; /* @kind other */\n  --sort-most-recent: \"Neueste\"; /* @kind other */\n  --sort-top: \"Top\"; /* @kind other */\n  --tag-ai-tag-ai-moderated: \"KI-moderiert\"; /* @kind other */\n  --tag-beta-tag-beta: \"Beta\"; /* @kind other */\n  --tag-beta-tag-labs: \"Labore\"; /* @kind other */\n  --tag-comment-slider-tag-its-complicated: \"Es ist kompliziert\"; /* @kind other */\n  --tag-comment-slider-tag-no-with-reservations: \"Nein mit Vorbehalt\"; /* @kind other */\n  --tag-comment-slider-tag-strongly-no: \"Eindeutig nein\"; /* @kind other */\n  --tag-comment-slider-tag-strongly-yes: \"Eindeutig ja\"; /* @kind other */\n  --tag-comment-slider-tag-yes-with-reservations: \"Ja, unter Vorbehalt\"; /* @kind other */\n  --tag-debate-tag-no: \"Nein\"; /* @kind other */\n  --tag-debate-tag-yes: \"Ja\"; /* @kind other */\n  --tag-external-mod-tag-approved: \"Genehmigt\"; /* @kind other */\n  --tag-external-mod-tag-only-visible-to-you: \"Nur für Sie sichtbar\"; /* @kind other */\n  --tag-external-mod-tag-rejected-by-moderator: \"Vom Moderator abgelehnt\"; /* @kind other */\n  --tag-external-mod-tag-under-review: \"Wird überprüft\"; /* @kind other */\n  --tag-internal-mod-tag-automatically-approved: \"Automatisch genehmigt\"; /* @kind other */\n  --tag-internal-mod-tag-awaiting-decision: \"Entscheidung steht noch aus\"; /* @kind other */\n  --tag-internal-mod-tag-blocked: \"Blockiert\"; /* @kind other */\n  --tag-internal-mod-tag-deleted-by-user: \"Gelöscht von Benutzer\"; /* @kind other */\n  --tag-internal-mod-tag-deleted-u "Journalist\"; /* @kind other */\n  --topic-topic-ai: \"Künstliche Intelligenz und ihre Auswirkungen auf unser Leben\"; /* @kind other */\n  --topic-topic-bigfoot: \"Fragen Sie uns alles: Das Bigfoot-Rätsel\"; /* @kind other */\n}\n\n:root[data-mode=\"de\"] {\n  --frontend-overlay-question-answer-option-1: \"Ja\"; /* @kind other */\n}\n\n:root[data-mode=\"fr\"] {\n  --frontend-overlay-question-answer-option-1: \"Oui\"; /* @kind other */\n}\n\n:root[data-theme=\"light\"], .light {\n  --label-txt-primary: rgb(19,19,19); /* @kind color */\n}\n\n:root[data-mode=\"mobile\"] {\n  --border-width: 1; /* @kind spacing */\n}\n\n:root[data-mode=\"tablet\"] {\n  --border-width: 1; /* @kind spacing */\n}\n\n\n/* 2. Friendly px aliases, color shortcuts, shadows, motion */\n/* ===========================================================================\n   PSI Design System — Foundations\n   Friendly px-based aliases over the raw Figma variables (which are unitless\n   floats meant for calc()). Components reference these so spacing / radius read\n   as real lengths without per-site calc() wrapping. Colors alias the semantic\n   Figma tokens to short names. Shadows + motion live here too.\n   =========================================================================== */\n\n:root {\n  /* --- Spacing scale (px) --- */\n  --psi-space-0: 0px;\n  --psi-space-4: 4px;\n  --psi-space-8: 8px;\n  --psi-space-12: 12px;\n  --psi-space-16: 16px;\n  --psi-space-20: 20px;\n  --psi-space-24: 24px;\n  --psi-space-32: 32px;\n  --psi-space-40: 40px;\n  --psi-space-48: 48px;\n  --psi-space-80: 80px;\n\n  /* --- Corner radii (px) --- */\n  --psi-radius-4: 4px;     /* tags, chips */\n  --psi-radius-8: 8px;     /* buttons, inputs, banners */\n  --psi-radius-12: 12px;   /* cards */\n  --psi-radius-16: 16px;   /* large cards, modals */\n  --psi-radius-20: 20px;   /* surfaces */\n  --psi-radius-32: 32px;   /* hero surfaces */\n  --psi-radius-pill: 100px;\n\n  /* --- Border --- */\n  --psi-border-width: 1px;\n\n  /* --- Color shortcuts over semantic Figma tokens --- */\n  --psi-text: var(--colors-text-primary);\n  --psi-text-secondary: var(--colors-text-secondary);\n  --psi-text-disabled: var(--colors-text-disabled);\n  --psi-text-hint: var(--colors-text-hint);\n  --psi-text-accent: var(--colors-text-accent);\n  --psi-text-on-dark: var(--colors-text-on-dark-bg);\n\n  --psi-surface: var(--colors-surface-primary);\n  --psi-surface-secondary: var(--colors-surface-secondary);\n  --psi-surface-highlight: var(--colors-surface-highlight);\n  --psi-surface-popover-dark: var(--colors-surface-popover-dark);\n\n  --psi-border: var(--colors-border-primary);\n  --psi-border-selected: var(--colors-border-selected);\n  --psi-border-accent: var(--colors-border-accent);\n\n  --psi-accent: var(--colors-primary-brand-iris);       /* rgb(90,30,245) */\n  --psi-accent-light: rgb(125,125,255);\n  --psi-accent-tint: var(--colors-primary-brand-tanzanite-3);\n\n  --psi-button-primary: var(--colors-button-primary);   /* soft black */\n  --psi-button-accent: var(--colors-button-accent);     /* iris */\n  --psi-button-disabled: var(--colors-button-disabled);\n\n  /* Status / feedback surfaces */\n  --psi-success: rgb(0,175,135);             /* green */\n  --psi-warning: var(--colors-utility-kilauea-1);       /* red-orange */\n  --psi-surface-success: var(--colors-surface-banner-success);\n  --psi-surface-warning: var(--colors-surface-banner-warning);\n  --psi-surface-info: var(--colors-surface-banner-info);\n  --psi-surface-suggestion: var(--colors-surface-banner-suggestion);\n\n  /* --- Elevation / shadows --- */\n  --psi-shadow-xs: 0 1px 2px rgba(0,0,0,0.06);\n  --psi-shadow-card: 0 2px 8px rgba(0,0,0,0.08);\n  --psi-shadow-popover: 0 8px 24px rgba(0,0,0,0.12);\n  --psi-shadow-modal: 0 16px 48px rgba(0,0,0,0.18);\n  /* hairline borders are drawn with inset box-shadow in the system */\n  --psi-hairline: inset 0 0 0 1px var(--colors-border-primary);\n\n  /* --- Motion --- */\n  --psi-ease: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --psi-duration-fast: 120ms; /* @kind other */\n  --psi-duration: 180ms; /* @kind other */\n}\n\n\n/* 3. Type scale + webfonts (IBM Plex Sans / Mono, DM Sans) */\n/* ===========================================================================\n   PSI Design System — Typography\n   Product type is IBM Plex Sans (font/primary + font/utility) and IBM Plex Mono\n   (font/mono). Interactive labels — buttons, tags, nav — are set in IBM Plex\n   Mono, a signature of the system. DM Sans is the large editorial / marketing\n   display face. Radio Canada Big & Raleway appear only inside partner logos.\n   PSMs (public-service-media partners) may swap font/primary for their own face.\n   =========================================================================== */\n\n\n\n:root {\n  /* Family tokens (mirror Figma variables font/primary, font/utility, font/mono) */\n  --font-primary: \"IBM Plex Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-utility: \"IBM Plex Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --font-display: \"DM Sans\", \"IBM Plex Sans\", -apple-system, sans-serif;\n\n  /* Semantic family aliases */\n  --psi-font-body: var(--font-primary);\n  --psi-font-label: var(--font-mono);   /* buttons, tags, chrome */\n  --psi-font-display: \"DM Sans\", \"IBM Plex Sans\", -apple-system, sans-serif;\n}\n\n/* --- Type-scale utility classes (mirror the Figma \"Type\" page) -------------- */\n/* Editorial / marketing display — DM Sans */\n.psi-display      { font-family: \"DM Sans\", \"IBM Plex Sans\", -apple-system, sans-serif; font-weight: 400; font-size: 48px; line-height: 1.0; letter-spacing: -0.01em; }\n\n/* Headings — IBM Plex Sans */\n.psi-heading-lg        { font-family: var(--font-primary); font-weight: 500; font-size: 24px; line-height: 1.25; }   /* Heading large medium */\n.psi-heading-lg-strong { font-family: var(--font-primary); font-weight: 600; font-size: 24px; line-height: 1.25; }\n.psi-heading-md        { font-family: var(--font-primary); font-weight: 500; font-size: 18px; line-height: 1.25; }\n.psi-heading-sm-strong { font-family: var(--font-primary); font-weight: 600; font-size: 16px; line-height: 1.25; }   /* Heading small strong */\n\n/* Paragraph / body — IBM Plex Sans, 150% line-height */\n.psi-paragraph-lg        { font-family: var(--font-primary); font-weight: 400; font-size: 16px; line-height: 1.5; }   /* Paragraph large */\n.psi-paragraph-sm        { font-family: var(--font-primary); font-weight: 400; font-size: 14px; line-height: 1.5; }   /* Paragraph small */\n.psi-paragraph-sm-strong { font-family: var(--font-primary); font-weight: 600; font-size: 14px; line-height: 1.5; }   /* Paragraph small strong */\n\n/* Utility — IBM Plex Sans, 125% line-height (UI text, metadata) */\n.psi-utility-lg          { font-family: var(--font-utility); font-weight: 400; font-size: 16px; line-height: 1.25; }\n.psi-utility-lg-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 16px; line-height: 1.25; }\n.psi-utility-sm          { font-family: var(--font-utility); font-weight: 400; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-sm-medium   { font-family: var(--font-utility); font-weight: 500; font-size: 14px; line-height: 1.25; letter-spacing: 0.05em; }\n.psi-utility-tiny        { font-family: var(--font-utility); font-weight: 400; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-medium { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-strong { font-family: var(--font-utility); font-weight: 600; font-size: 12px; line-height: 1.25; }\n.psi-utility-tiny-caps   { font-family: var(--font-utility); font-weight: 500; font-size: 12px; line-height: 1.25; letter-spacing: 0.04em; text-transform: uppercase; }\n\n/* Data-viz labels — IBM Plex Sans */\n.psi-dataviz-heading { font-family: var(--font-utility); font-weight: 600; font-size: 18px; line-height: 1.25; }\n\n/* Mono / label — IBM Plex Mono (interactive labels, code, counters) */\n.psi-mono     { font-family: var(--font-mono); font-weight: 400; font-size: 14px; line-height: 1.25; }\n.psi-label    { font-family: var(--font-mono); font-weight: 400; font-size: 16px; line-height: 1.25; }   /* button / CTA label */\n.psi-label-sm { font-family: var(--font-mono); font-weight: 500; font-size: 12px; line-height: 1.25; }   /* tag / chip label */\n\n\n/* 4. Brand logo bitmaps (ZDF, RTBF) + illustration bitmaps */\n/* Generated by fig_materialize — background/mask classes for extracted bitmaps.\n * One rule per line; url()s are relative to this file, so it must stay\n * next to the assets/ directory it references. */\n.fig-asset-48866a150d930faa { background: url(./assets/48866a150d930faa.png) center / cover no-repeat; }\n.fig-asset-5e113eed29f430e6 { background: url(./assets/5e113eed29f430e6.png) center / cover no-repeat; }\n.fig-asset-a92e3c291b4c714a { background: url(./assets/a92e3c291b4c714a.png) center / cover no-repeat; }\n.fig-asset-cb898eb11b2dad56 { background: url(./assets/cb898eb11b2dad56.png) center / cover no-repeat; }\n\n/* Generated by fig_materialize — background/mask classes for extracted bitmaps.\n * One rule per line; url()s are relative to this file, so it must stay\n * next to the assets/ directory it references. */\n.fig-asset-48866a150d930faa { background: url(./assets/48866a150d930faa.png) center / cover no-repeat; }\n.fig-asset-5e113eed29f430e6 { background: url(./assets/5e113eed29f430e6.png) center / cover no-repeat; }\n.fig-asset-a92e3c291b4c714a { background: url(./assets/a92e3c291b4c714a.png) center / cover no-repeat; }\n\n<\u002Fstyle>\n<style>\n  body { margin:0; background:rgb(238,238,240); }\n  a { color: rgb(90,30,245); text-decoration: none; }\n  a:hover { text-decoration: underline; }\n  .cn-scroll::-webkit-scrollbar { width:10px; }\n  .cn-scroll::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.16); border-radius:100px; border:3px solid transparent; background-clip:padding-box; }\n  @keyframes cnUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes cnPop { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }\n  @keyframes cnFade { from { opacity:0; } to { opacity:1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:var(--font-primary);color:var(--colors-text-primary);\" data-canvas-width=\"960\" data-canvas-height=\"900\" data-document-role=\"page\" data-label=\"Conversation navigator\">\n\n  <!-- Top toolbar: brand + device toggle -->\n  <div style=\"width:100%;position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.92);backdrop-filter:saturate(1.1) blur(6px);box-shadow:0 1px 0 rgba(0,0,0,0.08);\">\n    <div style=\"max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;\">\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:13px;letter-spacing:0.02em;color:var(--colors-text-primary);\">\n        <span style=\"width:20px;height:20px;border-radius:6px;background:var(--colors-primary-brand-iris);display:inline-block;\"><\u002Fspan>\n        PSI · Conversation navigator\n      <\u002Fspan>\n      <span style=\"margin-left:auto;display:inline-flex;background:var(--colors-grey-scale-grey-2);border-radius:100px;padding:3px;gap:2px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ setDesktop }}\" style=\"{{ deskTabStyle }}\">Desktop<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ setMobile }}\" style=\"{{ mobTabStyle }}\">Mobile<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Stage that holds the (optionally phone-constrained) surface -->\n  <div style=\"width:100%;flex:1;display:flex;justify-content:center;padding:24px 16px 64px;box-sizing:border-box;\">\n    <div style=\"{{ surfaceStyle }}\">\n\n      <!-- ============ QUESTION HEADER (jasper, pinned) ============ -->\n      <div style=\"{{ headerStyle }}\">\n        <h1 style=\"margin:0 0 16px;font-weight:600;font-size:23px;line-height:1.25;letter-spacing:-0.01em;\">{{ question }}<\u002Fh1>\n        <div style=\"display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;color:var(--colors-text-primary);\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\" style=\"flex-shrink:0;\"><circle cx=\"11\" cy=\"9\" r=\"4\"><\u002Fcircle><path d=\"M11 15c-4 0-7 2.5-7 6v2h14v-2c0-3.5-3-6-7-6z\"><\u002Fpath><path d=\"M20 6a4 4 0 0 1 0 8\"><\u002Fpath><path d=\"M22 15c3.5 0.3 6 2.8 6 6v2h-6\"><\u002Fpath><\u002Fsvg>\n          <span>{{ statLine }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ============ SCROLLING CONTENT ============ -->\n      <div style=\"{{ scrollStyle }}\" class=\"cn-scroll\">\n\n      <!-- ============ SCREEN: FEED ============ -->\n      <sc-if value=\"{{ isFeed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:cnFade .2s ease;\">\n\n        <sc-if value=\"{{ bannerAbove }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--colors-primary-brand-tanzanite-3);border-radius:16px;padding:18px;margin-bottom:20px;color:var(--colors-text-primary);box-shadow:inset 0 0 0 1px rgba(90,30,245,0.18);\">\n          <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n            <div style=\"flex:1;min-width:200px;\">\n              <div style=\"font-weight:600;font-size:16px;line-height:1.35;\"><span style=\"font-weight: normal; font-size: 14px; width: 314px; height: 38px\  style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ p.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:500;font-size:13.5px;\">{{ p.author }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">{{ p.metaLine }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.55;\">{{ p.text }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onUp }}\" style=\"{{ p.upStyle }}\">▲ {{ p.up }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onReply }}\" style=\"margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--colors-text-secondary);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;\">↩ Reply<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ p.replies }}\" as=\"r\" hint-placeholder-count=\"0\">\n                <div style=\"margin-left:14px;padding-left:14px;border-left:2px solid rgb(217,217,217);display:flex;flex-direction:column;gap:8px;margin-top:2px;\">\n                  <div style=\"display:flex;align-items:center;gap:8px;\">\n                    <span style=\"width:24px;height:24px;border-radius:50%;flex-shrink:0;background:{{ r.avColor }};color:#fff;font-family:var(--font-mono);font-weight:600;font-size:10px;display:inline-flex;align-items:center;justify-content:center;\">{{ r.initials }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0;\">\n                      <div style=\"font-weight:500;font-size:12.5px;\">{{ r.author }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--colors-text-hint);\">{{ r.metaLine }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:13px;line-height:1.5;color:var(--colors-text-primary);\">{{ r.text }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleThemeExpand }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:500;font-size:14px;background:var(--colors-button-primary);color:var(--colors-text-on-primary-button);border:none;border-radius:8px;padding:12px 18px;cursor:pointer;\">{{ theme.expandLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <\u002Fdiv><!-- /cn-scroll -->\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ REPLY COMPOSER ============ -->\n  <sc-if value=\"{{ showComposer }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(15,15,15,0.4);animation:cnFade .16s ease;\" sc-camel-on-click=\"{{ closeComposer }}\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:520px;margin:0 16px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 16px 48px rgba(0,0,0,0.18);animation:cnPop .2s cubic-bezier(0.2,0,0.1,1);\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;\">\n        <span style=\"font-weight:600;font-size:16px;\">{{ composerTitle }}<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeComposer }}\" style=\"margin-left:auto;width:28px;height:28px;border:none;background:var(--colors-grey-scale-grey-2);border-radius:8px;cursor:pointer;font-size:15px;color:var(--colors-text-secondary);\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ composerIsReply }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--colors-text-hint);margin-bottom:12px;\">Replying to {{ composerTarget }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <textarea id=\"cn-composer\" placeholder=\"Share your thoughts…\" style=\"width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:none;box-shadow:inset 0 0 0 1px var(--colors-border-primary);border-radius:8px;padding:12px;font-family:var(--font-primary);font-size:14px;line-height:1.5;color:var(--colors-text-primary);outline:none;\"><\u002Ftextarea>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px;\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--colors-text-hint);\">Be kind. 1000 characters max.<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ postReply }}\" style=\"margin-left:auto;font-family:var(--font-mono);font-weight:500;font-size:14px;background:var(--colors-primary-brand-iris);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;\">Post<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;background:var(--colors-grey-scale-soft-black);color:#fff;font-family:var(--font-mono);font-size:13px;padding:12px 18px;border-radius:100px;box-shadow:0 8px 24px rgba(0,0,0,0.12);animation:cnUp .22s ease;display:inline-flex;align-items:center;gap:8px;\">\n    <span style=\"color:rgb(0,175,135);\">✓<\u002Fspan> {{ toastMsg }}\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:900},&quot;bannerPosition&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Below composer&quot;,&quot;Above composer&quot;],&quot;default&quot;:&quot;Below composer&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feed&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'feed',        // feed | bubbles | theme | themeAll\n    device: 'desktop',\n    themeId: null,\n    feedExpanded: false,\n    sort: 'popular',\n    sortOpen: false,\n    composerTarget: null,\n    showToast: false,\n    toastMsg: '',\n    reacts: {},          // id -> {up, upMine, chips:{key:count}, mine:{key:true}}\n    extraReplies: {},    // postId -> [reply,...]\n  };\n\n  // ---- static content ----\n  QUESTION = 'What is the one thing you would like all Albertans to consider before voting this fall?';\n\n  STANCES = {\n    'Strongly yes':          { bg: 'var(--colors-tag-success)', color: 'var(--colors-text-success)' },\n    'Yes with reservations': { bg: 'var(--colors-tag-success)', color: 'var(--colors-text-success)' },\n    \"It's complicated\":      { bg: 'var(--colors-grey-scale-grey-2)',   color: 'var(--colors-text-secondary)' },\n    'No with reservations':  { bg: 'var(--colors-utility-kilauea-2)',   color: 'var(--colors-utility-kilauea-1)' },\n    'Strongly no':           { bg: 'var(--colors-utility-kilauea-2)',   color: 'var(--colors-utility-kilauea-1)' },\n  };\n\n  AV = ['rgb(90,30,245)','rgb(5,130,135)','rgb(165,115,40)','rgb(169,88,81)','rgb(195,70,70)','rgb(82,93,207)','rgb(0,175,135)','rgb(190,115,205)','rgb(63,63,128)','rgb(125,100,83)'];\n\n  // post factory — author is the real commenter name from the transcript\n  P(id, author, meta, stance, text, replies) {\n    return { id, author, meta, stance, text, replies: replies || [] };\n  }\n\n  constructor(props) {\n    super(props);\n    this.buildData();\n  }\n\n  buildData() {\n    const P = this.P.bind(this);\n    // ---- THEMES built from the feed JSON export (203 comments, real names) ----\n    // Each comment was read and tagged to one primary theme; 44 one-liners, meta remarks and\n    // off-topic asides (moderator note, CFL teams, poll claims, etc.) were excluded rather than forced in.\n    this.THEMES = [{\"id\":\"unfair\",\"label\":\"Alberta's fairness fight with Ottawa\",\"count\":28,\"color\":\"rgb(165,115,40)\",\"px\":286,\"py\":271,\"d\":158,\"allLabel\":\"14 responses · 14 replies\",\"posts\":[{\"id\":1045,\"aid\":34,\"author\":\"mike potter\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"The provinces want power but they're not very good a exercising it. Too often it amounts to the premiere(of any province) attempting to score cheap political points at a cost to everybody.\",\"replies\":[]},{\"id\":1053,\"aid\":2,\"author\":\"Philip Lucas\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Albertans need to reflect on what they expect from the several questions on the referendum in October. There is only finite power in any national equation, and giving one part more of it means taking away from another. \\nIt is a good idea to occasionally review the general balance and distribution of authority, services and equality within a nation, within each province and territory. The greatest harm is done when one or more levels of power move to far from equality among all the people under their authority, whether Canadian or otherwise or if such authority refuses to provide services to those in need through some pretence like orientation, religion or status. This is why programs are at a national level to ensure basic equal access. \\n\\nI think the referendum is beneficial if it opens up a national reflection, it is harmful if the intent is devision for the sake of greed or power.\",\"replies\":[]},{\"id\":1186,\"aid\":95,\"author\":\"Jeremy Levi\",\"meta\":\"Sep 5 · reply to Iain Basedord\",\"stance\":\"\",\"text\":\"\\\"how centralized the federal government is\\\" will always be a funny complaint to me since the people making it often look fondly on our neighbours south of the border without grasping that Canada's political system is a stronger form of Federalism than theirs, meaning our Provinces enjoy a far greater degree of autonomy over local matters than US States do. Heck, in many areas our Provinces maintain greater independence than even EU member States do as full on Countries.\\n\\nStill, I suppose I shouldn't be too surprised. From coast to coast, not just in Alberta, provincial politicians rely on the electorate's poor grasp of the federal and provincial division of responsibilities to make much political hay of blaming the federal government for things that fall firmly and entirely within provincial jurisdiction.\\n\\nOf course there are many problems we can and should hold the Federal government to task on, but how can we even begin to address those things so long as we continue to allow our Provincial politicians to constantly muddy the waters and continue to pull the wool over our eyes?\",\"replies\":[]},{\"id\":1203,\"aid\":105,\"author\":\"canadianabroad\",\"meta\":\"Sep 4 · reply to Brian Pollock\",\"stance\":\"\",\"text\":\"The perpetual feeling that Western Canada has been alienated is supported by political pundits designed to make people feel victimized. When, in fact, it's a lack of political willpower to move away from the oil and gas industry and diversify broadly, which is the biggest inhibitor. \\n\\nDid you know that even under Trudeau the production of oil in Alberta increased every year? Or how about under Trudeau the Government bought Alberta a pipeline to bring oil to Asia? Albertans talk about being victimized by the federal government, but that's broadly a talking point by local politicians who refuse to diversify the economy.\",\"replies\":[]},{\"id\":1060,\"aid\":2,\"author\":\"Philip Lucas\",\"meta\":\"Sep 13 · reply to Ryan Rob\",\"stance\":\"\",\"text\":\"Those who repeat the old saw that the federal government constantly mistreats Albertans is spinning a false tale, over the 150 and more years Canada and the national government has both assisted and sought assistance from Alberta, they have shared the costs of resource development, infrastructure, agriculture and help with any issues, though not perhaps with the same effort or to the expectations of all Albertans. \\nWe as a nation as part of the world tried to prevent devastating global warming attributed to fossil fuel use and population, and I would admit we failed both in application and relief for the regions carrying the brunt of the changes. The same was true of immigration policy and perhaps other programs though all have changed over time, with new governments and will do so again in the future. \\nCutting the nation in pieces is a poor choice when there only needs to be a reflection on issues and a reasoned solution.\",\"replies\":[]},{\"id\":1103,\"aid\":59,\"author\":\"Jimmy Sinclair\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Until Carney repeals Bills C - 69/48 , secession will always be real .\\n\\nps.  he won't\",\"replies\":[]},{\"id\":1024,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to Bill Watson\",\"stance\":\"\",\"text\":\"Using Alberta's economic weight to build regional trade alliances, ask for regulatory reform, and elect governments that negotiate inside Confederation. Demanding an unconstitutional split doesn't solve anything. It would give up leverage.\",\"replies\":[]},{\"id\":1007,\"aid\":7,\"author\":\"Dee Moore\",\"meta\":\"Sep 18\",\"stance\":\"\",\"text\":\"I have a hypothetical question for the separatists:\\n\\nIf the Yukon struck gold, and I mean struck it big, would you expect them to make equalization payments to the rest of Canada; or in your ideology, would you allow them to simply keep what wealth they gain?\",\"replies\":[]},{\"id\":1016,\"aid\":16,\"author\":\"Mike Mac\",\"meta\":\"Sep 14\",\"stance\":\"\",\"text\":\"Even Carney has acknowledged that Alberta has legitimate economic and regional greiviences. Would Ottawa have paid attention were it not for Alberta forcing them to? Not likely.\",\"replies\":[]},{\"id\":1023,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14\",\"stance\":\"\",\"text\":\"The one thing I would like all Albertans to consider is, if independence from Canada isn't the answer, how do you suggest addressing how poorly Alberta has been treated over the past 11 years?\",\"replies\":[]},{\"id\":1039,\"aid\":29,\"author\":\"Gale Leitch\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"One for all and all for one. Otherwise, support yourselves financially without the help of Canadian taxpayers from other provinces.\",\"replies\":[]},{\"id\":1046,\"aid\":35,\"author\":\"Dennis Sarmington\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Perhaps the provinces should have more autonomy if it will help quell separatism movements. Right now Canada is starting to look like a failed social experiment.\",\"replies\":[]},{\"id\":1077,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"The questions being posed in the upcoming referendum stem from how poorly the current federal government has treated Alberta over the past 11 years. As Premier Smith recently put it, many Albertans are angry about their province being treated by the current federal government the way Eastern Canada has been treated by the US government over the past year or so. If Alberta isn't given control over critical things like immigration and healthcare, it's obvious that there will be a definitive march towards gaining complete independence from Canada.\",\"replies\":[]},{\"id\":1082,\"aid\":48,\"author\":\"Raoul O'Riordon\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Alberta is clearly an integral part of and better in Canada. Unless the US jumps in to help them it’s a chaotic losing proposition. However the long term contempt and attitudes towards the culture and economy the Liberal party has shown to  Alberta, and for that matter anyone who has conservative values is unacceptable. So they should consider that and vote for a referendum to leave to put an exclamation point on the damage the elite progressives have done to their economy culture and spirit. But really,  you have to ultimately stay and fight on to keep Canada from descending further into socialism for those who would remain that espouse freedom independence and self sufficiency just like you.\",\"replies\":[]},{\"id\":1107,\"aid\":63,\"author\":\"Richard Fryer\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"...the separatists might not win this round, but the sentiment will not die. This is a canary in the coal mine, and Ottawa politicians need to quit listening to wealthy well connected lobbyists...for example,  the medical profession and others and move forward with meaningful reforms that reduces  bureaucracy, duplication  and costs. Smiths message about removing the requirement for a referral to get a lab test, for example an ECG , is a message to Ottawa... we all heard the screams from the vested interests...it's not about health-care but about power and control...well enough is enough... Ottawa better listen.\",\"replies\":[]},{\"id\":1128,\"aid\":73,\"author\":\"David Schultz\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Free Alberta! Keep the pressure on this is the only way to force our government to care about western issues! A vote to stay is tacit approval of our current trajectory!\",\"replies\":[]},{\"id\":1199,\"aid\":113,\"author\":\"nicole scott\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"The whole point is that even the People voting to separate if they thought the Liberals would change and offer Equality and some appreciation for the Contributions made by Alberta. Mar talks businesses leaving, Doubtful as even with Separation Talks Alberta is seeing Billions in Investments and the Only growing Population In Canada, Of course we would have to take some of the Debt, but based on population that's 12%, Imagine Ontario with a $500 Billion Provincial Debt having to take almost 1/2 the debt or Quebec with $300 Billion Provincial Debt have to takle their portion of Debt, But none of this is ever disgusted when we talk Quebec. CPP belongs to the People and Alberta is owed about 25% or More because of are Young Population and are contributions, last Year Ontario got more CPP Payments than they contributed. Alberta Exports over $180 Billion/Year (28% of all Canadian Exports) & that's mostly Oil going to the USA and that isn't going to stop. The citizenship issue is a Joke, we would maintain are Canadian Citizenship, Canada has the Highest Percentage of any Country of Ex Pats living outside of Canada, should they lose their Citizenship?\",\"replies\":[]},{\"id\":1201,\"aid\":115,\"author\":\"Brian Pollock\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"What’s the cost to stay?\",\"replies\":[]},{\"id\":1019,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to Jacques Bruyere\",\"stance\":\"\",\"text\":\"Premier Smith has repeatedly emphasized that she stands for a united Canada with Alberta being an independent province within Confederation. And the world will be a hydrocarbon society for several more generations.\",\"replies\":[]},{\"id\":1034,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to canadaproud\",\"stance\":\"\",\"text\":\"We've tried to influence change over several decades, but we've now given up.\",\"replies\":[]},{\"id\":1047,\"aid\":33,\"author\":\"Bala Viswa\",\"meta\":\"Sep 13 · reply to Dennis Sarmington\",\"stance\":\"\",\"text\":\"That is an interesting idea. Canada is set up as a federation of provinces (at least in the BNA). In that sense, the federal government owes its existence to the provinces. It is a unifying governance layer above the provinces, it is not an \\\"overlord\\\" layer of governance. The BNA and Constitution give the provinces plenty of autonomy, but they give the federal government the power to raise revenue (the power of taxation). Some of these revenue-raising powers have been devolved to the provinces (like undergorund mineral royalties, part of the income tax).\",\"replies\":[]},{\"id\":1057,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to lion37\",\"stance\":\"\",\"text\":\"Do you suggest that Albertans just continue to put up with how they are treated?\",\"replies\":[]},{\"id\":1061,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to Ryan Rob\",\"stance\":\"\",\"text\":\"So what is your solution? I've lived in Alberta almost 70 years, and the Province is always mistreated by the federal government.\",\"replies\":[]},{\"id\":1066,\"aid\":2,\"author\":\"Philip Lucas\",\"meta\":\"Sep 13 · reply to truecanadian99\",\"stance\":\"\",\"text\":\"🛢️ The Economic Powerhouses (Alberta & British Columbia)Alberta has been the largest net contributor to Confederation relative to its size. High oil revenues in the 1970s, 1980s, and 2000s boosted its fiscal capacity dramatically. Alberta has not qualified for an Equalization payout since 1965.British Columbia has occasionally drawn minor equalization in brief economic lulls (such as the early 2000s) but has functioned almost entirely as a \\\"have\\\" province for the last century. [1] (https://www.taxpayer.com/newsroom/cost-of-equalization-to-alberta-taxpayers), [2] (https://financesofthenation.ca/2020/11/17/who-pays-and-who-receives-in-confederation/), [3] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php), [4] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php)🏭 The Swing Provinces (Ontario, Quebec, & Saskatchewan)Ontario was the financial anchor of Canada for most of the century, serving as a non-recipient \\\"have\\\" province until the 2008 financial crisis devastated its manufacturing core. It drew Equalization for a ten-year stretch before returning to net-contributor status.Quebec receives the highest total nominal dollar amount of Equalization due to its massive population. However, on a per-capita basis, its draw is much lower than the Atlantic provinces, and its total fiscal reliance on Ottawa hovers near the exact national average.Saskatchewan spent decades as a recipient province, but the global agricultural and mining booms of the 2000s permanently elevated its fiscal capacity, removing it from Equalization reliance for the last 15+ years. [1] (https://en.wikipedia.org/wiki/Canadian_transfer_payments), [2] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php), [3] (https://financesofthenation.ca/2020/11/17/who-pays-and-who-receives-in-confederation/), [4] (https://spheresofinfluence.ca/the-two-sides-of-equalization-payments-in-canada/), [5] (https://etatscanadiens-canadiangovernments.enap.ca/en/nav.aspx?sortcode=2.0.3.1), [6] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php)\",\"replies\":[]},{\"id\":1084,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to JR Kookie\",\"stance\":\"\",\"text\":\"So do you accept the status quo approach for dealing with Alberta? Do you think that has been working well?\",\"replies\":[]},{\"id\":1086,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to JR Kookie\",\"stance\":\"\",\"text\":\"Good points, but my question for you is, do you think the status quo approach is working for Alberta?\",\"replies\":[]},{\"id\":1091,\"aid\":51,\"author\":\"Mitchell Dekker\",\"meta\":\"Sep 13 · reply to Robert MacMillan\",\"stance\":\"\",\"text\":\"I think the people of AB are relatively done with hearing the other provinces grievances\",\"replies\":[]},{\"id\":1193,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to princeofhartes\",\"stance\":\"\",\"text\":\"Good points, but my question for you is, what is your solution? Clearly, the status quo approach isn't and won't work for Alberta, so something has to change. What would you do?\",\"replies\":[]}]},{\"id\":\"optout\",\"label\":\"Keeping federal money without the conditions\",\"count\":18,\"color\":\"rgb(63,63,128)\",\"px\":160,\"py\":198,\"d\":127,\"allLabel\":\"10 responses · 8 replies\",\"posts\":[{\"id\":1028,\"aid\":21,\"author\":\"Mark Leenders\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"If Alberta is allowed to keep federal cash, the UCP will just give the money to large oil companies and their other rich friends. Average Albertans will never see a penny of it.\\nPlease, Federal Government, don't let our MAGA premier get away with this.\",\"replies\":[]},{\"id\":1029,\"aid\":23,\"author\":\"Sarah Brown\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Albertans have no business thinking they can opt out of federal programs but keep the money.\",\"replies\":[]},{\"id\":1040,\"aid\":30,\"author\":\"Eric Maker\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Why is it that Alberta, which is always bragging about being Canada's richest province, is constantly trying to get Canada's money without submitting to the conditions that all of the other provinces must follow to receive funding? No conditions? No cash.\",\"replies\":[]},{\"id\":1043,\"aid\":32,\"author\":\"Deanna Cadoret\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"You are either part of Canada or you stand completely alone. That means no Federal money, no RCMP, no Air Traffic Control and equipment maintenance, no CCP, no Canadian Military, no Federal Safety Regulations( including health, worker and food safety, weights and measures ), no Federally negotiated Trade Deals. You want out, then
