 doesn't mean they did not forget about conquering the rest of the continent.\"}]},{\"id\":1135,\"aid\":77,\"author\":\"Sue Kennedy\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789220373206,\"up\":3,\"depth\":0,\"text\":\"I would like them to reflect on the outcome of Brexit in the UK.\",\"replies\":[{\"id\":1136,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789507023688,\"up\":0,\"depth\":1,\"text\":\"Yes, many of them (meaning, us...we aren't children) are well  aware and well informed, thank you. \\nUnfortunately, most Canadians are late to the game. And CBC also needs to note that should AB separate, CBC's future is partly at stake.\"}]},{\"id\":1137,\"aid\":78,\"author\":\"joej\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789217235948,\"up\":0,\"depth\":0,\"text\":\"There doesn't seem to be a clear understanding of the process to seperation, it's not a simple divorce, the clarity act which Alberta and Quebec have signed lays out the process. What's disappointing is as a person from Ontario, everyone is frustrated with Ottawa. \\nPeople need to realize that, the grass won't be greener on the other side. All Provinces need to be working as a collective, to ensure the interests of every Province are taken into account especially on issues like energy, the environment, immigration.   Alberta is wanted, and valued even if it may SEEM Ottawa doesn't.\",\"replies\":[]},{\"id\":1138,\"aid\":79,\"author\":\"Terry Morrison\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789177501671,\"up\":3,\"depth\":0,\"text\":\"I cannot believe that the government of Alberta is using our money to fund an advertising campaign to promote their particular bias. This referendum is already costing the taxpayer an incredible amount of money. If they truly want the people of Alberta to voice their own opinions in a vote, then they should not be trying to sway it. I am appalled but not overly surprised.\",\"replies\":[{\"id\":1139,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789507290931,\"up\":0,\"depth\":1,\"text\":\"Much of what our AB gov't does surprises me, including changing laws to suit the UCP and Separation. \\nMany laws began quietly changing awhile back, but nobody seemed to notice. \\nIt's almost a full-time job keeping track of all the loopholes that have been found and the changes made even when loopholes could not be found.\"}]},{\"id\":1140,\"aid\":80,\"author\":\"Raymond Gignac\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 11\",\"ts\":1789142496460,\"up\":0,\"depth\":0,\"text\":\"I understand that some Albertains want to separate!I was born in Northern Ontario and there too we have problems with the Provincial Government and the Federal Government!Northern Ontario contains 95%of the area of Ontario but only has 5% of Ontario's population so we are forgotten about until election time it seems!But we hang in there and progress is slow but we up North do not want to seperate!Look what separation did to Britain and the EEC(now the EU!)Right now am living in Edmonton again!I want things to be better wherever i live and I LOVE CANADA!Separation may not be good for me or Alberta or Quebec in the long run.Thks!Raymond\",\"replies\":[]},{\"id\":1141,\"aid\":81,\"author\":\"TD DK\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 11\",\"ts\":1789127193734,\"up\":1,\"depth\":0,\"text\":\"Trump and the USA would put the thumbscrews to a separate Alberta. Alberta would become their next Puerto Rico. Alberta would bear the brunt of trump's anti-Canada rant, in light of the recent failed trade talks. And Trump could even offer to pay LESS for Alberta oil. And what would Premier Smith and the UCP do then? And all Smith is doing is sucking up to trump so that he doesn't. (And if I were him, I would)\",\"replies\":[]},{\"id\":1142,\"aid\":81,\"author\":\"TD DK\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 11\",\"ts\":1789126868318,\"up\":4,\"depth\":0,\"text\":\"One aspect of separation I have not read anywhere . . . just WHO is going to manage a separate Alberta? Has Smith and the UCP proven themselves competent at ANYTHING? What have they actually brought to fruition that is working FOR the every day Alberta resident? They have botched everything they have touched, except for the new license plates and the \\\"Welcome to Alberta\\\" signs? Whooooo hoooooooo, like how do those 2 help us with everyday cost-of-living, etc. All just status-quo . . . . They certainly have NOT done anything for the common every day Alberta resident.\",\"replies\":[]},{\"id\":1143,\"aid\":82,\"author\":\"ron2109\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 11\",\"ts\":1789094545737,\"up\":4,\"depth\":0,\"text\":\"If Alberta were to somehow distance themselves from Canada the U.S. would swallow it up faster than you could imagine. Consider paying all of your healthcare costs if you can find medical professionals that can help you. The population would be too small to have separate insurance plans or rates. Watch elected judges overlook basic principles of law so they can do whatever the current government wants them to do. The quality of education would plummet and governments would try to transition the population to all whites. The last point seems obvious based on the other questions being voted on Oct. 19. It is a very shortsighted strategy and I expect that the recent major projects announced for Alberta would be dropped because the rest of Canada won’t be interested in paying anything to help a province that leaves.\",\"replies\":[]},{\"id\":1144,\"aid\":83,\"author\":\"tf2026\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789079703890,\"up\":4,\"depth\":0,\"text\":\"If the vote is for Alberta separation then I will move back to Canada.  I’d like those who vote for separation to make the same commitment, if they lose they will move somewhere else.\",\"replies\":[]},{\"id\":1145,\"aid\":84,\"author\":\"Johannes Dietz\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789078181701,\"up\":1,\"depth\":0,\"text\":\"Anger, fear, and resentment. Those are the emotions that drive the separatists' debate. They are powerful and make people behave in destructive and self-destructive ways. Unfortunately, those caught up in the emotion are not receptive to rational argument. This isn't about debating policies and goals. It is about getting back at whoever: Ottawa, environmentalists, people who are not 'us.' There is no real communication between those that try to argue rationally and those that want to lash out. That is what concerns me most about this issue.\",\"replies\":[]},{\"id\":1146,\"aid\":85,\"author\":\"Tom Donaghy\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789075183581,\"up\":0,\"depth\":0,\"text\":\"This is a big and very profound issue and needs to be thought through!\\n\\nGlad it came to this level of a democratic discussion and I hope that whoever LOSES can deal with the rejection, whichever side that is.\\n\\nThis is the  best democracy in Canada.  Alberta.  Love it here. Will deal with the outcome. I just want everyone else to do that too.  C'mon.  we are all /canadian\",\"replies\":[{\"id\":1147,\"aid\":64,\"author\":\"amandaf\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789225548148,\"up\":0,\"depth\":1,\"text\":\"The UCP has held all kinds of surveys, polls, and referendums to find out what Albertans want. They then implement policies that are the exact opposite of what Albertans said they wanted. Take the referendum on daylight savings as one example. Can you explain how that's democratic?\"}]},{\"id\":1148,\"aid\":86,\"author\":\"Ellen Simpson\",\"ini\":\"E\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789074204203,\"up\":3,\"depth\":0,\"text\":\"I find it interesting that the separatist movement in Alberta doesn't seem to offer clarity on what the goal and objectives are for Albertans by separating? \\n\\nIt seems more like a grievance movement?\",\"replies\":[]},{\"id\":1149,\"aid\":87,\"author\":\"David Locontes\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789072994923,\"up\":6,\"depth\":0,\"text\":\"I think most of those pro-independence accounts are Russian state-sponsored groups and US maga.  See Brexit.  Canada is not doing a good job in defending against that.\",\"replies\":[]},{\"id\":1150,\"aid\":88,\"author\":\"fr2309\",\"ini\":\"F\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789071024880,\"up\":11,\"depth\":0,\"text\":\"People need to understand if Alberta becomes a landlocked nation it will have very little negotiating power for any fair deal with the US. The US will be perfectly happy to squeeze Alberta for cheap oil with very little return as we lose our coastal access. American influence is also declining on a global scale as seen with its inability to deal with the rise of China and aggressions from Russia and Iran. Declining superpowers has a tendency to lash out and turn more aggressive before imploding from within. If Alberta joins the US it will be akin to tying ourselfs onto a sinking ship. Staying in Canada still leaves Alberta with options other than America.\",\"replies\":[{\"id\":1151,\"aid\":73,\"author\":\"David Schultz\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789223244373,\"up\":0,\"depth\":1,\"text\":\"We are landlocked now\"}]},{\"id\":1152,\"aid\":13,\"author\":\"Andrew Ross\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789070947210,\"up\":13,\"depth\":0,\"text\":\"As a local activist in the south zone, I have never encountered someone pushing seperation in real life when I am handing out lawn signs for albertasvoice.ca, or while speaking as an AFL (Alberta federation of labor) activist... Not once.\\n\\nIts almost as if they exist stictly online, which raises many red flags.\\nThe arguments made for sepeartion are not based in reality, and completely crumble under the most basic of questioning.  \\nThe future promised us flying cars, and robot buttlers... Instead we got loud podcasters, medical disinformation and AI data centres that nobody asked for, and nobody wants. \\n\\nNot one politician in government ran on this issue, so why are we here now? Why does populism get entertained trying to break up the country, and not on renewable energy, or any progressive issue?\\n\\n When history repeats itself in the next 5 years, we are all in a ton of trouble.\",\"replies\":[{\"id\":1153,\"aid\":71,\"author\":\"amy\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789486196068,\"up\":1,\"depth\":1,\"text\":\"Go see their base out in Mirror. They definitely exist, but they've been sold a lie.\"}]},{\"id\":1154,\"aid\":61,\"author\":\"joalberta\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789062180667,\"up\":7,\"depth\":0,\"text\":\"Confederation of Canada was in order to hedge the American Imperial threat. \\n\\nTo think that the American Empire (with their imperial motto of \\\"manifest destiny\\\") wouldn't attempt to at least annex an independent Alberta or at least diminish its power significantly through heavy tariffs from king Trump. \\n\\nDo we think that Alberta's voice will be heard in the Washington with the chorus of 50 other states (assuming Alberta would gets statehood)? Because that is what American worshipping separatists ultimately want, we are kidding ourselves to think this is not their ultimately goal, which honestly amounts to treason (probably why RCMP has been asked to investigate Danielle Smith for that charge). \\n\\nDo we really believe that is a better deal than Ottawa and being a part of Canada?\\n\\nThis is a plan by the Americans to weaken Canada by knocking Alberta down peg (we make a lot of money). Separatist movements are really bad for the economy, even if the separation fails a lot of economic damage and uncertainty will be done, playing into the imperialist American's hands.\\n\\nHow about instead of separating we nationalize our oil (which is primarily owned by Americans)?\",\"replies\":[]},{\"id\":1155,\"aid\":73,\"author\":\"David Schultz\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789050403869,\"up\":0,\"depth\":0,\"text\":\"Option #2 all the way Alberta!\",\"replies\":[]},{\"id\":1156,\"aid\":89,\"author\":\"George Plachcinski\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788971621974,\"up\":1,\"depth\":0,\"text\":\"Separating from a strong(er), united Canada is not even short-sited, but unrealistic. 'Some' natural resources, but unable to refine them within our borders, export them raw (low price); no long-term interprovincial trade agreements; no ocean border (worldwide trade?);\\nThat's just a few economic aspects. \\nMedicare? Pensions? Retirement \\\"packages\\\"?\\nLet's look beyond the tip of our own noses! Yes! We have been frustrated with \\\"federalies\\\" over the years. However, not the way Ms. Smith and her \\\"supporters\\\". You cannot please the right hand and the left hand. Two tier medical system will uproot the long fought for and accomplished results.\\nWork with the federals; demand, pressure and cooperate.\\nJust \\\"putting your foot down\\\" (as the referendum) will get us nowhere!\\nWork with provinces on long-term inner provincial trades; as a united Canada of strongly inner connected provinces, work vigorously on world markets.\\nA post war (seemingly) very acceptable, long-term agreements with  one  economy (much stronger than ours) can lead to a showing up of... One self-centered, shovinistic, pig-headed male trumpet...and the flood gates open.\\nGeorge Plachcinski\\nEdmonton born, redneck Alberta boy with a strong Canadian heart\",\"replies\":[{\"id\":1157,\"aid\":90,\"author\":\"Rick McCaffrey\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788984655416,\"up\":0,\"depth\":1,\"text\":\"Calgary born, redneck Alberta boy here that has cut out his Canadian heart and ate it.\"}]},{\"id\":1158,\"aid\":91,\"author\":\"Bill Campbell\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788960572940,\"up\":25,\"depth\":0,\"text\":\"I wished everyone would publicly acknowledge that there is foreign interference. \\n \\nThere are two main players the US and then the rest of the world.  US interference has been shown by many journalists are exposing the mega right wing millionaires that funneling money into the campaign and social media.\\n\\nThe rest of the world is interfering whether it's Russia, North Korea or China.  There are many news stories on social media manipulation.  CBC had a great story on an American Youtuber who was paid $40 per post by someone in The Netherlands to make pro-separation post.\\n\\nAs an Alberta in my eighth decade I have never seen evidence of a separation movement.  I came after social media became dominant in the last 10 or so years and people got into these \\\"information silos\\\" that are filled with dis-information.\",\"replies\":[{\"id\":1159,\"aid\":71,\"author\":\"amy\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789485554337,\"up\":6,\"depth\":1,\"text\":\"The entire movement was literally started by an American, and funded by foreign powers. It's a ploy to purposefully destabilize our government, helped along by people who think that a separation vote \\\"sends a message\\\".\"},{\"id\":1160,\"aid\":86,\"author\":\"Ellen Simpson\",\"ini\":\"E\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 10\",\"ts\":1789073821262,\"up\":1,\"depth\":1,\"text\":\"Interesting that an up arrow isn't possible on your post?\"}]},{\"id\":1161,\"aid\":92,\"author\":\"Pamela Johnson\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788953315860,\"up\":8,\"depth\":0,\"text\":\"Being a \\\"proud Albertan\\\" and upset with Ottawa can co-exist and feeling both things does not necessitate leaving Canada. It's this message I am trying to figure out how to articulate with my friends.  Personally, I am not \\\"upset with Ottawa\\\" (I wish hyperpolitics wasn't pulling us away from the question of our environment and climate change) but I know people who are and I don't want to alienate them further by essentially telling them they are stupid for wanting to leave. I do think they are uninformed, heavily wedded to an ideology and see their lives as somehow out of their control and think a conservative government will deliver sweeping changes to them.  Leaving Canada is shortsighted in many ways but not least of which the fact that the UCP will not be the governing party forever.  I think \\\"oil and gas\\\" factors heavy into this equation and I wish my friends who think leaving Canada gives them more power considered a) there is such a thing as peak oil even when we just consider diversifying our energy and people wanting to get off fossil fuels b) is it really \\\"Alberta oil\\\"? How much of the oil industry is actually owned and influenced by American companies and interests? c) American interest in oil is strong and without any other real economic driver oil would be our only thing (I mean we make darn good draft beer!) Consider the fickleness of the current American regime, is that what we want to \\\"negotiate\\\" with?  \\n\\nSo what would I like all Albertans to know? Well, that each person comes at their thinking that staying in Canada is either bad or good for reasons personal to them. In many ways HOW they come to their reason is what's interesting and if we skate right by that and just tell the person who thinks differently from you/me that they are \\\"stupid\\\", it does nothing (except maybe push them further in their own direction)\",\"replies\":[]},{\"id\":1162,\"aid\":93,\"author\":\"jdvanisl\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788938465986,\"up\":1,\"depth\":0,\"text\":\"First, Alberta can't separate without agreement of First Nations as almost all the province is covered by Treatis with the federal government. Second, how do they think they're going to get their natural resources to market without going through Canada? Unless they immediately capitulate to the USA, which would hardly be independence.\",\"replies\":[]},{\"id\":1163,\"aid\":94,\"author\":\"stephanyt\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788931093198,\"up\":6,\"depth\":0,\"text\":\"So, Albertans are going to vote whether or not to have a vote on separating from Canada? Hey, I am Canadian but not Albertan and I want a vote, too. It is my Canada as well and if you want to leave (feel free!) AND take part of my Canada with you (don't!) I want at least some form of say/vote that goes beyond this discussion here.\",\"replies\":[]},{\"id\":1164,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788910932723,\"up\":6,\"depth\":0,\"text\":\"The 'Yes' group should they win and force or try and force D.Smith to hold a binding referendum would have opened a huge legal precedence by the simple 'Yes' vote win. \\nThey would have given the right of 1st nation treaty members to also vote to separate from Alberta in favour of Canada or complete autonomy. They would have the right just as the separatists say they have the right and the outcome would be a very small residual Alberta excluding much of the boasted resources that are under treaty lands. \\nThey also need to reflect on the history of past separations and attempted ones to see if history proves their truth of a 'better life' to be actually true. \\nThe argument that the 'Yes' vote is more of a strike vote to allow pressure for even more provincial autonomy is rather a red herring. \\nFinally a 'Yes' vote would harm the unity and one for all type of feeling Canadians have toward those who want to chuck it in. \\nDo you remember how you felt several years ago when the Alberta government threatened BC with cutting off the oil and gas? The simple threat I found revolting and reminds me of what Trump is doing now.\",\"replies\":[{\"id\":1165,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789504837655,\"up\":0,\"depth\":1,\"text\":\"What are you talking about? It's very unclear what you are trying to say here.\"},{\"id\":1166,\"aid\":95,\"author\":\"Jeremy Levi\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789225757296,\"up\":5,\"depth\":1,\"text\":\"First Nations are the elephant in the room that the separatists don't want to talk about. Without the support of First Nations seperation is a no go. It was a big issue during Quebec's previous seperation attempts and it remains a big issue today, one that's unlikely to be resolved in the separatists' favour.\"}]},{\"id\":1167,\"aid\":27,\"author\":\"Morton Cohen\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788907794249,\"up\":4,\"depth\":0,\"text\":\"If it should happen that oil is no longer the energy choice. Alberta may have problems. Canada will always have your back. That is what Canadians do. Don't sell out tomorrow for promises today\",\"replies\":[]},{\"id\":1168,\"aid\":96,\"author\":\"steves\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788900470565,\"up\":14,\"depth\":0,\"text\":\"Brexit created a number of lies that were used to justify the damage done to the British economy in the name of taking back control.  The result is that Britain is still suffering from the failures and is now looking to find a way to re-unite without re-uniting.  Those same lies are being used in Alberta.  Promises of prosperity, sudden access to markets, and continued relations with the rest of the world, influx of funds for services and healthcare, an end to immigration.  Brexit shrieks that won't happen.  Alberta has one resource and that is overshadowed by the growth in renewables.\",\"replies\":[]},{\"id\":1169,\"aid\":97,\"author\":\"Ken Johnson\",\"ini\":\"K\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788899425013,\"up\":31,\"depth\":0,\"text\":\"As a native Albertan I say to remember that the oil industry gets a subsidy of a billion dollars a month from the Feds. Most of it goes to the big four who dominate the tar sands and they are up to 73% foreign owned - mostly American. Most of the oil they produce goes to the US for $30 a barrel under the world rate. Let's clean up that process before even thinking about separation. Canada is an oasis in an uncertain world.\",\"replies\":[]},{\"id\":1170,\"aid\":98,\"author\":\"Mike Dixon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788896720453,\"up\":8,\"depth\":0,\"text\":\"A separated Alberta will be constantly attacked for annexation by America, and will lack the size and tools to do anything about it.\",\"replies\":[]},{\"id\":1171,\"aid\":99,\"author\":\"ai76\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 8\",\"ts\":1788834234778,\"up\":1,\"depth\":0,\"text\":\"My biggest concerns are: a) if Alberta does vote to separate, it may become a racist and xenophobic haven where all the issues will be \\\"because of immigrants\\\"; b) if Alberta votes to stay, provincial grievances will continue being ignored by Ottawa.\",\"replies\":[{\"id\":1172,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789253825628,\"up\":0,\"depth\":1,\"text\":\"Unfortunately, Alberta already is leaning in that direction.\"}]},{\"id\":1173,\"aid\":100,\"author\":\"Sofi Jizz\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 5\",\"ts\":1788635899634,\"up\":15,\"depth\":0,\"text\":\"I'm concerned that no one is talking about the Social factors.\\nThe factors that currently affect our province:\\nHomelessness, addictions, food insecurity, no living wage, etc etc etc...\\nWe've already taken hits this year affecting peoples with disabilities, seniors, schools, housing, hospitals, our healthcare is being turned into a for profit, etc....\\nThe driver's license scheme because it's a scheme. A money grab that is affecting the poorest and most vulnerable.\\n\\nWhat will social structure look like in the new Alberta.\\nWill the separatists even change that name since Alberta is named after \\\"Princess Louise Caroline Alberta was the 6th child of Queen Victoria and Prince Albert. Lake Louise is also named after her.\\\"\\nIs the 'new Alberta' hoping to do a person swap with Canada: We give you our homeless, addicts, the poor, seniors, you give is healthy people that can work.\\nWhat will our healthcare look like. \\nHow many nurses, doctors, teachers, skill trades people, blue collar, white collar workers will we lose.\\nWho will be left.\\nWill we resemble the Republican states, like Louisiana or Georgia. \\nWill only the poor and uneducated remain so the rich and powerful can retain control and remove every cent out of the population that's left.\\nSomeone compared this to the UK leaving Brexit.\\nHave people read the news of the mess the chaos for the working class this created. Then the continued \\\"blame the immigrant\\\". \\n\\nSeparatists blame the federal government for our poverty, and yet UCP have the freedom to turn our provincial healthcare into a 2 tier system, steal money from the poorest, etc etc etc...\\n\\nThe Conservative movement has been in charge in Alberta for as long as I can remember, and only once did they think about saving our wealth. Then they stole it, and spent it.\\n\\nNow they blame the feds.\\n\\nThey've been in control and they blame the feds.\",\"replies\":[]},{\"id\":1174,\"aid\":101,\"author\":\"Canada Proud\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 5\",\"ts\":1788630191134,\"up\":0,\"depth\":0,\"text\":\"Hello everyone. I’ve found the comments so far interesting, and I think one thing worth considering is the full scope of what major constitutional changes—such as leaving Canada—could involve. Conversations about separation often arise when people are frustrated with decisions made by governments at any level, but the practical implications of becoming an independent country are complex and far‑reaching.\\n\\nBecoming a separate nation would require negotiating new arrangements for citizenship, passports, federal programs (such as pensions, healthcare, schools, tutition, education, and employment insurance), and financial transfers. None of these systems automatically carry over; they would depend on negotiations with the federal government, and the outcomes are not guaranteed. It would also mean creating that countries new structures for currency, banking, national defence, and international agreements. Even organizers who support separation have acknowledged that many details would depend on future decisions with the federal government that no one can predict today, which means the results could differ dramatically from expectations.\\n\\nMy hope is simply that voters take time to think through what such a transition would realistically involve—both the opportunities and the challenges. Major structural changes deserve careful consideration, calm discussion, and a clear understanding of what is known and what remains uncertain.\",\"replies\":[]},{\"id\":1175,\"aid\":102,\"author\":\"Anton Pavlenko\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 5\",\"ts\":1788627456109,\"up\":0,\"depth\":0,\"text\":\"Why is there a pressing need to get Albertans to decide to either stay or separate from Canada. Why don't they simply have the separation voters sign up their numbers and all those that don't, are by default, automatically acknowledged patriotic Canadians. Thereby 120-130 million tax payer dollars would be saved and put towards serious pressing Albertan needs.\",\"replies\":[{\"id\":1176,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789254957059,\"up\":2,\"depth\":1,\"text\":\"We've already had two petitions. The remain side had almost twice as many signatures as the separatist side. There is no reason for this referendum other than Danielle is frightened of her UCP people who are mostly Separatists.\"}]},{\"id\":1177,\"aid\":102,\"author\":\"Anton Pavlenko\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 5\",\"ts\":1788626911549,\"up\":20,\"depth\":0,\"text\":\"How quickly can we get rid of the UCP and charge Danielle Smith with treason?\",\"replies\":[{\"id\":1178,\"aid\":45,\"author\":\"mike5600\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302460322,\"up\":2,\"depth\":1,\"text\":\"I think the next general election in Alberta will take care of Smith and the UCP.\"},{\"id\":1179,\"aid\":103,\"author\":\"Donna Cameron\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789177907604,\"up\":11,\"depth\":1,\"text\":\"Smith has to be defeated, she's dangerous.\"}]},{\"id\":1180,\"aid\":104,\"author\":\"user99\",\"ini\":\"U\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788539720437,\"up\":12,\"depth\":0,\"text\":\"1. Alberta can't afford to separate and its separation would be illegal; therefore the vote is a waste of money.  Danielle Smith, herself, claims she doesn't want to separate. Read Policy Opinions here: https://policyoptions.irpp.org/2026/02/alberta-separation-illegal/ \\n\\n2. What we can't vote on: Albertans now have to pay for Danielle Smith's Bill 11 U.S.-style health care, and wait times for surgeries will be longer unless you pay for them yourself by buying costly health care insurance. In the U.S. employers pay, but the premiums for insurance rise 5 - 6% a year.  Employers might not pay in Alberta.\\n\\n2.  The Walrus states 20% of the online influence to separate comes from Americans and the Globe and Mail states 80% of it comes from Russian propaganda (Pravda Network). This is also aimed at creating political discord.\",\"replies\":[]},{\"id\":1181,\"aid\":105,\"author\":\"canadianabroad\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788525515497,\"up\":28,\"depth\":0,\"text\":\"History does not repeat, but it rhymes. \\n\\nLook at other jurisdictions that have tried to 'leave' or have left. Quebec: Corporate Relocation: Approximately 700 companies left Quebec between 1976 and 1985, with Montreal’s manufacturing head offices declining by 24% between 1989 and 1999 compared to a 4% decline in Toronto. Ever wonder why the Bank of Montreal is in Toronto and not Montreal? \\n\\nUnited Kingdom (Brexit): Think tanks see the actual loss from the decision to leave the European Union at anywhere between 2% and 9% of GDP loss (8% = 100-200 billion pounds). Effectively, the United Kingdom is only now, 10 years later, seeing some level of normalcy. \\n\\nThink about an Alberta without access to tidewater, which is the current situation, but you have a partner that gives you access (maybe not as much as you like but still access). Now think about separation and that partner becoming your ex-wife, ex-husband. You won't be getting access to the water anytime soon or under favorable negotiating conditions. Alberta would have 3 oil pipelines (less than 10% of total current capacity) and 0 gas pipelines to feed the United States. Effectively, you would strangle the oil and gas industry for a decade minimum while taking on additional cost and administration responsibilities. Not to mention, you would need to negotiate new trade agreements with all the countries (including Canada) which take extensive time and investment.\",\"replies\":[{\"id\":1182,\"aid\":76,\"author\":\"J Johnson\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789273904553,\"up\":0,\"depth\":1,\"text\":\"Better free from the laurentian elites. Rather be poor than part of Canada.\"},{\"id\":1183,\"aid\":106,\"author\":\"Leopoldo Pisanello\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789248660477,\"up\":0,\"depth\":1,\"text\":\"That's exactly what makes Quebec so awesome.  It's so refreshing and delightful to visit a place that is not corporate.  Mind you, there are others things that make Quebec delightful, mostly its European vibe.  So we can't really compare Quebec to Alberta.\"}]},{\"id\":1184,\"aid\":107,\"author\":\"Iain Basedord\",\"ini\":\"I\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788523087706,\"up\":21,\"depth\":0,\"text\":\"I was on the fence for a long time in this debate, waiting for that \\\"Ah Ha\\\" moment the independence side would present viable data to consider. I mean, there are some valid complaints from Weatern Canada about how centralized the federal government is. Trouble is, no one on the independence side of the argument has presented anything other than \\\"trust me, it'll be better\\\" or \\\"the federalist are BSing us\\\" as evidence an independent Alberta would be in a better position. The closer we get to the date, the more the narrative (and the composition) of the independence movement is revealing itself as a bunch of angry good ole boys with no actual plan to keep the US out and what seems to be a suspiciously clandestine plan of self enrichment from its defacto leaders. Before you vote, really consider what their actual plan is.....because I haven't seen one, and I won't be holding the bag for them down the road.\",\"replies\":[{\"id\":1185,\"aid\":108,\"author\":\"sasha baby\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 11\",\"ts\":1789151741658,\"up\":0,\"depth\":1,\"text\":\"Stephen Harper Prime Minister of Canada for 10 years & Pierre Poilievre from Calgary Alberta almost won the election if Mark Carney didn't step up.\"},{\"id\":1186,\"aid\":95,\"author\":\"Jeremy Levi\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 5\",\"ts\":1788626098522,\"up\":15,\"depth\":1,\"text\":\"\\\"how centralized the federal government is\\\" will always be a funny complaint to me since the people making it often look fondly on our neighbours south of the border without grasping that Canada's political system is a stronger form of Federalism than theirs, meaning our Provinces enjoy a far greater degree of autonomy over local matters than US States do. Heck, in many areas our Provinces maintain greater independence than even EU member States do as full on Countries.\\n\\nStill, I suppose I shouldn't be too surprised. From coast to coast, not just in Alberta, provincial politicians rely on the electorate's poor grasp of the federal and provincial division of responsibilities to make much political hay of blaming the federal government for things that fall firmly and entirely within provincial jurisdiction.\\n\\nOf course there are many problems we can and should hold the Federal government to task on, but how can we even begin to address those things so long as we continue to allow our Provincial politicians to constantly muddy the waters and continue to pull the wool over our eyes?\"}]},{\"id\":1187,\"aid\":67,\"author\":\"Patrick Richard\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788521347114,\"up\":0,\"depth\":0,\"text\":\"If you look at similar efforts, the outcome is never as rosy as the leave side predicts it to be.\\n\\nIt doesn't mean you shouldn't go for it, but you should prepare for a rougher ride than predicted.\\n\\nAlso you can expect pushback similar to the current US-Canada tensions, with potentially multi-generational duration, if it ever becomes cordial again.\",\"replies\":[]},{\"id\":1188,\"aid\":56,\"author\":\"Charlie Miller\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788518616072,\"up\":8,\"depth\":0,\"text\":\"I have read and studied military history and war for a very long time. I am now retired but spent many years in the Canadian Forces. One thing  I have not heard anyone one commenting on is, in every separation I have read about, people have died? Are we prepared to have that happen in Canada? If we remember in Quebec in 1970 with the FLQ, a British diplomat was killed and many people arrested. Something to think about?\",\"replies\":[{\"id\":1189,\"aid\":109,\"author\":\"user2026\",\"ini\":\"U\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 18\",\"ts\":1789703451214,\"up\":0,\"depth\":1,\"text\":\"It has definitely crossed my mind that it could become rather difficult in the near future depending on the outcome of the Separation Question.\"},{\"id\":1190,\"aid\":110,\"author\":\"Mike Klym\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789226785370,\"up\":6,\"depth\":1,\"text\":\"Just to correct. The British Diplomat James Cross was released. It was Quebec Minister Pierre Laporte whose life was taken by The FLQ.\"}]},{\"id\":1191,\"aid\":111,\"author\":\"princeofhartes\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788516285990,\"up\":37,\"depth\":0,\"text\":\"The people of Alberta have to understand that a weaker Canada does not mean a stronger Alberta. If anything, separation makes Alberta a target for US imperialism and we see how well that is treating the people of Venezuela. Alberta won’t be a state, it will be a territory like Puerto Rico and none of the money from its resources will go back to Alberta.\\n\\nCanada is trying really hard to make jobs for Albertans and to. help you all feel included. We want to build railways and pipelines with you. Our doctors want to help you get the healthcare you need by removing inter provincial licensing barriers.\\n\\nLook up the reasons why Newfoundland joined Canada and look at what Newfoundland’s Dominion was like before confederation — exclusively private healthcare with US and UK doctors, poor access to vaccines, and a lack of government support behind major resource projects. The lives of rural Newfoundlanders was miserable and only merchants and private businesses flourished in Corner Brook and St. John’s. There is strength in unity and all of our provinces joined Canada because we saw unity as strength.\",\"replies\":[{\"id\":1192,\"aid\":29,\"author\":\"Gale Leitch\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789330518595,\"up\":2,\"depth\":1,\"text\":\"I agree.\"},{\"id\":1193,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789300882104,\"up\":0,\"depth\":1,\"text\":\"Good points, but my question for you is, what is your solution? Clearly, the status quo approach isn't and won't work for Alberta, so something has to change. What would you do?\"},{\"id\":1194,\"aid\":76,\"author\":\"J Johnson\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789273822112,\"up\":0,\"depth\":1,\"text\":\"But we would be free of a foreign government aka y’all.\"},{\"id\":1195,\"aid\":49,\"author\":\"JR Kookie\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789269439488,\"up\":4,\"depth\":1,\"text\":\"Unfortunately, I think the separatist leadership wants to be consumed by the US. They've certainly been meeting with US officials.\\n\\nAlso, if the US gobbles up provinces one by one, then the separatism from the rest of Canada becomes largely mooted.\"},{\"id\":1196,\"aid\":104,\"author\":\"user99\",\"ini\":\"U\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788541066570,\"up\":20,\"depth\":1,\"text\":\"The massive political, legal, and international hurdles involved in having Alberta join the U.S. would make this impossible. Alberta would have to negotiate its share of the dept, which is $75 - $100 billion. An amendment to Canada's constitution would be required but impossible without unanimous consent of Canadian parliament. Canadian courts have repeatedly ruled that Alberta cannot unilaterally alter Treaties 6, 7, and 8, all signed directly between Indigenous First Nations and the British Crown before Alberta even existed as a province.\\n\\nAdmitting Alberta as a U.S. territory or state would drastically alter American domestic politics. Alberta has a deeply conservative political culture. Adding Alberta as a state would mean adding two new, predictably Republican U.S. Senators and several members of Congress. U.S. Democrats would fiercely oppose admitting a massive, conservative, oil-rich territory that permanently tilts the balance of power in Washington. Read Dalhousie University's piece: https://www.dal.ca/news/2025/01/09/united-states-canada-state-51st.html\\n\\nAlberta would have to quickly build up customs, immigration, and international transit regulatory frameworks and transition away from the Canadian dollar.  Using U.S. dollars and complying with federal regulations would lead to economic discord and upheaval. Read: 'Alberta separation would harm both Canada and the United States': https://www.csis.org/analysis/alberta-separatism-would-harm-both-canada-and-united-states\"}]},{\"id\":1197,\"aid\":112,\"author\":\"canuckabout\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788509679133,\"up\":7,\"depth\":0,\"text\":\"Observations regarding Alberta separation debate.  \\n\\nAlberta exports approximately $178 billion internationally 71% (88% to the US) and 71$ billon to the rest of Canada 29%.\\n\\nSimilarities with the UK leaving the EU (Brexit).\\n-\\tCanada and the EU are federations, where each province / country has it’s distinct : local laws, taxes, driver licenses, health system and insurance, auto, home and personal insurances, among others.\\n-\\tCanada and the EU have federal rules and laws that govern the other provinces / countries regarding trade, movement of goods and people within the federation.\\n-\\tElected representatives are sent from each province / country to the respective parliaments. \\n\\nSignificant differences :\\n-\\tUK is a sovereign country\\n-\\tUK has its own bank and currency\\n-\\tUK has its own police forces and armed forces\\n-\\tUK has its own representation internationally (UN, NATO, ambassadors, consulates, etc.)\\n\\nThe underlying argument for separation is for decision making and control to be devolved to the local population and government.  The arguments for leaving :\\n-\\tToo much control ceded outside the country / province (UK to Brussels / Alberta to Ottawa), examples : taxation, immigration, international policy setting\\n-\\tMore economic opportunities outside of the federation\\n-\\tPossibility to create UK / Alberta specific organizations \\n\\nThe counter argument for remaining in the federation is one for collective support and security.  Arguments for remaining : \\n-\\tUncertainty : economic, national defense and security, social networks (health system)\\n\\nQuestions that both sides need to answer :\\n-\\tIn order defend international rights and responsibilities, there would need to be recognition by international community UN, NATO, etc. \\n-\\tIn order to access these organizations, additional resources would be required to support this administration (ex UN, NATO, ambassadors, consulates, etc.), how would Alberta be represented in these organizations ?\\n-\\tWhat currency to use (CDN, US or new Albertan) ?\\no\\tTo set up an Albertan currency and central bank, Alberta would need to hold foreign currency (US dollars, Euros, Yen, etc.) in sufficient amounts to create its own Foreign Exchange Reserve (similar to Canada’s current situation)\\no\\tIf not Alberta’s own currency then it will be controlled by another country (ex US, Canada, EU)\\n-\\tNew passport required (how / who will accept it ? – visas required for travel ?)\\n-\\tTrade deals to be negotiated with other countries (approximately $250 billon of Alberta export trade would be international and require new or re-negocation). \\n-\\tDefense and security.  Assuming that the local police forces remain under Alberta authority (ex Calgary, Edmonton city police, etc.).  Assuming that th Canadian military and RCMP remain under Canadian authority.  What does Alberta do for defense and security ?  Create a new Alberta Army ? Negociate a deal with Canada or the US for military support ?  Note : the military defend the country, they also have a role in security of the country, that is to say they help support in times of national emergencies (floods, fires, other disasters).\\n-\\tWill the border be a “hard” border with checks like the current Canada – US border, or a “soft” border such as in the EU with free movement of people and goods ?  The soft border already exists between Canadian provinces and territories.\\n-\\tThere is already a “hard” international border between Alberta and the US that is controlled (ex. Passport checks, inspection of goods, etc.), would this extend to the borders with BC, Saskatchewan and the NWT.  Both Alberta and Canada would have to invest in border services. \\n\\nObservations 10 years after the Brexit referendum and the UK leaving the EU :\\n-\\tThe UK did not have to create and setup new bodies to deal with international obligations (ex UN, NATO) these already existed.  The UK did have to renegociate agreements and arrangements that were previously covered by the EU.  Some of these are still ongoing.\\n-\\tThe UK government chose to have a “hard” Brexit where access to the EU single market and customs union were given up in order to create its own trade deals and regain control over its borders, immigration and laws.  \\n-\\tDuring the Brexit debate, the UK’s economy was predicted to shrink by about 4% if it left the EU.  The UK’s economy has actually shrunk by about 6%.  Labour and productivity are currently about 3% behind other G20 countries.\\n-\\tThe UK has had 6 prime ministers since the Brexit referendum, this probably underlines the political difficulties to implement a Brexit that meets all the promises made during the referendum debate.\\n-\\tThe Brexit referendum result in 2016 was leave 52% to remain 48%.  Recent polling in July 2026 indicated that 55% of Britons would vote to rejoin the EU, while 35% were opposed, the remaining 10% were undecided.\",\"replies\":[{\"id\":1198,\"aid\":105,\"author\":\"canadianabroad\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788525929411,\"up\":8,\"depth\":1,\"text\":\"You laid out a lot of the possible challenges that have yet to be determined. I think some of the others is this sales pitch that Albertans would get to keep their CPP, their passport, their healthcare access partially paid by Canadians and everything would be normal. When it is clearly far from the case that any of this would happen. \\n\\nI can't see Canada's allies (other then maybe the Trump government) even acknowledging Alberta as its own country. Recognition also doesn't equal sovereignty. Palestine is recognized but yet does not have its own state effectively.\"}]},{\"id\":1199,\"aid\":113,\"author\":\"nicole scott\",\"ini\":\"N\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788507333653,\"up\":0,\"depth\":0,\"text\":\"The whole point is that even the People voting to separate if they thought the Liberals would change and offer Equality and some appreciation for the Contributions made by Alberta. Mar talks businesses leaving, Doubtful as even with Separation Talks Alberta is seeing Billions in Investments and the Only growing Population In Canada, Of course we would have to take some of the Debt, but based on population that's 12%, Imagine Ontario with a $500 Billion Provincial Debt having to take almost 1/2 the debt or Quebec with $300 Billion Provincial Debt have to takle their portion of Debt, But none of this is ever disgusted when we talk Quebec. CPP belongs to the People and Alberta is owed about 25% or More because of are Young Population and are contributions, last Year Ontario got more CPP Payments than they contributed. Alberta Exports over $180 Billion/Year (28% of all Canadian Exports) & that's mostly Oil going to the USA and that isn't going to stop. The citizenship issue is a Joke, we would maintain are Canadian Citizenship, Canada has the Highest Percentage of any Country of Ex Pats living outside of Canada, should they lose their Citizenship?\",\"replies\":[{\"id\":1200,\"aid\":114,\"author\":\"kenneth wagner\",\"ini\":\"K\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788527579213,\"up\":3,\"depth\":1,\"text\":\"We wouldn't maintain \\\"are\\\" Canadian citizenship, because we'd have become a US territory in no time flat.  That's what Smith and Trump want you to vote for.\"}]},{\"id\":1201,\"aid\":115,\"author\":\"Brian Pollock\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788489398294,\"up\":0,\"depth\":0,\"text\":\"What’s the cost to stay?\",\"replies\":[{\"id\":1202,\"aid\":90,\"author\":\"Rick McCaffrey\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 9\",\"ts\":1788987082330,\"up\":0,\"depth\":1,\"text\":\"They have no answer.\\n\\nMakes my decision easy.\"},{\"id\":1203,\"aid\":105,\"author\":\"canadianabroad\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 4\",\"ts\":1788499207019,\"up\":5,\"depth\":1,\"text\":\"The perpetual feeling that Western Canada has been alienated is supported by political pundits designed to make people feel victimized. When, in fact, it's a lack of political willpower to move away from the oil and gas industry and diversify broadly, which is the biggest inhibitor. \\n\\nDid you
