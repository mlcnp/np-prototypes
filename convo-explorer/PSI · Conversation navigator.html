they're not interested in finding solutions despite a healthy intake of taxes (thanks to an NDP policy). Ask a teacher or nurse how the province has improved services and they'll laugh.\\n\\nStrain on the system is being felt from emergency rooms to classrooms, but it's not the fault of immigrants. It's our leadership that ignores experts, tries to divide labour, and won't listen to what Albertans are telling them.\\n\\nMy family doctor is an immigrant. My coworkers are immigrants. We are a nation of newcomers and to now ignore FIRST Nations concerns about seperation and on the same ballot say the problem is 'all those new people' would be laughable if it wasn't so scary.\",\"replies\":[]},{\"id\":1058,\"aid\":42,\"author\":\"Ryan Rob\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"It is proufoundly silly to waste time voting on referenda that have no impact. Race baiting questions and unconstitutional demands are beneath the dignity of regular Albertans and are instead the behavior of far right activists who also happen to be in the provincial government.\",\"replies\":[]},{\"id\":1176,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12 · reply to Anton Pavlenko\",\"stance\":\"\",\"text\":\"We've already had two petitions. The remain side had almost twice as many signatures as the separatist side. There is no reason for this referendum other than Danielle is frightened of her UCP people who are mostly Separatists.\",\"replies\":[]},{\"id\":1178,\"aid\":45,\"author\":\"mike5600\",\"meta\":\"Sep 13 · reply to Anton Pavlenko\",\"stance\":\"\",\"text\":\"I think the next general election in Alberta will take care of Smith and the UCP.\",\"replies\":[]},{\"id\":1032,\"aid\":24,\"author\":\"JD Skip\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"The history, behind all of the questions, each individual question.\\nConsider how many Alberta Conservative governments have failed Albertans and acted in their own interest.\\nTo also consider that this so called referendum is not giving Smith and the UCP any permission to make new laws, it is not giving any permission(s) at all on anything, it's simply getting views on subjects of the UCP's own interests.\",\"replies\":[]},{\"id\":1055,\"aid\":40,\"author\":\"blue hoo\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Anything that wasn't part of the UCP election platform gets a no from me, which is basically everything\",\"replies\":[]},{\"id\":1108,\"aid\":64,\"author\":\"amandaf\",\"meta\":\"Sep 12 · reply to Richard Fryer\",\"stance\":\"\",\"text\":\"So the completely botched rollout of the new driver's licenses and the underfunding of Elections Alberta to the point you've had to ask other provinces to help you administer your own separation referendum are the kind of results we can expect from the UCP's bureaucratic reforms? And Ottawa should emulate Danielle Smith and listen to oil and gas and health insurance lobbyists?\",\"replies\":[]},{\"id\":1009,\"aid\":9,\"author\":\"John Helm\",\"meta\":\"Sep 16\",\"stance\":\"\",\"text\":\"A grossly inappropriate campaign (using our money), and yet completely unsurprising from this government.\",\"replies\":[]},{\"id\":1056,\"aid\":41,\"author\":\"lion37\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"This is just the beginning of a longer process and the questions posed are in some way ambigious. Albertans should consider that this may be the beginning of more referendums and at a cost to the taxpayer. If this governemnt is so confident, call a full election and campaign on these points; soemthing they did not do.\",\"replies\":[]},{\"id\":1175,\"aid\":102,\"author\":\"Anton Pavlenko\",\"meta\":\"Sep 5\",\"stance\":\"\",\"text\":\"Why is there a pressing need to get Albertans to decide to either stay or separate from Canada. Why don't they simply have the separation voters sign up their numbers and all those that don't, are by default, automatically acknowledged patriotic Canadians. Thereby 120-130 million tax payer dollars would be saved and put towards serious pressing Albertan needs.\",\"replies\":[]},{\"id\":1139,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 15 · reply to Terry Morrison\",\"stance\":\"\",\"text\":\"Much of what our AB gov't does surprises me, including changing laws to suit the UCP and Separation. \\nMany laws began quietly changing awhile back, but nobody seemed to notice. \\nIt's almost a full-time job keeping track of all the loopholes that have been found and the changes made even when loopholes could not be found.\",\"replies\":[]},{\"id\":1147,\"aid\":64,\"author\":\"amandaf\",\"meta\":\"Sep 12 · reply to Tom Donaghy\",\"stance\":\"\",\"text\":\"The UCP has held all kinds of surveys, polls, and referendums to find out what Albertans want. They then implement policies that are the exact opposite of what Albertans said they wanted. Take the referendum on daylight savings as one example. Can you explain how that's democratic?\",\"replies\":[]}]}];\n\n    // index for lookup + feed\n    // hand-picked representative posts (most substantive, not just most upvoted)\n    const PICK = { unfair: [1077, 1016], legit: [1158, 1148], legal: [1102, 1127], together: [1161, 1113], distraction: [1173, 1096] };\n    this.THEMES.forEach(t => { const pk = PICK[t.id]; if (!pk) return;\n      t.posts = pk.map(id => t.posts.find(p => p.id === id)).filter(Boolean).concat(t.posts.filter(p => !pk.includes(p.id))); });\n    this.THEME_BY_ID = {};\n    this.THEMES.forEach(t => { this.THEME_BY_ID[t.id] = t; t.reps = t.posts.slice(0, 2); });\n\n    // FEED = every top-level post with its replies, from the feed JSON export\n    this.RAW_FEED = [{\"id\":1001,\"aid\":1,\"author\":\"Elise Stolte\",\"ini\":\"E\",\"title\":\"Producer, CBC Calgary\",\"pinned\":true,\"date\":\"Sep 2\",\"ts\":1788361441653,\"up\":4,\"depth\":0,\"text\":\"The leaders on both sides have the megaphone — we're hearing plenty from them. But in the end, it's individual Albertans who decide this vote. That's why we want to know what matters most to you.\\n\\nTell us how you're making up your mind.\\n\\n~ Elise Stolte, CBC\\n\\n(*comments flagged to the moderator after 8 p.m. will be processed the following morning)\",\"replies\":[{\"id\":1002,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789320317293,\"up\":7,\"depth\":1,\"text\":\"This is the great risk in a referendum, like an election, it is the side with the largest megaphone, purse and willingness to enchant people with false promise, or mystical facts. This skews real discussion and reaching positions beneficial to all, well reasoned and fair.\"}]},{\"id\":1003,\"aid\":3,\"author\":\"ferg64\",\"ini\":\"F\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 20\",\"ts\":1789932348265,\"up\":0,\"depth\":0,\"text\":\"Have they considered the financial costs of the federally owned airports and military bases which could be dismantled or the cost of needing a passport to leave Alberta? Even bigger is the personal costs of the rifts created within  family and friends. Just look south and see.\",\"replies\":[]},{\"id\":1004,\"aid\":4,\"author\":\"Jeff Lewis\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 19\",\"ts\":1789844759715,\"up\":0,\"depth\":0,\"text\":\"A warning about the referendum... we saw the same mistake happen with Brexit in the UK.\\nThe assumption was that the referendum would obviously fail and then it would be over, so a lot of people on the Remain (in the EU) side just didn't bother to show up. Remainers thought \\\"It's rainy and a bother and the we're going to win, of course, so my vote isn't really necessary.\\\" except they were wrong.\\nAnd the Remainers lost, mainly to a group who thought they could make a protest vote because Remain was going to win anyway.\\nDo NOT assume the pro-Canada side will win just because the polls say they will. Polls are not votes. Get out and vote.\",\"replies\":[]},{\"id\":1005,\"aid\":5,\"author\":\"robert litmis\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 18\",\"ts\":1789764006437,\"up\":0,\"depth\":0,\"text\":\"the only customer for oil would be the US who would set the oil pricing without any valid competition.  \\n\\nThe rest of canada could tax any oil  that it did chose to let pass through it's province or ports, if they allowed any at all. \\n\\n  Alberta is landlocked and has no port to ship oil from.    \\n\\n All alberta residents do depend upon oil company profits to support their economy.\",\"replies\":[]},{\"id\":1006,\"aid\":6,\"author\":\"Lloyd Aldercot\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 18\",\"ts\":1789755887121,\"up\":0,\"depth\":0,\"text\":\"Who does it benefit if Alberta separates? Someone tell me please\",\"replies\":[]},{\"id\":1007,\"aid\":7,\"author\":\"Dee Moore\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 18\",\"ts\":1789692343183,\"up\":0,\"depth\":0,\"text\":\"I have a hypothetical question for the separatists:\\n\\nIf the Yukon struck gold, and I mean struck it big, would you expect them to make equalization payments to the rest of Canada; or in your ideology, would you allow them to simply keep what wealth they gain?\",\"replies\":[]},{\"id\":1008,\"aid\":8,\"author\":\"Joe Laframboise\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 18\",\"ts\":1789689654102,\"up\":0,\"depth\":0,\"text\":\"Please remember the following quote from Sir John A. -\\\"Whatever you do adhere to the union - we are a great country and shall become one of the greatest in the universe if we preserve it; we shall sink into insignificance and adversity if we suffer it to be broken.  God and nature have made the two Canadas one - let no factious men be allowed to put them asunder.\\\"\",\"replies\":[]},{\"id\":1009,\"aid\":9,\"author\":\"John Helm\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 16\",\"ts\":1789589136929,\"up\":0,\"depth\":0,\"text\":\"A grossly inappropriate campaign (using our money), and yet completely unsurprising from this government.\",\"replies\":[]},{\"id\":1010,\"aid\":10,\"author\":\"Lynda Parks\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 16\",\"ts\":1789585536158,\"up\":0,\"depth\":0,\"text\":\"What the financial reports on Separation don't take into account is people. A good % of people are risk adverse - especially retired people. They, like my own Albertan Daughter (still working) will move. There will be a vacuum of people and capital that will not take risk. This in turn makes the financial picture on the short term much worse then current estimates based on no population, capital leaving, tax base leaving.\",\"replies\":[]},{\"id\":1011,\"aid\":11,\"author\":\"www\",\"ini\":\"W\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 16\",\"ts\":1789582805687,\"up\":0,\"depth\":0,\"text\":\"So do it!!!! you will see the beautiful bill 0)))))\",\"replies\":[]},{\"id\":1012,\"aid\":12,\"author\":\"Joel Unrau\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789491750107,\"up\":2,\"depth\":0,\"text\":\"The Alberta provincial government has been slow to respond to need within healthcare and education. Attempts at privatization, constant cabinet leadership shuffles, and strike action having to force even the most modest updates and changes in both sectors. They have shown that they're not interested in finding solutions despite a healthy intake of taxes (thanks to an NDP policy). Ask a teacher or nurse how the province has improved services and they'll laugh....\\nRead more\\n\\nThe Alberta provincial government has been slow to respond to need within healthcare and education. Attempts at privatization, constant cabinet leadership shuffles, and strike action having to force even the most modest updates and changes in both sectors. They have shown that they're not interested in finding solutions despite a healthy intake of taxes (thanks to an NDP policy). Ask a teacher or nurse how the province has improved services and they'll laugh.\\n\\nStrain on the system is being felt from emergency rooms to classrooms, but it's not the fault of immigrants. It's our leadership that ignores experts, tries to divide labour, and won't listen to what Albertans are telling them.\\n\\nMy family doctor is an immigrant. My coworkers are immigrants. We are a nation of newcomers and to now ignore FIRST Nations concerns about seperation and on the same ballot say the problem is 'all those new people' would be laughable if it wasn't so scary.\",\"replies\":[]},{\"id\":1013,\"aid\":13,\"author\":\"Andrew Ross\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789488349244,\"up\":2,\"depth\":0,\"text\":\"A reminder that what makes Canada better than the United States, is that we are not a melting pot. We are a strong cultural mosaic, that encourages new ideas, and new people to come and be a part of what makes us all Canadian. \\nWe are the true North, strong and free. We have always been progressive (women's suffrage, the underground railroad, Gay rights) now is our chance to prove our spirit once again on the world stage.\",\"replies\":[]},{\"id\":1014,\"aid\":14,\"author\":\"Johnathan Wilcox\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789418919333,\"up\":0,\"depth\":0,\"text\":\"Good luck Alberta. I hope you are successful. Watch the Liberal Party of Canada start squirming then.\",\"replies\":[]},{\"id\":1015,\"aid\":15,\"author\":\"Ian Canad\",\"ini\":\"I\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789410759972,\"up\":2,\"depth\":0,\"text\":\"Separatists will need a new name for themselves because Alberta is the name of a Canadian province in honour of a Princess. There's many details that will become exceedingly expensive beyond legal fees, lawsuits, establishing a new currency isn't free. Albertans have more freedom as part of Canada.\",\"replies\":[]},{\"id\":1016,\"aid\":16,\"author\":\"Mike Mac\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789394501629,\"up\":0,\"depth\":0,\"text\":\"Even Carney has acknowledged that Alberta has legitimate economic and regional greiviences. Would Ottawa have paid attention were it not for Alberta forcing them to? Not likely.\",\"replies\":[]},{\"id\":1017,\"aid\":17,\"author\":\"Jacques Bruyere\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789389086072,\"up\":0,\"depth\":0,\"text\":\"If Danielle Smith was a nationalist, I would trust her with the federal issues she brings up.  But she's not, she's a seperatist.  Therefore I would not trust her with her handling federal funds.  As well, oil and gas will eventually lose their momentum.  Then what?  Back to being broke again with her provincial programs not being funded.\",\"replies\":[{\"id\":1018,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789418094173,\"up\":1,\"depth\":1,\"text\":\"Bill. Danielle Smith’s slogan doesn't alter constitutional reality. 'Sovereignty within a united Canada' is a contradiction in terms used to appeal to voters. Under Canadian law, a province is either bound by the Constitution or it isn't—there is no legally recognised middle ground.\"},{\"id\":1019,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789404275959,\"up\":0,\"depth\":1,\"text\":\"Premier Smith has repeatedly emphasized that she stands for a united Canada with Alberta being an independent province within Confederation. And the world will be a hydrocarbon society for several more generations.\"}]},{\"id\":1020,\"aid\":20,\"author\":\"Hans Coyote\",\"ini\":\"H\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789359332859,\"up\":0,\"depth\":0,\"text\":\"Why the CBC has trouble providing non-partisan news.  Mis-quoting the referendum questions posed in Alberta does nothing but add confusion (perhaps a goal of the CBC), and further the lack of confidence in the broadcasters' professionalism.\\n\\nI would want Alberta's to ask why the CBC , publicly funded by Albertan tax payers - issues editorials and media posts that are incomplete, misleading, and/or untruthful.\",\"replies\":[]},{\"id\":1021,\"aid\":21,\"author\":\"Mark Leenders\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789351015647,\"up\":1,\"depth\":0,\"text\":\"The idea of the UCP government accepting Federal money without implementing the federal programs is terrible. Average Albertans would not benefit at all from those funds.\",\"replies\":[{\"id\":1022,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789404353600,\"up\":0,\"depth\":1,\"text\":\"It isn't federal money. Albertans just want their money returned.\"}]},{\"id\":1023,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789344803776,\"up\":0,\"depth\":0,\"text\":\"The one thing I would like all Albertans to consider is, if independence from Canada isn't the answer, how do you suggest addressing how poorly Alberta has been treated over the past 11 years?\",\"replies\":[{\"id\":1024,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789404590365,\"up\":1,\"depth\":1,\"text\":\"Using Alberta's economic weight to build regional trade alliances, ask for regulatory reform, and elect governments that negotiate inside Confederation. Demanding an unconstitutional split doesn't solve anything. It would give up leverage.\"}]},{\"id\":1025,\"aid\":22,\"author\":\"bigboss\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789341614534,\"up\":1,\"depth\":0,\"text\":\"I think there has to be some guidelines that harmonize services across the country. We cannot have provinces 100% doing their own thing. We need a strong federal presence negotiating with big pharma vs piecemeal by provinces\",\"replies\":[{\"id\":1026,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789344887549,\"up\":0,\"depth\":1,\"text\":\"What if we don't support the concept of government funded pharmacare?\"},{\"id\":1027,\"aid\":22,\"author\":\"bigboss\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789355998261,\"up\":1,\"depth\":2,\"text\":\"I'm assuming you are an Albertan? I am too. I believe some things are way too important and fundamental that cannot be left to the whims of the free market like education, healthcare, policing, the basic social services. I would like all of us to collectively pay for the basic needs of all of us regardless of our backgrounds, income, class etc. I don't have children and don't want to but I will gladly pay for equal access by all. Some goes for healthcare. I am a net contributor right now and hope to be for a very long time, but if/when the time comes I hope there will be others who will support me. Egalitarian access to me is very important when it comes to the basic needs of humans.\"}]},{\"id\":1028,\"aid\":21,\"author\":\"Mark Leenders\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789341499222,\"up\":2,\"depth\":0,\"text\":\"If Alberta is allowed to keep federal cash, the UCP will just give the money to large oil companies and their other rich friends. Average Albertans will never see a penny of it.\\nPlease, Federal Government, don't let our MAGA premier get away with this.\",\"replies\":[]},{\"id\":1029,\"aid\":23,\"author\":\"Sarah Brown\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789339122100,\"up\":2,\"depth\":0,\"text\":\"Albertans have no business thinking they can opt out of federal programs but keep the money.\",\"replies\":[{\"id\":1030,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789416748893,\"up\":2,\"depth\":1,\"text\":\"In response to Bill. Alberta can opt out of certain federal-provincial cost-shared programmes, but only under strict constitutional conditions—it must establish a provincial programme that meets national objectives. Opting out without delivering equivalent health or social services isn't a constitutional right. That’s how Quebec does it: they get funding because they actually provide the equivalent service, not because they demanded a blank cheque.\"},{\"id\":1031,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789344439123,\"up\":0,\"depth\":1,\"text\":\"We respectfully disagree with your view on this matter. Albertans have a right to opt out of federal programs and receive their money back.\"}]},{\"id\":1032,\"aid\":24,\"author\":\"JD Skip\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789334340977,\"up\":1,\"depth\":0,\"text\":\"The history, behind all of the questions, each individual question.\\nConsider how many Alberta Conservative governments have failed Albertans and acted in their own interest.\\nTo also consider that this so called referendum is not giving Smith and the UCP any permission to make new laws, it is not giving any permission(s) at all on anything, it's simply getting views on subjects of the UCP's own interests.\",\"replies\":[]},{\"id\":1033,\"aid\":25,\"author\":\"canadaproud\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789333647515,\"up\":0,\"depth\":0,\"text\":\"Do you want to be part of the U.S. since Alberta separation will eventually result in that, or do you want to remain in united Canada and work on necessary changes?\",\"replies\":[{\"id\":1034,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789345014717,\"up\":0,\"depth\":1,\"text\":\"We've tried to influence change over several decades, but we've now given up.\"}]},{\"id\":1035,\"aid\":4,\"author\":\"Jeff Lewis\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789333638992,\"up\":1,\"depth\":0,\"text\":\"My advice to my fellow Albertans is simple: go look at Brexit in the UK and see how that turned out. \\n\\nIt was fomented by right wingers who wanted to blame the EU for all the problems created by the right-wing Conservatives and in the end, not only reduced opportunities for Brits and damaged their economy, it didn't even effectively fix the alleged problems it promised it would.\\n\\nIt took away rights against the will of almost half of the UK population - possibly more because apparently a lot of people who voted to leave believed they'd retain those rights - much as many Alberta separatists think they'll keep their Canadian citizenships, made the breakup of the UK more likely by trampling on the other nations of the UK and now, ten years later, more than 2/3s of all Brits admit it was a mistake.\\n\\nUnfortunately, as I and many others pointed out at the time, it was a one way choice and even if a growing number of Brits want to rejoin the EU, it's not their choice.\\n\\nAnd much like the EU referendum, I suspect a lot of people will make a \\\"protest\\\" vote not realising that this is for real and irreversible.\\n\\nHaving gone through this with the EU referendum as a dual Canada/UK citizen, it's painful to watch this happen again knowing almost for certain how it will play out.\",\"replies\":[]},{\"id\":1036,\"aid\":26,\"author\":\"scott\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789333390087,\"up\":3,\"depth\":0,\"text\":\"As the folks in the UK found out to many of their disappointments during Brexit, a 'protest vote' intended to 'send a message' can have wildly different outcomes to what you intended. That's what conversations with your MP and relevant Ministers are for. If you want a voice in government, elect MPs from the party in power.\",\"replies\":[]},{\"id\":1037,\"aid\":27,\"author\":\"Morton Cohen\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789331756289,\"up\":0,\"depth\":0,\"text\":\"If you look through rose colored glasses. Everything is beautiful. But it is not beautiful. The demand for oil only has one way to go. Demand going down.   Look at China. Moving away from oil. Every country wants to be China.  What about the oil from Venezuela. US has an interest in those oil fields. Can you see US saying \\\"we do not need oil from Canada\\\". Give eastern Canada a choice. Windmills or pipelines. Do not sell your future,  your children's future for pennies today. The C in Canada means caring. That is us.\",\"replies\":[]},{\"id\":1038,\"aid\":28,\"author\":\"pnd\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789330960004,\"up\":0,\"depth\":0,\"text\":\"Then they have to get every other province to agree.\",\"replies\":[]},{\"id\":1039,\"aid\":29,\"author\":\"Gale Leitch\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789330461922,\"up\":0,\"depth\":0,\"text\":\"One for all and all for one. Otherwise, support yourselves financially without the help of Canadian taxpayers from other provinces.\",\"replies\":[]},{\"id\":1040,\"aid\":30,\"author\":\"Eric Maker\",\"ini\":\"E\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789328836166,\"up\":2,\"depth\":0,\"text\":\"Why is it that Alberta, which is always bragging about being Canada's richest province, is constantly trying to get Canada's money without submitting to the conditions that all of the other provinces must follow to receive funding? No conditions? No cash.\",\"replies\":[{\"id\":1041,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789344513157,\"up\":0,\"depth\":1,\"text\":\"We just want our money back to spend on our own programs.\"}]},{\"id\":1042,\"aid\":31,\"author\":\"Barbara Briden\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789328832609,\"up\":2,\"depth\":0,\"text\":\"Apparently Mr. Rath, a prominent separatist, owes Diriba Investments of Delaware over $100 million dollars as reported by Global News. So an American firm is putting money into the separatists cause. I don’t think Alberta will be ‘separate’ for long because those people will want their money back and they fund nothing for free.\",\"replies\":[]},{\"id\":1043,\"aid\":32,\"author\":\"Deanna Cadoret\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789328586913,\"up\":2,\"depth\":0,\"text\":\"You are either part of Canada or you stand completely alone. That means no Federal money, no RCMP, no Air Traffic Control and equipment maintenance, no CCP, no Canadian Military, no Federal Safety Regulations( including health, worker and food safety, weights and measures ), no Federally negotiated Trade Deals. You want out, then you start completely over from scratch.\",\"replies\":[]},{\"id\":1044,\"aid\":33,\"author\":\"Bala Viswa\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789327039034,\"up\":1,\"depth\":0,\"text\":\"The referendum question on the social programmes is akin to saying, \\\"I want to be a part of the programme, but I don't want to meet any of its objectives\\\". This is also essentially saying, \\\"Send us the money but don't expect it to be used for what it was meant.\\\" \\n\\nThis may be popular (as worded, such a proposition would be popular in any province), but has zero chance of passing as a Constitutional Amendment. Parliament would never endorse such an Amendment, though I expect all ten provinces to sign on.\",\"replies\":[]},{\"id\":1045,\"aid\":34,\"author\":\"mike potter\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789325531229,\"up\":1,\"depth\":0,\"text\":\"The provinces want power but they're not very good a exercising it. Too often it amounts to the premiere(of any province) attempting to score cheap political points at a cost to everybody.\",\"replies\":[]},{\"id\":1046,\"aid\":35,\"author\":\"Dennis Sarmington\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789325525550,\"up\":0,\"depth\":0,\"text\":\"Perhaps the provinces should have more autonomy if it will help quell separatism movements. Right now Canada is starting to look like a failed social experiment.\",\"replies\":[{\"id\":1047,\"aid\":33,\"author\":\"Bala Viswa\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789328946736,\"up\":0,\"depth\":1,\"text\":\"That is an interesting idea. Canada is set up as a federation of provinces (at least in the BNA). In that sense, the federal government owes its existence to the provinces. It is a unifying governance layer above the provinces, it is not an \\\"overlord\\\" layer of governance. The BNA and Constitution give the provinces plenty of autonomy, but they give the federal government the power to raise revenue (the power of taxation). Some of these revenue-raising powers have been devolved to the provinces (like undergorund mineral royalties, part of the income tax).\"}]},{\"id\":1048,\"aid\":36,\"author\":\"tilt\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789323454718,\"up\":0,\"depth\":0,\"text\":\"What happens if Alberta is the best Province to live in does every Canadian have the right to move there?\",\"replies\":[]},{\"id\":1049,\"aid\":36,\"author\":\"tilt\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789323264470,\"up\":0,\"depth\":0,\"text\":\"What happens if Alberta wins these arguments and it becomes the best province to live in-does every Canadian have the right to move to Alberta?\",\"replies\":[]},{\"id\":1050,\"aid\":37,\"author\":\"proundcanuck\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789320761853,\"up\":0,\"depth\":0,\"text\":\"Do you love Canada?\",\"replies\":[]},{\"id\":1051,\"aid\":37,\"author\":\"proundcanuck\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789320700279,\"up\":5,\"depth\":0,\"text\":\"Why does the CBC keep giving legitimacy to the so called seperation movement.  This referendum has been hoisted upon Alberta by a Provincial government by autocratic means. If you Love Canada make sure you get out and vote.\",\"replies\":[{\"id\":1052,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789506531877,\"up\":1,\"depth\":1,\"text\":\"Albertans need to note well in advance that voting won't be easy this year.  \\n Advance polling stations will be announced shortly. Mail-in ballots are currently available with a cutoff date coming soon. \\nLast year, nobody was ready for the long lineups at municipal elections and many Albertans left without voting. Nice test run for what could potentially happen this year.\\nIf you should decide to head out on voting day, bring food, water, a chair, and dress for the weather. Maybe even bring your own porta-potties. Arrange in advance for child-care. \\nBe prepared also with the proper ID. Check Elections Alberta to assure that you're registered. If you've had a name change since last election, be sure to bring the correct documents if your proper ID hasn't been updated. \\nBe sure to get out and vote. Do the work and understand the questions. \\nApathy and believing \\\"It'll never happen\\\" are the enemy.\"}]},{\"id\":1053,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789319928330,\"up\":1,\"depth\":0,\"text\":\"Albertans need to reflect on what they expect from the several questions on the referendum in October. There is only finite power in any national equation, and giving one part more of it means taking away from another. \\nIt is a good idea to occasionally review the general balance and distribution of authority, services and equality within a nation, within each province and territory. The greatest harm is done when one or more levels of power move to far from equality among all the people under their authority, whether Canadian or otherwise or if such authority refuses to provide services to those in need through some pretence like orientation, religion or status. This is why programs are at a national level to ensure basic equal access. \\n\\nI think the referendum is beneficial if it opens up a national reflection, it is harmful if the intent is devision for the sake of greed or power.\",\"replies\":[]},{\"id\":1054,\"aid\":39,\"author\":\"barry\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789318960682,\"up\":2,\"depth\":0,\"text\":\"Alberta wants Federal money, from all other provinces and territories, but does not want to provide the services as defined by those funders?\\nIt’s like Florida saying to Canadian tourists, send us your money but stay at home.\\nNo cooperative, coordinated compliance, then no money.\",\"replies\":[]},{\"id\":1055,\"aid\":40,\"author\":\"blue hoo\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789318439772,\"up\":1,\"depth\":0,\"text\":\"Anything that wasn't part of the UCP election platform gets a no from me, which is basically everything\",\"replies\":[]},{\"id\":1056,\"aid\":41,\"author\":\"lion37\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789311802316,\"up\":0,\"depth\":0,\"text\":\"This is just the beginning of a longer process and the questions posed are in some way ambigious. Albertans should consider that this may be the beginning of more referendums and at a cost to the taxpayer. If this governemnt is so confident, call a full election and campaign on these points; soemthing they did not do.\",\"replies\":[{\"id\":1057,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789312368920,\"up\":0,\"depth\":1,\"text\":\"Do you suggest that Albertans just continue to put up with how they are treated?\"}]},{\"id\":1058,\"aid\":42,\"author\":\"Ryan Rob\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789310535521,\"up\":2,\"depth\":0,\"text\":\"It is proufoundly silly to waste time voting on referenda that have no impact. Race baiting questions and unconstitutional demands are beneath the dignity of regular Albertans and are instead the behavior of far right activists who also happen to be in the provincial government.\",\"replies\":[{\"id\":1059,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789512619181,\"up\":0,\"depth\":1,\"text\":\"...much like all the people who couldn't be bothered to vote against Brexit, people were apathetic and said \\\"It'll never happen\\\"?\"},{\"id\":1060,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789321023721,\"up\":3,\"depth\":1,\"text\":\"Those who repeat the old saw that the federal government constantly mistreats Albertans is spinning a false tale, over the 150 and more years Canada and the national government has both assisted and sought assistance from Alberta, they have shared the costs of resource development, infrastructure, agriculture and help with any issues, though not perhaps with the same effort or to the expectations of all Albertans. \\nWe as a nation as part of the world tried to prevent devastating global warming attributed to fossil fuel use and population, and I would admit we failed both in application and relief for the regions carrying the brunt of the changes. The same was true of immigration policy and perhaps other programs though all have changed over time, with new governments and will do so again in the future. \\nCutting the nation in pieces is a poor choice when there only needs to be a reflection on issues and a reasoned solution.\"},{\"id\":1061,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789312305526,\"up\":0,\"depth\":1,\"text\":\"So what is your solution? I've lived in Alberta almost 70 years, and the Province is always mistreated by the federal government.\"}]},{\"id\":1062,\"aid\":43,\"author\":\"Steven Tyler\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789307604104,\"up\":2,\"depth\":0,\"text\":\"A couple of pro-separation people have posted numerous times (and replied to other comments even more).  Yet none of them have addressed the question I called out yesterday:\\nWhat is your plan regarding national parks and First Nations.  Be specific.  Do not use the mushy language that the separatist leader keeps using.  Tell us exactly how you envision this \\\"negotiation\\\" working out in a way that doesn't carve up Alberta into a jigsaw puzzle of regions outside the national parks and First Nations.\\nBecause let's be clear - those areas are not Alberta.\",\"replies\":[{\"id\":1063,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789321629893,\"up\":0,\"depth\":1,\"text\":\"It would be a waste of time to seriously consider these points before any October vote, it's outcome and the actions of the UCP government. \\nThat being said the 1st nations have legal ownership of their lands and through any court could claim separation of these lands from an independent Alberta or a legal and binding constitutional inclusion by Alberta respecting these rights for ever. This would likely be a very long legal and diplomatic struggle. As for National Parks, they can transition to Albertan authority with legislative provision as to conditions of use, conservation and development. Again this would be a long legal and diplomatic struggle between the federal powers, Canadian and the new Alberta.\"},{\"id\":1064,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789307839073,\"up\":0,\"depth\":1,\"text\":\"Everything within the boundaries of Alberta are part of Alberta whether or not Alberta remains part of Canada. But we will return the Parks Canada trucks and uniforms.\"}]},{\"id\":1065,\"aid\":44,\"author\":\"truecanadian99\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789306891731,\"up\":0,\"depth\":0,\"text\":\"This article makes it sound like Albertans want to rob the federal government of money without providing the services.\\n\\nBut the federal government has no money. Literally they are running deficits.  The federal government can only raise revenue by way of taxes. So even without deficits. The feds have no money. It is not theirs, it is taken from Canadians. \\n\\nAlberta has a value deficit from the feds of about $30 billion a year. They send $30 billion more than the value of the services they reveice. That includes military and passports. It is time to stop letting Ottawa waste Canadians money. They have been far too good at it for far too long.\",\"replies\":[{\"id\":1066,\"aid\":2,\"author\":\"Philip Lucas\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789322351663,\"up\":0,\"depth\":1,\"text\":\"🛢️ The Economic Powerhouses (Alberta & British Columbia)Alberta has been the largest net contributor to Confederation relative to its size. High oil revenues in the 1970s, 1980s, and 2000s boosted its fiscal capacity dramatically. Alberta has not qualified for an Equalization payout since 1965.British Columbia has occasionally drawn minor equalization in brief economic lulls (such as the early 2000s) but has functioned almost entirely as a \\\"have\\\" province for the last century. [1] (https://www.taxpayer.com/newsroom/cost-of-equalization-to-alberta-taxpayers), [2] (https://financesofthenation.ca/2020/11/17/who-pays-and-who-receives-in-confederation/), [3] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php), [4] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php)🏭 The Swing Provinces (Ontario, Quebec, & Saskatchewan)Ontario was the financial anchor of Canada for most of the century, serving as a non-recipient \\\"have\\\" province until the 2008 financial crisis devastated its manufacturing core. It drew Equalization for a ten-year stretch before returning to net-contributor status.Quebec receives the highest total nominal dollar amount of Equalization due to its massive population. However, on a per-capita basis, its draw is much lower than the Atlantic provinces, and its total fiscal reliance on Ottawa hovers near the exact national average.Saskatchewan spent decades as a recipient province, but the global agricultural and mining booms of the 2000s permanently elevated its fiscal capacity, removing it from Equalization reliance for the last 15+ years. [1] (https://en.wikipedia.org/wiki/Canadian_transfer_payments), [2] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php), [3] (https://financesofthenation.ca/2020/11/17/who-pays-and-who-receives-in-confederation/), [4] (https://spheresofinfluence.ca/the-two-sides-of-equalization-payments-in-canada/), [5] (https://etatscanadiens-canadiangovernments.enap.ca/en/nav.aspx?sortcode=2.0.3.1), [6] (https://www.schoolofpublicpolicy.sk.ca/research-ideas/publications-and-policy-insight/policy-brief/policy-paper-equalisation-canada.php)\"},{\"id\":1067,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789307262243,\"up\":0,\"depth\":1,\"text\":\"All Alberta is doing is asking for their money back to spend (or not spend) they way they feel is best. The money belongs to Albertans, not the federal government.\"}]},{\"id\":1068,\"aid\":45,\"author\":\"mike5600\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302235413,\"up\":2,\"depth\":0,\"text\":\"It would be interesting to see if there is a positive connection between the ardent separatists and support for the Freedom Convoy and anti-vaxxers.\",\"replies\":[]},{\"id\":1069,\"aid\":46,\"author\":\"Erman Vis\",\"ini\":\"E\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302053245,\"up\":0,\"depth\":0,\"text\":\"Here's hoping the new comment format will remove the plethora of negativity that has made this forum not worth reading for the past few years...\",\"replies\":[{\"id\":1070,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302789571,\"up\":0,\"depth\":1,\"text\":\"Great point. Albertans have certainly been hoping to be treated in a much more positive manner.\"}]},{\"id\":1071,\"aid\":45,\"author\":\"mike5600\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789301873808,\"up\":0,\"depth\":0,\"text\":\"I am sure many will vote for Option 2 in order to send a message to Ottawa. That is a venting which is understandable. What is not understandable is the apparent expectation by Option 2 supporters (according to polls) that they will win and more importantly, will conclude that the process was somehow rigged. That is more conspiracy related.\",\"replies\":[{\"id\":1072,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789403387921,\"up\":0,\"depth\":1,\"text\":\"I feel expecting to win isn't the issue—it's selling voters a legal shortcut that reality can't deliver on. Option 2 promises an outcome that a vote cannot actually do under constitutional law or international rules.\"},{\"id\":1073,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302183704,\"up\":0,\"depth\":1,\"text\":\"You're speculating about how people will feel about the outcome. All they've said is they expect to win. Do you think they should say they expect to lose?\"}]},{\"id\":1074,\"aid\":47,\"author\":\"Harry Donnelly\",\"ini\":\"H\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789301029460,\"up\":2,\"depth\":0,\"text\":\"Anyone have any doubt that the Alberta Separatists will reject the outcome if they lose?\",\"replies\":[{\"id\":1075,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789402856912,\"up\":1,\"depth\":1,\"text\":\"Bill. That’s a false equivalence. The 'Canada' side relies on constitutional law, which requires Canada to negotiate if a province votes to leave. Following the law isn't 'rejecting an outcome',  it's saying that big national decisions follow the rules of the law Canadians live by.\"},{\"id\":1076,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789301440428,\"up\":0,\"depth\":1,\"text\":\"Do you think the other side would accept the outcome if they lose?\"}]},{\"id\":1077,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789300727956,\"up\":0,\"depth\":0,\"text\":\"The questions being posed in the upcoming referendum stem from how poorly the current federal government has treated Alberta over the past 11 years. As Premier Smith recently put it, many Albertans are angry about their province being treated by the current federal government the way Eastern Canada has been treated by the US government over the past year or so. If Alberta isn't given control over critical things like immigration and healthcare, it's obvious that there will be a definitive march towards gaining complete independence from Canada.\",\"replies\":[{\"id\":1078,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 14\",\"ts\":1789401879511,\"up\":1,\"depth\":1,\"text\":\"Comparing trade disputes to provincial powers ignores basic constitutional law. Also federal issues is a reason to negotiate stronger terms not an excuse for self sabotage. Demanding an unconstitutional split forfeits negotiation and creates total legal chaos.\\n\\nBtw, Alberta already holds full authority over health care.\"},{\"id\":1079,\"aid\":33,\"author\":\"Bala Viswa\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789329397164,\"up\":2,\"depth\":1,\"text\":\"Alberta already has control over its healthcare. AHS only reports to the Government of Alberta.\"},{\"id\":1080,\"aid\":46,\"author\":\"Erman Vis\",\"ini\":\"E\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302387446,\"up\":1,\"depth\":1,\"text\":\"The 25 percent who would rather live in USA could move there as despite what some would have us believe, Canada is a free country.\"},{\"id\":1081,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789302846970,\"up\":0,\"depth\":2,\"text\":\"Has the vote already taken place?\"}]},{\"id\":1082,\"aid\":48,\"author\":\"Raoul O'Riordon\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789299311180,\"up\":0,\"depth\":0,\"text\":\"Alberta is clearly an integral part of and better in Canada. Unless the US jumps in to help them it’s a chaotic losing proposition. However the long term contempt and attitudes towards the culture and economy the Liberal party has shown to  Alberta, and for that matter anyone who has conservative values is unacceptable. So they should consider that and vote for a referendum to leave to put an exclamation point on the damage the elite progressives have done to their economy culture and spirit. But really,  you have to ultimately stay and fight on to keep Canada from descending further into socialism for those who would remain that espouse freedom independence and self sufficiency just like you.\",\"replies\":[]},{\"id\":1083,\"aid\":49,\"author\":\"JR Kookie\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789269572093,\"up\":0,\"depth\":0,\"text\":\"If Alberta (and other prairies) leave, and don't join the US, regardless of whether they join each other, then they'd become landlocked by Canada and the US (if BC remains in Canada).\\n\\nUnless they figure out a nifty way to trade with both countries, and act as a shortcut for Canada, landlocking is not wise for a time with potential conflict.\",\"replies\":[{\"id\":1084,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789301133734,\"up\":0,\"depth\":1,\"text\":\"So do you accept the status quo approach for dealing with Alberta? Do you think that has been working well?\"}]},{\"id\":1085,\"aid\":49,\"author\":\"JR Kookie\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789269254727,\"up\":1,\"depth\":0,\"text\":\"Then we should all separate and agree to a moratorium on forming new \\\"amalgamations\\\" of multiple provinces and territories. Every province for itself, then... Heck some of them, like Ontario, should feel like every sub-region can go off on its own.\\n\\nIf any separatist willingly gets gobbled up by the United States (which is more or less how they continued to form after their War of Independence -- \\\"America\\\" once referred to the whole continental landmass, and still does), then I'll just laugh and say:\\n\\n\\\"I told you so: you had no idea what you really wanted, except that you allowed your disdain towards federal politics, and towards a so-called adversarial party's predominance in governance, to become your modus operandi. You allowed emotions that I won't describe here to become a desire for favouritism and overcome the larger, greater identity of being Canadian. And then lost it to whomever else (like the Americans in this hypothetical posturing of mine).\\\" \\n\\nBitterness and false sense of being targeted does not make for a good self-nationalizing or self-actualizing operational philosophy. Feelings of starting something of your own should be nobler than that.\\n\\nAnd for the last time, we are a federalized nation first, and a bunch of provinces second. A whole greater than the sum of its parts, divided up only for administrative purposes at the end of the day (especially since we're so large). \\n\\nAnd since our provinces are also absurdly large (the average provincial land mass is as big as any average country elsewhere), what's the difference really? Where does the buck stop? Do y'all seriously not think that there are regions within your provinces in which the inhabitants sometimes don't want to be associated with their fellow provincials elsewhere? Look at the Golden Horseshoe in Ontario versus the other collective regions. Even the Horseshoe itself is significantly different from west to east end.\\n\\nMight as well go back to city states and tribes and forget about larger alliances. The nations today are remnants of empires, republics and commonwealths in which the bigger globs of groups gobbled up the smaller ones, however which way, for whatever reasons beyond survival. People banded together in bigger groups to keep increasing their survivability and ironically try and reduce the occurrences of conflict. \\n\\nAnyway, I digress. Think this through with not only the long view of the future, but that of the present and past too. No more political memory subjected to only the most recent ten or twenty years (and people can't even do that, thinking today's problems only originated today and not in previous administrations or generations. Problems are built up over LONG periods of time from everybody).\",\"replies\":[{\"id\":1086,\"aid\":19,\"author\":\"Bill Watson\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789303058118,\"up\":0,\"depth\":1,\"text\":\"Good points, but my question for you is, do you think the status quo approach is working for Alberta?\"}]},{\"id\":1087,\"aid\":50,\"author\":\"Ron Aaron\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789268881368,\"up\":0,\"depth\":0,\"text\":\"All Albertans should consider that unity is strength.     Divisiveness is weakness and inefficient.     Yes, we know there are elements that want change.      And change can, and is happening in ways that are very good for Alberta and Albertans, in a united Canada.      And those things would not be available to an Alberta - or whatever it would become - that is not part of Canada.        Vote well.\",\"replies\":[]},{\"id\":1088,\"aid\":51,\"author\":\"Mitchell Dekker\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789268150476,\"up\":0,\"depth\":0,\"text\":\"I dont think there are any assumptions in the AB premiers office that doing this vote will 'get the issue out of the way' I think they are doing it because a huge amount of Albertans signed petitions on the issue and the people have a right to give their opinion. Nobody should harbour any  worries about the after-election quandaries any more than they would about any other election..\",\"replies\":[]},{\"id\":1089,\"aid\":18,\"author\":\"rayparlour15\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789266058426,\"up\":0,\"depth\":0,\"text\":\"This separation vote is completely pointless because Alberta can legally never leave anyway. The Supreme Court of Canada already ruled that no province can unilaterally secede. To actually separate, you need to amend the Constitution, which requires formal approval from Ottawa and the other provinces. All laws flow from the Crown. It is a legal dead end. \\nOn top of that, Indigenous treaties are with the Crown. If they legally refuse to leave a breakaway Alberta would look like Swiss cheese on a map.\",\"replies\":[]},{\"id\":1090,\"aid\":52,\"author\":\"Robert MacMillan\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789264762176,\"up\":0,\"depth\":0,\"text\":\"Albertans should consider how Canadians in other provinces will react if they vote for Option 2. Will they be considered unreliable partners - a weak link? With bomber Canada flying through hostile skies will other Canadians begin to question should Albertans be part of the crew?\",\"replies\":[{\"id\":1091,\"aid\":51,\"author\":\"Mitchell Dekker\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789268325072,\"up\":0,\"depth\":1,\"text\":\"I think the people of AB are relatively done with hearing the other provinces grievances\"}]},{\"id\":1092,\"aid\":31,\"author\":\"Barbara Briden\",\"ini\":\"B\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789259320897,\"up\":1,\"depth\":0,\"text\":\"I think it is very risky for people to vote for Option 2 in order to”to send a message “ to the rest of Canada. Should Option 2 be successful, then be prepared to separate from Canada. Also they should be aware that any further investment in Alberta by Canada will have to stop leaving many projects unfinished such as the proposed new pipeline to the west coast. Since no private company was willing to take on a large part of the financing of that pipeline while Alberta is a part of Canada, it is highly unlikely that any would step up after Option 2 is approved.\",\"replies\":[]},{\"id\":1093,\"aid\":53,\"author\":\"Guard Ineer\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789256290925,\"up\":0,\"depth\":0,\"text\":\"Biased CBC headline. Redo, resubmit: \\\"True Albertans turn out to overcome media 'both-sideisms' expect massive push-back to Abpremier's manipulative divisive referendum questions.\\\"\",\"replies\":[]},{\"id\":1094,\"aid\":54,\"author\":\"Jason Annon\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789255820656,\"up\":0,\"depth\":0,\"text\":\"Would finally kill off the CFL losing two western teams . Oilers and Flames gone or sold off to Houston and Atlanta etc . Basically say bye bye to Canadian pro sports . Not gonna happen just interesting not a single persons ever mentioned the sports aspect of it .\",\"replies\":[{\"id\":1095,\"aid\":51,\"author\":\"Mitchell Dekker\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789268393687,\"up\":0,\"depth\":1,\"text\":\"Would the viewership suddenly disappear under the Option 2 scenario? I dont think so..\"}]},{\"id\":1096,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789255308451,\"up\":6,\"depth\":0,\"text\":\"For the millions and billions of dollars that are being spent on this referendum, Alberta could certainly have spent that money on improving education and health care. I am more than happy to stay in Canada, but the referendum is such a waste of taxpayer dollars.\",\"replies\":[]},{\"id\":1097,\"aid\":55,\"author\":\"darren\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789250046766,\"up\":3,\"depth\":0,\"text\":\"Voting for seperation isn't just sending a message to Ottawa so that Alberta can get more. It's ending Canada. Additionally the seperation movement is supported by groups from outside Canada. Ask why. To weaken Canada.\",\"replies\":[]},{\"id\":1098,\"aid\":56,\"author\":\"Charlie Miller\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789246561124,\"up\":1,\"depth\":0,\"text\":\"I would like everyone to consider what the USA would do if Alberta chooses to separate? I doubt if we would last a year on our own before the States would come in and take us over. That would be disastrous.\",\"replies\":[{\"id\":1099,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789253062043,\"up\":0,\"depth\":1,\"text\":\"People with dual citizenship would welcome becoming the 51st State, and currently have influence on and are part of the Separatist movement. \\nWhat many Separatists who have only Cdn citizenship don't realize is that with all the wars Trump is starting, the American congress and the president can reactivate conscription. All American men between the ages of 18-25 are being automatically registered for the draft. \\nDo we want this for Albertans should we eventually become the 51st State?\"}]},{\"id\":1100,\"aid\":57,\"author\":\"Jim Howard\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789246025697,\"up\":1,\"depth\":0,\"text\":\"What specifically would a better relationship with the rest of Canada entail? What precisely is deemed necessary or important to change? The media constantly presents broad statements re: Imbalances, unfairness, etc..\\nHowever,I don't think I have ever read a clear list/statement of 5, or 6, or 15, or 100 ,or??? issues that precisely define the problems or worries that generate discount.\\nWhat would ensure a better relationship and promote national unity?\\nIf those \\\"X\\\" number of items were listed and honestly, cooperatively addressed in working groups, is it possible for them to be resolved or at least improved?\\nI know this all sounds naive. I respect things have been building negatively for decades and some key irritants like the federal elections being \\\"over\\\" by the time votes are cast in Ontario are still unaddressed with Electoral Reform, but \\\"Specifically, WHAT ELSE\\\" should we do, or correct to make our country stronger?\",\"replies\":[]},{\"id\":1101,\"aid\":58,\"author\":\"Gord Hasay\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789244180474,\"up\":2,\"depth\":0,\"text\":\"The leadership of the 'separatist' factions:\\n1. Ian Parkinson, was introduced as a co-writer of the draft constitution called the “Foundation of Freedom,” His speech \\\"Every citizen has the right to life, liberty and security to the person — your own security, not some flip flop, towel-headed police officer who doesn’t even speak Canadian,” Parkinson said to applause by members of the audience. Which shows their support for racism.\\n2. Bob Deer: Bob  Deer was convicted of  manslaughter. by a judge. His role in a 2006 killing that led to him serving more than nine years in prison.\\n3. Jeff Rath: A lawyer accused of misappropriating money as the trustee of an account belonging to a First Nation in northern Alberta. \\nPlus an American litigation funder is threatening to call in more than $100 million in alleged debt from Jeffrey Rath and his firm.\\nDo we really want racists, murderers, and scam artists running our provincial government?\",\"replies\":[]},{\"id\":1102,\"aid\":43,\"author\":\"Steven Tyler\",\"ini\":\"S\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789242442986,\"up\":4,\"depth\":0,\"text\":\"I would like the separatists to answer - honestly - what they think the solution is to areas inside Alberta's borders which are not provincial jurisdiction.  Specifically, national parks and First Nations.\\nEverything I've read in the separatists' material avoids this question directly - instead using mushy phrases that talk about some type of \\\"negotiation\\\". \\nBe honest, separatists.  Canada certainly isn't going to let you have the national parks, and First Nations aren't going to accept anything less than they currently get from the federal government.  So in reality, your independent Alberta will be a jigsaw puzzle of little geographic regions - bisected and cut apart by national parks and First Nations.\\nFor those of you who have property anywhere inside Banff, Jasper, or other national parks - I guess you'll have to sell that now?  Or pay a foreigner tax to Canada, now that you aren't part of it?\",\"replies\":[]},{\"id\":1103,\"aid\":59,\"author\":\"Jimmy Sinclair\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789242163865,\"up\":1,\"depth\":0,\"text\":\"Until Carney repeals Bills C - 69/48 , secession will always be real .\\n\\nps.  he won't\",\"replies\":[]},{\"id\":1104,\"aid\":60,\"author\":\"albertansfreedom\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789241995995,\"up\":0,\"depth\":0,\"text\":\"This rings of the cold war, is this as good as CBC can do. Facts are independent polls show 68% in favor and that is just amongs coroporate offices in the Calgary core. We will qin by a landslide\",\"replies\":[{\"id\":1105,\"aid\":61,\"author\":\"joalberta\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789248546483,\"up\":1,\"depth\":1,\"text\":\"What poll is this from? I cant find anything online about this?\\n\\nAlso it does ring true of American politics during the cold war, divide and separate and then take over. I agree with you, American imperialism will only intensify post separation.\"}]},{\"id\":1106,\"aid\":62,\"author\":\"fluke\",\"ini\":\"F\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789239198486,\"up\":0,\"depth\":0,\"text\":\"\\\"This land is my land,this land is your land ...\\\". \\n1. The Canadian (federal) government directly owns about 8-10% Alberta's surface land (including national parks, military bases, and federal crown land), plus roughly 9.2% to 19% of sub-surface mineral rights (depending on classification, national parks, and First Nations holdings), and all the WATER that runs through them!  Private owners and corporations hold approximately 25% of natural resources (above and below). Total 35% (approx) of land,water, air,trees, minerals, and other resources. \\n2. Private owners will follow the money AND the Canadian federal and international subsidies. \\n3. Albertans will pay taxes,duty,inspections,laws,regulations, licenses,etc on import and export fees from 9 provinces and 3 territories of Canada. \\n4. Albertans will pay tolls on all Canadian owned highways running through the The Gulf-Lake of Alberta. \\n5. Albertans will lose Canadian rights, protection abroad, evacuation/rescue while in foreign countries including Canada. \\n6. Of 538,824 inter provincial residents (Stats Can,Fraser Institute) - domestic migrants of Canadians, how many will move \\\"home\\\" to Canada?  \\n7. Canada has no draft, no capital punishment.\\n8. Alberta (65%) can become a US northern state. Canadians will be delighted to invite California to take their place.  \\n9. Tech is the new oil. California can help Make Canada Greater,again.    \\n10. TBC...\",\"replies\":[]},{\"id\":1107,\"aid\":63,\"author\":\"Richard Fryer\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789237493288,\"up\":0,\"depth\":0,\"text\":\"...the separatists might not win this round, but the sentiment will not die. This is a canary in the coal mine, and Ottawa politicians need to quit listening to wealthy well connected lobbyists...for example,  the medical profession and others and move forward with meaningful reforms that reduces  bureaucracy, duplication  and costs. Smiths message about removing the requirement for a referral to get a lab test, for example an ECG , is a message to Ottawa... we all heard the screams from the vested interests...it's not about health-care but about power and control...well enough is enough... Ottawa better listen.\",\"replies\":[{\"id\":1108,\"aid\":64,\"author\":\"amandaf\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789253388552,\"up\":1,\"depth\":1,\"text\":\"So the completely botched rollout of the new driver's licenses and the underfunding of Elections Alberta to the point you've had to ask other provinces to help you administer your own separation referendum are the kind of results we can expect from the UCP's bureaucratic reforms? And Ottawa should emulate Danielle Smith and listen to oil and gas and health insurance lobbyists?\"}]},{\"id\":1109,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789237181893,\"up\":1,\"depth\":0,\"text\":\"\\\"Give Ottawa a message\\\" is  bluffing. Separatists need to understand what they're asking for:  How complex and costly separation would actually be?\",\"replies\":[]},{\"id\":1110,\"aid\":28,\"author\":\"pnd\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789236179361,\"up\":1,\"depth\":0,\"text\":\"Will the vast majority who do not want Alberta to try separate take it seriously and vote? People in the UK didn't take Brexit seriously so they didn't vote. Then it became a reality.\",\"replies\":[{\"id\":1111,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789253711906,\"up\":0,\"depth\":1,\"text\":\"Voting is difficult this time around. As we saw in last October's municipal election, Danielle Smith's switch to paper ballots caused long lineups and many left without voting.\\nIt was a cold, windy day where I live, and nobody was prepared. \\nPeople are being warned to vote in advance, either by mail or at the advance voting stations (which, when I last checked have not been announced). Elections Alberta has never had so many requests for mail-in ballots. According to Global News, the number is somewhere around 225k.\\nPeople may need to bring their lawn chairs, food, water, and dress for the weather should they decide to attend on voting day.\"}]},{\"id\":1112,\"aid\":65,\"author\":\"Tabby Buxton\",\"ini\":\"T\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789231587350,\"up\":1,\"depth\":0,\"text\":\"When the separatist side loses, and if you want to leave or no longer be part of Canada, there is a simple solution. And it is moving South. The fact that we have this style of politics now in Canada is a direct reflection of the disgrace that the US has become under the political style of their current President. I can guarantee following a substantial loss that the separatist side will declare a rigged vote. That is the style of their leadership and it is sad that we have come to this given how we have been treated, mocked and frankly lied about repetively by the regime below us.\",\"replies\":[]},{\"id\":1113,\"aid\":66,\"author\":\"Luc Perrier\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789231416033,\"up\":0,\"depth\":0,\"text\":\"Dear Albertans,\\n\\nPlease stay in Canada. We Québécois need Alberta more than we sometimes care to admit.\\nQuébec has built a generous social system, and it is easier to maintain when the rest of Canada is doing well.\\nAlberta’s workers, businesses and energy sector play a significant role in that prosperity.\\nYet some Québécois are quite comfortable criticizing Alberta’s environmental record while benefiting from its economic contribution.\\nIt is an interesting arrangement: we keep the moral high ground, while you help with the bill.\\nI understand why many Albertans are frustrated with Ottawa, but separation would hurt the rest of us as well.\\nWe may disagree on energy, taxes and the environment, but we remain financially and economically connected.\\nAs a Québécois, I would rather be honest about that connection than pretend otherwise.\\nSo, Alberta, please stay. Canada needs you—and Québec certainly has no interest in discovering the true cost of doing without you.\",\"replies\":[{\"id\":1114,\"aid\":67,\"author\":\"Patrick Richard\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789233845371,\"up\":0,\"depth\":1,\"text\":\"All good.\"}]},{\"id\":1115,\"aid\":68,\"author\":\"Greg Phillips\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789230313674,\"up\":1,\"depth\":0,\"text\":\"Social media posts last forever and those being most public in their efforts to separate  are now known coast to coast . . .\",\"replies\":[{\"id\":1116,\"aid\":64,\"author\":\"amandaf\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789253744251,\"up\":2,\"depth\":1,\"text\":\"...to coast. Believe me, that third coast is crucial here.\"}]},{\"id\":1117,\"aid\":10,\"author\":\"Lynda Parks\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789230212575,\"up\":7,\"depth\":0,\"text\":\"The Citizens of Alberta should be told up front that they will bear the costs of determining the Separation. All costs for CPP separation, Indigenous Peoples legal challenges, share of Canadian Dept, determining policing, Law changes, currency changes, Regulation changes  ... The rest of Canada will not be willing to share this cost burden that is strictly brought on by Albertan's. This will be hundreds of millions and possibly billions of dollars.\",\"replies\":[{\"id\":1118,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789505141387,\"up\":0,\"depth\":1,\"text\":\"Those of us who are well informed already know the many costs of separation. You would do well to reword your post indicating that it is the Separatists who need to be informed.\"}]},{\"id\":1119,\"aid\":69,\"author\":\"James Robson\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789228762250,\"up\":2,\"depth\":0,\"text\":\"Thoughtful Canadians should want to know what CSE electronic intercepts show about hostile foreign interference in the lead-up to this odious \\\"Referendum-to-Have-a-Referendum\\\" on separation from Confederation.  Both CSE and CSIS are more aware of the ugly under-currents in play than Ottawa admits.\",\"replies\":[]},{\"id\":1120,\"aid\":70,\"author\":\"Rae Swearengen\",\"ini\":\"R\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789226819145,\"up\":0,\"depth\":0,\"text\":\"I don't believe they will win. But I also don't believe that the numbers are as far apart as many claim. I remember when Trump was running the first time, many polls showed him not winning. Not even close. And then I spoke with someone who lived in Trump country and he said \\\"oh he's going to win! You haven't been to one of his rallies\\\". And he was right. He did win. Polls are a snapshot in time and people respond based on their feelings of that exact moment as they're being taken. No one should ever take them as a be all end all of an outcome. Alberta, we want you to stay. Alberta, have faith in Carney. He's not your average Liberal. He's your average Progressive Conservative. In fact, maybe even better. And this is largely in thanks to Donald Trump, who has pushed us to go after our potential. Something I believe Alberta separatists have been wanting for a long time.\",\"replies\":[{\"id\":1121,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789254246236,\"up\":2,\"depth\":1,\"text\":\"Good warning, thank you. We who wish to remain are encouraging Albertans to get out and vote. It isn't going to be easy this time around with ten paper ballots! Effort is required for sure.\"}]},{\"id\":1122,\"aid\":66,\"author\":\"Luc Perrier\",\"ini\":\"L\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789226339671,\"up\":0,\"depth\":0,\"text\":\"Dear Albertans,\\n\\nPlease stay in Canada. We Québécois need Alberta more than we sometimes care to admit.\\nQuébec has built a generous social system, and it is easier to maintain when the rest of Canada is doing well.\\nAlberta’s workers, businesses and energy sector play a significant role in that prosperity.\\nYet some Québécois are quite comfortable criticizing Alberta’s environmental record while benefiting from its economic contribution.\\nIt is an interesting arrangement: we keep the moral high ground, while you help with the bill.\\nI understand why many Albertans are frustrated with Ottawa, but separation would hurt the rest of us as well.\\nWe may disagree on energy, taxes and the environment, but we remain financially and economically connected.\\nAs a Québécois, I would rather be honest about that connection than pretend otherwise.\\nSo, Alberta, please stay. Canada needs you—and Québec certainly has no interest in discovering the true cost of doing without you.\",\"replies\":[{\"id\":1123,\"aid\":67,\"author\":\"Patrick Richard\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789233905970,\"up\":0,\"depth\":1,\"text\":\"I don't buy it.\"}]},{\"id\":1124,\"aid\":64,\"author\":\"amandaf\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789224137829,\"up\":5,\"depth\":0,\"text\":\"I'd like them to remember the territories just above them when they vote, and how they're deciding our future too, very much without our consent. If they actually cared about the whole concept of sovereignty, this would give them pause.\\n\\nAlberta is the NWT's main connection to the rest of Canada via the Mackenzie Highway. Edmonton literally calls itself \\\"The Gateway to the North\\\". Placing an international border across that highway would choke off our main supply route for the most basic necessities, like food and fuel. Our only \\\"choice\\\" would be to join them or die. Like, actually physically die. Starve or freeze to death. But they tell us this is Alberta's decision alone and nobody else gets a say.\\n\\nMaybe the rest of Canada should hold a referendum on whether Alberta should be reabsorbed into the NWT. Our system of consensus government would be healthy for them.\",\"replies\":[{\"id\":1125,\"aid\":71,\"author\":\"amy\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789500181240,\"up\":0,\"depth\":1,\"text\":\"I'd be 100% on board with Alberta being absorbed into the NWT. Unfortunately the population in AB is a lot higher, so they'd be bending you to their political whims. The only reason everything is falling apart is because of Conservative policies, and favouring private enterprise over public.\"},{\"id\":1126,\"aid\":64,\"author\":\"amandaf\",\"ini\":\"A\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 15\",\"ts\":1789500846792,\"up\":0,\"depth\":2,\"text\":\"Hence why they'd have to adopt our system of consensus government. No political parties up here, so elections don't turn into \\\"my team vs yours\\\".\"}]},{\"id\":1127,\"aid\":72,\"author\":\"Kevin Macaroni\",\"ini\":\"K\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789223317160,\"up\":4,\"depth\":0,\"text\":\"Voters should be aware that the current borders of Alberta and any resources located within those borders would all be part of the negotiations.  The separatists entire strategy works around the current borders so it is really just a fantasy.  Why would Edmonton join the separatists if a huge majority of Edmontonians vote against separation?  Why would Canada hand over the tar sands when there is only a small population of people living there? \\nThere is nothing that even forces Canada to negotiate with separatists. All just separatists fantasy and a huge waste of time and tax money\",\"replies\":[]},{\"id\":1128,\"aid\":73,\"author\":\"David Schultz\",\"ini\":\"D\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789223144461,\"up\":0,\"depth\":0,\"text\":\"Free Alberta! Keep the pressure on this is the only way to force our government to care about western issues! A vote to stay is tacit approval of our current trajectory!\",\"replies\":[{\"id\":1129,\"aid\":38,\"author\":\"Matilda Dillon\",\"ini\":\"M\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789254371373,\"up\":2,\"depth\":1,\"text\":\"I live in Alberta and I already feel free. As a Canadian who's lived in various locations around the country, I've never felt enslaved.\"}]},{\"id\":1130,\"aid\":67,\"author\":\"Patrick Richard\",\"ini\":\"P\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789223122810,\"up\":1,\"depth\":0,\"text\":\"Who wants most the Canadian government to cave in in the trade war? \\n\\nSeparatists, because that would be sold has an easy transition.\\n\\nThink again.\",\"replies\":[]},{\"id\":1131,\"aid\":74,\"author\":\"canadian\",\"ini\":\"C\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789222219875,\"up\":4,\"depth\":0,\"text\":\"For those wanting separation, do they realize it would include assuming a proportionate share of Canada's national debt ?\\nFor those wanting to be the 51st state, do they realize it would result in assuming a proportionate share of the US national debt ?\",\"replies\":[]},{\"id\":1132,\"aid\":75,\"author\":\"gardener\",\"ini\":\"G\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789220429324,\"up\":9,\"depth\":0,\"text\":\"We need to have the RCMP do a top down investigation and figure out who's paying these people to divide us when we're in the middle of a trade war. It seems so obvious that this is the latest in a pattern of countries like Russia, China, India, and the US using armies of bots and disinformation networks to weaken democratic and free countries. At a certain point we need to take these threats seriously or end up mince meat.\",\"replies\":[{\"id\":1133,\"aid\":76,\"author\":\"J Johnson\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 13\",\"ts\":1789274170485,\"up\":0,\"depth\":1,\"text\":\"Canada is foreign to many of us out here. Land back!\"},{\"id\":1134,\"aid\":61,\"author\":\"joalberta\",\"ini\":\"J\",\"title\":\"\",\"pinned\":false,\"date\":\"Sep 12\",\"ts\":1789249054314,\"up\":3,\"depth\":1,\"text\":\"Agreed this reeks of foreign interference. Just because USA put aside it's manifest destiny style imperialism in north american (because lets face it they have love destabilizing countries, looking at you CIA) post world war 2
