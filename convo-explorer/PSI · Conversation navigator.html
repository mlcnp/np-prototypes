you start completely over from scratch.\",\"replies\":[]},{\"id\":1054,\"aid\":39,\"author\":\"barry\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Alberta wants Federal money, from all other provinces and territories, but does not want to provide the services as defined by those funders?\\nIt’s like Florida saying to Canadian tourists, send us your money but stay at home.\\nNo cooperative, coordinated compliance, then no money.\",\"replies\":[]},{\"id\":1030,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to Sarah Brown\",\"stance\":\"\",\"text\":\"In response to Bill. Alberta can opt out of certain federal-provincial cost-shared programmes, but only under strict constitutional conditions—it must establish a provincial programme that meets national objectives. Opting out without delivering equivalent health or social services isn't a constitutional right. That’s how Quebec does it: they get funding because they actually provide the equivalent service, not because they demanded a blank cheque.\",\"replies\":[]},{\"id\":1079,\"aid\":33,\"author\":\"Bala Viswa\",\"meta\":\"Sep 13 · reply to Bill Watson\",\"stance\":\"\",\"text\":\"Alberta already has control over its healthcare. AHS only reports to the Government of Alberta.\",\"replies\":[]},{\"id\":1021,\"aid\":21,\"author\":\"Mark Leenders\",\"meta\":\"Sep 14\",\"stance\":\"\",\"text\":\"The idea of the UCP government accepting Federal money without implementing the federal programs is terrible. Average Albertans would not benefit at all from those funds.\",\"replies\":[]},{\"id\":1025,\"aid\":22,\"author\":\"bigboss\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"I think there has to be some guidelines that harmonize services across the country. We cannot have provinces 100% doing their own thing. We need a strong federal presence negotiating with big pharma vs piecemeal by provinces\",\"replies\":[]},{\"id\":1044,\"aid\":33,\"author\":\"Bala Viswa\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"The referendum question on the social programmes is akin to saying, \\\"I want to be a part of the programme, but I don't want to meet any of its objectives\\\". This is also essentially saying, \\\"Send us the money but don't expect it to be used for what it was meant.\\\" \\n\\nThis may be popular (as worded, such a proposition would be popular in any province), but has zero chance of passing as a Constitutional Amendment. Parliament would never endorse such an Amendment, though I expect all ten provinces to sign on.\",\"replies\":[]},{\"id\":1027,\"aid\":22,\"author\":\"bigboss\",\"meta\":\"Sep 14 · reply to Bill Watson\",\"stance\":\"\",\"text\":\"I'm assuming you are an Albertan? I am too. I believe some things are way too important and fundamental that cannot be left to the whims of the free market like education, healthcare, policing, the basic social services. I would like all of us to collectively pay for the basic needs of all of us regardless of our backgrounds, income, class etc. I don't have children and don't want to but I will gladly pay for equal access by all. Some goes for healthcare. I am a net contributor right now and hope to be for a very long time, but if/when the time comes I hope there will be others who will support me. Egalitarian access to me is very important when it comes to the basic needs of humans.\",\"replies\":[]},{\"id\":1017,\"aid\":17,\"author\":\"Jacques Bruyere\",\"meta\":\"Sep 14\",\"stance\":\"\",\"text\":\"If Danielle Smith was a nationalist, I would trust her with the federal issues she brings up.  But she's not, she's a seperatist.  Therefore I would not trust her with her handling federal funds.  As well, oil and gas will eventually lose their momentum.  Then what?  Back to being broke again with her provincial programs not being funded.\",\"replies\":[]},{\"id\":1065,\"aid\":44,\"author\":\"truecanadian99\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"This article makes it sound like Albertans want to rob the federal government of money without providing the services.\\n\\nBut the federal government has no money. Literally they are running deficits.  The federal government can only raise revenue by way of taxes. So even without deficits. The feds have no money. It is not theirs, it is taken from Canadians. \\n\\nAlberta has a value deficit from the feds of about $30 billion a year. They send $30 billion more than the value of the services they reveice. That includes military and passports. It is time to stop letting Ottawa waste Canadians money. They have been far too good at it for far too long.\",\"replies\":[]},{\"id\":1022,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to Mark Leenders\",\"stance\":\"\",\"text\":\"It isn't federal money. Albertans just want their money returned.\",\"replies\":[]},{\"id\":1026,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to bigboss\",\"stance\":\"\",\"text\":\"What if we don't support the concept of government funded pharmacare?\",\"replies\":[]},{\"id\":1031,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to Sarah Brown\",\"stance\":\"\",\"text\":\"We respectfully disagree with your view on this matter. Albertans have a right to opt out of federal programs and receive their money back.\",\"replies\":[]},{\"id\":1041,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 14 · reply to Eric Maker\",\"stance\":\"\",\"text\":\"We just want our money back to spend on our own programs.\",\"replies\":[]},{\"id\":1067,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to truecanadian99\",\"stance\":\"\",\"text\":\"All Alberta is doing is asking for their money back to spend (or not spend) they way they feel is best. The money belongs to Albertans, not the federal government.\",\"replies\":[]}]},{\"id\":\"legit\",\"label\":\"Questioning the separatist movement\",\"count\":19,\"color\":\"rgb(195,70,70)\",\"px\":148,\"py\":328,\"d\":130,\"allLabel\":\"16 responses · 3 replies\",\"posts\":[{\"id\":1158,\"aid\":91,\"author\":\"Bill Campbell\",\"meta\":\"Sep 9\",\"stance\":\"\",\"text\":\"I wished everyone would publicly acknowledge that there is foreign interference. \\n \\nThere are two main players the US and then the rest of the world.  US interference has been shown by many journalists are exposing the mega right wing millionaires that funneling money into the campaign and social media.\\n\\nThe rest of the world is interfering whether it's Russia, North Korea or China.  There are many news stories on social media manipulation.  CBC had a great story on an American Youtuber who was paid $40 per post by someone in The Netherlands to make pro-separation post.\\n\\nAs an Alberta in my eighth decade I have never seen evidence of a separation movement.  I came after social media became dominant in the last 10 or so years and people got into these \\\"information silos\\\" that are filled with dis-information.\",\"replies\":[]},{\"id\":1152,\"aid\":13,\"author\":\"Andrew Ross\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"As a local activist in the south zone, I have never encountered someone pushing seperation in real life when I am handing out lawn signs for albertasvoice.ca, or while speaking as an AFL (Alberta federation of labor) activist... Not once.\\n\\nIts almost as if they exist stictly online, which raises many red flags.\\nThe arguments made for sepeartion are not based in reality, and completely crumble under the most basic of questioning.  \\nThe future promised us flying cars, and robot buttlers... Instead we got loud podcasters, medical disinformation and AI data centres that nobody asked for, and nobody wants. \\n\\nNot one politician in government ran on this issue, so why are we here now? Why does populism get entertained trying to break up the country, and not on renewable energy, or any progressive issue?\\n\\n When history repeats itself in the next 5 years, we are all in a ton of trouble.\",\"replies\":[]},{\"id\":1132,\"aid\":75,\"author\":\"gardener\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"We need to have the RCMP do a top down investigation and figure out who's paying these people to divide us when we're in the middle of a trade war. It seems so obvious that this is the latest in a pattern of countries like Russia, China, India, and the US using armies of bots and disinformation networks to weaken democratic and free countries. At a certain point we need to take these threats seriously or end up mince meat.\",\"replies\":[]},{\"id\":1149,\"aid\":87,\"author\":\"David Locontes\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"I think most of those pro-independence accounts are Russian state-sponsored groups and US maga.  See Brexit.  Canada is not doing a good job in defending against that.\",\"replies\":[]},{\"id\":1159,\"aid\":71,\"author\":\"amy\",\"meta\":\"Sep 15 · reply to Bill Campbell\",\"stance\":\"\",\"text\":\"The entire movement was literally started by an American, and funded by foreign powers. It's a ploy to purposefully destabilize our government, helped along by people who think that a separation vote \\\"sends a message\\\".\",\"replies\":[]},{\"id\":1051,\"aid\":37,\"author\":\"proundcanuck\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Why does the CBC keep giving legitimacy to the so called seperation movement.  This referendum has been hoisted upon Alberta by a Provincial government by autocratic means. If you Love Canada make sure you get out and vote.\",\"replies\":[]},{\"id\":1097,\"aid\":55,\"author\":\"darren\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Voting for seperation isn't just sending a message to Ottawa so that Alberta can get more. It's ending Canada. Additionally the seperation movement is supported by groups from outside Canada. Ask why. To weaken Canada.\",\"replies\":[]},{\"id\":1148,\"aid\":86,\"author\":\"Ellen Simpson\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"I find it interesting that the separatist movement in Alberta doesn't seem to offer clarity on what the goal and objectives are for Albertans by separating? \\n\\nIt seems more like a grievance movement?\",\"replies\":[]},{\"id\":1134,\"aid\":61,\"author\":\"joalberta\",\"meta\":\"Sep 12 · reply to gardener\",\"stance\":\"\",\"text\":\"Agreed this reeks of foreign interference. Just because USA put aside it's manifest destiny style imperialism in north american (because lets face it they have love destabilizing countries, looking at you CIA) post world war 2 doesn't mean they did not forget about conquering the rest of the continent.\",\"replies\":[]},{\"id\":1042,\"aid\":31,\"author\":\"Barbara Briden\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Apparently Mr. Rath, a prominent separatist, owes Diriba Investments of Delaware over $100 million dollars as reported by Global News. So an American firm is putting money into the separatists cause. I don’t think Alberta will be ‘separate’ for long because those people will want their money back and they fund nothing for free.\",\"replies\":[]},{\"id\":1068,\"aid\":45,\"author\":\"mike5600\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"It would be interesting to see if there is a positive connection between the ardent separatists and support for the Freedom Convoy and anti-vaxxers.\",\"replies\":[]},{\"id\":1074,\"aid\":47,\"author\":\"Harry Donnelly\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Anyone have any doubt that the Alberta Separatists will reject the outcome if they lose?\",\"replies\":[]},{\"id\":1101,\"aid\":58,\"author\":\"Gord Hasay\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"The leadership of the 'separatist' factions:\\n1. Ian Parkinson, was introduced as a co-writer of the draft constitution called the “Foundation of Freedom,” His speech \\\"Every citizen has the right to life, liberty and security to the person — your own security, not some flip flop, towel-headed police officer who doesn’t even speak Canadian,” Parkinson said to applause by members of the audience. Which shows their support for racism.\\n2. Bob Deer: Bob  Deer was convicted of  manslaughter. by a judge. His role in a 2006 killing that led to him serving more than nine years in prison.\\n3. Jeff Rath: A lawyer accused of misappropriating money as the trustee of an account belonging to a First Nation in northern Alberta. \\nPlus an American litigation funder is threatening to call in more than $100 million in alleged debt from Jeffrey Rath and his firm.\\nDo we really want racists, murderers, and scam artists running our provincial government?\",\"replies\":[]},{\"id\":1119,\"aid\":69,\"author\":\"James Robson\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Thoughtful Canadians should want to know what CSE electronic intercepts show about hostile foreign interference in the lead-up to this odious \\\"Referendum-to-Have-a-Referendum\\\" on separation from Confederation.  Both CSE and CSIS are more aware of the ugly under-currents in play than Ottawa admits.\",\"replies\":[]},{\"id\":1100,\"aid\":57,\"author\":\"Jim Howard\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"What specifically would a better relationship with the rest of Canada entail? What precisely is deemed necessary or important to change? The media constantly presents broad statements re: Imbalances, unfairness, etc..\\nHowever,I don't think I have ever read a clear list/statement of 5, or 6, or 15, or 100 ,or??? issues that precisely define the problems or worries that generate discount.\\nWhat would ensure a better relationship and promote national unity?\\nIf those \\\"X\\\" number of items were listed and honestly, cooperatively addressed in working groups, is it possible for them to be resolved or at least improved?\\nI know this all sounds naive. I respect things have been building negatively for decades and some key irritants like the federal elections being \\\"over\\\" by the time votes are cast in Ontario are still unaddressed with Electoral Reform, but \\\"Specifically, WHAT ELSE\\\" should we do, or correct to make our country stronger?\",\"replies\":[]},{\"id\":1130,\"aid\":67,\"author\":\"Patrick Richard\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Who wants most the Canadian government to cave in in the trade war? \\n\\nSeparatists, because that would be sold has an easy transition.\\n\\nThink again.\",\"replies\":[]},{\"id\":1145,\"aid\":84,\"author\":\"Johannes Dietz\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"Anger, fear, and resentment. Those are the emotions that drive the separatists' debate. They are powerful and make people behave in destructive and self-destructive ways. Unfortunately, those caught up in the emotion are not receptive to rational argument. This isn't about debating policies and goals. It is about getting back at whoever: Ottawa, environmentalists, people who are not 'us.' There is no real communication between those that try to argue rationally and those that want to lash out. That is what concerns me most about this issue.\",\"replies\":[]},{\"id\":1171,\"aid\":99,\"author\":\"ai76\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"My biggest concerns are: a) if Alberta does vote to separate, it may become a racist and xenophobic haven where all the issues will be \\\"because of immigrants\\\"; b) if Alberta votes to stay, provincial grievances will continue being ignored by Ottawa.\",\"replies\":[]},{\"id\":1153,\"aid\":71,\"author\":\"amy\",\"meta\":\"Sep 15 · reply to Andrew Ross\",\"stance\":\"\",\"text\":\"Go see their base out in Mirror. They definitely exist, but they've been sold a lie.\",\"replies\":[]}]},{\"id\":\"economics\",\"label\":\"The economics of leaving don't add up\",\"count\":17,\"color\":\"rgb(5,130,135)\",\"px\":392,\"py\":170,\"d\":123,\"allLabel\":\"15 responses · 2 replies\",\"posts\":[{\"id\":1169,\"aid\":97,\"author\":\"Ken Johnson\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"As a native Albertan I say to remember that the oil industry gets a subsidy of a billion dollars a month from the Feds. Most of it goes to the big four who dominate the tar sands and they are up to 73% foreign owned - mostly American. Most of the oil they produce goes to the US for $30 a barrel under the world rate. Let's clean up that process before even thinking about separation. Canada is an oasis in an uncertain world.\",\"replies\":[]},{\"id\":1181,\"aid\":105,\"author\":\"canadianabroad\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"History does not repeat, but it rhymes. \\n\\nLook at other jurisdictions that have tried to 'leave' or have left. Quebec: Corporate Relocation: Approximately 700 companies left Quebec between 1976 and 1985, with Montreal’s manufacturing head offices declining by 24% between 1989 and 1999 compared to a 4% decline in Toronto. Ever wonder why the Bank of Montreal is in Toronto and not Montreal? \\n\\nUnited Kingdom (Brexit): Think tanks see the actual loss from the decision to leave the European Union at anywhere between 2% and 9% of GDP loss (8% = 100-200 billion pounds). Effectively, the United Kingdom is only now, 10 years later, seeing some level of normalcy. \\n\\nThink about an Alberta without access to tidewater, which is the current situation, but you have a partner that gives you access (maybe not as much as you like but still access). Now think about separation and that partner becoming your ex-wife, ex-husband. You won't be getting access to the water anytime soon or under favorable negotiating conditions. Alberta would have 3 oil pipelines (less than 10% of total current capacity) and 0 gas pipelines to feed the United States. Effectively, you would strangle the oil and gas industry for a decade minimum while taking on additional cost and administration responsibilities. Not to mention, you would need to negotiate new trade agreements with all the countries (including Canada) which take extensive time and investment.\",\"replies\":[]},{\"id\":1184,\"aid\":107,\"author\":\"Iain Basedord\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"I was on the fence for a long time in this debate, waiting for that \\\"Ah Ha\\\" moment the independence side would present viable data to consider. I mean, there are some valid complaints from Weatern Canada about how centralized the federal government is. Trouble is, no one on the independence side of the argument has presented anything other than \\\"trust me, it'll be better\\\" or \\\"the federalist are BSing us\\\" as evidence an independent Alberta would be in a better position. The closer we get to the date, the more the narrative (and the composition) of the independence movement is revealing itself as a bunch of angry good ole boys with no actual plan to keep the US out and what seems to be a suspiciously clandestine plan of self enrichment from its defacto leaders. Before you vote, really consider what their actual plan is.....because I haven't seen one, and I won't be holding the bag for them down the road.\",\"replies\":[]},{\"id\":1150,\"aid\":88,\"author\":\"fr2309\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"People need to understand if Alberta becomes a landlocked nation it will have very little negotiating power for any fair deal with the US. The US will be perfectly happy to squeeze Alberta for cheap oil with very little return as we lose our coastal access. American influence is also declining on a global scale as seen with its inability to deal with the rise of China and aggressions from Russia and Iran. Declining superpowers has a tendency to lash out and turn more aggressive before imploding from within. If Alberta joins the US it will be akin to tying ourselfs onto a sinking ship. Staying in Canada still leaves Alberta with options other than America.\",\"replies\":[]},{\"id\":1198,\"aid\":105,\"author\":\"canadianabroad\",\"meta\":\"Sep 4 · reply to canuckabout\",\"stance\":\"\",\"text\":\"You laid out a lot of the possible challenges that have yet to be determined. I think some of the others is this sales pitch that Albertans would get to keep their CPP, their passport, their healthcare access partially paid by Canadians and everything would be normal. When it is clearly far from the case that any of this would happen. \\n\\nI can't see Canada's allies (other then maybe the Trump government) even acknowledging Alberta as its own country. Recognition also doesn't equal sovereignty. Palestine is recognized but yet does not have its own state effectively.\",\"replies\":[]},{\"id\":1117,\"aid\":10,\"author\":\"Lynda Parks\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"The Citizens of Alberta should be told up front that they will bear the costs of determining the Separation. All costs for CPP separation, Indigenous Peoples legal challenges, share of Canadian Dept, determining policing, Law changes, currency changes, Regulation changes  ... The rest of Canada will not be willing to share this cost burden that is strictly brought on by Albertan's. This will be hundreds of millions and possibly billions of dollars.\",\"replies\":[]},{\"id\":1197,\"aid\":112,\"author\":\"canuckabout\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"Observations regarding Alberta separation debate.  \\n\\nAlberta exports approximately $178 billion internationally 71% (88% to the US) and 71$ billon to the rest of Canada 29%.\\n\\nSimilarities with the UK leaving the EU (Brexit).\\n-\\tCanada and the EU are federations, where each province / country has it’s distinct : local laws, taxes, driver licenses, health system and insurance, auto, home and personal insurances, among others.\\n-\\tCanada and the EU have federal rules and laws that govern the other provinces / countries regarding trade, movement of goods and people within the federation.\\n-\\tElected representatives are sent from each province / country to the respective parliaments. \\n\\nSignificant differences :\\n-\\tUK is a sovereign country\\n-\\tUK has its own bank and currency\\n-\\tUK has its own police forces and armed forces\\n-\\tUK has its own representation internationally (UN, NATO, ambassadors, consulates, etc.)\\n\\nThe underlying argument for separation is for decision making and control to be devolved to the local population and government.  The arguments for leaving :\\n-\\tToo much control ceded outside the country / province (UK to Brussels / Alberta to Ottawa), examples : taxation, immigration, international policy setting\\n-\\tMore economic opportunities outside of the federation\\n-\\tPossibility to create UK / Alberta specific organizations \\n\\nThe counter argument for remaining in the federation is one for collective support and security.  Arguments for remaining : \\n-\\tUncertainty : economic, national defense and security, social networks (health system)\\n\\nQuestions that both sides need to answer :\\n-\\tIn order defend international rights and responsibilities, there would need to be recognition by international community UN, NATO, etc. \\n-\\tIn order to access these organizations, additional resources would be required to support this administration (ex UN, NATO, ambassadors, consulates, etc.), how would Alberta be represented in these organizations ?\\n-\\tWhat currency to use (CDN, US or new Albertan) ?\\no\\tTo set up an Albertan currency and central bank, Alberta would need to hold foreign currency (US dollars, Euros, Yen, etc.) in sufficient amounts to create its own Foreign Exchange Reserve (similar to Canada’s current situation)\\no\\tIf not Alberta’s own currency then it will be controlled by another country (ex US, Canada, EU)\\n-\\tNew passport required (how / who will accept it ? – visas required for travel ?)\\n-\\tTrade deals to be negotiated with other countries (approximately $250 billon of Alberta export trade would be international and require new or re-negocation). \\n-\\tDefense and security.  Assuming that the local police forces remain under Alberta authority (ex Calgary, Edmonton city police, etc.).  Assuming that th Canadian military and RCMP remain under Canadian authority.  What does Alberta do for defense and security ?  Create a new Alberta Army ? Negociate a deal with Canada or the US for military support ?  Note : the military defend the country, they also have a role in security of the country, that is to say they help support in times of national emergencies (floods, fires, other disasters).\\n-\\tWill the border be a “hard” border with checks like the current Canada – US border, or a “soft” border such as in the EU with free movement of people and goods ?  The soft border already exists between Canadian provinces and territories.\\n-\\tThere is already a “hard” international border between Alberta and the US that is controlled (ex. Passport checks, inspection of goods, etc.), would this extend to the borders with BC, Saskatchewan and the NWT.  Both Alberta and Canada would have to invest in border services. \\n\\nObservations 10 years after the Brexit referendum and the UK leaving the EU :\\n-\\tThe UK did not have to create and setup new bodies to deal with international obligations (ex UN, NATO) these already existed.  The UK did have to renegociate agreements and arrangements that were previously covered by the EU.  Some of these are still ongoing.\\n-\\tThe UK government chose to have a “hard” Brexit where access to the EU single market and customs union were given up in order to create its own trade deals and regain control over its borders, immigration and laws.  \\n-\\tDuring the Brexit debate, the UK’s economy was predicted to shrink by about 4% if it left the EU.  The UK’s economy has actually shrunk by about 6%.  Labour and productivity are currently about 3% behind other G20 countries.\\n-\\tThe UK has had 6 prime ministers since the Brexit referendum, this probably underlines the political difficulties to implement a Brexit that meets all the promises made during the referendum debate.\\n-\\tThe Brexit referendum result in 2016 was leave 52% to remain 48%.  Recent polling in July 2026 indicated that 55% of Britons would vote to rejoin the EU, while 35% were opposed, the remaining 10% were undecided.\",\"replies\":[]},{\"id\":1131,\"aid\":74,\"author\":\"canadian\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"For those wanting separation, do they realize it would include assuming a proportionate share of Canada's national debt ?\\nFor those wanting to be the 51st state, do they realize it would result in assuming a proportionate share of the US national debt ?\",\"replies\":[]},{\"id\":1015,\"aid\":15,\"author\":\"Ian Canad\",\"meta\":\"Sep 14\",\"stance\":\"\",\"text\":\"Separatists will need a new name for themselves because Alberta is the name of a Canadian province in honour of a Princess. There's many details that will become exceedingly expensive beyond legal fees, lawsuits, establishing a new currency isn't free. Albertans have more freedom as part of Canada.\",\"replies\":[]},{\"id\":1156,\"aid\":89,\"author\":\"George Plachcinski\",\"meta\":\"Sep 9\",\"stance\":\"\",\"text\":\"Separating from a strong(er), united Canada is not even short-sited, but unrealistic. 'Some' natural resources, but unable to refine them within our borders, export them raw (low price); no long-term interprovincial trade agreements; no ocean border (worldwide trade?);\\nThat's just a few economic aspects. \\nMedicare? Pensions? Retirement \\\"packages\\\"?\\nLet's look beyond the tip of our own noses! Yes! We have been frustrated with \\\"federalies\\\" over the years. However, not the way Ms. Smith and her \\\"supporters\\\". You cannot please the right hand and the left hand. Two tier medical system will uproot the long fought for and accomplished results.\\nWork with the federals; demand, pressure and cooperate.\\nJust \\\"putting your foot down\\\" (as the referendum) will get us nowhere!\\nWork with provinces on long-term inner provincial trades; as a united Canada of strongly inner connected provinces, work vigorously on world markets.\\nA post war (seemingly) very acceptable, long-term agreements with  one  economy (much stronger than ours) can lead to a showing up of... One self-centered, shovinistic, pig-headed male trumpet...and the flood gates open.\\nGeorge Plachcinski\\nEdmonton born, redneck Alberta boy with a strong Canadian heart\",\"replies\":[]},{\"id\":1003,\"aid\":3,\"author\":\"ferg64\",\"meta\":\"Sep 20\",\"stance\":\"\",\"text\":\"Have they considered the financial costs of the federally owned airports and military bases which could be dismantled or the cost of needing a passport to leave Alberta? Even bigger is the personal costs of the rifts created within  family and friends. Just look south and see.\",\"replies\":[]},{\"id\":1005,\"aid\":5,\"author\":\"robert litmis\",\"meta\":\"Sep 18\",\"stance\":\"\",\"text\":\"the only customer for oil would be the US who would set the oil pricing without any valid competition.  \\n\\nThe rest of canada could tax any oil  that it did chose to let pass through it's province or ports, if they allowed any at all. \\n\\n  Alberta is landlocked and has no port to ship oil from.    \\n\\n All alberta residents do depend upon oil company profits to support their economy.\",\"replies\":[]},{\"id\":1010,\"aid\":10,\"author\":\"Lynda Parks\",\"meta\":\"Sep 16\",\"stance\":\"\",\"text\":\"What the financial reports on Separation don't take into account is people. A good % of people are risk adverse - especially retired people. They, like my own Albertan Daughter (still working) will move. There will be a vacuum of people and capital that will not take risk. This in turn makes the financial picture on the short term much worse then current estimates based on no population, capital leaving, tax base leaving.\",\"replies\":[]},{\"id\":1037,\"aid\":27,\"author\":\"Morton Cohen\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"If you look through rose colored glasses. Everything is beautiful. But it is not beautiful. The demand for oil only has one way to go. Demand going down.   Look at China. Moving away from oil. Every country wants to be China.  What about the oil from Venezuela. US has an interest in those oil fields. Can you see US saying \\\"we do not need oil from Canada\\\". Give eastern Canada a choice. Windmills or pipelines. Do not sell your future,  your children's future for pennies today. The C in Canada means caring. That is us.\",\"replies\":[]},{\"id\":1083,\"aid\":49,\"author\":\"JR Kookie\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"If Alberta (and other prairies) leave, and don't join the US, regardless of whether they join each other, then they'd become landlocked by Canada and the US (if BC remains in Canada).\\n\\nUnless they figure out a nifty way to trade with both countries, and act as a shortcut for Canada, landlocking is not wise for a time with potential conflict.\",\"replies\":[]},{\"id\":1187,\"aid\":67,\"author\":\"Patrick Richard\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"If you look at similar efforts, the outcome is never as rosy as the leave side predicts it to be.\\n\\nIt doesn't mean you shouldn't go for it, but you should prepare for a rougher ride than predicted.\\n\\nAlso you can expect pushback similar to the current US-Canada tensions, with potentially multi-generational duration, if it ever becomes cordial again.\",\"replies\":[]},{\"id\":1151,\"aid\":73,\"author\":\"David Schultz\",\"meta\":\"Sep 12 · reply to fr2309\",\"stance\":\"\",\"text\":\"We are landlocked now\",\"replies\":[]}]},{\"id\":\"legal\",\"label\":\"Separation isn't legally simple\",\"count\":19,\"color\":\"rgb(90,30,245)\",\"px\":271,\"py\":124,\"d\":130,\"allLabel\":\"12 responses · 7 replies\",\"posts\":[{\"id\":1163,\"aid\":94,\"author\":\"stephanyt\",\"meta\":\"Sep 9\",\"stance\":\"\",\"text\":\"So, Albertans are going to vote whether or not to have a vote on separating from Canada? Hey, I am Canadian but not Albertan and I want a vote, too. It is my Canada as well and if you want to leave (feel free!) AND take part of my Canada with you (don't!) I want at least some form of say/vote that goes beyond this discussion here.\",\"replies\":[]},{\"id\":1164,\"aid\":2,\"author\":\"Philip Lucas\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"The 'Yes' group should they win and force or try and force D.Smith to hold a binding referendum would have opened a huge legal precedence by the simple 'Yes' vote win. \\nThey would have given the right of 1st nation treaty members to also vote to separate from Alberta in favour of Canada or complete autonomy. They would have the right just as the separatists say they have the right and the outcome would be a very small residual Alberta excluding much of the boasted resources that are under treaty lands. \\nThey also need to reflect on the history of past separations and attempted ones to see if history proves their truth of a 'better life' to be actually true. \\nThe argument that the 'Yes' vote is more of a strike vote to allow pressure for even more provincial autonomy is rather a red herring. \\nFinally a 'Yes' vote would harm the unity and one for all type of feeling Canadians have toward those who want to chuck it in. \\nDo you remember how you felt several years ago when the Alberta government threatened BC with cutting off the oil and gas? The simple threat I found revolting and reminds me of what Trump is doing now.\",\"replies\":[]},{\"id\":1124,\"aid\":64,\"author\":\"amandaf\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I'd like them to remember the territories just above them when they vote, and how they're deciding our future too, very much without our consent. If they actually cared about the whole concept of sovereignty, this would give them pause.\\n\\nAlberta is the NWT's main connection to the rest of Canada via the Mackenzie Highway. Edmonton literally calls itself \\\"The Gateway to the North\\\". Placing an international border across that highway would choke off our main supply route for the most basic necessities, like food and fuel. Our only \\\"choice\\\" would be to join them or die. Like, actually physically die. Starve or freeze to death. But they tell us this is Alberta's decision alone and nobody else gets a say.\\n\\nMaybe the rest of Canada should hold a referendum on whether Alberta should be reabsorbed into the NWT. Our system of consensus government would be healthy for them.\",\"replies\":[]},{\"id\":1166,\"aid\":95,\"author\":\"Jeremy Levi\",\"meta\":\"Sep 12 · reply to Philip Lucas\",\"stance\":\"\",\"text\":\"First Nations are the elephant in the room that the separatists don't want to talk about. Without the support of First Nations seperation is a no go. It was a big issue during Quebec's previous seperation attempts and it remains a big issue today, one that's unlikely to be resolved in the separatists' favour.\",\"replies\":[]},{\"id\":1102,\"aid\":43,\"author\":\"Steven Tyler\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I would like the separatists to answer - honestly - what they think the solution is to areas inside Alberta's borders which are not provincial jurisdiction.  Specifically, national parks and First Nations.\\nEverything I've read in the separatists' material avoids this question directly - instead using mushy phrases that talk about some type of \\\"negotiation\\\". \\nBe honest, separatists.  Canada certainly isn't going to let you have the national parks, and First Nations aren't going to accept anything less than they currently get from the federal government.  So in reality, your independent Alberta will be a jigsaw puzzle of little geographic regions - bisected and cut apart by national parks and First Nations.\\nFor those of you who have property anywhere inside Banff, Jasper, or other national parks - I guess you'll have to sell that now?  Or pay a foreigner tax to Canada, now that you aren't part of it?\",\"replies\":[]},{\"id\":1127,\"aid\":72,\"author\":\"Kevin Macaroni\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Voters should be aware that the current borders of Alberta and any resources located within those borders would all be part of the negotiations.  The separatists entire strategy works around the current borders so it is really just a fantasy.  Why would Edmonton join the separatists if a huge majority of Edmontonians vote against separation?  Why would Canada hand over the tar sands when there is only a small population of people living there? \\nThere is nothing that even forces Canada to negotiate with separatists. All just separatists fantasy and a huge waste of time and tax money\",\"replies\":[]},{\"id\":1062,\"aid\":43,\"author\":\"Steven Tyler\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"A couple of pro-separation people have posted numerous times (and replied to other comments even more).  Yet none of them have addressed the question I called out yesterday:\\nWhat is your plan regarding national parks and First Nations.  Be specific.  Do not use the mushy language that the separatist leader keeps using.  Tell us exactly how you envision this \\\"negotiation\\\" working out in a way that doesn't carve up Alberta into a jigsaw puzzle of regions outside the national parks and First Nations.\\nBecause let's be clear - those areas are not Alberta.\",\"replies\":[]},{\"id\":1162,\"aid\":93,\"author\":\"jdvanisl\",\"meta\":\"Sep 9\",\"stance\":\"\",\"text\":\"First, Alberta can't separate without agreement of First Nations as almost all the province is covered by Treatis with the federal government. Second, how do they think they're going to get their natural resources to market without going through Canada? Unless they immediately capitulate to the USA, which would hardly be independence.\",\"replies\":[]},{\"id\":1018,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to Jacques Bruyere\",\"stance\":\"\",\"text\":\"Bill. Danielle Smith’s slogan doesn't alter constitutional reality. 'Sovereignty within a united Canada' is a contradiction in terms used to appeal to voters. Under Canadian law, a province is either bound by the Constitution or it isn't—there is no legally recognised middle ground.\",\"replies\":[]},{\"id\":1075,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to Harry Donnelly\",\"stance\":\"\",\"text\":\"Bill. That’s a false equivalence. The 'Canada' side relies on constitutional law, which requires Canada to negotiate if a province votes to leave. Following the law isn't 'rejecting an outcome',  it's saying that big national decisions follow the rules of the law Canadians live by.\",\"replies\":[]},{\"id\":1078,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to Bill Watson\",\"stance\":\"\",\"text\":\"Comparing trade disputes to provincial powers ignores basic constitutional law. Also federal issues is a reason to negotiate stronger terms not an excuse for self sabotage. Demanding an unconstitutional split forfeits negotiation and creates total legal chaos.\\n\\nBtw, Alberta already holds full authority over health care.\",\"replies\":[]},{\"id\":1038,\"aid\":28,\"author\":\"pnd\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Then they have to get every other province to agree.\",\"replies\":[]},{\"id\":1089,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"This separation vote is completely pointless because Alberta can legally never leave anyway. The Supreme Court of Canada already ruled that no province can unilaterally secede. To actually separate, you need to amend the Constitution, which requires formal approval from Ottawa and the other provinces. All laws flow from the Crown. It is a legal dead end. \\nOn top of that, Indigenous treaties are with the Crown. If they legally refuse to leave a breakaway Alberta would look like Swiss cheese on a map.\",\"replies\":[]},{\"id\":1106,\"aid\":62,\"author\":\"fluke\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"\\\"This land is my land,this land is your land ...\\\". \\n1. The Canadian (federal) government directly owns about 8-10% Alberta's surface land (including national parks, military bases, and federal crown land), plus roughly 9.2% to 19% of sub-surface mineral rights (depending on classification, national parks, and First Nations holdings), and all the WATER that runs through them!  Private owners and corporations hold approximately 25% of natural resources (above and below). Total 35% (approx) of land,water, air,trees, minerals, and other resources. \\n2. Private owners will follow the money AND the Canadian federal and international subsidies. \\n3. Albertans will pay taxes,duty,inspections,laws,regulations, licenses,etc on import and export fees from 9 provinces and 3 territories of Canada. \\n4. Albertans will pay tolls on all Canadian owned highways running through the The Gulf-Lake of Alberta. \\n5. Albertans will lose Canadian rights, protection abroad, evacuation/rescue while in foreign countries including Canada. \\n6. Of 538,824 inter provincial residents (Stats Can,Fraser Institute) - domestic migrants of Canadians, how many will move \\\"home\\\" to Canada?  \\n7. Canada has no draft, no capital punishment.\\n8. Alberta (65%) can become a US northern state. Canadians will be delighted to invite California to take their place.  \\n9. Tech is the new oil. California can help Make Canada Greater,again.    \\n10. TBC...\",\"replies\":[]},{\"id\":1137,\"aid\":78,\"author\":\"joej\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"There doesn't seem to be a clear understanding of the process to seperation, it's not a simple divorce, the clarity act which Alberta and Quebec have signed lays out the process. What's disappointing is as a person from Ontario, everyone is frustrated with Ottawa. \\nPeople need to realize that, the grass won't be greener on the other side. All Provinces need to be working as a collective, to ensure the interests of every Province are taken into account especially on issues like energy, the environment, immigration.   Alberta is wanted, and valued even if it may SEEM Ottawa doesn't.\",\"replies\":[]},{\"id\":1174,\"aid\":101,\"author\":\"Canada Proud\",\"meta\":\"Sep 5\",\"stance\":\"\",\"text\":\"Hello everyone. I’ve found the comments so far interesting, and I think one thing worth considering is the full scope of what major constitutional changes—such as leaving Canada—could involve. Conversations about separation often arise when people are frustrated with decisions made by governments at any level, but the practical implications of becoming an independent country are complex and far‑reaching.\\n\\nBecoming a separate nation would require negotiating new arrangements for citizenship, passports, federal programs (such as pensions, healthcare, schools, tutition, education, and employment insurance), and financial transfers. None of these systems automatically carry over; they would depend on negotiations with the federal government, and the outcomes are not guaranteed. It would also mean creating that countries new structures for currency, banking, national defence, and international agreements. Even organizers who support separation have acknowledged that many details would depend on future decisions with the federal government that no one can predict today, which means the results could differ dramatically from expectations.\\n\\nMy hope is simply that voters take time to think through what such a transition would realistically involve—both the opportunities and the challenges. Major structural changes deserve careful consideration, calm discussion, and a clear understanding of what is known and what remains uncertain.\",\"replies\":[]},{\"id\":1063,\"aid\":2,\"author\":\"Philip Lucas\",\"meta\":\"Sep 13 · reply to Steven Tyler\",\"stance\":\"\",\"text\":\"It would be a waste of time to seriously consider these points before any October vote, it's outcome and the actions of the UCP government. \\nThat being said the 1st nations have legal ownership of their lands and through any court could claim separation of these lands from an independent Alberta or a legal and binding constitutional inclusion by Alberta respecting these rights for ever. This would likely be a very long legal and diplomatic struggle. As for National Parks, they can transition to Albertan authority with legislative provision as to conditions of use, conservation and development. Again this would be a long legal and diplomatic struggle between the federal powers, Canadian and the new Alberta.\",\"replies\":[]},{\"id\":1064,\"aid\":19,\"author\":\"Bill Watson\",\"meta\":\"Sep 13 · reply to Steven Tyler\",\"stance\":\"\",\"text\":\"Everything within the boundaries of Alberta are part of Alberta whether or not Alberta remains part of Canada. But we will return the Parks Canada trucks and uniforms.\",\"replies\":[]},{\"id\":1072,\"aid\":18,\"author\":\"rayparlour15\",\"meta\":\"Sep 14 · reply to mike5600\",\"stance\":\"\",\"text\":\"I feel expecting to win isn't the issue—it's selling voters a legal shortcut that reality can't deliver on. Option 2 promises an outcome that a vote cannot actually do under constitutional law or international rules.\",\"replies\":[]}]},{\"id\":\"protest\",\"label\":\"Brexit's warning: protest votes and no-shows\",\"count\":14,\"color\":\"rgb(125,100,83)\",\"px\":246,\"py\":405,\"d\":112,\"allLabel\":\"10 responses · 4 replies\",\"posts\":[{\"id\":1168,\"aid\":96,\"author\":\"steves\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"Brexit created a number of lies that were used to justify the damage done to the British economy in the name of taking back control.  The result is that Britain is still suffering from the failures and is now looking to find a way to re-unite without re-uniting.  Those same lies are being used in Alberta.  Promises of prosperity, sudden access to markets, and continued relations with the rest of the world, influx of funds for services and healthcare, an end to immigration.  Brexit shrieks that won't happen.  Alberta has one resource and that is overshadowed by the growth in renewables.\",\"replies\":[]},{\"id\":1036,\"aid\":26,\"author\":\"scott\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"As the folks in the UK found out to many of their disappointments during Brexit, a 'protest vote' intended to 'send a message' can have wildly different outcomes to what you intended. That's what conversations with your MP and relevant Ministers are for. If you want a voice in government, elect MPs from the party in power.\",\"replies\":[]},{\"id\":1135,\"aid\":77,\"author\":\"Sue Kennedy\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I would like them to reflect on the outcome of Brexit in the UK.\",\"replies\":[]},{\"id\":1121,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12 · reply to Rae Swearengen\",\"stance\":\"\",\"text\":\"Good warning, thank you. We who wish to remain are encouraging Albertans to get out and vote. It isn't going to be easy this time around with ten paper ballots! Effort is required for sure.\",\"replies\":[]},{\"id\":1035,\"aid\":4,\"author\":\"Jeff Lewis\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"My advice to my fellow Albertans is simple: go look at Brexit in the UK and see how that turned out. \\n\\nIt was fomented by right wingers who wanted to blame the EU for all the problems created by the right-wing Conservatives and in the end, not only reduced opportunities for Brits and damaged their economy, it didn't even effectively fix the alleged problems it promised it would.\\n\\nIt took away rights against the will of almost half of the UK population - possibly more because apparently a lot of people who voted to leave believed they'd retain those rights - much as many Alberta separatists think they'll keep their Canadian citizenships, made the breakup of the UK more likely by trampling on the other nations of the UK and now, ten years later, more than 2/3s of all Brits admit it was a mistake.\\n\\nUnfortunately, as I and many others pointed out at the time, it was a one way choice and even if a growing number of Brits want to rejoin the EU, it's not their choice.\\n\\nAnd much like the EU referendum, I suspect a lot of people will make a \\\"protest\\\" vote not realising that this is for real and irreversible.\\n\\nHaving gone through this with the EU referendum as a dual Canada/UK citizen, it's painful to watch this happen again knowing almost for certain how it will play out.\",\"replies\":[]},{\"id\":1092,\"aid\":31,\"author\":\"Barbara Briden\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"I think it is very risky for people to vote for Option 2 in order to”to send a message “ to the rest of Canada. Should Option 2 be successful, then be prepared to separate from Canada. Also they should be aware that any further investment in Alberta by Canada will have to stop leaving many projects unfinished such as the proposed new pipeline to the west coast. Since no private company was willing to take on a large part of the financing of that pipeline while Alberta is a part of Canada, it is highly unlikely that any would step up after Option 2 is approved.\",\"replies\":[]},{\"id\":1109,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"\\\"Give Ottawa a message\\\" is  bluffing. Separatists need to understand what they're asking for:  How complex and costly separation would actually be?\",\"replies\":[]},{\"id\":1110,\"aid\":28,\"author\":\"pnd\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Will the vast majority who do not want Alberta to try separate take it seriously and vote? People in the UK didn't take Brexit seriously so they didn't vote. Then it became a reality.\",\"replies\":[]},{\"id\":1052,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 15 · reply to proundcanuck\",\"stance\":\"\",\"text\":\"Albertans need to note well in advance that voting won't be easy this year.  \\n Advance polling stations will be announced shortly. Mail-in ballots are currently available with a cutoff date coming soon. \\nLast year, nobody was ready for the long lineups at municipal elections and many Albertans left without voting. Nice test run for what could potentially happen this year.\\nIf you should decide to head out on voting day, bring food, water, a chair, and dress for the weather. Maybe even bring your own porta-potties. Arrange in advance for child-care. \\nBe prepared also with the proper ID. Check Elections Alberta to assure that you're registered. If you've had a name change since last election, be sure to bring the correct documents if your proper ID hasn't been updated. \\nBe sure to get out and vote. Do the work and understand the questions. \\nApathy and believing \\\"It'll never happen\\\" are the enemy.\",\"replies\":[]},{\"id\":1004,\"aid\":4,\"author\":\"Jeff Lewis\",\"meta\":\"Sep 19\",\"stance\":\"\",\"text\":\"A warning about the referendum... we saw the same mistake happen with Brexit in the UK.\\nThe assumption was that the referendum would obviously fail and then it would be over, so a lot of people on the Remain (in the EU) side just didn't bother to show up. Remainers thought \\\"It's rainy and a bother and the we're going to win, of course, so my vote isn't really necessary.\\\" except they were wrong.\\nAnd the Remainers lost, mainly to a group who thought they could make a protest vote because Remain was going to win anyway.\\nDo NOT assume the pro-Canada side will win just because the polls say they will. Polls are not votes. Get out and vote.\",\"replies\":[]},{\"id\":1071,\"aid\":45,\"author\":\"mike5600\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"I am sure many will vote for Option 2 in order to send a message to Ottawa. That is a venting which is understandable. What is not understandable is the apparent expectation by Option 2 supporters (according to polls) that they will win and more importantly, will conclude that the process was somehow rigged. That is more conspiracy related.\",\"replies\":[]},{\"id\":1120,\"aid\":70,\"author\":\"Rae Swearengen\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I don't believe they will win. But I also don't believe that the numbers are as far apart as many claim. I remember when Trump was running the first time, many polls showed him not winning. Not even close. And then I spoke with someone who lived in Trump country and he said \\\"oh he's going to win! You haven't been to one of his rallies\\\". And he was right. He did win. Polls are a snapshot in time and people respond based on their feelings of that exact moment as they're being taken. No one should ever take them as a be all end all of an outcome. Alberta, we want you to stay. Alberta, have faith in Carney. He's not your average Liberal. He's your average Progressive Conservative. In fact, maybe even better. And this is largely in thanks to Donald Trump, who has pushed us to go after our potential. Something I believe Alberta separatists have been wanting for a long time.\",\"replies\":[]},{\"id\":1059,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 15 · reply to Ryan Rob\",\"stance\":\"\",\"text\":\"...much like all the people who couldn't be bothered to vote against Brexit, people were apathetic and said \\\"It'll never happen\\\"?\",\"replies\":[]},{\"id\":1111,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12 · reply to pnd\",\"stance\":\"\",\"text\":\"Voting is difficult this time around. As we saw in last October's municipal election, Danielle Smith's switch to paper ballots caused long lineups and many left without voting.\\nIt was a cold, windy day where I live, and nobody was prepared. \\nPeople are being warned to vote in advance, either by mail or at the advance voting stations (which, when I last checked have not been announced). Elections Alberta has never had so many requests for mail-in ballots. According to Global News, the number is somewhere around 225k.\\nPeople may need to bring their lawn chairs, food, water, and dress for the weather should they decide to attend on voting day.\",\"replies\":[]}]},{\"id\":\"together\",\"label\":\"Canada is stronger together\",\"count\":13,\"color\":\"rgb(0,175,135)\",\"px\":157,\"py\":75,\"d\":108,\"allLabel\":\"11 responses · 2 replies\",\"posts\":[{\"id\":1161,\"aid\":92,\"author\":\"Pamela Johnson\",\"meta\":\"Sep 9\",\"stance\":\"\",\"text\":\"Being a \\\"proud Albertan\\\" and upset with Ottawa can co-exist and feeling both things does not necessitate leaving Canada. It's this message I am trying to figure out how to articulate with my friends.  Personally, I am not \\\"upset with Ottawa\\\" (I wish hyperpolitics wasn't pulling us away from the question of our environment and climate change) but I know people who are and I don't want to alienate them further by essentially telling them they are stupid for wanting to leave. I do think they are uninformed, heavily wedded to an ideology and see their lives as somehow out of their control and think a conservative government will deliver sweeping changes to them.  Leaving Canada is shortsighted in many ways but not least of which the fact that the UCP will not be the governing party forever.  I think \\\"oil and gas\\\" factors heavy into this equation and I wish my friends who think leaving Canada gives them more power considered a) there is such a thing as peak oil even when we just consider diversifying our energy and people wanting to get off fossil fuels b) is it really \\\"Alberta oil\\\"? How much of the oil industry is actually owned and influenced by American companies and interests? c) American interest in oil is strong and without any other real economic driver oil would be our only thing (I mean we make darn good draft beer!) Consider the fickleness of the current American regime, is that what we want to \\\"negotiate\\\" with?  \\n\\nSo what would I like all Albertans to know? Well, that each person comes at their thinking that staying in Canada is either bad or good for reasons personal to them. In many ways HOW they come to their reason is what's interesting and if we skate right by that and just tell the person who thinks differently from you/me that they are \\\"stupid\\\", it does nothing (except maybe push them further in their own direction)\",\"replies\":[]},{\"id\":1188,\"aid\":56,\"author\":\"Charlie Miller\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"I have read and studied military history and war for a very long time. I am now retired but spent many years in the Canadian Forces. One thing  I have not heard anyone one commenting on is, in every separation I have read about, people have died? Are we prepared to have that happen in Canada? If we remember in Quebec in 1970 with the FLQ, a British diplomat was killed and many people arrested. Something to think about?\",\"replies\":[]},{\"id\":1167,\"aid\":27,\"author\":\"Morton Cohen\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"If it should happen that oil is no longer the energy choice. Alberta may have problems. Canada will always have your back. That is what Canadians do. Don't sell out tomorrow for promises today\",\"replies\":[]},{\"id\":1013,\"aid\":13,\"author\":\"Andrew Ross\",\"meta\":\"Sep 15\",\"stance\":\"\",\"text\":\"A reminder that what makes Canada better than the United States, is that we are not a melting pot. We are a strong cultural mosaic, that encourages new ideas, and new people to come and be a part of what makes us all Canadian. \\nWe are the true North, strong and free. We have always been progressive (women's suffrage, the underground railroad, Gay rights) now is our chance to prove our spirit once again on the world stage.\",\"replies\":[]},{\"id\":1129,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12 · reply to David Schultz\",\"stance\":\"\",\"text\":\"I live in Alberta and I already feel free. As a Canadian who's lived in various locations around the country, I've never felt enslaved.\",\"replies\":[]},{\"id\":1085,\"aid\":49,\"author\":\"JR Kookie\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Then we should all separate and agree to a moratorium on forming new \\\"amalgamations\\\" of multiple provinces and territories. Every province for itself, then... Heck some of them, like Ontario, should feel like every sub-region can go off on its own.\\n\\nIf any separatist willingly gets gobbled up by the United States (which is more or less how they continued to form after their War of Independence -- \\\"America\\\" once referred to the whole continental landmass, and still does), then I'll just laugh and say:\\n\\n\\\"I told you so: you had no idea what you really wanted, except that you allowed your disdain towards federal politics, and towards a so-called adversarial party's predominance in governance, to become your modus operandi. You allowed emotions that I won't describe here to become a desire for favouritism and overcome the larger, greater identity of being Canadian. And then lost it to whomever else (like the Americans in this hypothetical posturing of mine).\\\" \\n\\nBitterness and false sense of being targeted does not make for a good self-nationalizing or self-actualizing operational philosophy. Feelings of starting something of your own should be nobler than that.\\n\\nAnd for the last time, we are a federalized nation first, and a bunch of provinces second. A whole greater than the sum of its parts, divided up only for administrative purposes at the end of the day (especially since we're so large). \\n\\nAnd since our provinces are also absurdly large (the average provincial land mass is as big as any average country elsewhere), what's the difference really? Where does the buck stop? Do y'all seriously not think that there are regions within your provinces in which the inhabitants sometimes don't want to be associated with their fellow provincials elsewhere? Look at the Golden Horseshoe in Ontario versus the other collective regions. Even the Horseshoe itself is significantly different from west to east end.\\n\\nMight as well go back to city states and tribes and forget about larger alliances. The nations today are remnants of empires, republics and commonwealths in which the bigger globs of groups gobbled up the smaller ones, however which way, for whatever reasons beyond survival. People banded together in bigger groups to keep increasing their survivability and ironically try and reduce the occurrences of conflict. \\n\\nAnyway, I digress. Think this through with not only the long view of the future, but that of the present and past too. No more political memory subjected to only the most recent ten or twenty years (and people can't even do that, thinking today's problems only originated today and not in previous administrations or generations. Problems are built up over LONG periods of time from everybody).\",\"replies\":[]},{\"id\":1008,\"aid\":8,\"author\":\"Joe Laframboise\",\"meta\":\"Sep 18\",\"stance\":\"\",\"text\":\"Please remember the following quote from Sir John A. -\\\"Whatever you do adhere to the union - we are a great country and shall become one of the greatest in the universe if we preserve it; we shall sink into insignificance and adversity if we suffer it to be broken.  God and nature have made the two Canadas one - let no factious men be allowed to put them asunder.\\\"\",\"replies\":[]},{\"id\":1087,\"aid\":50,\"author\":\"Ron Aaron\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"All Albertans should consider that unity is strength.     Divisiveness is weakness and inefficient.     Yes, we know there are elements that want change.      And change can, and is happening in ways that are very good for Alberta and Albertans, in a united Canada.      And those things would not be available to an Alberta - or whatever it would become - that is not part of Canada.        Vote well.\",\"replies\":[]},{\"id\":1090,\"aid\":52,\"author\":\"Robert MacMillan\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Albertans should consider how Canadians in other provinces will react if they vote for Option 2. Will they be considered unreliable partners - a weak link? With bomber Canada flying through hostile skies will other Canadians begin to question should Albertans be part of the crew?\",\"replies\":[]},{\"id\":1113,\"aid\":66,\"author\":\"Luc Perrier\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Dear Albertans,\\n\\nPlease stay in Canada. We Québécois need Alberta more than we sometimes care to admit.\\nQuébec has built a generous social system, and it is easier to maintain when the rest of Canada is doing well.\\nAlberta’s workers, businesses and energy sector play a significant role in that prosperity.\\nYet some Québécois are quite comfortable criticizing Alberta’s environmental record while benefiting from its economic contribution.\\nIt is an interesting arrangement: we keep the moral high ground, while you help with the bill.\\nI understand why many Albertans are frustrated with Ottawa, but separation would hurt the rest of us as well.\\nWe may disagree on energy, taxes and the environment, but we remain financially and economically connected.\\nAs a Québécois, I would rather be honest about that connection than pretend otherwise.\\nSo, Alberta, please stay. Canada needs you—and Québec certainly has no interest in discovering the true cost of doing without you.\",\"replies\":[]},{\"id\":1122,\"aid\":66,\"author\":\"Luc Perrier\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"Dear Albertans,\\n\\nPlease stay in Canada. We Québécois need Alberta more than we sometimes care to admit.\\nQuébec has built a generous social system, and it is easier to maintain when the rest of Canada is doing well.\\nAlberta’s workers, businesses and energy sector play a significant role in that prosperity.\\nYet some Québécois are quite comfortable criticizing Alberta’s environmental record while benefiting from its economic contribution.\\nIt is an interesting arrangement: we keep the moral high ground, while you help with the bill.\\nI understand why many Albertans are frustrated with Ottawa, but separation would hurt the rest of us as well.\\nWe may disagree on energy, taxes and the environment, but we remain financially and economically connected.\\nAs a Québécois, I would rather be honest about that connection than pretend otherwise.\\nSo, Alberta, please stay. Canada needs you—and Québec certainly has no interest in discovering the true cost of doing without you.\",\"replies\":[]},{\"id\":1140,\"aid\":80,\"author\":\"Raymond Gignac\",\"meta\":\"Sep 11\",\"stance\":\"\",\"text\":\"I understand that some Albertains want to separate!I was born in Northern Ontario and there too we have problems with the Provincial Government and the Federal Government!Northern Ontario contains 95%of the area of Ontario but only has 5% of Ontario's population so we are forgotten about until election time it seems!But we hang in there and progress is slow but we up North do not want to seperate!Look what separation did to Britain and the EEC(now the EU!)Right now am living in Edmonton again!I want things to be better wherever i live and I LOVE CANADA!Separation may not be good for me or Alberta or Quebec in the long run.Thks!Raymond\",\"replies\":[]},{\"id\":1189,\"aid\":109,\"author\":\"user2026\",\"meta\":\"Sep 18 · reply to Charlie Miller\",\"stance\":\"\",\"text\":\"It has definitely crossed my mind that it could become rather difficult in the near future depending on the outcome of the Separation Question.\",\"replies\":[]}]},{\"id\":\"uswallow\",\"label\":\"This ends with Alberta absorbed by the U.S.\",\"count\":12,\"color\":\"rgb(82,93,207)\",\"px\":421,\"py\":284,\"d\":103,\"allLabel\":\"7 responses · 5 replies\",\"posts\":[{\"id\":1191,\"aid\":111,\"author\":\"princeofhartes\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"The people of Alberta have to understand that a weaker Canada does not mean a stronger Alberta. If anything, separation makes Alberta a target for US imperialism and we see how well that is treating the people of Venezuela. Alberta won’t be a state, it will be a territory like Puerto Rico and none of the money from its resources will go back to Alberta.\\n\\nCanada is trying really hard to make jobs for Albertans and to. help you all feel included. We want to build railways and pipelines with you. Our doctors want to help you get the healthcare you need by removing inter provincial licensing barriers.\\n\\nLook up the reasons why Newfoundland joined Canada and look at what Newfoundland’s Dominion was like before confederation — exclusively private healthcare with US and UK doctors, poor access to vaccines, and a lack of government support behind major resource projects. The lives of rural Newfoundlanders was miserable and only merchants and private businesses flourished in Corner Brook and St. John’s. There is strength in unity and all of our provinces joined Canada because we saw unity as strength.\",\"replies\":[]},{\"id\":1170,\"aid\":98,\"author\":\"Mike Dixon\",\"meta\":\"Sep 8\",\"stance\":\"\",\"text\":\"A separated Alberta will be constantly attacked for annexation by America, and will lack the size and tools to do anything about it.\",\"replies\":[]},{\"id\":1196,\"aid\":104,\"author\":\"user99\",\"meta\":\"Sep 4 · reply to princeofhartes\",\"stance\":\"\",\"text\":\"The massive political, legal, and international hurdles involved in having Alberta join the U.S. would make this impossible. Alberta would have to negotiate its share of the dept, which is $75 - $100 billion. An amendment to Canada's constitution would be required but impossible without unanimous consent of Canadian parliament. Canadian courts have repeatedly ruled that Alberta cannot unilaterally alter Treaties 6, 7, and 8, all signed directly between Indigenous First Nations and the British Crown before Alberta even existed as a province.\\n\\nAdmitting Alberta as a U.S. territory or state would drastically alter American domestic politics. Alberta has a deeply conservative political culture. Adding Alberta as a state would mean adding two new, predictably Republican U.S. Senators and several members of Congress. U.S. Democrats would fiercely oppose admitting a massive, conservative, oil-rich territory that permanently tilts the balance of power in Washington. Read Dalhousie University's piece: https://www.dal.ca/news/2025/01/09/united-states-canada-state-51st.html\\n\\nAlberta would have to quickly build up customs, immigration, and international transit regulatory frameworks and transition away from the Canadian dollar.  Using U.S. dollars and complying with federal regulations would lead to economic discord and upheaval. Read: 'Alberta separation would harm both Canada and the United States': https://www.csis.org/analysis/alberta-separatism-would-harm-both-canada-and-united-states\",\"replies\":[]},{\"id\":1154,\"aid\":61,\"author\":\"joalberta\",\"meta\":\"Sep 10\",\"stance\":\"\",\"text\":\"Confederation of Canada was in order to hedge the American Imperial threat. \\n\\nTo think that the American Empire (with their imperial motto of \\\"manifest destiny\\\") wouldn't attempt to at least annex an independent Alberta or at least diminish its power significantly through heavy tariffs from king Trump. \\n\\nDo we think that Alberta's voice will be heard in the Washington with the chorus of 50 other states (assuming Alberta would gets statehood)? Because that is what American worshipping separatists ultimately want, we are kidding ourselves to think this is not their ultimately goal, which honestly amounts to treason (probably why RCMP has been asked to investigate Danielle Smith for that charge). \\n\\nDo we really believe that is a better deal than Ottawa and being a part of Canada?\\n\\nThis is a plan by the Americans to weaken Canada by knocking Alberta down peg (we make a lot of money). Separatist movements are really bad for the economy, even if the separation fails a lot of economic damage and uncertainty will be done, playing into the imperialist American's hands.\\n\\nHow about instead of separating we nationalize our oil (which is primarily owned by Americans)?\",\"replies\":[]},{\"id\":1143,\"aid\":82,\"author\":\"ron2109\",\"meta\":\"Sep 11\",\"stance\":\"\",\"text\":\"If Alberta were to somehow distance themselves from Canada the U.S. would swallow it up faster than you could imagine. Consider paying all of your healthcare costs if you can find medical professionals that can help you. The population would be too small to have separate insurance plans or rates. Watch elected judges overlook basic principles of law so they can do whatever the current government wants them to do. The quality of education would plummet and governments would try to transition the population to all whites. The last point seems obvious based on the other questions being voted on Oct. 19. It is a very shortsighted strategy and I expect that the recent major projects announced for Alberta would be dropped because the rest of Canada won’t be interested in paying anything to help a province that leaves.\",\"replies\":[]},{\"id\":1195,\"aid\":49,\"author\":\"JR Kookie\",\"meta\":\"Sep 13 · reply to princeofhartes\",\"stance\":\"\",\"text\":\"Unfortunately, I think the separatist leadership wants to be consumed by the US. They've certainly been meeting with US officials.\\n\\nAlso, if the US gobbles up provinces one by one, then the separatism from the rest of Canada becomes largely mooted.\",\"replies\":[]},{\"id\":1200,\"aid\":114,\"author\":\"kenneth wagner\",\"meta\":\"Sep 4 · reply to nicole scott\",\"stance\":\"\",\"text\":\"We wouldn't maintain \\\"are\\\" Canadian citizenship, because we'd have become a US territory in no time flat.  That's what Smith and Trump want you to vote for.\",\"replies\":[]},{\"id\":1098,\"aid\":56,\"author\":\"Charlie Miller\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I would like everyone to consider what the USA would do if Alberta chooses to separate? I doubt if we would last a year on our own before the States would come in and take us over. That would be disastrous.\",\"replies\":[]},{\"id\":1141,\"aid\":81,\"author\":\"TD DK\",\"meta\":\"Sep 11\",\"stance\":\"\",\"text\":\"Trump and the USA would put the thumbscrews to a separate Alberta. Alberta would become their next Puerto Rico. Alberta would bear the brunt of trump's anti-Canada rant, in light of the recent failed trade talks. And Trump could even offer to pay LESS for Alberta oil. And what would Premier Smith and the UCP do then? And all Smith is doing is sucking up to trump so that he doesn't. (And if I were him, I would)\",\"replies\":[]},{\"id\":1105,\"aid\":61,\"author\":\"joalberta\",\"meta\":\"Sep 12 · reply to albertansfreedom\",\"stance\":\"\",\"text\":\"What poll is this from? I cant find anything online about this?\\n\\nAlso it does ring true of American politics during the cold war, divide and separate and then take over. I agree with you, American imperialism will only intensify post separation.\",\"replies\":[]},{\"id\":1033,\"aid\":25,\"author\":\"canadaproud\",\"meta\":\"Sep 13\",\"stance\":\"\",\"text\":\"Do you want to be part of the U.S. since Alberta separation will eventually result in that, or do you want to remain in united Canada and work on necessary changes?\",\"replies\":[]},{\"id\":1099,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12 · reply to Charlie Miller\",\"stance\":\"\",\"text\":\"People with dual citizenship would welcome becoming the 51st State, and currently have influence on and are part of the Separatist movement. \\nWhat many Separatists who have only Cdn citizenship don't realize is that with all the wars Trump is starting, the American congress and the president can reactivate conscription. All American men between the ages of 18-25 are being automatically registered for the draft. \\nDo we want this for Albertans should we eventually become the 51st State?\",\"replies\":[]}]},{\"id\":\"distraction\",\"label\":\"The referendum is a costly distraction\",\"count\":19,\"color\":\"rgb(169,88,81)\",\"px\":371,\"py\":394,\"d\":130,\"allLabel\":\"13 responses · 6 replies\",\"posts\":[{\"id\":1177,\"aid\":102,\"author\":\"Anton Pavlenko\",\"meta\":\"Sep 5\",\"stance\":\"\",\"text\":\"How quickly can we get rid of the UCP and charge Danielle Smith with treason?\",\"replies\":[]},{\"id\":1173,\"aid\":100,\"author\":\"Sofi Jizz\",\"meta\":\"Sep 5\",\"stance\":\"\",\"text\":\"I'm concerned that no one is talking about the Social factors.\\nThe factors that currently affect our province:\\nHomelessness, addictions, food insecurity, no living wage, etc etc etc...\\nWe've already taken hits this year affecting peoples with disabilities, seniors, schools, housing, hospitals, our healthcare is being turned into a for profit, etc....\\nThe driver's license scheme because it's a scheme. A money grab that is affecting the poorest and most vulnerable.\\n\\nWhat will social structure look like in the new Alberta.\\nWill the separatists even change that name since Alberta is named after \\\"Princess Louise Caroline Alberta was the 6th child of Queen Victoria and Prince Albert. Lake Louise is also named after her.\\\"\\nIs the 'new Alberta' hoping to do a person swap with Canada: We give you our homeless, addicts, the poor, seniors, you give is healthy people that can work.\\nWhat will our healthcare look like. \\nHow many nurses, doctors, teachers, skill trades people, blue collar, white collar workers will we lose.\\nWho will be left.\\nWill we resemble the Republican states, like Louisiana or Georgia. \\nWill only the poor and uneducated remain so the rich and powerful can retain control and remove every cent out of the population that's left.\\nSomeone compared this to the UK leaving Brexit.\\nHave people read the news of the mess the chaos for the working class this created. Then the continued \\\"blame the immigrant\\\". \\n\\nSeparatists blame the federal government for our poverty, and yet UCP have the freedom to turn our provincial healthcare into a 2 tier system, steal money from the poorest, etc etc etc...\\n\\nThe Conservative movement has been in charge in Alberta for as long as I can remember, and only once did they think about saving our wealth. Then they stole it, and spent it.\\n\\nNow they blame the feds.\\n\\nThey've been in control and they blame the feds.\",\"replies\":[]},{\"id\":1180,\"aid\":104,\"author\":\"user99\",\"meta\":\"Sep 4\",\"stance\":\"\",\"text\":\"1. Alberta can't afford to separate and its separation would be illegal; therefore the vote is a waste of money.  Danielle Smith, herself, claims she doesn't want to separate. Read Policy Opinions here: https://policyoptions.irpp.org/2026/02/alberta-separation-illegal/ \\n\\n2. What we can't vote on: Albertans now have to pay for Danielle Smith's Bill 11 U.S.-style health care, and wait times for surgeries will be longer unless you pay for them yourself by buying costly health care insurance. In the U.S. employers pay, but the premiums for insurance rise 5 - 6% a year.  Employers might not pay in Alberta.\\n\\n2.  The Walrus states 20% of the online influence to separate comes from Americans and the Globe and Mail states 80% of it comes from Russian propaganda (Pravda Network). This is also aimed at creating political discord.\",\"replies\":[]},{\"id\":1179,\"aid\":103,\"author\":\"Donna Cameron\",\"meta\":\"Sep 12 · reply to Anton Pavlenko\",\"stance\":\"\",\"text\":\"Smith has to be defeated, she's dangerous.\",\"replies\":[]},{\"id\":1096,\"aid\":38,\"author\":\"Matilda Dillon\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"For the millions and billions of dollars that are being spent on this referendum, Alberta could certainly have spent that money on improving education and health care. I am more than happy to stay in Canada, but the referendum is such a waste of taxpayer dollars.\",\"replies\":[]},{\"id\":1142,\"aid\":81,\"author\":\"TD DK\",\"meta\":\"Sep 11\",\"stance\":\"\",\"text\":\"One aspect of separation I have not read anywhere . . . just WHO is going to manage a separate Alberta? Has Smith and the UCP proven themselves competent at ANYTHING? What have they actually brought to fruition that is working FOR the every day Alberta resident? They have botched everything they have touched, except for the new license plates and the \\\"Welcome to Alberta\\\" signs? Whooooo hoooooooo, like how do those 2 help us with everyday cost-of-living, etc. All just status-quo . . . . They certainly have NOT done anything for the common every day Alberta resident.\",\"replies\":[]},{\"id\":1138,\"aid\":79,\"author\":\"Terry Morrison\",\"meta\":\"Sep 12\",\"stance\":\"\",\"text\":\"I cannot believe that the government of Alberta is using our money to fund an advertising campaign to promote their particular bias. This referendum is already costing the taxpayer an incredible amount of money. If they truly want the people of Alberta to voice their own opinions in a vote, then they should not be trying to sway it. I am appalled but not overly surprised.\",\"replies\":[]},{\"id\":1012,\"aid\":12,\"author\":\"Joel Unrau\",\"meta\":\"Sep 15\",\"stance\":\"\",\"text\":\"The Alberta provincial government has been slow to respond to need within healthcare and education. Attempts at privatization, constant cabinet leadership shuffles, and strike action having to force even the most modest updates and changes in both sectors. They have shown that they're not interested in finding solutions despite a healthy intake of taxes (thanks to an NDP policy). Ask a teacher or nurse how the province has improved services and they'll laugh....\\nRead more\\n\\nThe Alberta provincial government has been slow to respond to need within healthcare and education. Attempts at privatization, constant cabinet leadership shuffles, and strike action having to force even the most modest updates and changes in both sectors. They have shown that
