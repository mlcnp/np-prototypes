namics and solve very fundamental problems that no one else could. this monumental achievement was derived partly from his view of different models of learning and discovery. (he talks about the learning journey in more detail and i would encourage anyone interested in reading this.)  the old story  that Einstein was so bored in school he almost failed was an indictment of the school system then. we sent our children to an alternative elementary school (Nouvelle Querbes in Montreal) where the standard method of rigid teaching was replaced by a flexible project-based active model that was used from grades 1-6. this active-based model was developed many decades ago in England, and maybe elsewhere, and was called the Summerhill model. parents are asked to be part of the teaching: my wife, also a prof in university, and i helped out in the classroom. many parents have workshops: a jazz drummer gave acweek's long percussion workshop to grade 1, and this is where we learned our son was a musician. i taught electromagnetism to grade 1s using screwdirvers, speaker wire, paper clips and a battery. all the kids participated in the \\\"experiments\\\" and they learned, witha lot of fun,  some fundamental physics that normally would not be taught till grade 10 or cegep. our daughter, who is more of a passive learner and not brilliant in math, is now a veterinarian running her own clinic. the success stories abound. \\n\\nthese active  models are there, they have been shown to work so there is no reason not to implement them \\n\\nmark goldberg, phd\\nprof, dept of medicine, mcgill\", \"replies\": []}, {\"id\": 1026, \"aid\": 25, \"author\": \"adele\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Just because boys aren’t going to university doesn’t mean that they’re falling behind. My family is full of electricians and they make a really good living and are very happy. Most probably have a higher standard of living and got jobs earlier. Our school system took the shops out of the high schools and of course boys suffered because they loved doing hands on mechanical work.\\nIt’s not all about attending university. You can be an intelligent, happy well-rounded person without ever stepping foot in a university.\", \"replies\": []}, {\"id\": 1150, \"aid\": 132, \"author\": \"Andrew Homzy\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Too much emphasis on math & science. Boys need creative skills - wood shop, metal shop, basic electronics, mechanics, cooking , managing - as do girls. And then there’s what may be most important - the arts - music, dance, theatre, visual arts. \\n\\nAnother way of saying this is less emphasis on sports- but maintain physical development- outdoor activities requiring hiking, caming, building shelter - and foraging and fishing and - gasp - hunting using traps and strategies to find food. \\n\\nAnd all of the above for girls.\", \"replies\": []}, {\"id\": 1076, \"aid\": 72, \"author\": \"James Wilson\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys are motivated by different stimuli than girls.  They need more hands on activities to support their academic day routines with more importance placed on individual needs.  The cookie cutter classroom does not fit well with many young male learners.\", \"replies\": []}, {\"id\": 1017, \"aid\": 16, \"author\": \"Laura Campbell\", \"meta\": \"May 14\", \"stance\": \"\", \"text\": \"I'm surprised that this is finally being noticed now 30 years later after my kids are now adult children! I had 2 girls and then a boy and that was when I noticed how the education system was biased and \\\"feminized\\\" towards girls.  Most of the teachers were women, very few men to serve as role models. My son was tested for ADHD in Gr. 1. and was then put in remedial English for the entire primary school system. The books offered were of little interest to him and the shop class was cancelled in middle school (and we wonder why we have a shortage of skilled labour?) He was labeled as disorganized, messy, and not motivated.  Highschool was not any better, but he did have 1 male teacher in shop class who motivated him and a class of boys to refurbish an old army tank.  He was inspired! My husband and I sought out extra-curricular activities, and he joined air and army cadets.   That really helped.  But schools need to change the curriculum to engage boys, help them to channel their energy and interests from Kindergaarten.  Get technical activities in class, reward their energy, and get books that interest them. Don't mark them on neatness or label them from the start.  I'm happy to say my son did sucessfully complete university, excel and is very focused, attentive to his public sector job.   However, there are other avenues to success than university - give them the skills to also consider the trades.  Do what we did for girls, now for boys!!\", \"replies\": []}, {\"id\": 1156, \"aid\": 22, \"author\": \"Bala Viswa\", \"meta\": \"May 12 · reply to Vince Schutt\", \"stance\": \"\", \"text\": \"So, you advocate managed risk in schools rather than risk elimination? I can agree with that. We cannot learn without making mistakes, and we cannot make mistakes without taking risks. How can we do new things without compromising safety to life and limb?\\n\\nI am also genuinely curious: what is considered risky in a trip to the water treatment plant or a food terminal? Why would they not be allowed to proceed?\", \"replies\": []}, {\"id\": 1120, \"aid\": 111, \"author\": \"Mark Goldberg\", \"meta\": \"May 12 · reply to Glenna Landry\", \"stance\": \"\", \"text\": \"public school in montreal, in s building that dates back to the 1920s, i believe. there was also a high school using the method; not sure if they still do. no extra facilities required. it is all about how one structures learning. in this school 1/3 of the kids were from different grades and they had the sane teacher for 3 years. instead of some person standing at the front of the class talking, they had workshops and not all of the kids had to go: e.g., a grade-1?level arithmetic class woukd only have grade 1s. lots of social interactions between ages and conflict resolutions that are reminiscent of what many native people do. projects were defined by the kids (my dsughter did projects on greyhiunds, world war 2, and others). the n projects had to comprise various aspects if learnjng (eg. math, science, geography, the arts), they were encouraged to do their own research, parents were encouraged to help out. etc. similar to how we teach our graduate students, which is very active and not in the least passive. the current school system really is quite the failure -grade F, in my opinion. in the early 1970s i visited an open school in Oxford (public in our sense of the word), UK, that was structured like this. north americans continue to be decades behind the europeans in so many ways...\", \"replies\": []}, {\"id\": 1171, \"aid\": 145, \"author\": \"Barry Wansbrough\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"We must be very careful not to be patronizing to this idea that should be self-evident with the provinces abandoning their leadership schooling role. The federal government has stepped in with the trades program run through the unions, not the ministries of education. Core problem - it's not what students, or any others, can remember about new knowledge, it's what they can do with it. So standardized memory tests just get in the way, especially for boys. Boys are the heavy lifters for hands on practical work. Globalization took much of that away from them without anything offered to help them. No GI Bill idea, for instance. They were forced to stay in school until they are 18 on the idea that more academic education would help. Clearly and predictably it hasn't. It's taken the feds to address that. At last there is hope if the provinces don't get in the way. Fingers crossed.\", \"replies\": []}, {\"id\": 1158, \"aid\": 136, \"author\": \"sb123\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a Toronto Board Kindergarten teacher for many years, we always used a play-based educational program. It was hands on and activity based.\\nAny academic learning was based on actual programming.\\nAnd teachers were even down on the floor working one to one with what the child was creating and playing with. \\nLater we extended this program to what we named Structures up to the Grade 3 level and we well knew it was a boon to boys and even some  girls who were just increasing their attention spans.\\nAt one point educators from New York came to observe this program.\\nMost of us who knew how well this worked were upset after the Mike Harris days when there was a return to paper and pencil tasks involving only eye hand coordination which favoured girls.\\nAnd teachers moving into the lower grades went on break when the kids were just “playing” as they saw it. When we originals used play as prime teaching times. The ones such as myself who tried to continue on were frowned upon. \\nHopefully this kind of programming could be restored/\", \"replies\": []}, {\"id\": 1155, \"aid\": 135, \"author\": \"Vince Schutt\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Hello everyone. I'm a PhD Candidate in Education, and prior school board partner.\\n\\nFirst, Experiential Education.  Where is it?\\n\\nTake a school board like TDSB (Toronto District School Board).  Every time a child scrapes a knee while running, climbs a tree (long gone) or a child is exposed to any risk of harm - there is hell to pay for the teacher, principal, administrators and the board overall.\\n\\nWe have a system that with no operator action trends towards catastrophic levels of risk aversion.  The administrative structures don't have the elasticity to respond to critique without system changes that increase risk aversion.\\n\\nEach incremental policy step that enshrines risk aversion disables educator pathways to create meaningful experiential learning.\\n\\nMany years ago while administering a program with secondary schools I was attempting to get a field trip for students to Toronto water treatment facilities or the Ontario Food Terminal. The goal was to help students see the infrastructure that supports millions of people in the Greater Toronto area. It became apparent quite quickly that this field trip was not going to be allowed, despite the fact that I was an official partner of the TDSB.\\n\\nSo let me be very clear that this is not a critique of the TDSB, educators, parents, young people, or lawyers. The critique is in how we have arranged the power of these various actors - and how, in combination, these actors drive educational structures towards catastrophic levels of risk aversion.\\n\\nSo I am saying risk aversion is the culprit.  If we want to do something about risk aversion we need to understand how and why risk aversion happens. Why is risk aversion the solution when something bad happens?  Stop and consider the answer.  You know it as well as I do. Now take your thinking and multiply it times 10,000X.  What % of the time is risk aversion the winner?\\n\\nNow the last question ... the clincher.  For whatever number of times you selected that risk aversion was the solution.  How often is the risk averse policy / way of doing things peeled back? At what rate do school administrators relieve the installed administrative risk controls?\\n\\nThings will happen in schools because things happen everywhere. When we label things as \\\"bad things\\\", we create an impetus that they must be controlled/administered/averted. What if a bad thing happening is a good thing. The bad thing creates the possibility of learning experientially through failure. \\n\\nIf our answer to sliding performance outcomes is more risk aversion - I suspect we will return here in a decade with even worse problems than the CBC is reporting on today.\", \"replies\": []}, {\"id\": 1139, \"aid\": 125, \"author\": \"Christopher Dinsdale\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a former male elementary teacher, I can say that I loved my 32 year career teaching primary and junior.  Why are boys failing today?  I believe it's not the sex of the teacher as much as the learning style imposed upon today's classrooms.  We were on the right educational track in the early 2000s when school boards were focussing on multiple learning styles which absolutely benefited both sexes and made the classroom a fun environment.  Unfortunately, there's been a hard turn back to paper-based, sit-in-your-seat learning which has resulted in today's stats.  A very sad day for children when politics triumphs over science.\", \"replies\": []}, {\"id\": 1124, \"aid\": 116, \"author\": \"Andrew Vernet\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Middle school 25 years ago- Unified Arts room- shop, family studies/home ec, specialist in visual arts/band or strings/dedicated science lab. And the full time guidance counsellor. ALL GONE. Replaced by \\\"kits\\\" and expert opinions.\", \"replies\": []}, {\"id\": 1093, \"aid\": 89, \"author\": \"Joe Grubb\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Our society idolizes sports stats, actors, etc, and we do the same with careers. Kids are told they need to work hard starting in grade school so you can become a doctor, lawyer, engineer etc, and you need to go to university. What does this do for kids confidence that do not have the learning skills at a young age. Kids in school are not aware of the many careers that do not need university degrees. The smart kids will find their way to university - both girls and boys. We need to promote the skills labour or other professions offered at college's. These jobs are not given the same respect as University education. It starts in grade school to promote college degrees, the same way society idolizes that of a university degree. Then in high school, the guidance councillor's to emphasis the college path. There is nothing wrong in a student going to college first, then going to university with more maturity. The first step is to educate society that college skills are more important than becoming a lawyer :)\", \"replies\": []}, {\"id\": 1059, \"aid\": 57, \"author\": \"parentofactiveboy\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"We need to deliver curriculum in a variety of ways, recognizing that children have different learning styles. I do believe that broadly, young boys are more likely to thrive in an active hands-on learning environment, than in a traditional sit at a desk classroom. Getting them a strong foundation is critical for later education success. We were lucky in that our son was able to attend a private school that separated boys and girls in early grades and delivered the curriculum to boys in immersive ways - study poetry of Robert Service? Turn the classroom into the Malamute Saloon. Studying fur traders? Dress as a fur trader and canoe out to an island to trade \\\"furs\\\". Morning assembly? Keep it active with skits. Science? Lots of experiments.  I suspected the son was ADD/ADHD but was not prepared to medicate or have \\\"labeled\\\" so never had tested. Tests as an adult confirm it...in hindsight probably best to identify earlier so can get proper supports at post-secondary level, such as for writing exams. Today son is very successful in life/career and I think the strong start in a supportive learning environment helped. To help these children reach their potential we need to have different styles of schools/classes and fit the children to their best style. It may take more resources but the outcomes would be worth it.\", \"replies\": []}, {\"id\": 1050, \"aid\": 48, \"author\": \"C Borkowski\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"There’s been a lot of discussion about rising female enrollment in universities and colleges, but I think it’s worth looking at the broader picture before drawing conclusions.\\nHas anyone compared this trend with the growing number of young men entering the skilled trades? While fewer men may be pursuing traditional post-secondary academic paths, many are choosing trade careers instead—fields that are not only in high demand but are also actively supported by government initiatives across Canada.\\nWith ongoing labour shortages in skilled trades and increased emphasis on apprenticeship programs, it makes sense that some men are opting for these practical, career-focused pathways rather than university degrees. In many cases, these roles offer strong earning potential, job security, and clear progression without the same level of student debt.\\nRather than viewing this as a simple imbalance in education, it may reflect a broader diversification in career choices. The real question might be whether we’re adequately recognizing and valuing all forms of post-secondary pathways—academic and vocational alike.\", \"replies\": []}, {\"id\": 1001, \"aid\": 1, \"author\": \"Russell Cullingworth\", \"meta\": \"Jun 12\", \"stance\": \"\", \"text\": \"I've worked and researched creativity and imagination-based professional development for 10 years and, from my research, found that its very absent in childhood and adult education (after about the age 10). \\n\\nI believe this is about nurturing imagination and creativity - and that these are critical for human development, and in my opinion this is more important for boys. \\n\\nSir Ken Robinson said \\\"we don't grow into creativity, we grow out of it. Or rather, we get educated out of it.\\\"  \\n\\nThis NASA study tested 1600 children age of 4-5 for creativity. At this age, 97% score at the genius level. Watch the video to see how this drops to 2% as the children aged into adulthood https://www.youtube.com/watch?v=pFD5UdGTOmw&t=19s.\\n\\nI'm convinced that boys could be more deeply engaged and interested with imagination-based storytelling and scenarios where they get to make decisions and \\\"play\\\" with their learning.\", \"replies\": []}, {\"id\": 1125, \"aid\": 110, \"author\": \"Paul Greenspan\", \"meta\": \"May 12 · reply to Andrew Vernet\", \"stance\": \"\", \"text\": \"We still have all those things in our middle school.Girls and boys take shop together then do a rotation of cooking together, then do a rotation of art or band.\", \"replies\": []}, {\"id\": 1119, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to Mark Goldberg\", \"stance\": \"\", \"text\": \"Was the alternative school private and available at a fee? Just curious if there is a facilities issue in public education if the Summerhill method were to be implemented.\", \"replies\": []}, {\"id\": 1157, \"aid\": 135, \"author\": \"Vince Schutt\", \"meta\": \"May 12 · reply to Bala Viswa\", \"stance\": \"\", \"text\": \"Risk is perceived on all sides.  Then there are all the quite frankly unimaginably large burdens on behalf of every stakeholder - and the paperwork to legalistically attend to those risks. Then the insurance policies for all entities. Let your mind run wild at what the perceived risks *might be* and every idea you come up with, if you look in reality at the policies and structures in place.  For each idea that you have of what the risk *might be* you'll see an administrative oversight burden to attend to regarding that risk.\\n\\nThe point being with my post - is that it's not the specifics.  Which I could get into.  But if I did, it would be zooming in, and at a hyper-specific scale risk aversion becomes more palatable.  \\\"well it's just a form\\\" -- \\\"what's the big deal\\\".  Until you have a 1000 forms to attend to, and you realize oh wait, Houston, we have a problem.\", \"replies\": []}]}, {\"id\": \"labels\", \"label\": \"ADHD, labels and diagnosis\", \"count\": 10, \"color\": \"rgb(169,88,81)\", \"px\": 67, \"py\": 349, \"d\": 112, \"allLabel\": \"5 responses · 5 replies\", \"posts\": [{\"id\": 1025, \"aid\": 24, \"author\": \"pg4\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As a woman who was diagnosed with autism in my 30s, and know of many woman who have been diagnosed with ADHD and Autism as adults, I disagree with the usage of statistics showing higher rates of neurodevelopmental differences in boys. \\n\\nWhere boys with ADHD can’t sit still, girls with ADHD can’t stop their minds. Girls however are much more likely to learn to successfully mask their symptoms. It takes a lot of energy (that the boys express physically), and these girls are often the ones who start to struggle in their pre-teens and are diagnosed with things like depression and anxiety as the responsibilities they are expected to take on increase. \\n\\nUnstructured time with appropriate supervision is important for all children, regardless of their labels. The key is that this unstructured time is accommodating to the children’s varying needs. Forcing a child who has energy to burn to play quietly doesn’t help in the same way that forcing a child who is constantly overstimulated to go play outside with the noise of the other children all around them doesn’t help.\", \"replies\": []}, {\"id\": 1149, \"aid\": 22, \"author\": \"Bala Viswa\", \"meta\": \"May 12 · reply to p3000g\", \"stance\": \"\", \"text\": \"Is the occurrence of ADHD much higher in boys? Or is the line for being diagnosed so far in one direction that more boys fall on the other side? \\n\\nWhy do I ask these? My son was referred to be tested for ADHD from school and the Board's psychologist said he has ADHD. We got him tested by his paediatrician and she said that he is progressing normally and does not have ADHD. (She said, he is just an active boy). \\n\\nI wonder how many boys have been medicated for not being able to sit still after being tested by a psychologist and not a doctor. (My son's paediatrician said she wouldn't make a diagnosis, she can only rule it out; she would refer to a neurologist for a diagnosis if he needed one. We also got tested by a neurologist at the children's hospital and we were laughed out of the room. This told me that psychologists and doctors have very different standards for diagnosing ADHD. ).\", \"replies\": []}, {\"id\": 1167, \"aid\": 143, \"author\": \"Xinhang Shen\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I believe that labeling a boy with attention deficit hyperactivity disorder (ADHD) may be a reason to send him into a failure! Stopping such diagnosis and tolerating more boys behaviour may be a solution! Boys and girls are different and should be treated differently!\", \"replies\": []}, {\"id\": 1024, \"aid\": 23, \"author\": \"Alina K\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"In a world where there's pesticides and plastics and preservatives in everything the growth in development will be different and every child is different and they should be labelled due to ADULT mistakes its sickening.. the schools are understaffed and the teachers are stressed enough they won't be able to pay attention to every detail of every child and it's sad.. can only do so much to help and be strong in a world that tells us different\", \"replies\": []}, {\"id\": 1147, \"aid\": 131, \"author\": \"p3000g\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The occurrence of disabilities like ADHD and autism are far higher in boys than girls .. As a result, their ability to concentrate, sit down and study is limited, leading to poor academic performance and higher dropout and lesser graduation rates .. Add to that, modern distractions like internet, social media etc. the findings are not surprising.\\nBoys tend to do well in physically oriented activities like sports, but how many can ,make a living out of sports? The world is such that you need a university/college  degree to get a decent white collar job , which leads to a stable source of income and live the dream .. Bottom line is  we need to make academics more interesting for kids.. restricting use of social media and internet in schools is a step in the right direction\", \"replies\": []}, {\"id\": 1106, \"aid\": 101, \"author\": \"Bethany Kuntz\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I would be interested to see if this is a problem specific to boys or a problem specific to ADHD, which affects both boys and girls, but predominantly boys. If ADHD is the cause and not gender, then we need to identify that as the root cause so that girls with ADHD don’t get left behind in the proposed solutions.\", \"replies\": []}, {\"id\": 1168, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to Xinhang Shen\", \"stance\": \"\", \"text\": \"That is a medical diagnosis,  not a label any more than a diagnosis of diabetes is a label. The article does not seem to be labelling boys as much as making observations and recommendations as a result of study for the sincere benefit for all students. We need to be careful about labels. They lead to stigma.\", \"replies\": []}, {\"id\": 1148, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to p3000g\", \"stance\": \"\", \"text\": \"Psychologists cannot prescribe medication in Canada.\", \"replies\": []}, {\"id\": 1107, \"aid\": 28, \"author\": \"Keta K\", \"meta\": \"May 13 · reply to Bethany Kuntz\", \"stance\": \"\", \"text\": \"This article is not well-written: girls have the same rates of ADHD etc. They are just diagnosed later, usually around 13.\", \"replies\": []}, {\"id\": 1169, \"aid\": 143, \"author\": \"Xinhang Shen\", \"meta\": \"May 13 · reply to Glenna Landry\", \"stance\": \"\", \"text\": \"Many boys are not just be diagnosed, but sometimes, they are  medicated and taught by specialists. All these are clear indications to them that they are problematic kids, which leads them to lose confidence.  Actually, many \\\"ADHD\\\" boys just have special personalities, not problems at all as shown by many successful people who have \\\"ADHD\\\".\", \"replies\": []}]}, {\"id\": \"resources\", \"label\": \"Underfunded, overstretched schools\", \"count\": 10, \"color\": \"rgb(150,60,130)\", \"px\": 469, \"py\": 130, \"d\": 112, \"allLabel\": \"8 responses · 2 replies\", \"posts\": [{\"id\": 1006, \"aid\": 6, \"author\": \"mom123outwest\", \"meta\": \"May 16\", \"stance\": \"\", \"text\": \"As a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\", \"replies\": []}, {\"id\": 1184, \"aid\": 154, \"author\": \"Jennifer Johnson\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I am a early childhood educator in B.C.  I have been in education in come capacity for more then 20 years.  Teaching in NL, ON, and B.C.  Over the years I have been advocating for change to our education systems starting in kindergarten.  In Canada our kindergarten programs are developmentally in appropriate.  We ask children to sit for too long and we ask one educator to be responsible for up to 20 4/5 year olds.   I agree that boys are losing interest and falling behind but all children are.   With girls it is less obvious because girls mask more due to social norms.   How do we change it?  I have many ideas but sadly our society does not value the early childhood educator.   We don’t have a seat at any of the policy tables.  Our education level is not honored as we live in a society that values degrees and masters more than experience and knowledge.   Our children are facing the biggest challenges in history between screens, over scheduling, and lack of outdoor learning.   There is not just one answer but until we stop wasting tax payers money on more studies and start asking the people who working with our youngest population their thoughts, we will continue down this road and pay for it later with mental health and addiction monies.\", \"replies\": []}, {\"id\": 1178, \"aid\": 150, \"author\": \"Nicholas Peron\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I think the problems are obvious:  Underfunding schools, growing class sizes, underpaying teachers, and training to be one is expensive. \\n\\nThen there's the issue that rote classroom learning has never been an efficient method to teach.\\n\\nKids learn best via interaction, not abstraction. Forcing them to sit still and memorize things from a book just for the sake of memorization is a terrible way to learn. We all know it. We hated it ourselves. Yet as adults, we just decide kids need to endure it because that's the way its always done. That's insanity.\", \"replies\": []}, {\"id\": 1189, \"aid\": 158, \"author\": \"edgradstud\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"If school is improved for kids who need to move their bodies to learn, everybody benefits. To do that requires $$$—for teachers to prep and run more labour-intensive activities, to elevate the prestige of teaching (one side effect of which might be more masculine role models on schools), to allow more observational assessments, etc. The problems are systemic and structural, and they come down to capitalism and patriarchy.\", \"replies\": []}, {\"id\": 1187, \"aid\": 156, \"author\": \"lorraine\", \"meta\": \"May 12 · reply to Jennifer Johnson\", \"stance\": \"\", \"text\": \"Jennifer I agree with you that early childhood educators' opinions and insights are often not valued as much as they should be and that the student to educator ratio is a common problem in our school system.  As a mother of 2 men and grand-mother of 2 boys and 2 girls I concur that there's a difference with most ways boys and girls learn.   I know all kids need to move but that being said, I have seen how young boys usually need to move more and sit quietly for shorter periods. I think our system in Canada should look at other education systems, such as Finland's for the early pre-school to age 7 (see att. link) https://www.heischools.com/resources/articles/finlands-early-childhood-education-model/.  \\nThey have a higher rate of success than we do therefore, it seems to me it is worth seriously considering its content and curriculum, as a first line of study.  \\nWe have many issues in our society which are contributing to children's learning difficulties that were not an issue before, such as screen time, social and gaming media, over-scheduling for kids and parents alike (which by the way include some teachers and their own children) and less simple outdoor play.  Other problems, such as good nutrition, rest, stable home environments, etc that have always made it more of a challenge for some children compared to others also come into play.  \\nLet's all keep being involved and pushing through to help make it better for this and the next generation.\", \"replies\": []}, {\"id\": 1129, \"aid\": 116, \"author\": \"Andrew Vernet\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"More \\\"expert\\\" opinions, more \\\"studies\\\" about one sex or the other. What teachers aren't doing, what they should be doing, blah, blah, blah. Remember in Middle School? Shop, Visual Arts, Science Lab and Home Ec? Remember that? Remember the librarian and the guidance counsellor? Where did they all go? Now the homeroom teacher is expected to teach all specialty subjects except French. Master of none! Years ago, there was a push to put women in positions of authority in Education. So the lucky guy who hopes to have a shot at being an S.O.S. or similar, knew there was little chance, especially in a system that already attracts more women. Then the \\\"boy thing\\\". So a boy is assessed for math and language and his stats show he is need of help. So, instead of music and or P.E., he gets \\\"extra help\\\". Next year same thing and on it goes. So the boy never has the chance to support math and language through music, etc. There are better solutions.. student mentoring, for example. Now with the province taking more control of educational funding, there is less chance of genuine improvements. Some expert will write a paper telling teachers what to do, so problem solved.\", \"replies\": []}, {\"id\": 1126, \"aid\": 116, \"author\": \"Andrew Vernet\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Where is it written that \\\"boys are more active than girls\\\"? Is this a perpetuated cultural expectation or is it based in some genetic code? These huge generalizations are not helpful. Please review the opportunities students had for varied learning some 25 years ago. Shop class, home ec, a visual arts specialist, band and strings, the guidance counsellor in a middle school, the librarian, etc. etc. All these services and opportunities have been removed or replaced with half-hearted efforts from the Provincial government. Education is expensive, but it is planting a seed from which we hope a return will be very fruitful. Don't cheap out and rely only on the words of an \\\"expert\\\".\", \"replies\": []}, {\"id\": 1068, \"aid\": 66, \"author\": \"Ken Goncalves\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"This complex issue demands multifaceted solutions, combining sophisticated AI systems with human interaction.  Tailored support for boys is essential, as they are unique individuals with diverse personalities, learning differences, family dynamics, cultural backgrounds, religious or non-religious beliefs, and living situations.  A good approach is investing in highly skilled, boy-specific mental health counselling in schools. This should focus on understanding and addressing the dynamics outlined above to help boys succeed rather than fail.\\n\\nAI interaction can also be a valuable tool for boys.  It can help identify skill and learning gaps and work with boys to improve those gaps based on their unique abilities.  When AI is carefully tailored with human assistance, it won’t diminish boys’ critical thinking skills but instead focus on filling skill and learning gaps.\\n\\nWhile there’s no simple solution to this global issue, complacency is not an option. As Canadians, we need immediate and dynamic changes..\", \"replies\": []}, {\"id\": 1054, \"aid\": 52, \"author\": \"Jennifer Duncan\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"There are to sides this coin. I completely agree that more activity would benefit all children. My boys would love to have my school schedule which included two 15min recess breaks, 40min at lunch, and schools in walking distance. However, that does not justify boys becoming violent at school when they get frustrated.  Funding needs to increase, parents expectations of their government should be increased. We should not blame the problem on teachers doing the best with what theyve been given.\", \"replies\": []}, {\"id\": 1185, \"aid\": 6, \"author\": \"mom123outwest\", \"meta\": \"May 16 · reply to Jennifer Johnson\", \"stance\": \"\", \"text\": \"I am pasting this here to join the conversation \\n\\nI greatly appreciate early educators and EAs. Yes! 👏 somehow we do need to get their voices heard as they see the classroom from a unique perspective. Also as Substitute teacher, I feel like I don’t have a direct channel,  but I see such a broad swath of the system and problems. \\n\\nAs a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\", \"replies\": []}]}, {\"id\": \"screens\", \"label\": \"Screens, phones and gaming\", \"count\": 7, \"color\": \"rgb(82,93,207)\", \"px\": 472, \"py\": 367, \"d\": 108, \"allLabel\": \"5 responses · 2 replies\", \"posts\": [{\"id\": 1064, \"aid\": 62, \"author\": \"Shane Robinson\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I have a 19 year old son, and from about the age of 13 he had been exposed to a lot. We folded to the pressure of all his friends having a cell phone. I firmly believe that that was one of the main factors to him falling behind in school. At one point he was sharing the toxic masculinity that was mentioned in the news story. We offered a perspective that was contrary to the opinion being fed to him online. Eventually he was able to build an opinion, that wasn't rooted with the online view. Unfortunately from the age of 13-17 he thought the social media presences we correct in everything they said. He was firm with the 'fact' that his education wouldn't help him in any way and that it was more of a waste of time than the hours of scrolling that we could not control. \\nIt is my opinion that removing social media and cell phone presence in schools is one of the biggest promoters of success.\", \"replies\": []}, {\"id\": 1046, \"aid\": 44, \"author\": \"Kevork Hacatoglu\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Social media is a giant unregulated experiment being run on boys and girls, as is the broader phone-based childhood. More free play and schools implementing phone bans would certainly help. Giant Silicon Valley tech companies have too much direct access to youth and it's leading to increased rates of anxiety, depression, addiction, attention fragmentation, etc. Boys as more solitary individuals compared to girls are especially vulnerable.\", \"replies\": []}, {\"id\": 1159, \"aid\": 137, \"author\": \"edk\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"What, no mention of video games? Boys are into these games much more than girls, and that is something we didn't have to worry about 25 years ago. We had video games when I was growing up too, but I think they became much more widespread and addictive since then.\", \"replies\": []}, {\"id\": 1049, \"aid\": 47, \"author\": \"helga\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Mom of Teen son with high functioning ADHD, Learning Disability & Sensory Processing Disorder.\\nIt's been a struggle, I can tell there is a very high pressure of self image going on between the boys, more than before, comparing growing up with brothers.\\nHair products, body products, barbers, shoes, clothes.. all of this!! \\nI think girls have always had that and relaxed with it. Social media pumping things.. snap chat.. adding to social stress.. that they are more focused on social images and personal self growth for the future, they are more worried about the \\\"now\\\" moment.\", \"replies\": []}, {\"id\": 1021, \"aid\": 20, \"author\": \"anita\", \"meta\": \"May 14\", \"stance\": \"\", \"text\": \"My son does well at math but is totally disengaged with other subjects that he doesn’t like English and French.  He is also constantly gaming and I am concerned he is faking illness to avoid going to school.  How do we intervene to prevent our teenage sons from dropping out?!\", \"replies\": []}, {\"id\": 1161, \"aid\": 138, \"author\": \"Tony Johnson\", \"meta\": \"May 12 · reply to edk\", \"stance\": \"\", \"text\": \"I can assure you that video games existed 20 years ago.\", \"replies\": []}, {\"id\": 1160, \"aid\": 135, \"author\": \"Vince Schutt\", \"meta\": \"May 12 · reply to edk\", \"stance\": \"\", \"text\": \"addictive tech is definitely a problem I agree with what you are saying here.  This is a problem that is not isolated to young boys.  It is relevant for all young people.  It is also relevant for adults.\\n\\naddictive tech companies employ clinical psychologists -- and are made to turn the dopamine responses into addictive pathways.  It works on both young people and adults (including me).\\n\\nI ask my spouse to ban various tech platforms on my laptop, turning my tech-inability into a boon.  I don't know how to undo it, so I don't waste days of my life wasting away on YouTube.\\n\\nVolkow, Koob, and McLellan - researchers have found that addictive behaviours interact and hack the dopamine systems of the brain in very similar ways.  Meaning YouTube has a lot more in common with elicit drugs than previously realized.\\n\\nSo the Clinical Psychologist that works with algorithmic coders at Google to \\\"make a satisfying User Interface\\\" (that's an example excuse the psychologist uses to assuage their guilt) -- is in effect a crack dealer to children (and adults).\", \"replies\": []}]}, {\"id\": \"reading\", \"label\": \"Reading and literacy first\", \"count\": 3, \"color\": \"rgb(40,110,170)\", \"px\": 85, \"py\": 124, \"d\": 100, \"allLabel\": \"3 responses\", \"posts\": [{\"id\": 1113, \"aid\": 106, \"author\": \"Maggie Baer\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As mom to four sons (all grown up now), I am grateful for my journey of learning all about \\\"boy-world.\\\" It has been radically different than my own girlhood. \\n\\nI learned that boys thrive with physical activity and hands-on challenges like building and creating things.\\n\\nMy boys survived the endless hours of sitting still in classrooms by reading a the back of the classroom quietly. \\n\\nHelping more boys learn to to read earlier would boost them more than any other effort -- fuelling their imagination, building their confidence, and equipping them with life-long communication skills.\\n\\nBut even my quiet, compliant sons found their happiest place in sports -- in school and extracurricular. Recess games, competitive teams, tournaments -- these are their highlight memories from K-12. \\n\\nOne last point: more male teachers in primary school would most certainly provide crucial mentors to young boys. Positive adult models are essential for all kids, and sadly, many boys are missing this key link in their early development.\\n\\nLet's borrow some of those best practices from Finland!\", \"replies\": []}, {\"id\": 1175, \"aid\": 148, \"author\": \"fox2\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a former public school teacher of 27 years, teaching mainly grade 8 in the English stream, I can confidently attest to the fact that boys struggle more in school than girls.  In my opinion, boys are struggling mainly from a lack of ability to read — which also affects many girls in the system. Even in math, where many boys used to excel, the curriculum has become more language/ problem solving based which is affecting boys’ progress.  In addition, with the elimination of physical education specialists for boys and girls classes, the quality of physical education in public schools dropped dramatically.  As all parents and teachers know, most young boys thrive on engaging in physical activity (ball hockey, soccer, tennis, wresting, snowboarding, climbing, etc.) and mainly of these activities have been eliminated or even banned at recess.  If we want boys to enjoy school and achieve their potential both parent and the education system must work together to raise their reading skills and the system need to provide more time for physical activities and hands on learning.\", \"replies\": []}, {\"id\": 1030, \"aid\": 29, \"author\": \"Shelley Corrin\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"The problem is the French language itself, and the way it is taught.\\nWhen HS dropout rates were measured in the 80’s and 90,’s, the boys dropping out at a 20% higher rate than girls failed French and one other subject.  Given the differential in learning disabilities, dyslexias , ADHD’s, the mastery of written French  is clearly so much harder for boys than girls.  Add to that the unwillingness of boys to read books out of school, and voila.\\n\\nBut the teaching of French was then so hidebound in traditions that further hampered literacy. Dictee, where even the punctuation was supplied, and grammaire instead of real writing ( stories, essays etc), condemned boys to failure if they were even slightly disadvantaged.  \\nAs the teaching of English Language Arts moved further into enhancing the mind and away from traditional ‘ grammar’,  the French language and its burdensome spellings, agreements, etc continued to burden boys, and prevent classrooms from developing literacy skills ( reading novels, writing freely, verbal skills, and such.) As I completed an M.Ed and taught \\nin an English  school whose students often had come from French homes ( but who still failed French ) and as I spoke about pedagogy with teachers of French in the staff room, all became clear.  Needless to say, my assessment would be anathema to the Education dept in La Belle Province.  Granted, it has been over 20 years ago that I observed that. But has it changed?  The stats stay the same.  It would be interesting to compare boys’ results in provinces where French is no longer in the curriculum.\", \"replies\": []}]}];\n\n    // index for lookup + feed\n    // hand-picked representative posts (most substantive, not just most upvoted)\n    const PICK = {\"notjustboys\": [1140, 1108], \"bias\": [1097, 1067], \"home\": [1043, 1044], \"differently\": [1040, 1073], \"move\": [1130, 1052], \"rolemodels\": [1208, 1164], \"handson\": [1118, 1026], \"labels\": [1025, 1149], \"resources\": [1006, 1184], \"screens\": [1064, 1046], \"reading\": [1113, 1175]};\n    this.THEMES.forEach(t => { const pk = PICK[t.id]; if (!pk) return;\n      t.posts = pk.map(id => t.posts.find(p => p.id === id)).filter(Boolean).concat(t.posts.filter(p => !pk.includes(p.id))); });\n    this.THEME_BY_ID = {};\n    this.THEMES.forEach(t => { this.THEME_BY_ID[t.id] = t; t.reps = t.posts.slice(0, 2); });\n\n    // FEED = every top-level post with its replies, from the feed JSON export\n    this.RAW_FEED = [{\"id\": 1001, \"aid\": 1, \"author\": \"Russell Cullingworth\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"Jun 12\", \"ts\": 1781279791288, \"up\": 0, \"depth\": 0, \"text\": \"I've worked and researched creativity and imagination-based professional development for 10 years and, from my research, found that its very absent in childhood and adult education (after about the age 10). \\n\\nI believe this is about nurturing imagination and creativity - and that these are critical for human development, and in my opinion this is more important for boys. \\n\\nSir Ken Robinson said \\\"we don't grow into creativity, we grow out of it. Or rather, we get educated out of it.\\\"  \\n\\nThis NASA study tested 1600 children age of 4-5 for creativity. At this age, 97% score at the genius level. Watch the video to see how this drops to 2% as the children aged into adulthood https://www.youtube.com/watch?v=pFD5UdGTOmw&t=19s.\\n\\nI'm convinced that boys could be more deeply engaged and interested with imagination-based storytelling and scenarios where they get to make decisions and \\\"play\\\" with their learning.\", \"replies\": []}, {\"id\": 1002, \"aid\": 2, \"author\": \"Nicholas Zacharias\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 30\", \"ts\": 1780155573332, \"up\": 0, \"depth\": 0, \"text\": \"Western society is clearly designed to elicit specific behaviours in adulthood. A lot of growing up and transitioning to adulthood is about meeting arbitrarily defined standards. The less our system enables individual freedoms, the more Canadians will internalize artificial values.\", \"replies\": []}, {\"id\": 1003, \"aid\": 3, \"author\": \"Teran Mundell\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 22\", \"ts\": 1779477350992, \"up\": 0, \"depth\": 0, \"text\": \"[I posted this on the Youtube video and pasted it here]\\nAs many commenters have described, the phenomenon of females outpacing males in education is decades-old in both Canada and the United States.  I'm very happy for the progress of females, but society in English-speaking countries, writ large, has underemphasized young males for many years.  Nevertheless, I'm happy that CBC is coming to this late instead of never.  I'm also happy with how the CBC's editors framed the unnamed \\\"expert and activist\\\": they included her opinion, but the story was framed in such a way that her opinion was debunked by Heck immediately thereafter.  Yes, it is important to note that men currently hold the majority of high power and earning positions, but we're comparing entirely different age cohorts who grew up in different periods and with different cultural values.  What most of the people in this video are saying is that that if current educational trends continue into future occupational trends, then we should expect to see men lagging behind women in socioeconomic status.  We'll see if this actually happens. \\n\\nBear in mind that if it does happen that there will likely be more social disruption, because while men TEND to find physical attractiveness in women to be highly important in mate selection, women TEND to find a man's ability to provide (i.e., earnings) to be highly important in their mate selection.  As such, if women are earning more than men, then the prediction follows that we can expect to see even more sex and relationship-deprived males, and this often leads to very bad societal outcomes (e.g., mass unrest and revolutions).\\n\\nThe solution?  I generally bristle at the word \\\"equitable\\\", but in this case, it may be the right course of action. This is to say that, generally speaking, males and females thrive within slightly different learning environments, and we should try to couple these needs with these environments.  Another solution is for us, as Canadians, to value both sexes equally.  We really do compliment each other, and it is to any society's discredit to overemphasize demographic and underemphasize another, regardless of which demographic (e.g., sex, ethnicity, etc.) we're discussing.\", \"replies\": []}, {\"id\": 1004, \"aid\": 4, \"author\": \"William Anderson\", \"ini\": \"W\", \"title\": \"\", \"pinned\": false, \"date\": \"May 21\", \"ts\": 1779384099647, \"up\": 0, \"depth\": 0, \"text\": \"I do NOT ever want to take away from women in the workforce or opportunities for their success at any age. I am a strong supporter that women are always fighting an uphill battle and I know because my wife and I are in the same profession that women are disadvantaged even in women dominated professions. BUT when I started as a teacher I was told my mentors and professors I can no longer say \\\"boys will be boys\\\" but now that I have one of my won, I was one and still have some of that in me, it is true. Also by the stats, articles and research coming out about this topic, I feel like people again went too far one way to try to correct an issue and have no caused more problems. Boys will be boys, what that looks like can be different. My boy is a wild boy and we spend the majority of the time outside, playing, hanging out with the neighbourhood and going on adventures. On those days, his regulation is right, when he does not get that - it is a much different experience parenting.\", \"replies\": []}, {\"id\": 1005, \"aid\": 5, \"author\": \"Larry Van Pelt\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 16\", \"ts\": 1778896029848, \"up\": 0, \"depth\": 0, \"text\": \"According to Google’s Gemini AI ...\\n“... collectivist and individualistic societies differ significantly in how they socialize males, largely because they aim to produce different types of men tailored to different societal needs. In collectivist cultures, socialization emphasizes interdependence, obedience, duty, and maintaining harmony, whereas individualistic cultures prioritize independence, self-reliance, and personal achievement.”\\n          I was brought up in an individualist society i.e. North America, but my early childhood was spent mostly on my own in a rural setting. My mother thought I was not getting sufficient socialization, so she put me in school—although I was several months younger than the average for first grade. There was no kindergarten or preschool then. Mom asked my first-grade teacher to inflate my grades. According to her they did. The point was to build up my confidence. \\n          My mom’s socialization plan for me did not work in the way she expected. My identity was already too strong. School society could not change me.  I tended to have independent  friends. I married an independent  woman. We were blessed with two sons that grew up to be like us—adjusted and successful. \\n          My solitary early life and my age upon entering school affected my attitude. I was appalled at the way my schoolmates behaved towards one another. My best school playmate had a great interest in baseball, so I played pitch and catch with him every day. This association lasted until grade 3. Boys tended to play at competitive sports and football, while girls gravitated towards games like hide and seek, and cliques of friends.\\n          Society prepares girls and boys for different social roles. Males are expected to compete, and females are expected to socialize. The education system of today suffers because today’s social roles are evolving. Our entertainments and professions are still highly competitive and individualistic. \\n          There have been attempts to understand the development of children by people like Piaget. BF Skinner and Montessori proposed changes to the education system. I remember studying these ideas in college. Perhaps they should be revisited. \\n         The human world is more conflicted now than when I was young. I would like to see society become less individualistic,  more cooperative, and more adaptable.  \\n                                          Larry Van Pelt,  Stratford, Ontario.\", \"replies\": []}, {\"id\": 1006, \"aid\": 6, \"author\": \"mom123outwest\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 16\", \"ts\": 1778890417787, \"up\": 1, \"depth\": 0, \"text\": \"As a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\", \"replies\": [{\"id\": 1007, \"aid\": 7, \"author\": \"p123\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 16\", \"ts\": 1778890897662, \"up\": 0, \"depth\": 1, \"text\": \"Yeah\\nIt’s not so much a boy/girl\\nMy daughter was very active\"}, {\"id\": 1008, \"aid\": 6, \"author\": \"mom123outwest\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 16\", \"ts\": 1778891400962, \"up\": 0, \"depth\": 2, \"text\": \"yes, we need to fix the system for everyone. \\nMy daughter was also very active and   struggled with boredom. She could not hide her frustration as well as my son. My son was a bookworm and just resorted to escaping in books or drawing whenever there was chaos, long pauses in instruction or boredom.\"}]}, {\"id\": 1009, \"aid\": 8, \"author\": \"Christopher Marshall\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778886622024, \"up\": 0, \"depth\": 0, \"text\": \"The school system and its structure are designed for female learning and not male learning. Male and female learning are different and should be treated as so . Until this is corrected we have a failed system.\", \"replies\": []}, {\"id\": 1010, \"aid\": 9, \"author\": \"Donna Angel\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778868478912, \"up\": 0, \"depth\": 0, \"text\": \"I knew the education systems was not for boys when my sons started kindergarten. The system is about academic learning and making children sit too long. My sons' intolerance peaked in junior high school. I asked administration and teachers to bring in speakers during education week to talk about various careers that are not university-focused. They told me it's not necessary!  My sons quit in high school and my husband and I understood. One son later did ABE grades 10, 11 and 12 completely self-directed without a teacher, in eight months! My sons are smart but they had no interest in any career that required a university degree. They are working in the automotive industry and enjoy their work. I don't have the answer for a better system and I know the educators are burnt out because this system doesn't work for them, either.\", \"replies\": []}, {\"id\": 1011, \"aid\": 10, \"author\": \"ludo\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778863052994, \"up\": 0, \"depth\": 0, \"text\": \"There are a range of systemic issues in our modern society contributing to creating a \\\"non-ideal\\\" boy/young man environment:\\n\\n1) The \\\"go-girl\\\" attitudes in general, focused on female-focused successes; these permeate all aspects of society and send a strong latent (and psychological) series of implicit messages to young males - society is not routing for them. I think this a primary issue.\\n2) The number of \\\"new family\\\" types: this leaves many young males without a strong male role model, which can disengage them from being able to deal with challenges specific to males, without an understanding mentor.\\n3) Males and females DO have differences in the way they learn and think, and some of the new programs may not address this aspect very well. I am not saying that men or women are \\\"better\\\" than their counterparts, but these differences need be addressed. ADHD may not be as common, but disengagement and boredom more likely a cause. \\n4) Too many sports related focuses for males. Young boys need outlets like Cubs, Scouts, and other programs which are not as common as they were several decades ago. I think that these bonding outlets are important to help young men and boys learn to cooperate and do tactile activity OTHER than purely sports related activities.\\n5) With many new cultures integrating into Canada, I think we have lost some of the focus on what worked in the past, and with new challenges some minority males are already having to deal with within their cultural contexts, this may amplify other above issues. \\n6) The workload of parents in many cases has prevented them form taking as strong an active role in involving themsleves with their children, or being able to have a more \\\"village/neighbour\\\" situation which was more common back in the 60s/70s, and earlier. Back then, kids could stay afterschool at a friend's place and play. We have overly institutionalized our children's time when not with parents. This may have an effect on male development as well. \\n7) Society's current attitudes with males in general has affected their ability to BE men and boys. IMO, to the point where a boy may not understand what it IS to be male, and how they fit into a novel society with gender expression/expansion and being able to discover themselves within a spectrum that is now present.\\n8) It is possible that some societal changes over past recent decades has disconnected educators from these challeges and left them with little internal solutions to help reduce these impacts. An unbalanced gender representation at levels of education may also be a cause. \\n9) Virtual and actual peer pressures and social-media causes certainly amplify challenges, and even though some virtual bullying has been addressed, there may be more here than educators realize. I suggest limiting access to these media during school hours for primary schools - no exceptions. \\n10) Having too high a virtual learning tool may be putting young men into a category of diffuculty for those more \\\"tactile\\\" learning groups. This also may create or start early the path to falling behind. I think that all young peopleshould have to do a more complete learning/skills assessment earlier on to determine WHERE they are deficit and what paths to address these more early on to re-balance all students in class. This will assist educators in refining a better pathway to success for all. It is done with special needs groups, but not as common in general. \\n\\nMORE teachers are also needed - they're workload is such that they cannot or start to only be able to do SO MUCH with what they have. Not a good recipe to face these new challenges well in general. If more time and attention is needed, they NEED to have the TIME to address these with various students. This may not universally be the case anymore, where it may have been pre-1990.\\n\\nFinally: Let us remember than MEN and WOMEN are supposed to be equal. This includes all people on the gender \\\"rainbow\\\". We need to focus on PEOPLE, ABILITIES  and NEEDS, and address them all equally. If we wish successful outcomes. If the boys are falling behind, it is OUR collective fault - let's get to work providing a pathway to male success such that the result is a nuturing, wise, and productive male who can be a role model and someone to aspire to like. They don't need to be Hockey Players, or MBA stars - they need to be husbands, friends, dads, brothers, and female support (emotional/cooperation mostly) members of our communities. \\n\\nA lot of work to do, let's get this dealt with. It is NOT going away.\\nLudo\", \"replies\": []}, {\"id\": 1012, \"aid\": 11, \"author\": \"monroe2020\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778854579074, \"up\": 0, \"depth\": 0, \"text\": \"I have a 5 year old son who has ADHD, and so far he likes going to school. But he needs to be more active. And I really feel there should be more male kindergarten teachers. There would be a big improvement in these boys lives if they had one. \\n\\nI did ask the Principal at my son’s school about hiring male kindergarten teachers, he gave me some answer about looking into it. I don’t believe there are many out there who want to teach young children, but they should be paid more as an incentive or something.\", \"replies\": []}, {\"id\": 1013, \"aid\": 12, \"author\": \"norwester03\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778844004872, \"up\": 0, \"depth\": 0, \"text\": \"The bar is raised high for boys compared to the other percentage in their class. They become underachievers as comparison is too favorable for the girls in grading and recognition, acknowledgment and what previous commenters have said it is true that going against our impulse to be confined in sitting and lack of male roles in the education system and being taught to repress our natural instincts and conform to something that has boys discouraged and feel not treated equitably after putting in same determination and effort and yet feeling that they cannot measure up to the expectations around them. Most boys especially due to life circumstances have chosen to drop out to support their family or a widow in family and would find labor and energy - fueled employment adopting new skills and trades that paid well and provided for the community / economy and employers didn’t require a high school diploma for these career paths. Perhaps every school in Canada differs but follows same protocol and curriculum set by the Education board and is trying to diversify and not leave one of the student body feel left behind and disadvantaged and yet as boys are continually criticized pushed with unreasonable expectations and yet not given the patience time and attention to succeed with the tools that will help them with feeling self validation and have the proper manageable mental health that carries into their adulthood and maturity. No blame can be all on one side, the environment nurturing in safe place within the home and the institution that molds and inspires and encourages everyone to be driven to succeed academically and to be motivated after school graduation so that they see the skills talents that they have honed and been blessed with. \\nI thank the opportunity for me to be able to share my own experience and to do so without bias just observation of what was observed within our schooling system in early 2000’s\", \"replies\": []}, {\"id\": 1014, \"aid\": 13, \"author\": \"olivia\", \"ini\": \"O\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778810699074, \"up\": 0, \"depth\": 0, \"text\": \"I think the way this issue is approached in the article is all wrong. I saw someone else mention on this discussion board that the issue for boys begins much earlier than school and extends much later - I agree. We are raising our boys from birth in such a different way than we are raising our girls. Not teaching them to sit still, to listen carefully, and very importantly not encouraging them to read. There is certainly an aspect on the school's end that students are expected to sit still for far too long, however, this is an issue that affects girls as well as boys. The girls simply respond differently and tend to find a way to manage due to differences in expectations from birth. Also, this article cites learning disabilities/ADHD as a reason boys are struggling more, saying that the rates of learning disabilities/ADHD are higher in boys. This is a great moment to consider that the rates are higher due to an underdiagnosis of learning disabilities in girls, which is a well-documented issue. Many girls are diagnosed later in their teens or early adulthood with learning disabilities/ADHD after they have burnt out from trying to manage for so long. The solution to this is not a changed/special curriculum for boys. The solution is much broader than that and will need to be a combination of school adjustments, parenting adjustments, and perhaps some government laws particularly around screen time for children (known to cause attention span issues.) Overall, the wrong way to frame this issue as schools disadvantaging boys, because that is simply not true.\", \"replies\": []}, {\"id\": 1015, \"aid\": 14, \"author\": \"Lesley McVey\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778804480247, \"up\": 0, \"depth\": 0, \"text\": \"I believe that boys would do better (and so would girls) in gender specific schools after age12.  Having boys and girls together during those unsettled years of puberty puts unnecessary extra pressures on them to the detriment of concentrating on schoolwork.\", \"replies\": [
