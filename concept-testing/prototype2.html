ook like them in positions of intellectual authority and care. \\n\\nSecond, Ontario should decolonize and diversify the curriculum so that Black and Indigenous students are not only discussed through trauma, slavery, residential schools, or deficit narratives. Their histories, philosophies, leaders, legal traditions, scientists, artists, entrepreneurs, and communities should be part of the regular curriculum.\\n\\nThird, literacy should be treated as an equity issue. Boys who struggle with reading and writing need early intervention, culturally relevant books, structured literacy support, and smaller group instruction before they become disengaged. \\n\\nFourth, Ontario should reduce exclusionary discipline. Suspensions often remove students from learning and deepen the very behaviour and academic problems they are supposed to solve. Restorative practices, mental health supports, family engagement, and culturally appropriate intervention should be used before students are pushed out.\\n\\nFifth, high schools should start later. Teenagers need sleep, and later start times can improve attendance, attention, mental health, and learning. Sixth, schools should consider shorter periods, more breaks, and more active learning through projects, co-op, trades, arts, entrepreneurship, outdoor education, debate, and community-based learning. This is not about lowering standards. It is about creating more ways for students to enter academic success.\", \"replies\": []}, {\"id\": 1078, \"aid\": 74, \"author\": \"Evanthia K\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778643342037, \"up\": 1, \"depth\": 0, \"text\": \"I think there are many factors, here are some based on my observations as a mom of boys:\\n1) there is a lack of good male role models at home and schools, society in general \\n2) education system is failing boys\\n- most teachers in elementary schools are women and unless they’re mothers of boys they do not understand boys and are quick to punish them or immediately label the boys or request for them to be assessed for either learning disabilities or ADHD; female teachers in general do not know how to handle boys and scream a lot in class \\n- girls are encouraged to succeed academically more than boys \\n- the literary reading material and topics in the classroom has forced boys to lose interest and focus, there are no more male heroes in all the books they read and in most cases the male character is a villain … quite frankly some of the books the kids are forced to read in school today are disturbing \\n- the curriculum needs to include more sports or physical activities as well as non academic courses like whatever happened to home economics and woodworking classes or even offer basic life skill classes like learning to change tires where both boys and girls can learn or team up together to learn how to work together \\n3) one or both parents not being present at home to provide guidance and open lines of communication \\n4) online content has become almost impossible to police, control and restrict as a parent especially as the boys get older and become more tech savvy than the parents \\n5) the pandemic did not help boys; the isolation during the lockdown destroyed their social circles and not being to play sports during that time was not easy for active boys \\n\\nIn the high school level more male teachers are needed in the education system and if required invite more male professionals or entrepreneurs or tradesmen to talk to boys once a month to show them options of what is available outside of schools or provide mentorship to boys. \\n\\nSports or physical activities should become more accessible especially after school and on weekends. \\n\\nParents should be encouraged to learn how to be more aware of the online dangers or given workshops at kids’ schools on how to monitor their kids’ online activities.\", \"replies\": []}, {\"id\": 1079, \"aid\": 75, \"author\": \"parent33\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778642044710, \"up\": 0, \"depth\": 0, \"text\": \"Consequences would help. There are no more consequences due to the parents being too involved in the kid's lives to the point the administration is terrified of being targeted online. Too many permissive parents outraged about their dysregulated, entitled children who trashed a classroom got suspended. Or the fact that they can't fail a grade. Or IEPs to lower the bar ( that's already on the floor). Why should I work my butt off to write 5 pages while Timmy who has autism and a behavioral problem can write 2 sentences and keep moving forward? What's the incentive? Why should they try? They need consequences and goals, especially boys. They need healthy competition. Young men are angry and unfamiliar to failure by the time high school and university come around that they can and will react violently and impulsively when they don't get things their way. We are raising babies, not strong men who can embrace and express their feelings in healthy ways. We're not setting them up for success. Put more money in sports, arts and music programs in elementary schools. Send unacceptable behaviors home. Fail kids who put in no effort. Stop giving parents that amount of power and make going to the principal's office an intimidating experience again. Oh, and make a law that prohibits children from having phones/YouTube/tiktok until 16 years of age. Every behavioral problem or learning disability I've seen were the kids who had access to those platforms. School can't compete with the dopamine rush of phones, so their nervous systems freak out when it's boring or difficult.\", \"replies\": []}, {\"id\": 1080, \"aid\": 76, \"author\": \"Marilyn Elliott\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778641853124, \"up\": 1, \"depth\": 0, \"text\": \"In the early 1970’s, I read a book by A.S. Neill who started a school called Summerhill.  He believed boy’s brains developed later than girl’s brains and forcing boys to attend classes before they were ready to learn did immeasurable damage. He believed boys should attend school and play sports or other such activities and when the boy was ready to learn, his brain would soak up knowledge like a sponge. Our school system is set up to accommodate teachers, and students must conform. Summerhill school still operates. I suggest you seek out his book and read it.\", \"replies\": []}, {\"id\": 1081, \"aid\": 77, \"author\": \"Leesha C\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778641741223, \"up\": 2, \"depth\": 0, \"text\": \"Follow Japanses schooling system. Showing kids about respect, accountability, responsibility and pride.  Our kids are ways to spoiled especially boys.  They think they know at all, it is our society and up bringing, lack of respect, gratitude and patient practice and focus.\", \"replies\": []}, {\"id\": 1082, \"aid\": 78, \"author\": \"T Ro\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778641494099, \"up\": 0, \"depth\": 0, \"text\": \"The persecution of young men is finally beginning to show some consequences.  You can’t have girls only summer camps and girls only scholarships and girls only social clubs before boys start to feel like second class citizens.  2/3 of university graduates are female.  Young men realize very early that the current system is stacked against them.  No matter how hard a young man works he will never get rewarded on the same level as an equal female. If you don’t believe me take a look at the local high school graduating class and look at how many scholarships aren’t available to young men because they committed the sin of being born male. Congratulations to the CBC for having the courage to produce a segment that runs counter to the current cultural zeitgeist.\", \"replies\": []}, {\"id\": 1083, \"aid\": 79, \"author\": \"Jennifer Blake\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778641290554, \"up\": 0, \"depth\": 0, \"text\": \"I doubt there is any one reason, but I do think that our current mantra that everyone is different is missing the social dimensions of childhood of learning and motivation. Suggesting or acknowledging that- for the most part, boys and girls are different is challenged by   how to hold that and also recognize the needs of the gender diverse. Increasing physical exercise makes sense.- moving our bodies is vitally important- not elective. I went to a public school but in most of my elementary school the classes were all girls or all boys. I would like to know: Are boys falling behind and dropping out in the schools for boys?\", \"replies\": []}, {\"id\": 1084, \"aid\": 80, \"author\": \"Denise Kemp\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640986228, \"up\": 0, \"depth\": 0, \"text\": \"Boys are made differently. They are active, high energy, chaotic and girls are the complete opposite. Boys need to be taught differently. In the ancient ways boys were taught self defence, aggression, strategy. Boys have not changed. Our way of teaching is based on the way girls learn. Teach boys through strategy and activity. Place their attention on challenges that trigger those aspects of what they are made for.. it will not only enable learning but raise their self esteem as well.\", \"replies\": []}, {\"id\": 1085, \"aid\": 81, \"author\": \"Erin C\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640876962, \"up\": 0, \"depth\": 0, \"text\": \"seems to be generalizing on both sides...\\n\\non average, girls are socialized to perform better at collaborative and focus work at earlier ages, and school is (currently) designed more to that strength \\n\\non average boys are underperforming but are also socialized to allow them to be more boisterous or have less consequences to acting out which doesn't align with current learning models\\n\\nhowever...\\nindividual girls might want to be allowed to nonconform with these norms or face similar allowances to disrupt \\nand \\nsome boys might want to be more focused or collaborate but are socialized to compete/run around to not be seen to be different \\n\\nwe need school options for everyone \\na mix of learning and active elements at younger ages giving choices for l learners\\nbetter alignment of grade levels - both moving up the kids who are ready and a shame free way to hold back those who are not\\nand teachers with enough flexibility and small enough class sizes to individualize programs vs pivoting to the average\", \"replies\": []}, {\"id\": 1086, \"aid\": 82, \"author\": \"Heather Moffat\", \"ini\": \"H\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640844560, \"up\": 0, \"depth\": 0, \"text\": \"Boys require more physical activity throughout the day. \\n\\nThey also need to understand their emotions, fear, sadness, happiness, not just anger.\", \"replies\": []}, {\"id\": 1087, \"aid\": 83, \"author\": \"Luke Derksen\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640837782, \"up\": 0, \"depth\": 0, \"text\": \"As a millennial man, I grew up both with and without the advanced technology we have now. I believe that is one problem. The other I would say, is that many of my female teachers would never recognize my needs as a boy and would overlook everything I did as trash. I think female teachers need to treat boys with respect.\", \"replies\": []}, {\"id\": 1088, \"aid\": 84, \"author\": \"Ralph Furley\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640812317, \"up\": 0, \"depth\": 0, \"text\": \"Canadian society and the Canadian education system has changed too much and has changed for the worse. Schools no longer have a school nurse. A lot of schools do not have enough counselors. Sports has been taken away from many Elementary School students as well as high school students. Children and young teenagers need to have exercise to drain the excess energy while learning sportsmanship, teamwork and improving all of their skills and abilities. The new \\\"woke\\\" method is turning our boys into feminine versions of themselves. \\n\\nI have been overseas to multiple countries and the education system is the same as Canada used to be in the past. Recess is filled with playtime and there are lunch intramurals for students who want to have fun during their break time playing sports and games. There are no more clubs for students to join and that is a huge problem not to mention that most students have both parents working and no one to drive them to and from soccer or baseball practice. Children used to play an organized sport for their school and a lot of the times the same sport for their community. Even the USA still has a very normal school system and curriculum but because Canada wants to be this new style of Education, the Educators need to accept the blame for this. For example at my son's Elementary School, they have banned playing soccer at recess and lunch because people have been getting injured but that is a normal passage of life. The feminization of boys in this country is going to lead to huge issues and problems. Let boys be boys and stop trying to make them what they are not. Boys climb trees, ride bikes, skateboard, do gymnastics, play team sports, and enjoy their childhood and if they are allowed to enjoy their childhood they will be normal boys who do their homework and try to do their best in school.\\n\\nMy son and daughter go to the same Elementary School. Sports day at the end of the year is ridiculous compared to what we all had growing up in Canada. They have taken away Mother's Day and Father's Day and the school only celebrates family day. They are not allowed to celebrate Halloween because it might offend someone and the Christmas concerts that we all grew up to are now gone.\\n\\nThis is my honest opinion and I should be allowed to voice my honest opinion without AI telling me that I'm going against Community guidelines because that is just complete and utter censorship and that is not what life should be about.\", \"replies\": []}, {\"id\": 1089, \"aid\": 85, \"author\": \"Dirk Lepage\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640788442, \"up\": 1, \"depth\": 0, \"text\": \"Boys need to move. Studies abound that  have shown that intermingling exercise and shorter study periods improve concentration and academic success. Boys and girls  should have treadmills and stationary bikes accessible especially in grade school.\", \"replies\": []}, {\"id\": 1090, \"aid\": 86, \"author\": \"canadaproud67\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640718510, \"up\": 0, \"depth\": 0, \"text\": \"As a police widow with a late husband who had a very strong personality in childhood and as a father, helped me raise our two boys, I agree boys at younger ages especially may need more physical programs not sitting and listening. Classrooms can be hard for active youngsters. I also feel teachers and parents need more support for challenging boys based on accepting their vigour with age appropriate accountability the child is also empowered to meet. It can be hard to raiae an active boy without making the child “the bad kid”. My husband was a handful, but also crazy smart, caring but sometimes misunderstood. He was successful as an adult thanks to strong parenting, a mother who was very communicative with teachers, and he thrived with structure. Not so much without. These folks, male or female need understanding not frustration, acknowledgement not labelling.\", \"replies\": []}, {\"id\": 1091, \"aid\": 87, \"author\": \"Ben R\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640708802, \"up\": 0, \"depth\": 0, \"text\": \"I feel that adopting more of the Danish and Nordic approach in Canada with less early academic pressure and obsession over grades, more free play and outdoor activity, greater independence, and more focus on social development, resilience, and well-being  could drastically improve the confidence, mental health, and overall development of many young boys.\", \"replies\": []}, {\"id\": 1092, \"aid\": 88, \"author\": \"Eric Gervais\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778640620530, \"up\": 0, \"depth\": 0, \"text\": \"In my honest opinion, there isn't enough physical education. I have 2 sons and they only have 1 clasee per week. It just isn't enough..\", \"replies\": []}, {\"id\": 1093, \"aid\": 89, \"author\": \"Joe Grubb\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778639276819, \"up\": 0, \"depth\": 0, \"text\": \"Our society idolizes sports stats, actors, etc, and we do the same with careers. Kids are told they need to work hard starting in grade school so you can become a doctor, lawyer, engineer etc, and you need to go to university. What does this do for kids confidence that do not have the learning skills at a young age. Kids in school are not aware of the many careers that do not need university degrees. The smart kids will find their way to university - both girls and boys. We need to promote the skills labour or other professions offered at college's. These jobs are not given the same respect as University education. It starts in grade school to promote college degrees, the same way society idolizes that of a university degree. Then in high school, the guidance councillor's to emphasis the college path. There is nothing wrong in a student going to college first, then going to university with more maturity. The first step is to educate society that college skills are more important than becoming a lawyer :)\", \"replies\": []}, {\"id\": 1094, \"aid\": 90, \"author\": \"farmer\", \"ini\": \"F\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778639225383, \"up\": 0, \"depth\": 0, \"text\": \"Lack of ambition, failing to launch, mental health challenges, suicide!! Boys dont even rebel the same anymore. I have a daughter that is a farmer. Fully educated, socially capable, supports community, and will be able to run a large farming operation. Our other daughter equally capable but not a farmer. Our son is also capable but he doesnt know it. Stuggles with confidence, social situations, stressful situations, even time managment. My wife and I raised the kids the same. Solid fundamental parenting, lots of love and structure. Consitancy and discipline. Why the differance?? Society and its pressure on males to be less. It starts in toddler play groups and is compounded every step of the way as they mature. In societies push for women's equality, which was well over due,  boys suffered by being less. This is not equality. Unfortunately as women were empowered to be more boys are actually suppressed. It wasnt ment to happen but it has. Strong independent women need strong independent men! Trust, respect and compassion is what needs to be the early focus. Genders will figure it out.\", \"replies\": []}, {\"id\": 1095, \"aid\": 91, \"author\": \"jacques59\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778638863991, \"up\": 0, \"depth\": 0, \"text\": \"The impossible solution would be by establishing a 50/50 ratio between men and women as school teachers and not 98% women a 2% men as it is everywhere in primary schools.  Boys would find there place naturally.  I've been a suppleant teatcher for 7 years.  Taught thousands of children, grade 1 to 12.  Believe me.\", \"replies\": []}, {\"id\": 1096, \"aid\": 92, \"author\": \"ski\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778638110795, \"up\": 0, \"depth\": 0, \"text\": \"My son completely thrived in an alternative elementary program rooted in Scandinavian education practices. Learning through play and outdoor classrooms gave him an incredible foundation. Unfortunately, that beautiful approach abruptly ended when he entered high school. Transitioning from active, nature-based learning to a traditional, desk-bound environment has been a massive hurdle for him.\", \"replies\": []}, {\"id\": 1097, \"aid\": 93, \"author\": \"Al-hafiz Virani\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778637230669, \"up\": 0, \"depth\": 0, \"text\": \"All the focus on Girls and Education and Girls are strong Girls are betrer, Girls can do it and Girls self-esteem ads and girrls only activities and over focus on Girls education and personal growth has left behind the boys as the boys do not get the same access or support. It should have been for both not a focus only on girls as boys also have the same issues. I know, I have been a teaxher afor 23 years. Growing up in the 90's I always felt it unfair that we boys did not have the same suport. Girls are encouraged, boys are discouraged especially for indeoendant or creative thinking. I could not understand how my sister got special marks for cresrive thinking for literally turning in a projext I did 100% for her but when I turned in nearly the same project for my class I was given zero for  going out of the box and not sticking to the scope of the project rather than being rewarded for the extra work. The projext was to invent a  board game. I invented a 3d board game with marbles and bridges and levels. Same project, two opposite results. I saw this later with complete focus on girls throighout the 200's and especially today; focus on training, girl power motivation ads, \\\"we are betrer than boys, we too can win at sports\\\". Not bad to motivate Girls abd help their self-esteem, I fully agree except please don't ignore the boys who suffer from the same issues. Even mental health education is primarilly to girls and girls issues like body image. I have been a teacher for 23 years and see the effect it has on the boys. They feel and have they are being left out. They know and they feel it. Boys also need mental health suport, educarional support and learning catered to them. But I agree with cbc, educarion primarily focuses on the way girls like to learn - but teachers beed to be taught that boys can learn if in a different way. A teaxher threw out a boy from her class, and a few minutes with me and I told him he was smart, that he could do this, because I believed in him. Teaxher was shocked that he finished the entire lesson for the fi. rst time tjat year. I told the teaxher what to do. Next lesson? She went baxk to the old way and threw him out for just not following along. (I was also throw out as a kid until they found out I had ADHD and Autism. I had the lowest scores and even failed a grade . Teacher acused me of being mentally retarded and and an IQ test proved I was not. Later when I got older where school required more crearivity in college technology and art classes, English literature , etc  90-100% grades.  So what was the difference? The support and acceptance of beinf crearive and not having to fail because you did it a different way and didn't colour in the lines but being rewarded for figuring it out\", \"replies\": []}, {\"id\": 1098, \"aid\": 94, \"author\": \"John Dammeyer\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778637103078, \"up\": 0, \"depth\": 0, \"text\": \"I read the first of what is now a 4 book series on this over 20 years ago.  Published in 2001 \\\"Spreading Misandry\\\" by Paul Nathan's and Katherine K. Young is an in depth look at how society views males and how subtle the signals are.\", \"replies\": []}, {\"id\": 1099, \"aid\": 95, \"author\": \"Kelly Cooper\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636831790, \"up\": 0, \"depth\": 0, \"text\": \"I should have added to my previous statement - we don’t have just a boys crisis - we have a men crisis.\", \"replies\": []}, {\"id\": 1100, \"aid\": 96, \"author\": \"tomf\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636807047, \"up\": 0, \"depth\": 0, \"text\": \"Part of the issue is the high degree of females in the early years schools. Male teachers think and act differently than female teachers; not with regards to pedagogy, but thinking about interactions, acknowledging the need for much more physical play, “dad jokes”, bringing in stories activities that appeal to boys. Having watched many female educators restrict certain types of outdoor play for the boys, this bubble wrapping seem to stifle outdoor creativity and their need for active play. I often observed stories and activities that interested the girls, but not necessarily the boys. The movement to engage and encourage girls has been very successful, but it may have been detrimental to the needs of the boys.\", \"replies\": []}, {\"id\": 1101, \"aid\": 95, \"author\": \"Kelly Cooper\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636737221, \"up\": 0, \"depth\": 0, \"text\": \"We need social and emotional intelligence in the schools.\\n\\nWe need men / fathers who role model these skills.\\n\\nWe need to help families with understanding that different roles between men and women is ok - with home and work responsibilities. ie. Evolve from the traditional roles to show it’s acceptable to have women bringing home the bacon and men doing the home front without judgment.\", \"replies\": []}, {\"id\": 1102, \"aid\": 97, \"author\": \"Skylar Petrah\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636671259, \"up\": 0, \"depth\": 0, \"text\": \"Boys need true role models from their early age. Way before school begins. It is very heard to expect a teacher to raise one’s child when at home things are not going well and the child has no moral grounds that will shape him as he grows up. \\n\\nWhat is the kid watching at home, are parents finding time to communicate or is daycare and Nannies doing the job? \\nIs the gaming and social media being regulated from early age? Because it’s going to be hard as they turn into their teenage with no foundational knowledge that shapes them into responsible kids both at school and in the adult phase. \\n\\nYou can see this with even mature men who one can easily tell that their childhood was not well and yes, mental health will be at a play.\\n\\nIt’s really hard but it does take a village to raise a child and teachers won’t do it alone if at home parents aren’t starting early to prepare their children for the world both at school and home.\\n\\nJust my thoughts.\", \"replies\": []}, {\"id\": 1103, \"aid\": 98, \"author\": \"Robin Brinos\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636603137, \"up\": 0, \"depth\": 0, \"text\": \"We all agree there is a problem - we all know the answer - physical stimulation + discipline , more male teachers , nutrition programs - will politicians act or just commission more studies - analysis paralysis!\", \"replies\": []}, {\"id\": 1104, \"aid\": 99, \"author\": \"Grant Richards\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778636167879, \"up\": 0, \"depth\": 0, \"text\": \"The \\\"progress\\\" of society has overridden the true nature of the male.\", \"replies\": []}, {\"id\": 1105, \"aid\": 100, \"author\": \"Kerrie Jaques\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778635428575, \"up\": 0, \"depth\": 0, \"text\": \"This is entirely normal any more. Systemic misandry is everywhere. Just watch tv for a night; if there is a buffoon, an idiot, a loser, etc it's always the man. Teen TV is even worse. Women are allowed into medical school, law school, and doctorate programs at a higher rate than men. Suicide rates are much higher among men, so nothing is done about it. Violence against men is be coming more and more common on social media, and nothing will be done about it. But if the roles were reversed.... Boys are falling behind in school... nothing  be done about it.\", \"replies\": []}, {\"id\": 1106, \"aid\": 101, \"author\": \"Bethany Kuntz\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778629603693, \"up\": 0, \"depth\": 0, \"text\": \"I would be interested to see if this is a problem specific to boys or a problem specific to ADHD, which affects both boys and girls, but predominantly boys. If ADHD is the cause and not gender, then we need to identify that as the root cause so that girls with ADHD don’t get left behind in the proposed solutions.\", \"replies\": [{\"id\": 1107, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778631605146, \"up\": 0, \"depth\": 1, \"text\": \"This article is not well-written: girls have the same rates of ADHD etc. They are just diagnosed later, usually around 13.\"}]}, {\"id\": 1108, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778628964430, \"up\": 0, \"depth\": 0, \"text\": \"There are many studies of this over decades all around the world:\\n\\\"It seems to be that girls are finally being rewarded in the form of college attainment and more equal pay for their efforts\\\"\\n\\\"There’s not much solid evidence that boys do better with male teachers. And girls have been getting better grades than boys since before women had the right to vote\\\"\\n\\\"Only a quarter of superintendents, who are in charge of multiple public schools or districts, are women\\\"\\n\\nIts troubling that, now that girls are not hindered from taking certain classes or continuing into higher grades/levels of education, suddenly people talk about \\\"giving boys a boost up\\\". What about the MILLENIA and CENTURIES that girls and women could not get an education?? Universities used to say there is \\\"no point\\\" in educating women to IE: engineering, since they wouldn't be allowed to have those jobs anyway!\\n\\nThis is the first generation that girls are not DISCOURAGED or outright refused a proper education, and they are blazing ahead. This is the first time girls are NOT disadvantaged and they are succeeding. To say the boys \\\"need help\\\" is laughable considering they had all the advantages for multiple centuries.\\nNow that things are equal amd the girls are doing better, people want to \\\"help\\\" the boys. They had ALL the help for all of history now when things are fair the results speak for themselves.\", \"replies\": []}, {\"id\": 1109, \"aid\": 102, \"author\": \"Jack Abbott\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778625257103, \"up\": 0, \"depth\": 0, \"text\": \"The education system will go on to fail them forever, and we see the results in our city streets, in the subway, generations of homeless men lost due to lack of role models, inspiration, purpose and leadership. All the decades of talk of giving them more gym time and hands-on learning overruled out by stakeholder discussions of \\\"boosting subject time allocation in core subjects\\\" and \\\"raising test scores\\\". How often do we ask what interests them? Our teachers are better trained than ever, surrounded by technology and online resources, and yet we cannot meet the most basic needs of boys: give them sports, outdoor adventures, constant movement, hands-on learning, an inspirational teacher with a sense of humor, a chance to explore the outside world and a curriculum that will help them manage all the challenges of life. We can endlessly say that these things are not practical or feasible for our schools, that they fall on parental responsibility, and that there are more important things to address. Talk is cheap. For once, say yes and give it to them.\", \"replies\": []}, {\"id\": 1110, \"aid\": 103, \"author\": \"Arthur Pelton\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778621634663, \"up\": 0, \"depth\": 0, \"text\": \"Academic achievement is not rewarded or encouraged in boys, neither by parents nor peers.  Far more emphasis is placed on excelling in sports.  In fact, academic achievement can often be actively discouraged through labels like \\\"sissy\\\" or \\\"brown noser.\\\"\", \"replies\": []}, {\"id\": 1111, \"aid\": 104, \"author\": \"betty maurice\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778615231422, \"up\": 0, \"depth\": 0, \"text\": \"A very interesting article.  I also read the one from the NYT, which was similar.  There was also some excellent solutions in both articles.  But we know that solutions take a long time to work their way to the decision makers.  Despite some gains over the years, women remain in fewer management roles, holding 42.7 per cent of middle management and 30.8 per cent of senior management positions, according to Statistics Canada data from 2021.  I would be interested  in hearing comments about why this exists.\", \"replies\": []}, {\"id\": 1112, \"aid\": 105, \"author\": \"joseph beaudin\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778614446106, \"up\": 0, \"depth\": 0, \"text\": \"Boys are falling behind because the system is not allowing them to be boys, This is not rocket science , the system decided that boys need to be trained out of male toxic behaviours, except a certain amount of that is biologically who we are . Then on top of that the current male is subject to increasing , men are bad, men suck at this and that. We must understand the differnces between the sexes and modify the system to accommodate that.\", \"replies\": []}, {\"id\": 1113, \"aid\": 106, \"author\": \"Maggie Baer\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778614333846, \"up\": 3, \"depth\": 0, \"text\": \"As mom to four sons (all grown up now), I am grateful for my journey of learning all about \\\"boy-world.\\\" It has been radically different than my own girlhood. \\n\\nI learned that boys thrive with physical activity and hands-on challenges like building and creating things.\\n\\nMy boys survived the endless hours of sitting still in classrooms by reading a the back of the classroom quietly. \\n\\nHelping more boys learn to to read earlier would boost them more than any other effort -- fuelling their imagination, building their confidence, and equipping them with life-long communication skills.\\n\\nBut even my quiet, compliant sons found their happiest place in sports -- in school and extracurricular. Recess games, competitive teams, tournaments -- these are their highlight memories from K-12. \\n\\nOne last point: more male teachers in primary school would most certainly provide crucial mentors to young boys. Positive adult models are essential for all kids, and sadly, many boys are missing this key link in their early development.\\n\\nLet's borrow some of those best practices from Finland!\", \"replies\": []}, {\"id\": 1114, \"aid\": 107, \"author\": \"Sarah Morris\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778613694826, \"up\": 0, \"depth\": 0, \"text\": \"This is interesting, I don’t believe this should be seen as disadvantageous for boys but rather an example of girls pressure to be exceptional and to beat standard. Sitting still in a classroom is disadvantageous for both boys and girls, however girls receive attention and appreciation for their behaviours especially in a class setting. Where boys unruly behaviour is excused as their temperament, even this article perpetuates this patriarchal perspective.\", \"replies\": []}, {\"id\": 1115, \"aid\": 108, \"author\": \"Dee Adams\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778612845226, \"up\": 0, \"depth\": 0, \"text\": \"School is boring. It is now being used as daycare so parents can work. We keep youngsters trapped inside all day until they are 16-18 years old. Some like to learn but no one needs 8 hrs a day for 12 years to learn what  is taught in the schools this article refers to. Shorten the school year and school day and let kids have meaningful jobs! There is absolutely no reason to keep up this jail sentence for children!\", \"replies\": []}, {\"id\": 1116, \"aid\": 109, \"author\": \"Ian Brown\", \"ini\": \"I\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778610178627, \"up\": 4, \"depth\": 0, \"text\": \"There's nothing new here.  Dr. Leonard Sax wrote about this 20 years ago (see his book Boys Adrift, published in 2007), in which he describes the research on the negative effects of video games, changes at school, medications, endocrine disruptors, and the lack of role models for boys.  I was a school psychologist for 34 years and saw first-hand how quickly boys get turned off school and fall behind.  Now I volunteer in a primary class and see the girls enjoying learning and moving ahead, while the boys lag behind and are discouraged.  Boys learn differently than girls, and need to be taught differently, including the opportunity for more movement.\", \"replies\": []}, {\"id\": 1117, \"aid\": 110, \"author\": \"Paul Greenspan\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778609947424, \"up\": 0, \"depth\": 0, \"text\": \"Oh please. I taught for 24 years, just leaving 6 months ago.Boys always are shown more favouritism.In the article it states that boys are more active.Seriously? That seems to be a gender bias and generalization I am not willing to make.Seems like a colossal step backwards.I spent years telling girls that they were just as smart in Math and Science as boys . One parent in the article is scared her son won't be successful in the space so will give up!! Seems like a parent job not to let your child give up.This is such a step back in time.All children ,I taught ,were taught as individuals not boys or girls.\", \"replies\": []}, {\"id\": 1118, \"aid\": 111, \"author\": \"Mark Goldberg\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778608920302, \"up\": 1, \"depth\": 0, \"text\": \"the article alluded to a key issue in learning, at any age: passive versus active. the former is what is prevalent at all levels (i teach in university and it applies there equally, namely the reliance on lectures and large classes) and what many people need, especially boys, is an active environment for learning. unfortunately the educators favour the former and this is what is taught, i believe, in educational curricula. women often do much better in a passive environment and given that they make up the majority of the teaching workforce the tendency will be to enforce that model and not likely appreciate that not everyone learns that way.  much \\\"hyperactivity\\\" is a result of this model being imposed on children. richard feynman, one of the most brilliant physicists who has ever lived, understood that clearly and indeed he wrote about that in some of his essays on learning.  it was not \\\"understanding\\\" quantum mechanics that led\\nhim to discove a new method to approach quantum electrodynamics and solve very fundamental problems that no one else could. this monumental achievement was derived partly from his view of different models of learning and discovery. (he talks about the learning journey in more detail and i would encourage anyone interested in reading this.)  the old story  that Einstein was so bored in school he almost failed was an indictment of the school system then. we sent our children to an alternative elementary school (Nouvelle Querbes in Montreal) where the standard method of rigid teaching was replaced by a flexible project-based active model that was used from grades 1-6. this active-based model was developed many decades ago in England, and maybe elsewhere, and was called the Summerhill model. parents are asked to be part of the teaching: my wife, also a prof in university, and i helped out in the classroom. many parents have workshops: a jazz drummer gave acweek's long percussion workshop to grade 1, and this is where we learned our son was a musician. i taught electromagnetism to grade 1s using screwdirvers, speaker wire, paper clips and a battery. all the kids participated in the \\\"experiments\\\" and they learned, witha lot of fun,  some fundamental physics that normally would not be taught till grade 10 or cegep. our daughter, who is more of a passive learner and not brilliant in math, is now a veterinarian running her own clinic. the success stories abound. \\n\\nthese active  models are there, they have been shown to work so there is no reason not to implement them \\n\\nmark goldberg, phd\\nprof, dept of medicine, mcgill\", \"replies\": [{\"id\": 1119, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778615882316, \"up\": 0, \"depth\": 1, \"text\": \"Was the alternative school private and available at a fee? Just curious if there is a facilities issue in public education if the Summerhill method were to be implemented.\"}, {\"id\": 1120, \"aid\": 111, \"author\": \"Mark Goldberg\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778620118338, \"up\": 1, \"depth\": 2, \"text\": \"public school in montreal, in s building that dates back to the 1920s, i believe. there was also a high school using the method; not sure if they still do. no extra facilities required. it is all about how one structures learning. in this school 1/3 of the kids were from different grades and they had the sane teacher for 3 years. instead of some person standing at the front of the class talking, they had workshops and not all of the kids had to go: e.g., a grade-1?level arithmetic class woukd only have grade 1s. lots of social interactions between ages and conflict resolutions that are reminiscent of what many native people do. projects were defined by the kids (my dsughter did projects on greyhiunds, world war 2, and others). the n projects had to comprise various aspects if learnjng (eg. math, science, geography, the arts), they were encouraged to do their own research, parents were encouraged to help out. etc. similar to how we teach our graduate students, which is very active and not in the least passive. the current school system really is quite the failure -grade F, in my opinion. in the early 1970s i visited an open school in Oxford (public in our sense of the word), UK, that was structured like this. north americans continue to be decades behind the europeans in so many ways...\"}]}, {\"id\": 1121, \"aid\": 113, \"author\": \"S W\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607906379, \"up\": 0, \"depth\": 0, \"text\": \"The education model originates from the 1850s to keep children off of the streets and supervised. To train them to sit still for future work in the factories. One could say that model still exists to some extent today. It is a matter of maturity - girls are generally more mature and able to sit and listen longer than boys. Boys tend to be more physical and need to get out and run around often. It also has to do with emotional maturity - boys are not encouraged to express their sadness the way girls are. The focus of schools is more about academic testing and grades instead of actual learning. Children feel shame when they compare their marks to their peers. Children should be allowed to learn at their own pace and be able to pick and choose what they want to learn and how they want to learn it.\", \"replies\": []}, {\"id\": 1122, \"aid\": 114, \"author\": \"Ken Breadner\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607713663, \"up\": 0, \"depth\": 0, \"text\": \"And what about those boys who do well? Does nobody even look at how they differ from those who don't? No, instead those boys are called nerds, geeks, and every manner of gay slur imaginable....and then beaten up by the lunkheads.\", \"replies\": []}, {\"id\": 1123, \"aid\": 115, \"author\": \"Bernadette Warren\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607648451, \"up\": 1, \"depth\": 0, \"text\": \"While raising my now adult children, I was happy to discover all the programs available to support and encourage my daughter.  I was dismayed to find there we no such programs for my son.  In fact it was difficult to find male role models in media, outside of sports figures, with most men at the time being portrayed as the \\\"bumbling fool\\\".  I am a feminist and strong champion of women's rights, but one gender should never be upraised at the expense of another.  Children need access to the best educators who understand that we all learn differently and there is no one size fits all.\", \"replies\": []}, {\"id\": 1124, \"aid\": 116, \"author\": \"Andrew Vernet\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607493275, \"up\": 0, \"depth\": 0, \"text\": \"Middle school 25 years ago- Unified Arts room- shop, family studies/home ec, specialist in visual arts/band or strings/dedicated science lab. And the full time guidance counsellor. ALL GONE. Replaced by \\\"kits\\\" and expert opinions.\", \"replies\": [{\"id\": 1125, \"aid\": 110, \"author\": \"Paul Greenspan\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778610780837, \"up\": 0, \"depth\": 1, \"text\": \"We still have all those things in our middle school.Girls and boys take shop together then do a rotation of cooking together, then do a rotation of art or band.\"}]}, {\"id\": 1126, \"aid\": 116, \"author\": \"Andrew Vernet\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607198876, \"up\": 0, \"depth\": 0, \"text\": \"Where is it written that \\\"boys are more active than girls\\\"? Is this a perpetuated cultural expectation or is it based in some genetic code? These huge generalizations are not helpful. Please review the opportunities students had for varied learning some 25 years ago. Shop class, home ec, a visual arts specialist, band and strings, the guidance counsellor in a middle school, the librarian, etc. etc. All these services and opportunities have been removed or replaced with half-hearted efforts from the Provincial government. Education is expensive, but it is planting a seed from which we hope a return will be very fruitful. Don't cheap out and rely only on the words of an \\\"expert\\\".\", \"replies\": [{\"id\": 1127, \"aid\": 110, \"author\": \"Paul Greenspan\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778610923802, \"up\": 0, \"depth\": 1, \"text\": \"Our Middle school has all those things you mention bot 100% agree this article has too many generalizations.\"}]}, {\"id\": 1128, \"aid\": 117, \"author\": \"Don Richardson\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607160422, \"up\": 0, \"depth\": 0, \"text\": \"Our twin sons entered junior kindergarten. On the first meet the teacher session, their teacher, female, stated quite seriously and with great conviction that things would be so much better in the classroom if the boys behaved more like the girls!! That just about sums up their entire education from JK to graduation.\", \"replies\": []}, {\"id\": 1129, \"aid\": 116, \"author\": \"Andrew Vernet\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778606809301, \"up\": 0, \"depth\": 0, \"text\": \"More \\\"expert\\\" opinions, more \\\"studies\\\" about one sex or the other. What teachers aren't doing, what they should be doing, blah, blah, blah. Remember in Middle School? Shop, Visual Arts, Science Lab and Home Ec? Remember that? Remember the librarian and the guidance counsellor? Where did they all go? Now the homeroom teacher is expected to teach all specialty subjects except French. Master of none! Years ago, there was a push to put women in positions of authority in Education. So the lucky guy who hopes to have a shot at being an S.O.S. or similar, knew there was little chance, especially in a system that already attracts more women. Then the \\\"boy thing\\\". So a boy is assessed for math and language and his stats show he is need of help. So, instead of music and or P.E., he gets \\\"extra help\\\". Next year same thing and on it goes. So the boy never has the chance to support math and language through music, etc. There are better solutions.. student mentoring, for example. Now with the province taking more control of educational funding, there is less chance of genuine improvements. Some expert will write a paper telling teachers what to do, so problem solved.\", \"replies\": []}, {\"id\": 1130, \"aid\": 118, \"author\": \"cdnmomof2\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778606560220, \"up\": 8, \"depth\": 0, \"text\": \"Boys aren't \\\"falling behind\\\" — our schools are failing to meet their developmental needs.\\n\\nThe research is unequivocal: recess and unstructured outdoor play are not privileges to be earned. They are developmental necessities for all children and most especially for boys.\\n\\nBoys develop executive function, impulse control, and emotional regulation skills through physical movement and free play. When we remove recess as punishment — which the studies also show disproportionately affects boys — we're actually removing the very tool they need to develop the self-regulation skills we're punishing them for lacking. It's a cruel feedback loop that the system has created.\\nOther jurisdictions have figured this out. Finland guarantees 15 minutes of outdoor time after every 45-minute lesson throughout the school day in addition to an long lunch period that also encourages outdoor play.  Finland's PISA scores consistently rank among the world's highest, suggesting their approach works. Japan mandates recess periods and views outdoor play as essential to academic success. Washington State adopted policies ensuring recess cannot be withheld for behavioral reasons, and that outdoor time happens daily except in specified weather conditions. Why? Because the evidence is clear:\\n\\n- Physical activity directly improves attention, focus, and classroom behavior\\n- Unstructured play builds social skills, conflict resolution, and emotional literacy\\n- Outdoor time reduces stress hormones and improves mental health\\n- Movement supports boys' developmental trajectories\\n\\nYet I've watched my son's school routinely remove recess and outdoor lunch time as punishment. A punishment that seems to be reserved for boys only.  For my daughter, I seen the entire school keep all classes inside for weeks on end in the spring because of \\\"rain\\\".  We're sacrificing children's health and development for adult convenience. \\n\\nMy recommendations:\\n- Adopt protected recess policies: Recess is a right, not a reward. Full stop.\\n- Increase recess time: it is recommended that elementary students get 60+ minutes daily of unstructured play, yet most of our schools provide 30 minutes or less.\\n-Train educators on gender differences in development: Boys' need for movement isn't \\\"bad behavior\\\" — it's biology.\\n- Redesign discipline approaches: Removing the tool a child needs to succeed is not discipline. I would argue that it's educational malpractice.\\n- Make outdoor time non-negotiable: Weather guidelines should be specific and evidence-based, and published at the School Board level in all communities. This should not be left to adult preference.\\n\\nOur boys aren't broken. Our system is. And until we acknowledge that sitting still and being quiet for 6+ hours isn't developmentally appropriate for most elementary-aged children — especially boys — we'll continue to see them \\\"fall behind\\\" in schools designed around a narrow definition of success.\\n\\nThe solution isn't to fix the boys. It's to fix the schools.\", \"replies\": [{\"id\": 1131, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778632494192, \"up\": 3, \"depth\": 1, \"text\": \"Biologically there is almost no difference between boys and girls until about age 10. This is long-studied and well-known globally for many, many years.\\nThe \\\"differences\\\" you list are learned, not innate.\"}]}, {\"id\": 1132, \"aid\": 119, \"author\": \"Donald Rogers\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778606540170, \"up\": 3, \"depth\": 0, \"text\": \"The bias against men, especially in today's environment is unfortunate. The idea that you can't help boys succeed because it takes away from girls is an inaccurate zero-sum argument.\\n\\nDecades ago there were efforts to help girls succeed and continue on to University and the University graduate percentages flipped.  But there is push-back to countering what was obviously an over-correction. \\n\\nAs far as the small percentage of men in those high-earning leadership roles, a significant percentage of men work in high paying but dangerous roles that, while financially beneficial, lead to other social issues.\\n\\nMen struggle much more with substance abuse and thoughts of self-harm. Caused by what I believe is a world where there is less support and less focus on the value that men bring to the table.\", \"replies\": [{\"id\": 1133, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778632784805, \"up\": 3, \"depth\": 1, \"text\": \"What \\\"efforts to help girls succeed and continue on to University\\\", do you mean the end of actively preventing them from taking courses that would lead to IE: engineering??\\nUntil a few decades ago the system said there was no point in educating in these fields because they wouldn't be allowed to have those jobs.\"}]}, {\"id\": 1134, \"aid\": 120, \"author\": \"Roger Curtis\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778605783708, \"up\": 0, \"depth\": 0, \"text\": \"This is old news. Sadly, really old.  There was a time when it was girls who were the least likely to graduate; hence, the introduction of the novel study, night school, commercial subjects and more.  Can we do the same for boys?  Sure we can.  Let's make certain content fits, offer a boys-only option and ensure that the teachers they encounter represents as many males as possible.. \\n\\nAs for giving up, parents must govern themselves accordingly.  After all, failure is not an option.\", \"replies\": []}, {\"id\": 1135, \"aid\": 121, \"author\": \"Krissy Pearson\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778605553635, \"up\": 0, \"depth\": 0, \"text\": \"I was an Educational Assistant for many years with HRCE. Unfortunately  the school system is not set up for traditional \\\"boys\\\"(or rambunctious girls). There is too much sitting still, quiet and not enough movement breaks/outdoor breaks. The teachers HAVE to push a curriculum that is way  too much( a level ahead of what it used to be).Not their fault.  I get and agree that there HAVE to be rules and regulation and boundaries but also get that most boys need physical movement and stimulation and hands on learning. To me there should be more focus on music/art/gym/outdoor skills and cooking like The Nordic countries. Reading, writing and Math are extremely important but they will learn those WHILE learning these other skills. The classes are too big and the boys seem to get \\\"lost\\\" especially if they find it hard to sit still or be quiet for \\\"long periods\\\".  Its a  no win situation for active, creative boys.\", \"replies\": []}, {\"id\": 1136, \"aid\": 122, \"author\": \"David Burke\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778605035907, \"up\": 0, \"depth\": 0, \"text\": \"I, a male, always hated school. My IQ is quite high, but I don't think it is that, at least not mainly. I found that as I progressed through the school system from grade school to university, the system was becoming increasingly biased against learning styles that favoured males. There was far too much sitting around listening to run on lessons with little or no hands on activities. In university there was no tolerance for actual debate about ideas as it was viewed that debate was too confrontational and it may upset some people. There were very few ways for boys to confront and overcome challenges. I have to say that the whole school system is almost completely useless if not counterproductive for males, especially in a society where individual thought and creativity are highly valued in the economy. The system is lacking for femaes too, but shockingky useless and even bad for most males. It needs major overhaul and for some males and some females, segregation may even be beneficial. On a side note, government taxes should not fund any separate (religious or lingual) education systems - it is far too inefficient, from transport to admin. We simply can't afford it.\", \"replies\": []}, {\"id\": 1137, \"aid\": 123, \"author\": \"cmk26\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778604706993, \"up\": 0, \"depth\": 0, \"text\": \"I think that somehow the school day in primary school should start with vigorous activity. It would make it easier for boys to sit still for those lessons where it's needed because they would have expended some of that fidgeting energy. It probably would be good for girls too. \\nI home schooled both of my sons for some of their school career and I noticed how they would change positions frequently while doing assignments seated at the table, sometimes standing, sometimes kneeling on the chair. I have also noticed that vigorous activity all their lives (they are now adult) such as Karate and other routines improves their mood. My daughter, while she has a more practical approach to learning also shows mood improvement after playing games such as tennis.\", \"replies\": []}, {\"id\": 1138, \"aid\": 124, \"author\": \"novascotia18\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778603740009, \"up\": 0, \"depth\": 0, \"text\": \"The age in which students begin primary school has a very late cut off date of December 31st... far too late, in my experiences and opinion. Sure parents can keep them home another year if they choose, but I believe the cut off date urgently needs to be addressed and changed so that all kids can benefit positively. If you look at countries with higher levels of success across all areas, they all begin school at a later age. Even if female students do well academically compared to males,  social emotional aspects may be impacted. My belief is that they are impacted across the board, and even if on the surface things look okay, it can  have huge impacts throughout school and into adulthood. If we change the cut off dates, then I believe we will see higher rates of employment, happiness, and improved mental health for all.\", \"replies\": []}, {\"id\": 1139, \"aid\": 125, \"author\": \"Christopher Dinsdale\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778603703488, \"up\": 0, \"depth\": 0, \"text\": \"As a former male elementary teacher, I can say that I loved my 32 year career teaching primary and junior.  Why are boys failing today?  I believe it's not the sex of the teacher as much as the learning style imposed upon today's classrooms.  We were on the right educational track in the early 2000s when school boards were focussing on multiple learning styles which absolutely benefited both sexes and made the classroom a fun environment.  Unfortunately, there's been a hard turn back to paper-based, sit-in-your-seat learning which has resulted in today's stats.  A very sad day for children when politics triumphs over science.\", \"replies\": []}, {\"id\": 1140, \"aid\": 126, \"author\": \"crocodiledoug\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778602760678, \"up\": 3, \"depth\": 0, \"text\": \"Treating boys differently would only exacerbate the problem. The reason why boys are less attentive and have high energy levels is directly related to how they are treated. \\n\\nMany parents of boys are not supported by educators when they share their concerns of their boys falling behind. Many teachers will say “boys will be boys” and say that from an educator’s perspective, boys are “just like that.” In reality, boys are only “like that” because instead of teaching boys how to regulate themselves (something important for all children), we have the mentality that boys won’t always behave/listen. This leads to giving them more leeway and having a higher tolerance for bad behaviour, or a lower bar for good behaviour.\\n\\nWe have a lower tolerance for bad behaviour from girls because “they know better,” and we believe they are able to be calm. Our education system is failing boys by writing them off as poorly behaved, before they’re given a single chance to learn good behaviour like girls are. Kids test boundaries, that’s how they learn. If you have leeway to be poorly behaved, why wouldn’t kids take it? If your peers are expecting you to fail, where’s the motivation to try? \\n\\nThis isn’t to say that our current model of education is set up in the best interests of our children. It’s not. Studies have shown that students absorb more by taking breaks and being active (not sitting inside for extended periods). Most very young children have hyperactive tendencies because their brains haven’t developed enough to learn how to regulate their emotions. This doesn’t always mean they all have ADHD. This only becomes an issue when we DON’T teach boys these important skills, meaning they will still be unable to regulate emotions going into elementary school. Of course this is different for kids who do have ADHD, since their brains are wired differently and they won’t ‘grow out’ of hyperactive tendencies that most very young kids have.\\n\\nOn the flip side, many girls are not diagnosed with ADHD, since until recently, studies on ADHD were conducted primarily on white boys. Many girls with ADHD seem to do well in school (on paper), because they mask. Often, they are struggling internally with school, which tends to show up as poor mental health in high school.\\n\\nWe shouldn’t be looking at our education system from the lens of “what gender is it failing more?” We should be seeing that it is failing students full stop. We should be asking how and where it’s failing to meet student needs. We are only as strong as our weakest. If the system isn’t working for even as low as 10% of students, it’s the entire system that needs a change.\", \"replies\": []}, {\"id\": 1141, \"aid\": 127, \"author\": \"Brad Douglas\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778602314980, \"up\": 4, \"depth\": 0, \"text\": \"Hard to imagine that a decade plus of telling boys that their inherent traits are \\\"toxic\\\", curbing their desire to succeed, feminizing them at every turn, denying employment opportunities on the basis of their gender, and presenting a societal-wide hostility towards them would have ill effects. \\n\\nYou reap what you sow.\", \"replies\": [{\"id\": 1143, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607985206, \"up\": 0, \"depth\": 1, \"text\": \"Maybe one simple fact is an illustration. Where is the term 'toxic femininity, yet it exists? I am female and my son and grandsons have encountered this.\"}, {\"id\": 1142, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778632603676, \"up\": 2, \"depth\": 1, \"text\": \"You mean men teaching boys that anything \\\"girl\\\" is bad, wrong, weak etc.\\nYou have it backward.\"}]}, {\"id\": 1144, \"aid\": 128, \"author\": \"Murrie Redman\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778602298451, \"up\": 3, \"depth\": 0, \"text\": \"I have thirty years of kids in teaching under my belt and I think we should stop comparing boys and girls. Take each pupil as they come and leave the computer stats out of it. Teachers and the education system is doing the best it can to advance learning styles and methods without throwing out to such as the media who is there to create excitement. Keep it calm and encourage parents to continue to nurture a rounded environment with love and peace at the core. It works.\", \"replies\": []}, {\"id\": 1145, \"aid\": 129, \"author\": \"Martin Oubliette\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778601546538, \"up\": 5, \"depth\": 0, \"text\": \"Not once in this whole big long article about how boys \\\"have more trouble\\\" in early grades than girls is it even suggested that it might have something to do with parents (and media) setting different cultural expectations for boys and girls in those critical first five years.\", \"replies\": []}, {\"id\": 1146, \"aid\": 130, \"author\": \"Chris Reeve\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778601353820, \"up\": 0, \"depth\": 0, \"text\": \"Recess is too short. Here in School District 57, in Northern B.C. recess is only 10 minutes long. Children need physical play  so  they can focus in the classroom. Parents can help by exercising with their children more & reduce screen time.  Children need screening for learning disabilities at age four and again at age six, but that means school boards should have adequate staffing levels of psychologists, speech/language pathologists and Resource teachers to facilitate remedial tutoring.\", \"replies\": []}, {\"id\": 1147, \"aid\": 131, \"author\": \"p3000g\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778600839083, \"up\": 0, \"depth\": 0, \"text\": \"The occurrence of disabilities like ADHD and autism are far higher in boys than girls .. As a result, their ability to concentrate, sit down and study is limited, leading to poor academic performance and higher dropout and lesser graduation rates .. Add to that, modern distractions like internet, social media etc. the findings are not surprising.\\nBoys tend to do well in physically oriented activities like sports, but how many can ,make a living out of sports? The world is such that you need a university/college  degree to get a decent white collar job , which leads to a stable source of income and live the dream .. Bottom line is  we need to make academics more interesting for kids.. restricting use of social media and internet in schools is a step in the right direction\", \"replies\": [{\"id\": 1149, \"aid\": 22, \"author\": \"Bala Viswa\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778603034328, \"up\": 0, \"depth\": 1, \"text\": \"Is the occurrence of ADHD much higher in boys? Or is the line for being diagnosed so far in one direction that more boys fall on the other side? \\n\\nWhy do I ask these? My son was referred to be tested for ADHD from school and the Board's psychologist said he has ADHD. We got him tested by his paediatrician and she said that he is progressing normally and does not have ADHD. (She said, he is just an active boy). \\n\\nI wonder how many boys have been medicated for not being able to sit still after being tested by a psychologist and not a doctor. (My son's paediatrician said she wouldn't make a diagnosis, she can only rule it out; she would refer to a neurologist for a diagnosis if he needed one. We also got tested by a neurologist at the children's hospital and we were laughed out of the room. This told me that psychologists and doctors have very different standards for diagnosing ADHD. ).\"}, {\"id\": 1148, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778617252981, \"up\": 0, \"depth\": 1, \"text\": \"Psychologists cannot prescribe medication in Canada.\"}]}, {\"id\": 1150, \"aid\": 132, \"author\": \"Andrew Homzy\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778600666766, \"up\": 3, \"depth\": 0, \"text\": \"Too much emphasis on math & science. Boys need creative skills - wood shop, metal shop, basic electronics, mechanics, cooking , managing - as do girls. And then there’s what may be most important - the arts - music, dance, theatre, visual arts. \\n\\nAnother way of saying this is less emphasis on sports- but maintain physical development- outdoor activities requiring hiking, caming, building shelter - and foraging and fishing and - gasp - hunting using traps and strategies to find food. \\n\\nAnd all of the above for girls.\", \"replies\": [{\"id\": 1151, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778632847291, \"up\": 1, \"depth\": 1, \"text\": \"How is any of what \\\"boys need\\\" is any different from girls?? All the things you list are good for both girls and boys.\"}, {\"id\": 1152, \"aid\": 132, \"author\": \"Andrew Homzy\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778657415856, \"up\": 1, \"depth\": 2, \"text\": \"Exactly - as I said in my final sentence..\"}]}, {\"id\": 1153, \"aid\": 133, \"author\": \"Nancy Carle\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778600278709, \"up\": 2, \"depth\": 0, \"text\": \"Boys have few role models in preschool and elementary school.  The vast majority of teachers in these years are women, so recruitment of more men as teachers for these early years, especially in the arts, I think would be crucial.  This is not to disparage the fine work and leadership of women but simply to point out how academic and artistic pursuits may be perceived by young boys.\", \"replies\": []}, {\"id\": 1154, \"aid\": 134, \"author\": \"Linda Cochrane\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778600126262, \"up\": 1, \"depth\": 0, \"text\": \"The problem starts long before kindergarten: girl and boy babies are treated differently from the very beginning.  Girl babies tend to be held still, while boy babies are encouraged to play roughly; parents speak much more to girls than to boys; girls are given dolls, while boys are given bricks or similar toys. Just look at toy stores to see how toys are differentiated. I hope daycare staff are paying attention.\", \"replies\": []}, {\"id\": 1155, \"aid\": 135, \"author\": \"Vince Schutt\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778598359264, \"up\": 0, \"depth\": 0, \"text\": \"Hello everyone. I'm a PhD Candidate in Education, and prior school board partner.\\n\\nFirst, Experiential Education.  Where is it?\\n\\nTake a school board like TDSB (Toronto District School Board).  Every time a child scrapes a knee while running, climbs a tree (long gone) or a child is exposed to any risk of harm - there is hell to pay for the teacher, principal, administrators and the board overall.\\n\\nWe have a system that with no operator action trends towards catastrophic levels of risk aversion.  The administrative structures don't have the elasticity to respond to critique without system changes that increase risk aversion.\\n\\nEach incremental policy step that enshrines risk aversion disables educator pathways to create meaningful experiential learning.\\n\\nMany years ago while administering a program with secondary schools I was attempting to get a field trip for students to Toronto water treatment facilities or the Ontario Food Terminal. The goal was to help students see the infrastructure that supports millions of people in the Greater Toronto area. It became apparent quite quickly that this field trip was not going to be allowed, despite the fact that I was an official partner of the TDSB.\\n\\nSo let me be very clear that this is not a critique of the TDSB, educators, parents, young people, or lawyers. The critique is in how we have arranged the power of these various actors - and how, in combination, these actors drive educational structures towards catastrophic levels of risk aversion.\\n\\nSo I am saying risk aversion is the culprit.  If we want to do something about risk aversion we need to understand how and why risk aversion happens. Why is risk aversion the solution when something bad happens?  Stop and consider the answer.  You know it as well as I do. Now take your thinking and multiply it times 10,000X.  What % of the time is risk aversion the winner?\\n\\nNow the last question ... the clincher.  For whatever number of times you selected that risk aversion was the solution.  How often is the risk averse policy / way of doing things peeled back? At what rate do school administrators relieve the installed administrative risk controls?\\n\\nThings will happen in schools because things happen everywhere. When we label things as \\\"bad things\\\", we create an impetus that they must be controlled/administered/averted. What if a bad thing happening is a good thing. The bad thing creates the possibility of learning experientially through failure. \\n\\nIf our answer to sliding performance outcomes is more risk aversion - I suspect we will return here in a decade with even worse problems than the CBC is reporting on today.\", \"replies\": [{\"id\": 1156, \"aid\": 22, \"author\": \"Bala Viswa\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778601496399, \"up\": 1, \"depth\": 1, \"text\": \"So, you advocate managed risk in schools rather than risk elimination? I can agree with that. We cannot learn without making mistakes, and we cannot make mistakes without taking risks. How can we do new things without compromising safety to life and limb?\\n\\nI am also genuinely curious: what is considered risky in a trip to the water treatment plant or a food terminal? Why would they not be allowed to proceed?\"}, {\"id\": 1157, \"aid\": 135, \"author\": \"Vince Schutt\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778628375681, \"up\": 0, \"depth\": 2, \"text\": \"Risk is perceived on all sides.  Then there are all the quite frankly unimaginably large burdens on behalf of every stakeholder - and the paperwork to legalistically attend to those risks. Then the insurance policies for all entities. Let your mind run wild at what the perceived risks *might be* and every idea you come up with, if you look in reality at the policies and structures in place.  For each idea that you have of what the risk *might be* you'll see an administrative oversight burden to attend to regarding that risk.\\n\\nThe point being with my post - is that it's not the specifics.  Which I could get into.  But if I did, it would be zooming in, and at a hyper-specific scale risk aversion becomes more palatable.  \\\"well it's just a form\\\" -- \\\"what's the big deal\\\".  Until you have a 1000 forms to attend to, and you realize oh wait, Houston, we have a problem.\"}]}, {\"id\": 1158, \"aid\": 136, \"author\": \"sb123\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778598257742, \"up\": 0, \"depth\": 0, \"text\": \"As a Toronto Board Kindergarten teacher for many years, we always used a play-based educational program. It was hands on and activity based.\\nAny academic learning was based on actual programming.\\nAnd teachers were even down on the floor working one to one with what the child was creating and playing with. \\nLater we extended this program to what we named Structures up to the Grade 3 level and we well knew it was a boon to boys and even some  girls who were just increasing their attention spans.\\nAt one point educators from New York came to observe this program.\\nMost of us who knew how well this worked were upset after the Mike Harris days when there was a return to paper and pencil tasks involving only eye hand coordination which favoured girls.\\nAnd teachers moving into the lower grades went on break when the kids were just “playing” as they saw it. When we originals used play as prime teaching times. The ones such as myself who tried to continue on were frowned upon. \\nHopefully this kind of programming could be restored/\", \"replies\": []}, {\"id\": 1159, \"aid\": 137, \"author\": \"edk\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778597856794, \"up\": 0, \"depth\": 0, \"text\": \"What, no mention of video games? Boys are into these games much more than girls, and that is something we didn't have to worry about 25 years ago. We had video games when I was growing up too, but I think they became much more widespread and addictive since then.\", \"replies\": [{\"id\": 1161, \"aid\": 138, \"author\": \"Tony Johnson\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778598088373, \"up\": 0, \"depth\": 1, \"text\": \"I can assure you that video games existed 20 years ago.\"}, {\"id\": 1160, \"aid\": 135, \"author\": \"Vince Schutt\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778599717305, \"up\": 0, \"depth\": 1, \"text\": \"addictive tech is definitely a problem I agree with what you are saying here.  This is a problem that is not isolated to young boys.  It is relevant for all young people.  It is also relevant for adults.\\n\\naddictive tech companies employ clinical psychologists -- and are made to turn the dopamine responses into addictive pathways.  It works on both young people and adults (including me).\\n\\nI ask my spouse to ban various tech platforms on my laptop, turning my tech-inability into a boon.  I don't know how to undo it, so I don't waste days of my life wasting away on YouTube.\\n\\nVolkow, Koob, and McLellan - researchers have found that addictive behaviours interact and hack the dopamine systems of the brain in very similar ways.  Meaning YouTube has a lot more in common with elicit drugs than previously realized.\\n\\nSo the Clinical Psychologist that works with algorithmic coders at Google to \\\"make a satisfying User Interface\\\" (that's an example excuse the psychologist uses to assuage their guilt) -- is in effect a crack dealer to children (and adults).\"}]}, {\"id\": 1162, \"aid\": 139, \"author\": \"Brian Rosborough\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778597717796, \"up\": 0, \"depth\": 0, \"text\": \"Some reasons -\\nMainly poor parenting, entitled children, lack of discipline, male children running households - making family decisions for example family meal decisions, entertainment, bed times, easy rewards before finished effort, parents too free with social media for children, male peer pressures, etc. \\nVery, very poor school education systems now, too much government
