bureaucracy, classrooms are chaos  - Teaches try in early career but then reduce their dreams of being teacher superstars and key on retirement pensions.\\nFemale children are more mature.\", \"replies\": []}, {\"id\": 1163, \"aid\": 140, \"author\": \"joleen2026\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778597322758, \"up\": 0, \"depth\": 0, \"text\": \"My sister was the Principal of a \\\"test\\\" school in Calgary that was set up by one of the main school boards. It wanted to test the research on \\\"single gender\\\" education, which meant that in academic subjects, girls and boys were separated. On average, girls preferred having desks they could keep their belonging in, whereas boys preferred sitting at tables or standing desks, using exercise balls to sit on, and having to get up and go to their cubbies to retrieve school supplies. \\n\\nThe point isn't that we have to have gender-differentiated classrooms, perhaps just more individuated choice for how kids use their classroom in a way that helps to keep them focused. In my daughter's elementary school now, teachers do their best to let kids stand if they want, or sit on the carpet, etc. I know this is asking alot of teachers as it might make it harder for them to manage, but I think all of us (regardless of gender) have our own preferences as to what keeps us motivated to get our work done (eg, I have tasks that I prefer my standing desk for, and others I prefer sitting). The sooner we all figure out how we work best, the more successful we will be.\", \"replies\": []}, {\"id\": 1164, \"aid\": 141, \"author\": \"David Pollock\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778597316792, \"up\": 2, \"depth\": 0, \"text\": \"I am a 61 year old man that has Masters in both Comparative Theology and Classical Philosophy.  I am also an advocate of gender segregated schooling in the early years of education.  Not complete segregation, some mixed classes are necessary for social training obviously but in a classroom setting, for certain subjects, segregation helps.  I am also someone that has Asperger's that went undiagnosed till during the COVID crisis.  The changes to my routines sent me into a spin.  Why I bring this into the conversation is because I was labeled a \\\"problem child\\\" in the 70's by the school system.  They discovered then, even though they did not know of my neurodivergence, that I responded better to male teachers.  I feel that this is a large part of the problem - we do not have enough male teachers in the school system.  How many children come from homes where the male role model is missing, intermittent, or simply has no time for them?  This has a HUGE impact on boys.  It did me.  A male mentor or teacher helps to fill the gap that this poses.  The school system should be actively trying to equalize the ratio of male to female teachers.\\n\\nAs for teen boys - they are not unaware, they just see no hope - all you have to do is ask them.  They have been witnessing their fathers and brothers and other males in their families struggle day after day to get jobs, start careers and families.  There is an extremely high rate of depression among male youth today.  Yet, no one seems to be talking about it.\", \"replies\": []}, {\"id\": 1165, \"aid\": 142, \"author\": \"Geoff Tomlinson\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778597315128, \"up\": 0, \"depth\": 0, \"text\": \"As a coach and educator with 35 years of experience working with adolescents I could not agree more.\\nIf I have learned anything it are these 2 observations:\\n#1:  the 10% rule =. I speak for 10% of the time when Im with my students and athletes.  the rest of the time they perform.  The young move, they socialize, they perform\\n#2:  this is a controversial opinion - the hiring of early year educators (pre-school and elementary) is very weighted towards females.  Many of whom prize compliance and order.  Like hires like.  More males in the early years = more movement and physicality, which all students prize\", \"replies\": []}, {\"id\": 1166, \"aid\": 138, \"author\": \"Tony Johnson\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778596724431, \"up\": 0, \"depth\": 0, \"text\": \"Boys have more variance. There are more high flyers and there are more bottom dwellers. Modern society works so hard to ensure equity for everyone, this tends to benefit girls, IMO, who have less variance.\", \"replies\": []}, {\"id\": 1167, \"aid\": 143, \"author\": \"Xinhang Shen\", \"ini\": \"X\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778596696541, \"up\": 1, \"depth\": 0, \"text\": \"I believe that labeling a boy with attention deficit hyperactivity disorder (ADHD) may be a reason to send him into a failure! Stopping such diagnosis and tolerating more boys behaviour may be a solution! Boys and girls are different and should be treated differently!\", \"replies\": [{\"id\": 1168, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778617003992, \"up\": 0, \"depth\": 1, \"text\": \"That is a medical diagnosis,  not a label any more than a diagnosis of diabetes is a label. The article does not seem to be labelling boys as much as making observations and recommendations as a result of study for the sincere benefit for all students. We need to be careful about labels. They lead to stigma.\"}, {\"id\": 1169, \"aid\": 143, \"author\": \"Xinhang Shen\", \"ini\": \"X\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778635329675, \"up\": 0, \"depth\": 2, \"text\": \"Many boys are not just be diagnosed, but sometimes, they are  medicated and taught by specialists. All these are clear indications to them that they are problematic kids, which leads them to lose confidence.  Actually, many \\\"ADHD\\\" boys just have special personalities, not problems at all as shown by many successful people who have \\\"ADHD\\\".\"}]}, {\"id\": 1170, \"aid\": 144, \"author\": \"Jack Russ\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595700436, \"up\": 0, \"depth\": 0, \"text\": \"my child's school incorporates movement breaks during class, has gym class, and two recesses.  My kids still has some trouble, they are diagnosed ADHD, its obvious and it shows, but they get chairs that wobble, can stand if needed, and I burn the crap out of any energy left over (there's LOTS) in the evenings and on weekends by being outside constantly and in an organized sports activity minimum 4 days a week.  Part of the consistency and expectations need to start at home and more parents need to get their kids moving.\", \"replies\": []}, {\"id\": 1171, \"aid\": 145, \"author\": \"Barry Wansbrough\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595078325, \"up\": 0, \"depth\": 0, \"text\": \"We must be very careful not to be patronizing to this idea that should be self-evident with the provinces abandoning their leadership schooling role. The federal government has stepped in with the trades program run through the unions, not the ministries of education. Core problem - it's not what students, or any others, can remember about new knowledge, it's what they can do with it. So standardized memory tests just get in the way, especially for boys. Boys are the heavy lifters for hands on practical work. Globalization took much of that away from them without anything offered to help them. No GI Bill idea, for instance. They were forced to stay in school until they are 18 on the idea that more academic education would help. Clearly and predictably it hasn't. It's taken the feds to address that. At last there is hope if the provinces don't get in the way. Fingers crossed.\", \"replies\": []}, {\"id\": 1172, \"aid\": 146, \"author\": \"Sean Berry\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594935598, \"up\": 13, \"depth\": 0, \"text\": \"It starts with not allowing students to fail.... Automatic passing has done nothing to create a motivation to learn, but what do I know? I've only been an educator for 10 years, married to an educator, and surrounded by educators for most of my life. My degree in behavioral psychology aside....\", \"replies\": [{\"id\": 1174, \"aid\": 42, \"author\": \"Jake Thornton\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778676447149, \"up\": 3, \"depth\": 1, \"text\": \"Couldn’t agree more. Kids not being able to fail only sets them up for failure in later life when society WILL allow them to fail\"}, {\"id\": 1173, \"aid\": 147, \"author\": \"Jim Smith\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778708321476, \"up\": 0, \"depth\": 1, \"text\": \"Totally agree. As a high school teacher and parent of 3 boys, I see both home and school as \\\"safe\\\" environments where kids learn incrementally how to operate in the \\\"real world\\\", i.e. when they graduate. \\\"Not failing\\\" is not the only problem, but it is definitely a contributing factor.. What is the point of graduating a student from grade 12 when they can't even read instructions, fill out a job application, determine that their grocery bill is wrong, follow a recipe, or figure out how many tiles they need for a floor? It's not fair to the students, and it's not fair to employers or post-secondary educational institutions who need some kind of baseline represented by those high school diplomas.\"}]}, {\"id\": 1175, \"aid\": 148, \"author\": \"fox2\", \"ini\": \"F\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594780144, \"up\": 10, \"depth\": 0, \"text\": \"As a former public school teacher of 27 years, teaching mainly grade 8 in the English stream, I can confidently attest to the fact that boys struggle more in school than girls.  In my opinion, boys are struggling mainly from a lack of ability to read — which also affects many girls in the system. Even in math, where many boys used to excel, the curriculum has become more language/ problem solving based which is affecting boys’ progress.  In addition, with the elimination of physical education specialists for boys and girls classes, the quality of physical education in public schools dropped dramatically.  As all parents and teachers know, most young boys thrive on engaging in physical activity (ball hockey, soccer, tennis, wresting, snowboarding, climbing, etc.) and mainly of these activities have been eliminated or even banned at recess.  If we want boys to enjoy school and achieve their potential both parent and the education system must work together to raise their reading skills and the system need to provide more time for physical activities and hands on learning.\", \"replies\": []}, {\"id\": 1176, \"aid\": 149, \"author\": \"Ken Davies\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594364597, \"up\": 2, \"depth\": 0, \"text\": \"Go figure, you  demonize their natural behaviour, and education that ignores boys and girls learn differently.   Education/teachers try to force boys to act like girls, guess what, mother nature prevails.  We need to let kids be kids and not try and force them in to mold.\", \"replies\": [{\"id\": 1177, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778632955325, \"up\": 1, \"depth\": 1, \"text\": \"Where do you get that?? Have you been in a young classroom? Your statements are not fact.\"}]}, {\"id\": 1178, \"aid\": 150, \"author\": \"Nicholas Peron\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594343145, \"up\": 7, \"depth\": 0, \"text\": \"I think the problems are obvious:  Underfunding schools, growing class sizes, underpaying teachers, and training to be one is expensive. \\n\\nThen there's the issue that rote classroom learning has never been an efficient method to teach.\\n\\nKids learn best via interaction, not abstraction. Forcing them to sit still and memorize things from a book just for the sake of memorization is a terrible way to learn. We all know it. We hated it ourselves. Yet as adults, we just decide kids need to endure it because that's the way its always done. That's insanity.\", \"replies\": []}, {\"id\": 1179, \"aid\": 151, \"author\": \"John Janmaat\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594274073, \"up\": 8, \"depth\": 0, \"text\": \"Each child is unique.  I am male, but was never the rough and tumble 'boy' that seems to be the focus here.  I made my way through academia and now work as a university professor.  One of my daughters is a top rugby player who can bench press my body weight.  She is in some dimensions more boy like than I am.  Perhaps a bigger problem is that we are not investing enough in our children to 'meet them where they are' and therefore put them into predefined boxes to make education more 'efficient'.\", \"replies\": [{\"id\": 1180, \"aid\": 116, \"author\": \"Andrew Vernet\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607354714, \"up\": 0, \"depth\": 1, \"text\": \"Generalizations are more convenient. They offer easy excuses and solutions. I take issue with this huge generalization. Has anyone asked whether it is a perpetuated cultural expectation or some genetic code?\"}]}, {\"id\": 1181, \"aid\": 152, \"author\": \"Cindy Burkett\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594176646, \"up\": 6, \"depth\": 0, \"text\": \"Not so long ago we were celebrating systems that gave girls opportunities that had been previously denied to them. More girls studying the sciences, embracing math, finding careers in the trades, medicine and sports - these paths had been closed to girls. \\nAsk any teacher, children show up differently from day one. There are common variations between boys/girls, kids of different socio-economic status, kids from various cultures. Teachers welcome and work with all of them. \\nMore than 50 years ago, teachers recognized that children needed to move about the classroom, needed to learn in a variety of ways beyond worksheets, and needed to be provided some choices in their learning. \\nYes, boys often bring different strengths than girls. Educators have been aware of this and addressing it for decades. \\nUsing the term ‘boy crisis’ is misleading and inflammatory. Maybe speak to a few more educators about the wide variety of ways they address the needs of all the children in their classrooms instead of creating a crisis?\", \"replies\": [{\"id\": 1182, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595106964, \"up\": 1, \"depth\": 1, \"text\": \"I do have to differ that 50 years ago paths were closed to girls. They may not have been 'encouraged' but the paths were not closed. I had classmates who became engineers, doctors, etc. Families may not have been encouraging their girls, statistics may have suggested the assumption, but the paths were not closed. The term 'boy crisis' may not be just an assumption from statistics, however. Many teachers are in agreement despite all their efforts, and this is the experience of many, many families.\"}]}, {\"id\": 1183, \"aid\": 153, \"author\": \"Mic Mellosz\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594108970, \"up\": 2, \"depth\": 0, \"text\": \"Where is the womansphere? Everywhere else. Men are denigrated and feel victimized by current socialization particulars. Naturally, an overshoot from earlier corrective action. Tricky subject.\", \"replies\": []}, {\"id\": 1184, \"aid\": 154, \"author\": \"Jennifer Johnson\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594099320, \"up\": 18, \"depth\": 0, \"text\": \"I am a early childhood educator in B.C.  I have been in education in come capacity for more then 20 years.  Teaching in NL, ON, and B.C.  Over the years I have been advocating for change to our education systems starting in kindergarten.  In Canada our kindergarten programs are developmentally in appropriate.  We ask children to sit for too long and we ask one educator to be responsible for up to 20 4/5 year olds.   I agree that boys are losing interest and falling behind but all children are.   With girls it is less obvious because girls mask more due to social norms.   How do we change it?  I have many ideas but sadly our society does not value the early childhood educator.   We don’t have a seat at any of the policy tables.  Our education level is not honored as we live in a society that values degrees and masters more than experience and knowledge.   Our children are facing the biggest challenges in history between screens, over scheduling, and lack of outdoor learning.   There is not just one answer but until we stop wasting tax payers money on more studies and start asking the people who working with our youngest population their thoughts, we will continue down this road and pay for it later with mental health and addiction monies.\", \"replies\": [{\"id\": 1187, \"aid\": 156, \"author\": \"lorraine\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778596512604, \"up\": 5, \"depth\": 1, \"text\": \"Jennifer I agree with you that early childhood educators' opinions and insights are often not valued as much as they should be and that the student to educator ratio is a common problem in our school system.  As a mother of 2 men and grand-mother of 2 boys and 2 girls I concur that there's a difference with most ways boys and girls learn.   I know all kids need to move but that being said, I have seen how young boys usually need to move more and sit quietly for shorter periods. I think our system in Canada should look at other education systems, such as Finland's for the early pre-school to age 7 (see att. link) https://www.heischools.com/resources/articles/finlands-early-childhood-education-model/.  \\nThey have a higher rate of success than we do therefore, it seems to me it is worth seriously considering its content and curriculum, as a first line of study.  \\nWe have many issues in our society which are contributing to children's learning difficulties that were not an issue before, such as screen time, social and gaming media, over-scheduling for kids and parents alike (which by the way include some teachers and their own children) and less simple outdoor play.  Other problems, such as good nutrition, rest, stable home environments, etc that have always made it more of a challenge for some children compared to others also come into play.  \\nLet's all keep being involved and pushing through to help make it better for this and the next generation.\"}, {\"id\": 1186, \"aid\": 155, \"author\": \"frostie1\", \"ini\": \"F\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778604244993, \"up\": 0, \"depth\": 1, \"text\": \"There are a whole myriad of factors that can influence behaviours. The biggest in my mind is having mentors to guide you through the decision points in your life. One has to learn that being responsible and accountable for your decisions and actions are extremely important.\"}, {\"id\": 1185, \"aid\": 6, \"author\": \"mom123outwest\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 16\", \"ts\": 1778892568150, \"up\": 0, \"depth\": 1, \"text\": \"I am pasting this here to join the conversation \\n\\nI greatly appreciate early educators and EAs. Yes! 👏 somehow we do need to get their voices heard as they see the classroom from a unique perspective. Also as Substitute teacher, I feel like I don’t have a direct channel,  but I see such a broad swath of the system and problems. \\n\\nAs a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\"}]}, {\"id\": 1188, \"aid\": 157, \"author\": \"theresa\", \"ini\": \"T\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593800392, \"up\": 5, \"depth\": 0, \"text\": \"The education curriculum needs reform. We need midterm and final exams to properly measure how much knowledge children have actually mastered, so we can tell whether a student is truly falling behind academically or simply has discipline and behavior issues. Boys are naturally less obedient and compliant than girls, and elementary school report cards don’t really reflect a child’s true academic ability.\\n\\nParents with money and time can provide extra tutoring and support for their children, but families without those resources have to rely entirely on schools, and the current system is failing them. Society no longer provides real upward mobility for children from poor families. In the end, “all inclusive” policies hurt low-income families the most.\", \"replies\": []}, {\"id\": 1189, \"aid\": 158, \"author\": \"edgradstud\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593576687, \"up\": 6, \"depth\": 0, \"text\": \"If school is improved for kids who need to move their bodies to learn, everybody benefits. To do that requires $$$—for teachers to prep and run more labour-intensive activities, to elevate the prestige of teaching (one side effect of which might be more masculine role models on schools), to allow more observational assessments, etc. The problems are systemic and structural, and they come down to capitalism and patriarchy.\", \"replies\": [{\"id\": 1190, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594177438, \"up\": 2, \"depth\": 1, \"text\": \"Without prejudice and with respect, this is the second post that has mentioned patriarchy.  I honestly don't understand. If this were patriarchal, wouldn't the focus be on the boys and their needs to be successful? I am in total agreement about a focus on movement and a variety of assessments. It has felt like this has resulted from a 'slippery slope' of attempting to improve things for girls without a plan for not leaving boys behind, rather than a patriarchal plan. When we are planning, we should be creatively thinking about the possible negative outcomes, too, as part of the decision process.\"}, {\"id\": 1191, \"aid\": 158, \"author\": \"edgradstud\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595438027, \"up\": 7, \"depth\": 2, \"text\": \"I don’t know if you were asking me to explain the patriarchy thing but as an educator, I love an opportunity to explain haha! Feel free to ignore me.\\n\\nWhen I talk about the patriarchy, I mean the culture that devalues caring professions (like nursing, teaching, anything domestic, etc.) in the first place. Other people in this discussion have mentioned boys needing better male role models—even people whose politics seem far to the right of mine. Well, the reason those are missing in elementary schools is that teaching children is seen as women’s work and is paid/respected accordingly, under our patriarchal values.\\n\\nThe patriarchy is also why people had to make a special effort to improve things for girls in the first place, right?\\n\\nI’m not saying everyone is a male supremacist; I’m saying that the systems we have now were created in the context of patriarchy, and it’ll be hard to change them without recognizing that.\"}]}, {\"id\": 1192, \"aid\": 159, \"author\": \"walter williams\", \"ini\": \"W\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593501549, \"up\": 2, \"depth\": 0, \"text\": \"ever heard the saying \\\"boys will be boys\\\". Was at an elementary school spring open house with singing and dancing, both boys and girls (still allowed to say that?). Boys wearing flowery hats and bird or bunny costumes, no wolves or bears. Grooming aggression out of them at an early age.\", \"replies\": []}, {\"id\": 1193, \"aid\": 160, \"author\": \"calebb\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593385576, \"up\": 10, \"depth\": 0, \"text\": \"I'm friends with 5 people who are educators, most at the elementary level. All of them women. All of them, in one way or another, have made it clear that they have a strong bias against men in their personal life. I would say with great confidence that all of them hate men. I find it difficult to believe that that bias doesn't get passed on to their professional work. If I had a son going through school, I would assume that at least one of his teachers is going to be prejudiced against him.\", \"replies\": [{\"id\": 1197, \"aid\": 22, \"author\": \"Bala Viswa\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595264815, \"up\": 2, \"depth\": 1, \"text\": \"And you would not be wrong. Over the past decade, there have been studies showing that a percentage of teachers want to \\\"right historical wrongs\\\" by being biased in favour of girl students (in addition to the ways the classroom has been remodelled to be more welcoming to girls), which in extreme cases may exhibit as bias against boys. That is why the article also worries that making things better/easier for boy students would make the classroom harder for girl students: they are retracing the process that occurred historically over the past 40 years.\"}, {\"id\": 1196, \"aid\": 163, \"author\": \"Ingrid Raudsepp\", \"ini\": \"I\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778595830455, \"up\": 1, \"depth\": 1, \"text\": \"They \\\"hate\\\" men? They should not be educators.\"}, {\"id\": 1195, \"aid\": 162, \"author\": \"Ernest Patrick\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778603226779, \"up\": 8, \"depth\": 1, \"text\": \"Frankly your anecdotal \\\"evidence\\\" is ridiculous on its face. They clearly don't \\\"have a strong bias against men in their personal life\\\" if they're all friends with a a person (you) who is likely a man.\"}, {\"id\": 1194, \"aid\": 161, \"author\": \"Kay Vega\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778621140430, \"up\": 3, \"depth\": 1, \"text\": \"As a mom with a boy and girl in school I believe from conversations with their educators that some women teachers just don’t like boys.\"}]}, {\"id\": 1198, \"aid\": 155, \"author\": \"frostie1\", \"ini\": \"F\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593128374, \"up\": 1, \"depth\": 0, \"text\": \"They are all children. As soon as one group is treated differently from the others based on gender or any reason for that matter, problems are created. Children can adapt. Adults dont seem to be able to. The adults and the so called experts are the real problem. Governments mismanage every thing. Look at the mess health care, education, housing, and infrastructure in.\", \"replies\": []}, {\"id\": 1199, \"aid\": 164, \"author\": \"Gemma Corless\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778593083726, \"up\": 2, \"depth\": 0, \"text\": \"This comment isn't a criticism of boys and their behaviour, but rather the teachers, aids, and volunteers tolerating behaviour from some kids (boys) and not others (girls). \\nIt starts early. When I was in kindergarten girls were told off for speaking loudly while boys were throwing things across the the room. It is no wonder the kids being told to behave and pay attention are less likely to fall behind, and it's a real shame.\", \"replies\": []}, {\"id\": 1200, \"aid\": 30, \"author\": \"Erin Obourn\", \"ini\": \"E\", \"title\": \"Community Manager\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778592865161, \"up\": 1, \"depth\": 0, \"text\": \"It's interesting to hear people's thoughts beyond the school system — that structure, role models, physical activity, expectations and parenting outside of schools matter too.\", \"replies\": []}, {\"id\": 1201, \"aid\": 165, \"author\": \"Larry mor\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778592338379, \"up\": 12, \"depth\": 0, \"text\": \"it is not surprise that males are falling behind. More  Emphasises  is put on girls and minorities to ensure sure they succeed, it is just expected that males will figure it out for them selves over time, Take a look at how the male has been shifted to just a provider, little or no recognition for the achievements of there children, or there upbringing.  Equal is not what is used to be, there has been a total shift,\", \"replies\": [{\"id\": 1202, \"aid\": 134, \"author\": \"Linda Cochrane\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778601076086, \"up\": 9, \"depth\": 1, \"text\": \"A study was done in England in which a group of high school students were given a 1950's boarding school experience. The girls still did better than the boys. Since this is a worldwide problrm, it is unlikely that the type of education system is to blame. Perhaps boys in the past did not have to compete against girls. In any case, workplace success still shows that being male counts for more than education.\"}]}, {\"id\": 1203, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778591833721, \"up\": 4, \"depth\": 0, \"text\": \"As a parent and grandparent of boys, I have seen this as progressively becoming an issue. Ironically, as a child of the fifties and sixties, despite the women's lib. movement which had its purpose, in school as a female I felt equally entitled to be successful and attend post-secondary education. Did not need the focus away from boys. For years, I have said we are leaving boys behind. Boys need competition and both genders need phys. ed. added back to the curriculum in a major way. A kindergartner does not need computer time supervised by a grade 8 student. Find another way to provide prep time to the teacher. I have  been a volunteer and have seen the declining engagement of boys, in general. Girls begin to see themselves as superior academically. In group, they take over and are dismissive of the boys contributions even before engaging. I have seen this at the post-secondary level, too. I know that teachers are aware and I wonder if they feel powerless to solve this. I have observed fewer male teachers in the system. Why? I work in post-secondary and have been concerned for many years. Ensuring one group has opportunity should not have been at the expense of another group. Surely, we can manage multiple goals....we expect our students to.\", \"replies\": [{\"id\": 1205, \"aid\": 158, \"author\": \"edgradstud\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778596558137, \"up\": 0, \"depth\": 1, \"text\": \"What you said about girls shutting down boys’ ideas in group work—thats such a good point! Nowadays, being good at school is seen as a feminine trait, so boys REALLY don’t want to do it because the patriarchy tells them that to be feminine is the worst thing, even worse than having a really tough life because you flunked out of grade 7!\"}, {\"id\": 1206, \"aid\": 112, \"author\": \"Glenna Landry\", \"ini\": \"G\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778607490534, \"up\": 1, \"depth\": 2, \"text\": \"While I said that girls were just as eligible to pursue science, etc. in the fifties and sixties; for example, my chemistry teacher in the sixties was a female likely in her fifties, but there were more male teachers than there are now which speaks to your statement that school success is perceived as a feminine trait by students currently. I understand, now, what you meant by the patriarchal influence. The lack of opportunities for movement may not be the only explanation for boys' 'acting out' behaviours.\"}, {\"id\": 1204, \"aid\": 158, \"author\": \"edgradstud\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778680482531, \"up\": 1, \"depth\": 1, \"text\": \"I think the numbers of male teachers at the high school level aren’t as bad—probably because that’s seen as being more specialized and prestigious, and the students are farther away from early childhood, which is seen as the women’s domain.\"}]}, {\"id\": 1207, \"aid\": 166, \"author\": \"Sue Clarke\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778591320315, \"up\": 2, \"depth\": 0, \"text\": \"Doesn't start or end in schools, this starts shortly after birth, that little blue  or pink sleeper and bonnet. Call it what you want but I call it patriarchal grooming and it's been happening for centuries.\", \"replies\": []}, {\"id\": 1208, \"aid\": 167, \"author\": \"Ryan Carey\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778590975394, \"up\": 35, \"depth\": 0, \"text\": \"As a veteran, strength coach, and someone who has worked with men from middle school to elite military, I want to offer a perspective that is missing from this conversation.\\n\\nThe boy crisis does not start at school. It starts long before that. And it does not end at graduation. You can draw a straight line from the boy who cannot sit still in kindergarten to the veteran who cannot regulate his nervous system at forty. Same boy. Same unaddressed wound.\\n\\nWe did not just fail boys in the classroom. We removed their rites of passage. We medicated their wildness instead of directing it. We told them to suppress the very energy that, properly channelled, builds men of character and purpose.\\n\\nBoys do not need a different worksheet. They need men in their lives who model what a regulated, purposeful, grace filled man looks like. They need to move. They need challenge. They need to be told they are capable of hard things and then shown how to do them.\\n\\nThe mental health crisis in young men, the dropout rates, the disengagement, these are symptoms. The root is a generation of boys who were never shown what it looks like to become a man.\\n\\nWe can fix the curriculum. But until we address what is happening at home and in community, we are treating the symptom and ignoring the wound.\\n\\nRyan Carey\\nVeteran. Coach. Dad. Man.\", \"replies\": [{\"id\": 1217, \"aid\": 172, \"author\": \"Mellissa Breault\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778594412988, \"up\": 8, \"depth\": 1, \"text\": \"I agree that boys need men in their lives. They need a father who models these things. I think another contributing factor is that parents have no time or energy to be these things for their kids because the struggle to put food on the table and a roof over their heads is all-consuming. I have no solution for this because the problem is so enormous and world-wide. But part of the solution is to recognize that what we are doing is not sustainable if we want things to improve.\"}, {\"id\": 1216, \"aid\": 131, \"author\": \"p3000g\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778603476059, \"up\": 2, \"depth\": 1, \"text\": \"Definitely agree. Boys are more physical and need more physical stimulation to be disciplined and organized. Physical activity makes them feel like men and give them a sense of purpose. In the olden days, men used to go out, hunt and work in the farms and factories doing jobs that demand physical labour and they excelled in that. \\nIn the modern world, these things have been replaced by machines and robots, leaving only desk jobs available to them .. Add to that internet , online and social media access without restriction , mean that the current generation of boys is growing up completely detached from reality.. spending their times on screen and typing on their phones instead of doing real work.  The upcoming AI revolution will only exacerbate this issue , unless it is addressed urgently. We need to urgently think how to face this oncoming onslaught of AI, internet and social media combined..\"}, {\"id\": 1215, \"aid\": 171, \"author\": \"Barry Andruschak\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778641040847, \"up\": 0, \"depth\": 1, \"text\": \"Excellent Ryan. So true. Thanks for sharing\"}, {\"id\": 1214, \"aid\": 170, \"author\": \"usergenx\", \"ini\": \"U\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778647615856, \"up\": 0, \"depth\": 1, \"text\": \"I was going to write something very similar but you’ve articulated it better than I would have.  Well done!!!!\"}, {\"id\": 1212, \"aid\": 134, \"author\": \"Linda Cochrane\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778689530812, \"up\": 0, \"depth\": 1, \"text\": \"Are you sure you are interpreting the statistics correctly? The statistics could just as easily show that girls are improving but boys are not. Also, blaming changes in the school system for the differing results does not explain why the difference are world-wide. I doubt that all countries have implemented the same changes in their school systems. More girls than boys were being accepted into Swedish universities in the 1960s. Perhaps treating boys and girls equally will always result in girls doing better than boys in school.\"}, {\"id\": 1213, \"aid\": 167, \"author\": \"Ryan Carey\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778694564517, \"up\": 3, \"depth\": 2, \"text\": \"Fair point on the statistics. You are right that the data could reflect girls improving rather than boys declining. Both things can be true simultaneously and the honest answer is probably that it is some of both.\\nBut here is where I respectfully push back.\\nThe worldwide nature of this trend is actually the strongest argument that something systemic is happening to boys specifically. Not in the curriculum. In the culture. Across every developed nation we have seen the same pattern emerge at roughly the same time. Boys disengaging. Men checking out. The mental health of young males declining sharply.\\nThat is not a curriculum problem. That is a rite of passage problem. A purpose problem. A belonging problem.\\nAs for Sweden in the 1960s, that is an interesting data point but it does not address what has changed in the last 30 years specifically. Something shifted. The rates of male disengagement, suicide, addiction, and dropout accelerated. That acceleration needs an explanation beyond girls simply being naturally better students.\\nAnd to your final point. Perhaps treating boys and girls equally will always result in girls doing better in school. Maybe. But equal treatment does not mean identical treatment. Boys and girls develop differently, learn differently, and need different things at different stages. Acknowledging that is not inequality. It is just biology.\\nThe goal is not for boys to outperform girls. It is for every young person to reach their potential. Right now boys are not doing that. That should concern all of us.\"}, {\"id\": 1211, \"aid\": 169, \"author\": \"dean\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778709722680, \"up\": 2, \"depth\": 1, \"text\": \"Historical institutional male dominance with reflexive gender bias/favoritism reinforced the old boys club, significant pay disparity, restrictions on women's autonomy, and countless other disadvantages levied against women. There is no denying it.\\n\\nHowever, early childhood education is now increasingly female-dominant (85-90%), and no institution is immune to reflexive gender bias/favoritism.\\n\\nEquitable treatment should be the destination. Equal treatment can drive out equal expectations, resulting in boys generally being viewed as \\\"malfunctioning girls\\\" who can’t sit still and are immature. This framework effectively pathologizes male-typical development by treating biological and developmental variance as a behavioral deficit. When \\\"equal treatment\\\" is defined by a standard that favors one gender’s natural developmental timeline, it is an inevitable consequence that girls will see greater success than boys.\"}, {\"id\": 1210, \"aid\": 168, \"author\": \"brennan Fitzgerald\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778712842106, \"up\": 0, \"depth\": 1, \"text\": \"Ryan, I resonate so strongly with what you're saying. As a new father, I often think about what it means to be that model for my children, to the best of my ability. \\nDo you have any favourite resources (books, authorities, role models, etc...) for men and fathers that speak more to this idea you're sharing?\\nI find myself searching for communities of like minded men who hold these values and are on the common mission of instilling them in our children, while simultaneously seeking to be better men, fathers, and community members.\"}, {\"id\": 1209, \"aid\": 4, \"author\": \"William Anderson\", \"ini\": \"W\", \"title\": \"\", \"pinned\": false, \"date\": \"May 21\", \"ts\": 1779383470623, \"up\": 0, \"depth\": 1, \"text\": \"This is a fantastic reply by you. I am a teacher (middle school) and have a son that is 22 months old. Everything you have said is true and whenever I relflect on being a male role model, I think of exactly what you wrote: men need to be role models and show regulation and show humility and other tools for these young boys to learn from. The drastic difference in my teacher/student relationship with my students vs the female staff is very noticeable. The boys love me, my class and I understand their needs a lot more, even if they are moms of boys, they don't understand because they weren't an active boy. My son is and will always be wild - He will never be put into a category as a problem - even at his day-care they tried - imagine my response as an educator but as a fully present father and role model for my son who at the time was 20 months old - all these people tried to say he was a problem and then after they heard from me, imagine how many times I have heard from them since? ZERO - why? I rejected their therapy and resources from the region etc... I continued to take him outside evryday, even during the winter - exposed him to experiences, people and nature. He doesn't ever want to go inside (I also do no screens) and he lives the life I lived in the 90s. Ryanb, I love what you are saying, I support you and all men that are aligned in helpeing these young boys become men, the right way - even if it is hard for us in the moment!\"}]}, {\"id\": 1218, \"aid\": 173, \"author\": \"Rae Swearengen\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778590715090, \"up\": 0, \"depth\": 0, \"text\": \"Our job as parents and educators is to help prepare adults. That's it. We worry far too much about giving them \\\"childhood\\\" about preserving their \\\"innocence\\\" and about making every dream and wish a reality and removing every wee bit of discomfort for them, that all we end up doing is failing them. We are not preparing these children. Not teaching them how to fall and get back up. Not demonstrating that discomfort equals growth. This is on us.\", \"replies\": [{\"id\": 1219, \"aid\": 167, \"author\": \"Ryan Carey\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 12\", \"ts\": 1778591014585, \"up\": 1, \"depth\": 1, \"text\": \"I couldn't agree more. FACTS!\"}]}, {\"id\": 1220, \"aid\": 30, \"author\": \"Erin Obourn\", \"ini\": \"E\", \"title\": \"Community Manager\", \"pinned\": false, \"date\": \"May 11\", \"ts\": 1778525007392, \"up\": 0, \"depth\": 0, \"text\": \"Raising a young son and reading this made me want to hear from others. Whether you're a parent or not, if there's a boy in your life — nephew, student, neighbour — what's your take?\", \"replies\": []}];\n    this.UPV = {\"Russell Cullingworth|iveworkedandresearchedcreativi\": 0, \"Nicholas Zacharias|westernsocietyisclearlydesigne\": 0, \"Teran Mundell|ipostedthisontheyoutubevideoan\": 0, \"William Anderson|idonoteverwanttotakeawayfromwo\": 0, \"Larry Van Pelt|accordingtogooglesgeminiaicoll\": 0, \"mom123outwest|asasubstituteteacherwiththevsb\": 1, \"p123|yeahitsnotsomuchaboygirlmydaug\": 0, \"mom123outwest|yesweneedtofixthesystemforever\": 0, \"Christopher Marshall|theschoolsystemanditsstructure\": 0, \"Donna Angel|iknewtheeducationsystemswasnot\": 0, \"ludo|therearearangeofsystemicissues\": 0, \"monroe2020|ihavea5yearoldsonwhohasadhdand\": 0, \"norwester03|thebarisraisedhighforboyscompa\": 0, \"olivia|ithinkthewaythisissueisapproac\": 0, \"Lesley McVey|ibelievethatboyswoulddobettera\": 0, \"Patrick A
