]}, {\"id\": 1016, \"aid\": 15, \"author\": \"Patrick Auge\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778798983129, \"up\": 1, \"depth\": 0, \"text\": \"I think the real problem is not that boys and girls are “better” or “worse” than each other. The real problem is that we often expect boys and girls to develop, learn, behave, and succeed in exactly the same way and on the same timeline, when human development is much more complex than that.\\n\\nSchools are built around certain definitions of success: sitting still for long periods, strong verbal communication, organization, attention regulation, structured work, and standardized testing. Those are valid skills, but they are not the only forms of intelligence, competence, or potential. When one group statistically struggles more within that structure, the conversation immediately becomes “they are falling behind,” instead of asking whether the system is flexible enough to support different developmental needs and learning styles.\\n\\nThat does not mean boys should not be held to standards, nor does it mean girls have an unfair advantage. It means boys and girls are different, and that is okay. Different does not mean unequal in value. Men and women develop differently in some areas, may mature at different rates, may respond differently to the same environment, and may have different strengths or challenges on average. The solution is not to erase those differences or pretend they do not exist. The solution is to better understand them.\\n\\nThat is where I think the article’s wording becomes problematic. Terms like “boy crisis,” “falling behind,” and “systemically disadvantaged” create a very competitive framework. The article repeatedly compares boys’ results directly against girls’ results in areas like graduation rates and academic performance. That subtly pushes readers toward the idea that one sex is “doing better” than the other, when in reality academic metrics only measure a narrow category of performance. They do not measure overall human value, emotional intelligence, resilience, creativity, leadership, social contribution, or success in life as a whole.\\n\\nThe article also mixes educational concerns with broader ideological discussions about “male supremacy” and workplace power structures. That shifts the discussion away from childhood developmental needs and into a social competition between sexes. Once the conversation becomes boys versus girls, everyone loses. Helping boys succeed should not threaten girls, and girls succeeding should not be framed as a problem for boys.\\n\\nThe deeper issue is that we keep trying to force identical outcomes instead of asking better questions:\\nAre schools adaptable enough for different developmental styles?\\nAre we mistaking quietness and compliance for intelligence?\\nAre we measuring true understanding, or mainly the ability to fit one behavioural model?\\nAre we supporting children according to their actual needs?\\n\\nEquality does not always mean treating everyone identically. Equity means recognizing that different students may require different approaches, supports, or environments to have the same opportunity to succeed.\\n\\nMen and women are not enemies competing for superiority. They complement each other and depend on each other in society, families, workplaces, and communities. The goal should not be to erase differences, rank one sex above the other, or force everyone into the same mold. The goal should be mutual respect, equity, understanding developmental differences, and helping every child reach their full potential.\", \"replies\": []}, {\"id\": 1017, \"aid\": 16, \"author\": \"Laura Campbell\", \"ini\": \"L\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778793121343, \"up\": 1, \"depth\": 0, \"text\": \"I'm surprised that this is finally being noticed now 30 years later after my kids are now adult children! I had 2 girls and then a boy and that was when I noticed how the education system was biased and \\\"feminized\\\" towards girls.  Most of the teachers were women, very few men to serve as role models. My son was tested for ADHD in Gr. 1. and was then put in remedial English for the entire primary school system. The books offered were of little interest to him and the shop class was cancelled in middle school (and we wonder why we have a shortage of skilled labour?) He was labeled as disorganized, messy, and not motivated.  Highschool was not any better, but he did have 1 male teacher in shop class who motivated him and a class of boys to refurbish an old army tank.  He was inspired! My husband and I sought out extra-curricular activities, and he joined air and army cadets.   That really helped.  But schools need to change the curriculum to engage boys, help them to channel their energy and interests from Kindergaarten.  Get technical activities in class, reward their energy, and get books that interest them. Don't mark them on neatness or label them from the start.  I'm happy to say my son did sucessfully complete university, excel and is very focused, attentive to his public sector job.   However, there are other avenues to success than university - give them the skills to also consider the trades.  Do what we did for girls, now for boys!!\", \"replies\": []}, {\"id\": 1018, \"aid\": 17, \"author\": \"Mark Bradley\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778790565543, \"up\": 0, \"depth\": 0, \"text\": \"Pure discrimination against males since 1970s.\\n\\nDefund the organization’s who discriminate against males.\\n\\nDefund the CBC\", \"replies\": []}, {\"id\": 1019, \"aid\": 18, \"author\": \"Brendan Mirka\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778764918877, \"up\": 0, \"depth\": 0, \"text\": \"Has the CBC contacted Richard Reeves to discuss this topic? He has done a lot of work to bring attention to this topic and I'm sure he would be willing to give an interview to Canada's broadcaster. He wrote the 2022 book \\\"Of Boys and Men\\\" which delves deeper into the crisis of boys in school, and how that crisis affects men later in life.\", \"replies\": []}, {\"id\": 1020, \"aid\": 19, \"author\": \"kate633\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778738321064, \"up\": 1, \"depth\": 0, \"text\": \"I am absolutely fuming at this article and reporting. I think looking at this as an issue of boys are being prejudiced against. There’s so many issues with this that present their opinions on correlations as causations and that makes me furious. \\n\\nFirstly, I would like to say, I’m 30F who was late diagnosed ADHD, I was a hyper kid and later called a chatty Kathy. As a girl, I was EXPECTED to sit and listen and do my work and be organized. And while my penmanship was and always has been terrible, I learned and developed strategies to deal with school and go onto to be successful enough obtain a double major in biology and psychology. Now I work with children who have learning disabilities to help them re-integrate into typical classrooms more easily. \\n\\nNow let’s talk about the first Mom. She has 3 daughters and 1 son, who is also the youngest. And her son seemed more tired by his day, was dejected, and he had to sit still to do worksheets. I’m sorry, but that’s school. You sit in a desk and learn. There’s different learning styles and interests but school generally takes place in your desk. By looking at only the subjective relation between your son and academia vs your daughters is pointless. They are individual children with their own interests and strengths, and frankly societal pressures for how they should act. There is no recommended difference in exercise for girls and boys, so claiming that boys are more rambunctious and need more physical activity for school is ridiculous. You predisposing them to indulge their energetic impulses and never teaching them self control is the problem. And if your son has a neurological condition (as I do) then help give him the tools and resources to handle it. But just claiming he’s a boy so he’s got more energy is laughable. \\n\\nSecond, learning disabilities, like many health related things, are more common in men. Other than mood disorders, which are more common in women, but are associated with emotional disturbances that we also tend to label women with. Women are often undiagnosed because their symptoms are different in their presentation than men. This has been shown to be the case for heart attacks, where only men were studied and thus only their symptoms were diagnosed. The seatbelts in cars are designed for men’s bodies, and women are often more likely to have injuries in car accidents. So while more boys are being diagnosed with learning disabilities, that’s not to say they aren’t present in girls (myself included, being undiagnosed my entire adolescence). A diagnosis actually makes help available to you and means they can take steps to help you. \\n\\nThird, do not talk about the USA. Our schooling system is different from theirs, as well we have no capacity to change their school system so bringing it up is not helpful. Unless this isn’t a school system problem, but boys everywhere have problems with school and thus changing schools methods won’t help. \\n\\nFourth, to state with your full chest that it isn’t good for one gender to fall behind the other is laughable. Women continue to make less than their male counterparts, are not afforded as much respect when in positions of authority, and are also judged for their personal lives and whether they have children and keep working or not have kids. So saying that it will affect these boys mental health and future job prospects is ironic when women have suffered both since…the beginning of time? Maybe we should look at a system that makes these boys suffer mentally rather than just trying to handicap girls or give boys another advantage. \\n\\nFifth, why are we talking about organized desks and sports games? I get evaluating a fish by his ability to climb a tree isn’t fair, but a good student needs to have their tools to learn. Teachers aren’t just evaluating and then saying “messy boys” with their hands up. They teach the importance of responsibility of your belongings and organizing your things to be able to study independently one day. The example of the boys at recess organizing sports games shows they are capable of these skills- but lack the inclination to use it in their classroom. That suggests to me not that we need to change our definition or evaluation of their organizational skills - because they NEED these skills in the classroom environment for their academic lives and potentially their professional lives as well - but that we need to change their perception of the skill. Which leads to my push for action. \\n\\nWhile there are many things in school that could change to help students, basing that change on this belief that boys are being somehow denied opportunities and success is not one of them. As a society, we need to recognize hard work and studies as something to respect. We also need to be wary of our own biases and how we treat boys and girls - with the intent of raising them more similarly. Encourage boys to sit and colour quietly sometimes or girls to go outside and play in the dirt. Read to all children, and emphasize how important education is while celebrating their strengths outside of school (like the arts, sports, hobbies). Doing a disservice to boys by allowing them to indulge in their impulses and shrug off skills they gain in school, while scolding girls for being loud and energetic will only harm all children involved. Stop trying to make school change for your societal expectation of how boys and girls “act”, and change your expectations of what boys and girls can do.\", \"replies\": []}, {\"id\": 1021, \"aid\": 20, \"author\": \"anita\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 14\", \"ts\": 1778719591598, \"up\": 0, \"depth\": 0, \"text\": \"My son does well at math but is totally disengaged with other subjects that he doesn’t like English and French.  He is also constantly gaming and I am concerned he is faking illness to avoid going to school.  How do we intervene to prevent our teenage sons from dropping out?!\", \"replies\": []}, {\"id\": 1022, \"aid\": 21, \"author\": \"randyp\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778712031562, \"up\": 2, \"depth\": 0, \"text\": \"There have been several comments so far that I think have captured the essence of the problem - it's not really about gender but about a broken system that, for the most part, has ignored both the socio-cultural realities as well as the science related to both human learning and development.\\n\\nMany (learned yet exhausted) educators and researchers understand that it's broken.  And it goes well beyond elementary school as the same systemic issues persist through post-secondary education (and even into the workplace). While I'm not 'all in' on the Montessori method, \\\"following the learner\\\" makes a lot of sense given the diversity of youth and their: nature, interests, abilities and proclivities. This is emphasized in adult learning. But as it generally applies to formal education at all levels, based on what I've seen (and lived through with myself, children and grandchildren), there has been a lot of 'admiring the problem' and systemic resistance to introducing a new learning model for education. \\n\\nGender aside, as we look to the future of Canadian society and, indeed humanity, we should be asking core questions like:  \\n- What does wholly successful education really look like from the child's and society's perspective (not just the stats but in how outcomes are measured in qualitative terms)?\\n- What exactly do all children need to successfully navigate life in the 21st century (acknowledging that much of the current curriculum is based on historical understanding of what formal education is supposed to look like rather than an actual needs-based curriculum)?\\n- How can we address the diversity of learning and learner needs to support this success (recognizing the success should not be defined by a credential alone)? And,\\n- What learning structures do we need to put in place so we can address the points above (understanding that the pathways to success may be considerably different across learners)?\\n\\nI (and many others) realize that this requires a significant paradigm shift. And, to be honest I don't care what the rest of the world expects (e.g. IB or OECD standards) but rather what the needs are for our kids to be healthy, happy and find meaning and relevance in an increasingly challenging world. \\n\\nAnd, before anybody says it can't be done, given our understanding, relative prosperity, technology, talent and collective interest, I can only respond, why not?\", \"replies\": [{\"id\": 1023, \"aid\": 22, \"author\": \"Bala Viswa\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 15\", \"ts\": 1778812314956, \"up\": 0, \"depth\": 1, \"text\": \"One reason why \\\"it can't be done\\\" is we still don't know what \\\"it\\\" is. We as a society haven't decided what we want school (K-12) to be. \\nDo we want it to be a place to socialise children? Prepare them for work? A place to keep them out of trouble while the parents work? Educate them and prepare them to live as adults? Make them academically proficient? Is it enough to do well on PISA? Or do we want to compare to OECD? Help children reach their potential in what they want to do? How well-rounded should children be? Do we encourage their interests, even if it means they hyperspecialise in one thing?\\nEach of those objectives requires different structures and different ways of doing things. The other problem is government, industry, parents, the community, and higher education have different views of what the school system should do. Those views don't always line up. If we do not know what we want the system to do, we will never know if it has been successful. Right now, the system is unsuccessful, simply because it is trying to be everything to everybody. In the process, it doesn't meet anybody's needs.\"}]}, {\"id\": 1024, \"aid\": 23, \"author\": \"Alina K\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778711344842, \"up\": 1, \"depth\": 0, \"text\": \"In a world where there's pesticides and plastics and preservatives in everything the growth in development will be different and every child is different and they should be labelled due to ADULT mistakes its sickening.. the schools are understaffed and the teachers are stressed enough they won't be able to pay attention to every detail of every child and it's sad.. can only do so much to help and be strong in a world that tells us different\", \"replies\": []}, {\"id\": 1025, \"aid\": 24, \"author\": \"pg4\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778711293764, \"up\": 1, \"depth\": 0, \"text\": \"As a woman who was diagnosed with autism in my 30s, and know of many woman who have been diagnosed with ADHD and Autism as adults, I disagree with the usage of statistics showing higher rates of neurodevelopmental differences in boys. \\n\\nWhere boys with ADHD can’t sit still, girls with ADHD can’t stop their minds. Girls however are much more likely to learn to successfully mask their symptoms. It takes a lot of energy (that the boys express physically), and these girls are often the ones who start to struggle in their pre-teens and are diagnosed with things like depression and anxiety as the responsibilities they are expected to take on increase. \\n\\nUnstructured time with appropriate supervision is important for all children, regardless of their labels. The key is that this unstructured time is accommodating to the children’s varying needs. Forcing a child who has energy to burn to play quietly doesn’t help in the same way that forcing a child who is constantly overstimulated to go play outside with the noise of the other children all around them doesn’t help.\", \"replies\": []}, {\"id\": 1026, \"aid\": 25, \"author\": \"adele\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778710061681, \"up\": 2, \"depth\": 0, \"text\": \"Just because boys aren’t going to university doesn’t mean that they’re falling behind. My family is full of electricians and they make a really good living and are very happy. Most probably have a higher standard of living and got jobs earlier. Our school system took the shops out of the high schools and of course boys suffered because they loved doing hands on mechanical work.\\nIt’s not all about attending university. You can be an intelligent, happy well-rounded person without ever stepping foot in a university.\", \"replies\": []}, {\"id\": 1027, \"aid\": 26, \"author\": \"Shelagh McNally\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778706381260, \"up\": 1, \"depth\": 0, \"text\": \"The male loneliness epidemic, boys not doing well in school, their need for validation, the right wing radicalization of young men are all treated as a giant crisis. There are reports, programs and solutions along with \\\"alarming\\\" stats. Meanwhile femicide, missing and murdered Indigenous women are not dealt with. No one in the Epstein files was charged except the woman. Women's health remains under funded and under researched. We still don't have pay equity and men are still promoted quicker than women. As it was said, the real issues are the patriarchal structures that assume men are superior. Somehow schools being the issues (despite girls thriving) is a dog whistle for the patriarchy feeling the pressure of change.\", \"replies\": []}, {\"id\": 1028, \"aid\": 27, \"author\": \"philature99\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778694317126, \"up\": 1, \"depth\": 0, \"text\": \"Many studies identified that boys simply mature later compared to girls making it difficult for them to keep up. The simplest solution is to simply provide one more year of kindergardern to boys to allow them to mature enough prior to the 1st grade.\\n\\nAlso, boys also suffer from higher rates of autism and ADHD so it could also be an issues with the lack of supporting ressources.\", \"replies\": []}, {\"id\": 1029, \"aid\": 28, \"author\": \"Keta K\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778692761660, \"up\": 0, \"depth\": 0, \"text\": \"Honestly i think the phrasing \\\"boys falling behind\\\" is innacurate in the first place. I agree with people here who say too much time sitting in desks, a shift in focus away from some subjects (more 'hands-on' ones that involve tactile experiences, rather than just reading & writing), and it seems the frequent \\\"group projects\\\" which disinsentive some students.\\nThis is beneficial to all students but would noticeably improve grades for boys.\\n\\nIn truth, to me the issue is not just with the education system but society at large. Are girls more self-motivating, at home to do their homework? Are boys more drawn to screen time, as video games are targetted at them from a very young age?\\nSome boys by the time they start school they are already \\\"behind\\\".\\nThe cultural shift to superficial; university profs are saying right now they have students who never read an entire book (just the synopsis or specific sections that were part of the curriculum). Do parents still read to their children?\\n\\nThese things are universal, they are showing up more with boys right now because society is just at the beginning of girls not being held back, discouraged, or outright not allowed to take certain subjects.\", \"replies\": []}, {\"id\": 1030, \"aid\": 29, \"author\": \"Shelley Corrin\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778692078296, \"up\": 0, \"depth\": 0, \"text\": \"The problem is the French language itself, and the way it is taught.\\nWhen HS dropout rates were measured in the 80’s and 90,’s, the boys dropping out at a 20% higher rate than girls failed French and one other subject.  Given the differential in learning disabilities, dyslexias , ADHD’s, the mastery of written French  is clearly so much harder for boys than girls.  Add to that the unwillingness of boys to read books out of school, and voila.\\n\\nBut the teaching of French was then so hidebound in traditions that further hampered literacy. Dictee, where even the punctuation was supplied, and grammaire instead of real writing ( stories, essays etc), condemned boys to failure if they were even slightly disadvantaged.  \\nAs the teaching of English Language Arts moved further into enhancing the mind and away from traditional ‘ grammar’,  the French language and its burdensome spellings, agreements, etc continued to burden boys, and prevent classrooms from developing literacy skills ( reading novels, writing freely, verbal skills, and such.) As I completed an M.Ed and taught \\nin an English  school whose students often had come from French homes ( but who still failed French ) and as I spoke about pedagogy with teachers of French in the staff room, all became clear.  Needless to say, my assessment would be anathema to the Education dept in La Belle Province.  Granted, it has been over 20 years ago that I observed that. But has it changed?  The stats stay the same.  It would be interesting to compare boys’ results in provinces where French is no longer in the curriculum.\", \"replies\": []}, {\"id\": 1031, \"aid\": 30, \"author\": \"Erin Obourn\", \"ini\": \"E\", \"title\": \"Community Manager\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778691858357, \"up\": 0, \"depth\": 0, \"text\": \"Thanks to everyone who has contributed so far. Many of you have shared deeply personal experiences — as parents, students, teachers, coaches, mentors and community members — and others have brought professional expertise and long-term perspective to the conversation.\\n\\nWe’re continuing to read through your comments and are interested in hearing from even more people about what supports, environments or approaches they’ve personally seen help boys thrive — both inside and outside the classroom.\", \"replies\": []}, {\"id\": 1032, \"aid\": 31, \"author\": \"Vickie Jones\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778691591784, \"up\": 0, \"depth\": 0, \"text\": \"I taught for over 7 years in the public schools and 30+ years in a university. Boys are so much fun and high spirited; they are in your face expecting you pay attention to them. The girls are quieter, and heres the main difference, they try harder, they do their homework, they study and they don't complain. Boys would rather play or go out for the night or act out while the girls complete their assignments, and often help the boys to complete theirs. Schools today use grades to make placement decisions, and bottom line, they boys are not competing very well. My advice to parents is teach and expect your boys to study, complete their assignments and fill their heads with visions of how to be successful. And they will do fine. Ask yourself if perhaps you believe \\\"boys will be boys\\\" and you don't expect head work and have high expectations for them. In my opinion that is the problem.\", \"replies\": []}, {\"id\": 1033, \"aid\": 32, \"author\": \"Matilda Dillon\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778691566922, \"up\": 0, \"depth\": 0, \"text\": \"Perhaps the problem begins at home where expectations for boys and girls are different. Parents might push ideas of what boys should be interested in and what they think girls should take an interest in. Boys are generally nudged towards sports, cars and trucks. Girls are nudged towards being sweet, kind, obedient and quiet.\", \"replies\": []}, {\"id\": 1034, \"aid\": 33, \"author\": \"mari\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778691451714, \"up\": 0, \"depth\": 0, \"text\": \"I’m a retired elementary school teacher. I raised a son and have a grandson. I have taught boys and girls aged 5 to 12. I agree that the problem starts before school. Parents are a child’s first teachers. Children emulate what they see. If you read for enjoyment, your child will too. If you value learning, your child will too. School is not the only place where learning happens.\", \"replies\": []}, {\"id\": 1035, \"aid\": 34, \"author\": \"Damien Hollett\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778688035628, \"up\": 0, \"depth\": 0, \"text\": \"Just have witnessed a interview on CBCNEWS, not judging or giving negative feedback, I am giving back positive observation feed back. The boy swinging around on a swing in the middle of a climbing jungle gym. No parent physcal connection, no interpretation of learning skills, numbers, alphabets, math, reading , words, writing into the child's physical activity. Use pictures of words, writing, directions, make a game out those skills. Otherwise parents stop being on your phones, and create ideas for your kids. Your phone has those ideas, options, and teachings. \\nFrom:\\nLifesaving Swimming Instructor since 2005 age 47.\", \"replies\": []}, {\"id\": 1036, \"aid\": 35, \"author\": \"Barbara Johnstone Grimmer\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778687314374, \"up\": 0, \"depth\": 0, \"text\": \"It starts before school. I have three boys, two whose dad died when they were in diapers and I raised them alone until school age. They had good daycare, stable home with consistent expectations and love.  I remarried and had a third boy, and he was mostly raised the same but had a dad and less daycare. They each had different issues with school but made it through and graduated, two graduated from university, one with a trade. Life isn’t easy but perseverance is important. Preparing young children for school when they are little is important. In my day, the bias towards boys was very evident. I was able to succeed and received postgraduate degrees. I shared my experiences with my boys, especially the joy of learning, how to succeed in learning, and I would read to them and encourage reading, and let them know you can learn anything if you read.\", \"replies\": []}, {\"id\": 1037, \"aid\": 36, \"author\": \"vocationcaptain\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778685485822, \"up\": 0, \"depth\": 0, \"text\": \"As one of my fellow students believes I agree that schools should be focusing on becoming a learning organizations who are prioritizing education among teachers. \\n\\nI wonder if we should be asking our peers and mentors if the collective intelligence of school staff is capable of facing challenges inherent in our systems today. \\n\\nFinally, I wonder if it would be a good exercise to redefine the system or system systems and understand what they are and what they intend to become.\", \"replies\": []}, {\"id\": 1038, \"aid\": 37, \"author\": \"Celia Kennedy\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778685106386, \"up\": 0, \"depth\": 0, \"text\": \"As I watched this story being reported on The National during my morning coffee, all I could say was, \\\"It's about time they said it out loud\\\". I am a retired environmental scientist with 2 grown sons and a husband of 40 years. One of my sons has a hearing disability. Both are established professionals holding positions of authority in their disciplines. I have 4 siblings and neither of my parents completed high school. When I was 39, I returned to high school with 2 young boys at home and the support of my husband. Five years later, I completed my first (of 3) post-secondary degrees, the first in my family. Now you have context. We were fortunate to find a preschool that specialized in children with disabilities, with some of the most insightful staff I have ever known. They taught my husband and I how to communicate with our older son and how to parent. How to constructively parent bright, energetic, misunderstood little boys whose potential is fragile if not nurtured in a positive, demonstrative way. In our family, learning was not confined to the classroom. We became coaches, scout leaders, community advocates and guest speakers at local schools. I could speak/write on the topic much longer, but I think my key message here is that if you want to produce thoughtful, intelligent, open-minded, gentle men, who are strong leaders with high-energy multi-tasking capacity, confidence and humility, you have to put in the time and effort to give them the tools and strategies to set them up for success as they make the journey from early childhood to adulthood. It's difficult, demanding, and the public school system will not support you in these efforts. Experience has taught me that it's broken. There will be times when your sons resent you and society offers easier options, but find the strength to stay the course.  Activities (athletic, tactile, artistic, social, indoor, outdoor) are your tools of leverage to reinforce learning and to help him navigate the challenge of growing up and finding peace of mind. My 2 cents' worth.\", \"replies\": []}, {\"id\": 1039, \"aid\": 36, \"author\": \"vocationcaptain\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778683819805, \"up\": 0, \"depth\": 0, \"text\": \"I experienced emotional and physical abuse from employees within the public school system. I was a boy with endless curiosity, and I later grew up to become talented in the fields of physics and mathematics. I learned a vocation and earned my Red Seal certification only because people in my life kept pushing me forward and refused to give up on me, no matter what I said or how difficult things became. From there, I went on to become an engineering technician, and I am now enrolled in university.\\n\\nAll of that success exists because of the people in my life who continued to believe in me and push me forward. As it turns out, many of the things people in public school said about me when I was a young boy were not true at all. In fact, those experiences caused me a great deal of harm.\\n\\nEntering university in the middle of my life has created enormous challenges for building a career. If I could have chosen my own path, I would have preferred to complete the education and courses that allowed me to pursue these opportunities much earlier in life.\", \"replies\": []}, {\"id\": 1040, \"aid\": 38, \"author\": \"Maxine Bertolini\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778682286809, \"up\": 0, \"depth\": 0, \"text\": \"As a grandparent of 3, who has raised a son and daughter in two Northern communities. I have experience with both my children and now grandchildren. The education system does not take into consideration the developmental differences between girls and boys. Little girls most often develop their fine motor skills first so they often enjoy sitting and colouring, cutting, whatever the task of the day is. Whereas little boys are most often the opposite they develop their large motor skills first. So they have a need to run and climb and move. I say most often as every child is unique and we really can’t be sorting by gender. But rather by individual preference. \\n\\nEarly and middle school isn’t designed for this. \\nBoth my children have become successful adults partly due to both myself and husband being involved with our children’s education and good communication with their teachers. \\nEarly on in our home community of Inuvik both my children were able to attend a Montessori preschool. It was a wonderful experience as each child could learn in different ways.  In our current community of Yellowknife, NT both my children and now my grandchildren have access to some on the land learning with indigenous Elders. It’s such a great opportunity for them. Something all schools should do more of. \\n\\nIn closing, it is important for children to learn how to sit and learn in a classroom but finding great ways to learn outside the classroom is just as important.\", \"replies\": []}, {\"id\": 1041, \"aid\": 39, \"author\": \"Mike Gravelle\", \"ini\": \"M\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778682163726, \"up\": 0, \"depth\": 0, \"text\": \"I think I'm a perfect example. In early 90'  I was a good boy in grade 8 to grade 10 with a failing grade and at times barely passing. There wasn't any extra help for me or an Avenue to go down, I would just sit there in class and continue to struggle. It probably led me more to not even make an effort since I knew I was struggling. Thinking back now, The best case scenario would have been to go home in the evening and hit the books but after sitting in a classroom all day, there would be none of that.\\nI had no ADHD or anything wrong with me whatsoever. Just a normal kid. \\nIn Grade 11 I started skipping Wednesdays and my grades move to a b+. None of my classes was even close to a failing grade for 11 and grade 12.\\nI replaced school with an adventure. Not get up late, linger around, play outside or (now days stay home play video games).\\nLooking back now, I didn't do this purposely but It was a structured adventure. \\nI had a plan the night before and I had to lie to my parents because taking a day off school to go play was unaccepected in society. My parents now would agree it was a good decision. I got busted in June of grade 12 when teachers ask my parents \\\" what did you guys do to help his grades? Where did he go every Wednesday?\\\" \\nThey had no clue. They came home after that school meeting and I was probably going to get drastically punished and yelled at with disappointment. But what saved me was the teacher saying my grades were good and they had no issues with me at school, I was a good quiet student.\\n\\nOn Wednesdays,\\nI got up at the same time and had to borrow my parents car to get me to school because of team practice after school so I needed to bring my equipment that wasn't allowed on the bus. \\nThat lying meant that I needed to have a plan to follow all day long. That meant that this was a structured adventure. You can say it's kind of like school, I had a plan all day long and there was structure in my day. That is important.\\n\\nYou can assume what you would do today on Wednesdays as there are many options. \\nJust as an example, September to December and April to June, I mostly rode my bike in the forest all day long, and going fishing, or hiking up some little trail. I tried to stay away from the downtown to not be seen by others (like family or Parents Friends).\\nWhen I got comfortable skipping, I went to the arena and took advantage of the scheduled skating the city had in place. There was a senior skate and there was also an Old-Timers hockey ice time. I took advantage of both and the old-timers didn't mind having me around. \\nI also went to the YMCA or the local gym. 8am to 5pm was along day so I needed to keep busy.\\nDecember to March was my favorite. I went straight to the ski hill and I stayed there until everyone was gone and the lodge was locked. \\nThe ski hill was mostly loaded with men working graveyard shifts or retired seniors. \\nGrade 12, I even volunteered ski patrolled. \\n\\nAs of today, it is Wednesday, and it is my scheduled off work day. All the staff know that I'm golfing on Wednesdays. Or I'm at the gym, or I'm going skiing or biking. \\nI own 3 businesses, have 40 staff, two kids and a couple pieces of real estate. I'm for an healthy.\\nI don't think I would have come out the way I am today if I would have been stuck in that classroom 5 days a week sitting on a chair in grade 11 and 12. I never would have signed up for college.\\n\\nI structure my job so I never sit on a chair more than 2 hours a day. This has got to be one of the major issues for young boys and girls. \\n\\nOkay, some of you right now will say that most kids would have simply got into drugs and caused more issues and learn bad things by hiding out in a downtown core. That is true but I was fortunate enough to have these memberships in community buildings. If it wasn't for these memberships that my parents paid for or had access through school programs, I may have found myself hiding out in the forest or trying to blend in in the downtown core away from being seen. \\nI had access to hockey skates, a bike, fishing rod and luckily a ski pass. \\nI'd be curious to look at those schools that utilizes the outdoors on a regular basis or head out on field trips often. How are those kids doing. I know those schools are everywhere and there are pilot projects out there today. \\nI can safely say that my kids classes head outside frequently, and my kids don't mind skipping school for a ski day or an adventure. And their grades are pretty good.\", \"replies\": []}, {\"id\": 1042, \"aid\": 40, \"author\": \"Ralph Mousseau\", \"ini\": \"R\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778677876802, \"up\": 0, \"depth\": 0, \"text\": \"Boys are taught that being male means your are toxic. Men are represented as bumbling idiots in pop culture. I am a single father of four. I can tell you that from family court to supports for single moms only our culture is replete with sexism toward men. It's accepted and even encouraged. Boys are made to feel weak if they ask for equality. Since the 80s the focus has been on girls in education. We need to re align it so focus in on kids.\", \"replies\": []}, {\"id\": 1043, \"aid\": 41, \"author\": \"Cici Ford\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778677761319, \"up\": 2, \"depth\": 0, \"text\": \"As a mom of a 12-year-old boy, I know I did some things, early on, that helped my son do well in school: established bedtime reading routine/love of books, I made sure he could read and write before starting JK, and I took him to pre-school playgroups so he could get a \\\"feel\\\" for a classroom-like setting.\\n\\nIn retrospect, I know I should have done more regarding general discipline and directly teaching empathy and consideration of others. I also feel a piece I missed was building his tolerance for WAITING. HAVING to sit and wait, sometimes, for others to be served, talked to, or dealt with BEFORE HIM. I think the things I did well have gotten him through, but the things I did poorly have cost him even better learning, mastering self-regulation sooner, and possibly quality friendships, as well.\\n\\nI believe many mothers favour (not quite what I mean, but I will use that word as a catch-all for the biological and psychological baggage that comes with women rearing little men) and pamper their boys. I don't think this is necessarily conscious, nor is the \\\"toughen up, it's a tough world\\\" philosophy often delivered to girls (\\\"for their own good\\\"). Moms commonly set the family tone, and if these two approaches exist AND combine with \\\"gentle parenting\\\" it spells more disaster for boys than girls.\\n\\nAs a teacher, recently having switched from secondary to elementary teaching, I feel I see proof of this theory very often. I taught grade one last year and, when held to a certain standard, boys have no problem - through prolonged training - meeting standards for sitting still, increasing the length of time they can focus, and learning. Maybe these skills don't come as naturally to all boys as they do most girls, but that doesn't mean the work put in isn't worth doing. \\n\\nAs a woman, I wonder why girls (I am speaking in generalities which can be exclusionary AND useful, which is challenging) are expected to sit by quietly and patiently while boys collect themselves or while adult educators in the room have to deal with boy antics and outbursts BEFORE the class can get down to learning? Again, this is delivering the same two messages: \\\"boys will be boys\\\" and let's give them the priority time and space to do that, and girls should \\\"toughen up, it's a tough world\\\"...and a lot of that has to do with all the space you have to make for boys.\\n\\nI think both genders/sexes, wherever they feel they fit, suffer - albeit in differing ways - when the basic self-discipline required to exist in a considerate society are lost. How are these regained? Through the direct teaching of having to wait at times, by parents modeling empathy and consideration for others, and by helping kids develop an internal locus of control.\\n\\nI'm sure there's more to the issue - and I didn't even touch on the disruptions of technology - but these are my thoughts on the issue.\", \"replies\": []}, {\"id\": 1044, \"aid\": 42, \"author\": \"Jake Thornton\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778677704258, \"up\": 1, \"depth\": 0, \"text\": \"As I look at this issue, I see several contributing factors:\\n\\n1. All of this starts at home. Children’s home situation, whether they’re boys or girls, is the number one predictor of future success. Having 2 present and engaged parents is the best thing to set up children to be successful adults. There’s a societal disconnect from this historic norm that is contributing greatly to this issue. \\n\\n2. Boys need to be allowed to be masculine. This is going to sound like ‘Manosphere’ indoctrination, but the evidence is out there; masculinity is discouraged in boys from the get go. I’m not talking about chauvinism or misogyny though, these should indeed be discouraged. But boys and men are wired differently than girls and women and those differences in both need to be nurtured. \\n\\n3. Kids are not allowed to fail. School systems are systemically flawed nowadays where kids who are underperforming are pushed through with a low passing grade rather than being failed on homework and assignments. All this does is undermine the teachers’ authority and the need to put in effort for the kids. Eventually these kids are going to fail; it’s just going to happen when it truly counts. As adults, they will not have the tools to cope with society, and society isn’t going to give them anything for free so understanding that there are consequences to not performing is an essential piece of education. \\n\\n4. Kids have so much energy, boys and girls alike. Boys seem to tend to need the outlet of sports and free play to then be able to sit in the classroom. Having outlets for this throughout the day, whether it be physical education, recess, or even a more interactive portion of other education seems vital to me. \\n\\n5. Parents need to work with teachers better. Too often, parents think their children can do no wrong and will just fight teachers on every little piece of constructive criticism. This is not to say that some teachers won’t get it wrong and it’s important to know your children well and be able to recognize where something simply doesn’t fit your child’s character. But far more often than not, teachers are trying to help, not trying  to sabotage our child.\", \"replies\": []}, {\"id\": 1045, \"aid\": 43, \"author\": \"Bethany Waldie\", \"ini\": \"B\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778677123608, \"up\": 1, \"depth\": 0, \"text\": \"So glad this is being discussed. As someone who is about to have their first child (a boy) I am already thinking about what his experience will be in school and how to set him up for success. By and large the education system structure and framework is not set up for most boys to succeed. The expectation to sit quietly for hours and pay attention is unreasonable for majority of children, let alone boys. More activity is needed throughout the day. \\n Also, as others have said below - there’s the critical component of boys needing more male role models present in their lives through community (not via social media) to help guide and direct them.\", \"replies\": []}, {\"id\": 1046, \"aid\": 44, \"author\": \"Kevork Hacatoglu\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778676389432, \"up\": 0, \"depth\": 0, \"text\": \"Social media is a giant unregulated experiment being run on boys and girls, as is the broader phone-based childhood. More free play and schools implementing phone bans would certainly help. Giant Silicon Valley tech companies have too much direct access to youth and it's leading to increased rates of anxiety, depression, addiction, attention fragmentation, etc. Boys as more solitary individuals compared to girls are especially vulnerable.\", \"replies\": []}, {\"id\": 1047, \"aid\": 45, \"author\": \"Yoga du Village\", \"ini\": \"Y\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778675931495, \"up\": 0, \"depth\": 0, \"text\": \"Scandinavian approach to learning: outdoor classrooms, using nature as a teaching tool, play in younger children as been shown to develop skills that lead to higher success as they grow.  Get the kids out of rows and stuck in desks.  Kids learn faster through play.\", \"replies\": []}, {\"id\": 1048, \"aid\": 46, \"author\": \"David Neil\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778675738640, \"up\": 0, \"depth\": 0, \"text\": \"Apathetic parenting, too much screen time, not enough exercise, lack of nutrition. Young boys need regiment.  Cod liver oil can help support brain development in young children, primarily due to its high content of omega-3 fatty acids (DHA and EPA) and vitamins A and D. DHA is a crucial structural component of the brain and retina, supporting cognitive function, memory, and visual development.Key Benefits for Young Brains:Cognitive and Behavioral Support: Rich in DHA, it supports memory, learning, and overall brain cell communication. Improved Focus and Attention: Studies have linked omega-3 intake in children to improved attention spans and better performance in tasks requiring cognitive effort. Neuroprotection: The nutrients in cod liver oil are thought to aid in reducing inflammation and promoting long-term brain health. Early Life Development: It is particularly valuable during infancy and childhood for maintaining healthy brain function.\\nhttps://www.google.com/url?sa=i&source=web&rct=j&url=https://www.healthline.com/health/parenting/cod-liver-oil-kids&ved=2ahUKEwiM1dCQo7aUAxV9MlkFHbZgCEYQy_kOeggIAggACBcQBA&opi=89978449&cd&psig=AOvVaw2UvyBTeu6_oOTHhx20gAfR&ust=1778762046475000\", \"replies\": []}, {\"id\": 1049, \"aid\": 47, \"author\": \"helga\", \"ini\": \"H\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778674862049, \"up\": 0, \"depth\": 0, \"text\": \"Mom of Teen son with high functioning ADHD, Learning Disability & Sensory Processing Disorder.\\nIt's been a struggle, I can tell there is a very high pressure of self image going on between the boys, more than before, comparing growing up with brothers.\\nHair products, body products, barbers, shoes, clothes.. all of this!! \\nI think girls have always had that and relaxed with it. Social media pumping things.. snap chat.. adding to social stress.. that they are more focused on social images and personal self growth for the future, they are more worried about the \\\"now\\\" moment.\", \"replies\": []}, {\"id\": 1050, \"aid\": 48, \"author\": \"C Borkowski\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778672785992, \"up\": 0, \"depth\": 0, \"text\": \"There’s been a lot of discussion about rising female enrollment in universities and colleges, but I think it’s worth looking at the broader picture before drawing conclusions.\\nHas anyone compared this trend with the growing number of young men entering the skilled trades? While fewer men may be pursuing traditional post-secondary academic paths, many are choosing trade careers instead—fields that are not only in high demand but are also actively supported by government initiatives across Canada.\\nWith ongoing labour shortages in skilled trades and increased emphasis on apprenticeship programs, it makes sense that some men are opting for these practical, career-focused pathways rather than university degrees. In many cases, these roles offer strong earning potential, job security, and clear progression without the same level of student debt.\\nRather than viewing this as a simple imbalance in education, it may reflect a broader diversification in career choices. The real question might be whether we’re adequately recognizing and valuing all forms of post-secondary pathways—academic and vocational alike.\", \"replies\": []}, {\"id\": 1051, \"aid\": 49, \"author\": \"elleb\", \"ini\": \"E\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778672648999, \"up\": 0, \"depth\": 0, \"text\": \"Boys, in particular, are started in school WAY too early. They should NOT start school until age six, maybe 7. Look at Sweden and Norway way where children don’t start until 6/7. There would be significant decrease in ADHD diagnosis in boys. Boys do significantly better when they start school later. Suggested reading “Boys Adrift” by Leonard Sax \\nAs long as parents want “free day care” in the form of formal schooling boys will struggle. That is not a slam on teachers whatsoever. I am a retired one, and teachers do amazing things. Boys just don’t fair well in these settings so early.\", \"replies\": []}, {\"id\": 1052, \"aid\": 50, \"author\": \"Jill Lawless\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778666738407, \"up\": 0, \"depth\": 0, \"text\": \"I have two sons who went through the public school system. One is in high school and the other is in undergrad university level education. We are a highly educated family with both parents and health professions.  I was very involved in our boys education in elementary school and I observed firsthand the struggles they overcame to be successful in their higher level schooling.  Both of my boys recall feeling tortured at the grade 6 level due to the expectation that they would sit still and not move for didactic- style teaching.  Ever recall both sons asking if there was something wrong with them because they felt akathesic sitting in their seats, trying to pay attention. We even met with the teacher and had adaptations made for our younger son so that he could get  up and walk to the washroom without having to ask permission. My observation is that the classroom needs to be a more dynamic environment for both genders. I noticed that there seemed to be more understanding of the nature of boys “energy” with male teachers more so than female teachers.  I don’t think the answer is putting stationary bikes in the classroom. But I do think movement needs to be part of every classroom, less static learning.  Experiential learning needs to happen in the upper elementary grades where it seems that as  work gets more serious, the teaching becomes more stationary and more didactic. In the younger elementary teaching, experiential learning is embedded and a focus.  I believe there are ways to incorporate movement as children are learning more difficult concepts. My boys are intelligent and picked up concepts especially in math and science relatively quickly, however, I noticed their confidence was shaken during those upper elementary years of school and that fed into an attitude towards school for a period  time that was negative.\\nThey both enjoyed the movement from class to class in middle school and regained their confidence thereafter. From our experience, the upper elementary years were their most challenging.  Classroom size obviously plays a significant role in how creative teachers can be- smaller class sizes are needed to enact change.\", \"replies\": []}, {\"id\": 1053, \"aid\": 51, \"author\": \"fundaybay\", \"ini\": \"F\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778666366576, \"up\": 0, \"depth\": 0, \"text\": \"Parents need to work very closely with teachers and staff on what works for their child.  My 24 year old son was always a challenge and he is now working as an insurance adjuster and loves it.  My son always wanted to be the centre of attention, the one who made kids laugh.  Having him work in a room in the principal's office worked for him because he was very focussed when working independently.  Also, two teachers engaged him in stimulating conversation.  He loved to read and know facts about sports and history. I always told teachers to keep him busy.  Always make sure that he had something to do.  High school guidance encouraged him into tech courses and I said no.  I told him that he is a thinker and does not have the aptitudes or interest for skilled labour.  I had to fight hard to ensure that he was directed to university level courses.  Now he is happy and focussed because he can talk to people and think to navigate claims.  Both of which he thrives on.\", \"replies\": []}, {\"id\": 1054, \"aid\": 52, \"author\": \"Jennifer Duncan\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778666026851, \"up\": 0, \"depth\": 0, \"text\": \"There are to sides this coin. I completely agree that more activity would benefit all children. My boys would love to have my school schedule which included two 15min recess breaks, 40min at lunch, and schools in walking distance. However, that does not justify boys becoming violent at school when they get frustrated.  Funding needs to increase, parents expectations of their government should be increased. We should not blame the problem on teachers doing the best with what theyve been given.\", \"replies\": []}, {\"id\": 1055, \"aid\": 53, \"author\": \"Steve TThompson\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778665319896, \"up\": 0, \"depth\": 0, \"text\": \"When the ideal for boys in the media is presented as sports idols like Sidney Crosby or Tiger Woods or music stars or any of those popular entertainers, why would they want to achieve at school cuz those aren't relevant to those roles that have become what the media presents as ideal careers in science trades or economics are never presented as the ideal role for young men, especially boys. Why would they bother to you succeed academically when it's been shown that the academics aren't the ones that gain the popularity and that seems to be the new role\", \"replies\": []}, {\"id\": 1056, \"aid\": 54, \"author\": \"Nick Pretty\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778662651495, \"up\": 0, \"depth\": 0, \"text\": \"There are many reasons why boys are falling behind in school academics. One would simply be the educational setting. A disciplined setting designed for a more innately compassionate female sex, not that boys cannot adapt but the nature vs nurture argument does have some relevance in this debate. Next is more societal based argument where aggressiveness is not a positive virtue in today's society. Males are inherently more aggressive, and these attributes are not welcomed in most setting in a 'civil' society.  The education system attempts to downplay and extinguish these traits which are more prevalent in males. Activities in school are also aimed towards a more passive nature, leaving persons with more aggressive traits attempting to find other activities. Fixing the issue will be no easy task but systematic discrimination (albeit unintended) must be addressed to equal the playing field between males and females.\", \"replies\": []}, {\"id\": 1057, \"aid\": 55, \"author\": \"Dean Styles\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778656353278, \"up\": 0, \"depth\": 0, \"text\": \"What about STEM completion. Why do we have woman making up less than 1/4 of our engineering/applied math graduates? Are girls being rewarded for the wrong things in grade school setting them up for failure in STEM subjects. Yes 55% of university students are women but are they just getting \\\"participation\\\" degrees?\", \"replies\": []}, {\"id\": 1058, \"aid\": 56, \"author\": \"cob\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778654320300, \"up\": 0, \"depth\": 0, \"text\": \"Parents need to take more responsibility for their children and quit blaming 'the system'.  It's been known for decades that in elementary school boys are at a disadvantage because of the structure of needing to 'sit still' in class or learn passively and they are generally more physically wired at that age than girls.  But studies have also shown that by grade 8 and beyond, boys take over in that they are a 'louder' more 'outspoken' presence in class.  So yes the system needs improvement and let's advocate for it.  But parents, until change comes advocate for your child and work with their teachers.  My kids are now adults. I have 2 girls and a boy, the oldest girl and youngest boy both have ADHD.  And I had to advocate and work with teachers and counsellors from K through to Gr 12 to support their success in school.  LOTS of meetings.  But it was worth it.  For my son in partucular who was EXTREMELY physical, teachers came up with ways to allow him to move in class while not disturbing others AND get his work done.  In pre school at story time he was given his own chair behind the other kids sitting on the carpet.  As long as he stayed on the chair (i.e. not run around the room) he could move anyway he wanted.  Sometimes he was sitting upside down on the chair, wriggling and wriggling but listening and not disrupting the class.  Genius teachers.  In gr 2, his teacher let him do 1 math question then quietly get up, take a turn about the room, then do the next question.  It worked for him and the other kids accepted that was how he worked.  His teacher understood moving helped him concentrate. I love that teacher to this day for accepting all her students for who they are and for not labelling them as being 'bad' for different behaviour. I understand that not all teachers may be as understanding but most are willing to work out a solution with you.  And for those that aren't, it's an early lesson for your child on how to handle adversity and for parents to teach their children resilliency and to accept themselves.  They are wonderful just as they are.\", \"replies\": []}, {\"id\": 1059, \"aid\": 57, \"author\": \"parentofactiveboy\", \"ini\": \"P\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778652203555, \"up\": 0, \"depth\": 0, \"text\": \"We need to deliver curriculum in a variety of ways, recognizing that children have different learning styles. I do believe that broadly, young boys are more likely to thrive in an active hands-on learning environment, than in a traditional sit at a desk classroom. Getting them a strong foundation is critical for later education success. We were lucky in that our son was able to attend a private school that separated boys and girls in early grades and delivered the curriculum to boys in immersive ways - study poetry of Robert Service? Turn the classroom into the Malamute Saloon. Studying fur traders? Dress as a fur trader and canoe out to an island to trade \\\"furs\\\". Morning assembly? Keep it active with skits. Science? Lots of experiments.  I suspected the son was ADD/ADHD but was not prepared to medicate or have \\\"labeled\\\" so never had tested. Tests as an adult confirm it...in hindsight probably best to identify earlier so can get proper supports at post-secondary level, such as for writing exams. Today son is very successful in life/career and I think the strong start in a supportive learning environment helped. To help these children reach their potential we need to have different styles of schools/classes and fit the children to their best style. It may take more resources but the outcomes would be worth it.\", \"replies\": []}, {\"id\": 1060, \"aid\": 58, \"author\": \"Daniel Friedt\", \"ini\": \"D\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778651634889, \"up\": 0, \"depth\": 0, \"text\": \"One factor is the teacher. I am a retired teacher and principal (39 years experience). Teachers need to move beyond worksheets. Secondly, I believe boys learn differently than girls. There is much valuable research already done on this topic. Teachers should be prepared to teach boys differently and maybe even separately from girls, especially in the early years. Active learning must be part of this learning process - for both student AND teacher. This is a sound bite. Much more needs to be shared, tried and learned from actual classroom experience.  Put our best teachers in the first three or four grades of school to establish a solid foundation of acceptance and learning.\", \"replies\": []}, {\"id\": 1061, \"aid\": 59, \"author\": \"Vania Ivonne Vargas\", \"ini\": \"V\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778651549727, \"up\": 0, \"depth\": 0, \"text\": \"I think that boys need to be boys when they are kids or teens. They need physical activity, good food and protein, also emotional support and depending on their interests they should be guided to do what they like as kids. Playing sports, going into Arts or music, theatre, etc. A good father figure is also necessary and not only the father who \\\"brings money to the house\\\" or the one who is on the phone all the time. Having a good Tutor or Coach helps them to psychologically open up. Because Social Media and \\\"smart Phones\\\" are also modeling expectations of people or families about what do the kids \\\"should be\\\" or \\\"do\\\" or \\\"eat\\\" or \\\"achieve\\\". This can get depressing for anyone who is exposed too soon to those \\\"general expectations\\\" from their society. Having everything immediately is also not positive for their development. Kids should feel that their efforts are getting them what they dream of. Solving everything for them creates more frustration for them, when they should be thinking how to solve problems and feel useful and loved and accepted.\", \"replies\": []}, {\"id\": 1062, \"aid\": 60, \"author\": \"nailz71\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778651493709, \"up\": 0, \"depth\": 0, \"text\": \"I have a daughter and son that are 2 years apart. My daughter's confidence and assertiveness is beyond my son's. In speaking with peers with similar offspring their challenges are very similar. The covid years were devastating to males. Most had all their sports interrupted suddenly with no return, missed prom and started their first 2 years of University at home.  Girls for some reason reacted or rebounded much more aggressively.  We spent the last 20 years over indexing in female STEM programs and the last 5 years focusing on DEI initiatives and making white males feel guilty for their so called white privilege. We told our boys to be respectful and treat women with respect. We hammered our boys to the point of feeling inferior.  We have allowed boys from other countries enter without following the same expectations. My daughter fears these new immigrants, meanwhile our boys are afraid to ask a girl out on a date? Don't get me wrong these initiatives are not wrong and and am proud to see females and equity thrive however the way we approached and making our boys feel guilty has been completely offside.\", \"replies\": []}, {\"id\": 1063, \"aid\": 61, \"author\": \"nichole\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778649657124, \"up\": 0, \"depth\": 0, \"text\": \"What if we accept what girls have been taught from very early childhood - that girls are more mature than boys? Say the boys are about 2 years on average behind the girls in measurable metrics, reading, maths etc - what if we let the boys start school 2 years later than girls? \\n\\nThat way they can catch up, and have similar graduation/post secondary numbers as the girls.\", \"replies\": []}, {\"id\": 1064, \"aid\": 62, \"author\": \"Shane Robinson\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778648139209, \"up\": 0, \"depth\": 0, \"text\": \"I have a 19 year old son, and from about the age of 13 he had been exposed to a lot. We folded to the pressure of all his friends having a cell phone. I firmly believe that that was one of the main factors to him falling behind in school. At one point he was sharing the toxic masculinity that was mentioned in the news story. We offered a perspective that was contrary to the opinion being fed to him online. Eventually he was able to build an opinion, that wasn't rooted with the online view. Unfortunately from the age of 13-17 he thought the social media presences we correct in everything they said. He was firm with the 'fact' that his education wouldn't help him in any way and that it was more of a waste of time than the hours of scrolling that we could not control. \\nIt is my opinion that removing social media and cell phone presence in schools is one of the biggest promoters of success.\", \"replies\": []}, {\"id\": 1065, \"aid\": 63, \"author\": \"Jammy Jorza\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778647918482, \"up\": 0, \"depth\": 0, \"text\": \"We have a daughter that falls on the autism spectrum and much like boys she has tons of energy, cannot sit still, is messy and would be considered disruptive. When a child’s nervous system cannot regulate it is difficult for them to focus. I do believe there needs to be more programs and schools that approach teaching in a different manner. Providing more time for physical activity breaking up classroom time helps.\", \"replies\": []}, {\"id\": 1066, \"aid\": 64, \"author\": \"andrew23\", \"ini\": \"A\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778647906716, \"up\": 0, \"depth\": 0, \"text\": \"I have been working with boys and girls as a community coach for over 20 years all ages. Boys have been more active and driven in sports than girls. But when it come to the class room i have noticed boy's struggle with simple tasks, and get labeled with adhd or other items. I think these labels are just the need for the boys to move and release their disconnected thoughts. You can see this as early as pre school. Where if you give kids boys and girls more freedom of movement they can then focus after these energy releases. Lots of teachers note boys especially after recess and lunch are more prepared to learn and have structure.\\n\\nI do not agree with the statements made in the article. That it doesn't matter as white middle aged men still hold all the economic power. Where I work, the white middle ages men are the lower income workers. Women well out weigh the men in our office and are 50/50 split over all in our industry. Many of which are earning much more then men. This a great thing more diversified workforce. But i am not sure statistics have caught up with real life. \\n\\nWe do need to help young boys from preschool and kindergarten to give them the tools to move on to future roles, not just side line them for hard labor work, because they can't sit still.\", \"replies\": []}, {\"id\": 1067, \"aid\": 65, \"author\": \"simon\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778645302656, \"up\": 0, \"depth\": 0, \"text\": \"Truth is that this goes back 50 years when educators were rightly trying to resolve the disparity in educational outcomes for girls. But in creating a more inclusive and safe learning environment for girls, the needs of boys got neglected. The K-12 system has become totally feminized. Little/no focus on sports, collaboration over competition, focus on verbal over physical expression, need for discussion over implementing rules and discipline - these all sound great ... to girls. But that's not how boys (or tbh men, when women aren't looking) naturally operate. So we've basically swapped a patriarchical, muscular structure with a matriarchical, feminine one. In other words, we just discriminate against boys now rather than discriminate against girls. As a parent of both, I've watched how that discrimination impacts education outcomes. We had to work really hard to level the playing field between our kids.\\n\\nI also worked in K12 for years dealing with senior K12 leaders across North America. They all know this is a major problem. But the issue isn't even measured, let alone managed, so they have no mandate to take action. Provincial/State Education Ministries and School Board trustees just don't care. The attitude is \\\"It's just the boys, right?\\\". Yet if the numbers favoured boys to the same degree it currently favours girls, it would be a national crisis. Its actually a disgrace, and with the impacts of education of life outcomes, its a predictable societal crisis in the making.\\n\\nWe need to wake up to this huge issue.\", \"replies\": []}, {\"id\": 1068, \"aid\": 66, \"author\": \"Ken Goncalves\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778645168343, \"up\": 0, \"depth\": 0, \"text\": \"This complex issue demands multifaceted solutions, combining sophisticated AI systems with human interaction.  Tailored support for boys is essential, as they are unique individuals with diverse personalities, learning differences, family dynamics, cultural backgrounds, religious or non-religious beliefs, and living situations.  A good approach is investing in highly skilled, boy-specific mental health counselling in schools. This should focus on understanding and addressing the dynamics outlined above to help boys succeed rather than fail.\\n\\nAI interaction can also be a valuable tool for boys.  It can help identify skill and learning gaps and work with boys to improve those gaps based on their unique abilities.  When AI is carefully tailored with human assistance, it won’t diminish boys’ critical thinking skills but instead focus on filling skill and learning gaps.\\n\\nWhile there’s no simple solution to this global issue, complacency is not an option. As Canadians, we need immediate and dynamic changes..\", \"replies\": []}, {\"id\": 1069, \"aid\": 67, \"author\": \"khkw\", \"ini\": \"K\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778644896296, \"up\": 0, \"depth\": 0, \"text\": \"It’s parenting. No one wants to say it - not enough discipline. Kids are allowed to be wild. Taking away spankings was worse for boys than girls. All this ADHD and other labels... Back in the day we called them bad kids. The elephant in the room is that certain races don’t have a problem with their boys. My two kids are grown, on their and successful. I’m done. People that have problems with their boys can look longingly at those boys that do well and instead of attributing that to luck, they need to know that we’re they a lot tougher with them when they were little, they too could have had great kids, including their boys.\", \"replies\": [{\"id\": 1070, \"aid\": 65, \"author\": \"simon\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778646273204, \"up\": 0, \"depth\": 1, \"text\": \"Sorry but that's rubbish. Boys need rules and discipline, yes, but they don't need spanking. You don't have to hit a dog to train it, so why on earth would you need to hit a boy to regulate and educate them?\\n\\nBoys need exercise. They need to express their energy. They need to compete. Both parents and educators need to create that environment rather than try to shoehorn them into feminine-focused systems. But boys can be encourage and their energies can be channelled without the need to resort to violence.\"}]}, {\"id\": 1071, \"aid\": 68, \"author\": \"Nachiket Karnik\", \"ini\": \"N\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778644754667, \"up\": 0, \"depth\": 0, \"text\": \"Has any study bothered to look at the differences between the boys that are struggling and those who aren’t?   It seems to me to be the obvious place to start.  Look at differences in screen time, physical activity, diet, family dynamics, socioeconomic status, possibly even ethnic/cultural background and immigrant vs non-immigrant for a start and whatever else “experts” think is important.\", \"replies\": []}, {\"id\": 1072, \"aid\": 69, \"author\": \"Joel B\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778644477164, \"up\": 0, \"depth\": 0, \"text\": \"We need to stop feeding our children processed garbage packed with sugar and acting like that doesn’t have a profound trickle down effect on how they act/ learn/ behave.\", \"replies\": []}, {\"id\": 1073, \"aid\": 70, \"author\": \"jacrobs\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778644381577, \"up\": 0, \"depth\": 0, \"text\": \"More of a movement/play based structure for school to for a little longer would likely be beneficial for boys and wouldn’t harm girls. A proper Montessori style of classroom where you kids are encouraged to get up and move around regularly and have some more choice on when they learn things as long as they end up where they need to be after a three year cycle would help. Another option could be having it be standard for boys to start school a year later to better match boy and girl maturity levels. Boys who are ready “on time” could still start early, and girls who would benefit from waiting a year could, but the default would be boys do an extra year of kindergarten.\", \"replies\": [{\"id\": 1074, \"aid\": 65, \"author\": \"simon\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778647054922, \"up\": 0, \"depth\": 1, \"text\": \"I agree with all that. Based on my son and daughter's experience - both equally smart but maturing veey differently - I saw my daughter fully focused on high school straight away in Grade 8, whereas my son suddenly clicked into gear half way through Grade 10. Just in time as it turned out to get the grades needed to get into a decent university. He did well, but if he had started school at 7 and graduated at 20 rather than 18 I'm sure he would have had top grades and been a scholarship candidate like his sister. But I'll be first to admit, mine are privileged kids - two educated parents, warm home environment, great public schools, upper middle class neighbourhood. Not sure my son would have fared so well without those guardrails\"}]}, {\"id\": 1075, \"aid\": 71, \"author\": \"sd1980\", \"ini\": \"S\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778644134319, \"up\": 1, \"depth\": 0, \"text\": \"It’s very sad, I have personally seen this for my highly energetic 11yr old. He keeps getting penalised despite his A grades, just because he is restless and disorganised. In a class of 30, 20 are girls and the teachers have clearly tried turning the other 10 into girls too. I believe :\\n\\n1- Having male teachers/mentors in Elementary school will change the way of Canadian education system that wants boys to behave like girls- be clean, be calm & organised \\n2-Have assessments and activities that encourages boys to feel good in their skin. It’s very discouraging to see young boys getting name shamed constantly by their teachers for being too sporty or dirty as they play sports \\n\\n3-Conduct audits and surveys to check number of complaints and issues raised at schools against the system. In my personal case, my son has been very vocal about the number of times the boys in his class get unnoticed or ignored as the female teacher has huge bias against boys. It’s sad to see the frustration growing at that young an age.\\n\\n4-Independent audits to be conducted to ensure there’s balance of boy-girl ratio\\n\\n5- Increase awareness programs as part of curriculum to encourage acceptance of the differences between boy and girl students.\\nJust by constantly berating boys for being untidy isn’t a healthy way of teaching anything to anyone.\\n\\nThank you CBC for taking up such a crucial topic, I can totally relate to this study and the concerns being a boy mom myself.\", \"replies\": []}, {\"id\": 1076, \"aid\": 72, \"author\": \"James Wilson\", \"ini\": \"J\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778643794936, \"up\": 2, \"depth\": 0, \"text\": \"Boys are motivated by different stimuli than girls.  They need more hands on activities to support their academic day routines with more importance placed on individual needs.  The cookie cutter classroom does not fit well with many young male learners.\", \"replies\": []}, {\"id\": 1077, \"aid\": 73, \"author\": \"christian\", \"ini\": \"C\", \"title\": \"\", \"pinned\": false, \"date\": \"May 13\", \"ts\": 1778643515990, \"up\": 0, \"depth\": 0, \"text\": \"Ontario should respond with practical reforms. First, the province should recruit, hire, and retain more Black, Indigenous, and racialized male teachers, principals, guidance counsellors, graduation coaches, and child and youth workers. Students should see people who l
