egulation, structured work, and standardized testing. Those are valid skills, but they are not the only forms of intelligence, competence, or potential. When one group statistically struggles more within that structure, the conversation immediately becomes “they are falling behind,” instead of asking whether the system is flexible enough to support different developmental needs and learning styles.\\n\\nThat does not mean boys should not be held to standards, nor does it mean girls have an unfair advantage. It means boys and girls are different, and that is okay. Different does not mean unequal in value. Men and women develop differently in some areas, may mature at different rates, may respond differently to the same environment, and may have different strengths or challenges on average. The solution is not to erase those differences or pretend they do not exist. The solution is to better understand them.\\n\\nThat is where I think the article’s wording becomes problematic. Terms like “boy crisis,” “falling behind,” and “systemically disadvantaged” create a very competitive framework. The article repeatedly compares boys’ results directly against girls’ results in areas like graduation rates and academic performance. That subtly pushes readers toward the idea that one sex is “doing better” than the other, when in reality academic metrics only measure a narrow category of performance. They do not measure overall human value, emotional intelligence, resilience, creativity, leadership, social contribution, or success in life as a whole.\\n\\nThe article also mixes educational concerns with broader ideological discussions about “male supremacy” and workplace power structures. That shifts the discussion away from childhood developmental needs and into a social competition between sexes. Once the conversation becomes boys versus girls, everyone loses. Helping boys succeed should not threaten girls, and girls succeeding should not be framed as a problem for boys.\\n\\nThe deeper issue is that we keep trying to force identical outcomes instead of asking better questions:\\nAre schools adaptable enough for different developmental styles?\\nAre we mistaking quietness and compliance for intelligence?\\nAre we measuring true understanding, or mainly the ability to fit one behavioural model?\\nAre we supporting children according to their actual needs?\\n\\nEquality does not always mean treating everyone identically. Equity means recognizing that different students may require different approaches, supports, or environments to have the same opportunity to succeed.\\n\\nMen and women are not enemies competing for superiority. They complement each other and depend on each other in society, families, workplaces, and communities. The goal should not be to erase differences, rank one sex above the other, or force everyone into the same mold. The goal should be mutual respect, equity, understanding developmental differences, and helping every child reach their full potential.\", \"replies\": []}, {\"id\": 1006, \"aid\": 6, \"author\": \"mom123outwest\", \"meta\": \"May 16\", \"stance\": \"\", \"text\": \"As a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\", \"replies\": []}, {\"id\": 1182, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to Cindy Burkett\", \"stance\": \"\", \"text\": \"I do have to differ that 50 years ago paths were closed to girls. They may not have been 'encouraged' but the paths were not closed. I had classmates who became engineers, doctors, etc. Families may not have been encouraging their girls, statistics may have suggested the assumption, but the paths were not closed. The term 'boy crisis' may not be just an assumption from statistics, however. Many teachers are in agreement despite all their efforts, and this is the experience of many, many families.\", \"replies\": []}, {\"id\": 1151, \"aid\": 28, \"author\": \"Keta K\", \"meta\": \"May 13 · reply to Andrew Homzy\", \"stance\": \"\", \"text\": \"How is any of what \\\"boys need\\\" is any different from girls?? All the things you list are good for both girls and boys.\", \"replies\": []}, {\"id\": 1177, \"aid\": 28, \"author\": \"Keta K\", \"meta\": \"May 13 · reply to Ken Davies\", \"stance\": \"\", \"text\": \"Where do you get that?? Have you been in a young classroom? Your statements are not fact.\", \"replies\": []}, {\"id\": 1126, \"aid\": 116, \"author\": \"Andrew Vernet\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Where is it written that \\\"boys are more active than girls\\\"? Is this a perpetuated cultural expectation or is it based in some genetic code? These huge generalizations are not helpful. Please review the opportunities students had for varied learning some 25 years ago. Shop class, home ec, a visual arts specialist, band and strings, the guidance counsellor in a middle school, the librarian, etc. etc. All these services and opportunities have been removed or replaced with half-hearted efforts from the Provincial government. Education is expensive, but it is planting a seed from which we hope a return will be very fruitful. Don't cheap out and rely only on the words of an \\\"expert\\\".\", \"replies\": []}, {\"id\": 1117, \"aid\": 110, \"author\": \"Paul Greenspan\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Oh please. I taught for 24 years, just leaving 6 months ago.Boys always are shown more favouritism.In the article it states that boys are more active.Seriously? That seems to be a gender bias and generalization I am not willing to make.Seems like a colossal step backwards.I spent years telling girls that they were just as smart in Math and Science as boys . One parent in the article is scared her son won't be successful in the space so will give up!! Seems like a parent job not to let your child give up.This is such a step back in time.All children ,I taught ,were taught as individuals not boys or girls.\", \"replies\": []}, {\"id\": 1115, \"aid\": 108, \"author\": \"Dee Adams\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"School is boring. It is now being used as daycare so parents can work. We keep youngsters trapped inside all day until they are 16-18 years old. Some like to learn but no one needs 8 hrs a day for 12 years to learn what  is taught in the schools this article refers to. Shorten the school year and school day and let kids have meaningful jobs! There is absolutely no reason to keep up this jail sentence for children!\", \"replies\": []}, {\"id\": 1114, \"aid\": 107, \"author\": \"Sarah Morris\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"This is interesting, I don’t believe this should be seen as disadvantageous for boys but rather an example of girls pressure to be exceptional and to beat standard. Sitting still in a classroom is disadvantageous for both boys and girls, however girls receive attention and appreciation for their behaviours especially in a class setting. Where boys unruly behaviour is excused as their temperament, even this article perpetuates this patriarchal perspective.\", \"replies\": []}, {\"id\": 1111, \"aid\": 104, \"author\": \"betty maurice\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"A very interesting article.  I also read the one from the NYT, which was similar.  There was also some excellent solutions in both articles.  But we know that solutions take a long time to work their way to the decision makers.  Despite some gains over the years, women remain in fewer management roles, holding 42.7 per cent of middle management and 30.8 per cent of senior management positions, according to Statistics Canada data from 2021.  I would be interested  in hearing comments about why this exists.\", \"replies\": []}, {\"id\": 1085, \"aid\": 81, \"author\": \"Erin C\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"seems to be generalizing on both sides...\\n\\non average, girls are socialized to perform better at collaborative and focus work at earlier ages, and school is (currently) designed more to that strength \\n\\non average boys are underperforming but are also socialized to allow them to be more boisterous or have less consequences to acting out which doesn't align with current learning models\\n\\nhowever...\\nindividual girls might want to be allowed to nonconform with these norms or face similar allowances to disrupt \\nand \\nsome boys might want to be more focused or collaborate but are socialized to compete/run around to not be seen to be different \\n\\nwe need school options for everyone \\na mix of learning and active elements at younger ages giving choices for l learners\\nbetter alignment of grade levels - both moving up the kids who are ready and a shame free way to hold back those who are not\\nand teachers with enough flexibility and small enough class sizes to individualize programs vs pivoting to the average\", \"replies\": []}, {\"id\": 1057, \"aid\": 55, \"author\": \"Dean Styles\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"What about STEM completion. Why do we have woman making up less than 1/4 of our engineering/applied math graduates? Are girls being rewarded for the wrong things in grade school setting them up for failure in STEM subjects. Yes 55% of university students are women but are they just getting \\\"participation\\\" degrees?\", \"replies\": []}, {\"id\": 1029, \"aid\": 28, \"author\": \"Keta K\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Honestly i think the phrasing \\\"boys falling behind\\\" is innacurate in the first place. I agree with people here who say too much time sitting in desks, a shift in focus away from some subjects (more 'hands-on' ones that involve tactile experiences, rather than just reading & writing), and it seems the frequent \\\"group projects\\\" which disinsentive some students.\\nThis is beneficial to all students but would noticeably improve grades for boys.\\n\\nIn truth, to me the issue is not just with the education system but society at large. Are girls more self-motivating, at home to do their homework? Are boys more drawn to screen time, as video games are targetted at them from a very young age?\\nSome boys by the time they start school they are already \\\"behind\\\".\\nThe cultural shift to superficial; university profs are saying right now they have students who never read an entire book (just the synopsis or specific sections that were part of the curriculum). Do parents still read to their children?\\n\\nThese things are universal, they are showing up more with boys right now because society is just at the beginning of girls not being held back, discouraged, or outright not allowed to take certain subjects.\", \"replies\": []}, {\"id\": 1014, \"aid\": 13, \"author\": \"olivia\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"I think the way this issue is approached in the article is all wrong. I saw someone else mention on this discussion board that the issue for boys begins much earlier than school and extends much later - I agree. We are raising our boys from birth in such a different way than we are raising our girls. Not teaching them to sit still, to listen carefully, and very importantly not encouraging them to read. There is certainly an aspect on the school's end that students are expected to sit still for far too long, however, this is an issue that affects girls as well as boys. The girls simply respond differently and tend to find a way to manage due to differences in expectations from birth. Also, this article cites learning disabilities/ADHD as a reason boys are struggling more, saying that the rates of learning disabilities/ADHD are higher in boys. This is a great moment to consider that the rates are higher due to an underdiagnosis of learning disabilities in girls, which is a well-documented issue. Many girls are diagnosed later in their teens or early adulthood with learning disabilities/ADHD after they have burnt out from trying to manage for so long. The solution to this is not a changed/special curriculum for boys. The solution is much broader than that and will need to be a combination of school adjustments, parenting adjustments, and perhaps some government laws particularly around screen time for children (known to cause attention span issues.) Overall, the wrong way to frame this issue as schools disadvantaging boys, because that is simply not true.\", \"replies\": []}, {\"id\": 1002, \"aid\": 2, \"author\": \"Nicholas Zacharias\", \"meta\": \"May 30\", \"stance\": \"\", \"text\": \"Western society is clearly designed to elicit specific behaviours in adulthood. A lot of growing up and transitioning to adulthood is about meeting arbitrarily defined standards. The less our system enables individual freedoms, the more Canadians will internalize artificial values.\", \"replies\": []}, {\"id\": 1205, \"aid\": 158, \"author\": \"edgradstud\", \"meta\": \"May 12 · reply to Glenna Landry\", \"stance\": \"\", \"text\": \"What you said about girls shutting down boys’ ideas in group work—thats such a good point! Nowadays, being good at school is seen as a feminine trait, so boys REALLY don’t want to do it because the patriarchy tells them that to be feminine is the worst thing, even worse than having a really tough life because you flunked out of grade 7!\", \"replies\": []}, {\"id\": 1180, \"aid\": 116, \"author\": \"Andrew Vernet\", \"meta\": \"May 12 · reply to John Janmaat\", \"stance\": \"\", \"text\": \"Generalizations are more convenient. They offer easy excuses and solutions. I take issue with this huge generalization. Has anyone asked whether it is a perpetuated cultural expectation or some genetic code?\", \"replies\": []}, {\"id\": 1127, \"aid\": 110, \"author\": \"Paul Greenspan\", \"meta\": \"May 12 · reply to Andrew Vernet\", \"stance\": \"\", \"text\": \"Our Middle school has all those things you mention bot 100% agree this article has too many generalizations.\", \"replies\": []}, {\"id\": 1212, \"aid\": 134, \"author\": \"Linda Cochrane\", \"meta\": \"May 13 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"Are you sure you are interpreting the statistics correctly? The statistics could just as easily show that girls are improving but boys are not. Also, blaming changes in the school system for the differing results does not explain why the difference are world-wide. I doubt that all countries have implemented the same changes in their school systems. More girls than boys were being accepted into Swedish universities in the 1960s. Perhaps treating boys and girls equally will always result in girls doing better than boys in school.\", \"replies\": []}, {\"id\": 1023, \"aid\": 22, \"author\": \"Bala Viswa\", \"meta\": \"May 15 · reply to randyp\", \"stance\": \"\", \"text\": \"One reason why \\\"it can't be done\\\" is we still don't know what \\\"it\\\" is. We as a society haven't decided what we want school (K-12) to be. \\nDo we want it to be a place to socialise children? Prepare them for work? A place to keep them out of trouble while the parents work? Educate them and prepare them to live as adults? Make them academically proficient? Is it enough to do well on PISA? Or do we want to compare to OECD? Help children reach their potential in what they want to do? How well-rounded should children be? Do we encourage their interests, even if it means they hyperspecialise in one thing?\\nEach of those objectives requires different structures and different ways of doing things. The other problem is government, industry, parents, the community, and higher education have different views of what the school system should do. Those views don't always line up. If we do not know what we want the system to do, we will never know if it has been successful. Right now, the system is unsuccessful, simply because it is trying to be everything to everybody. In the process, it doesn't meet anybody's needs.\", \"replies\": []}, {\"id\": 1007, \"aid\": 7, \"author\": \"p123\", \"meta\": \"May 16 · reply to mom123outwest\", \"stance\": \"\", \"text\": \"Yeah\\nIt’s not so much a boy/girl\\nMy daughter was very active\", \"replies\": []}, {\"id\": 1008, \"aid\": 6, \"author\": \"mom123outwest\", \"meta\": \"May 16 · reply to p123\", \"stance\": \"\", \"text\": \"yes, we need to fix the system for everyone. \\nMy daughter was also very active and   struggled with boredom. She could not hide her frustration as well as my son. My son was a bookworm and just resorted to escaping in books or drawing whenever there was chaos, long pauses in instruction or boredom.\", \"replies\": []}, {\"id\": 1185, \"aid\": 6, \"author\": \"mom123outwest\", \"meta\": \"May 16 · reply to Jennifer Johnson\", \"stance\": \"\", \"text\": \"I am pasting this here to join the conversation \\n\\nI greatly appreciate early educators and EAs. Yes! 👏 somehow we do need to get their voices heard as they see the classroom from a unique perspective. Also as Substitute teacher, I feel like I don’t have a direct channel,  but I see such a broad swath of the system and problems. \\n\\nAs a substitute teacher with the VSB, I work across every grade level from K to Grade 12 and in all the neighbourhoods. I think the system is broken for both boys and girls. Many of the girls are just hiding it better. Most recently certified educators understand that all students (boys and girls) learn better through movement, with some hands-on activities, and clear structure. The challenge is that many schools lack the staffing, resources, space, and systems needed to consistently provide these supports. I do not know where all the money goes! \\n\\n1. The Biggest Issue: Behaviour Support\\n\\nMore students seem to arrive with complex behavioural and emotional needs. I do not know specifically why, but it is happening everywhere ( high and low income areas). I am regularly 😳 shocked by the extreme behaviours in regular classrooms.   There may be different contributing factors, and these trends need further investigation but until then … schools need immediate support. \\n\\nTeachers are increasingly facing situations such as:\\n\\nRepeated classroom evacuations due violent outbursts \\nDestroyed classrooms and materials\\nVerbal aggression\\nPhysical aggression, including hitting and biting of staff and other students\\nIn many cases, the needs of one student consume the attention of the entire classroom (even with an EA present!) causing learning for all other students to stop or lowering the learning expectation. \\nIn high schools students refuse to work, walk out of classrooms and will not do group work or help other students. Highschools\\nhave no control over phone usage and actually need  them because there is not enough computers or textbooks. \\n\\nWhen a classroom is regularly out of control, teachers need to go back to basics, line ups, waiting, there are more limits, less freedom to access extending materials and less fun for all. \\n\\n2. Physical Education Is Falling Behind\\n\\nMany students are missing foundational skills that physical education should teach, including:\\nBehaviour regulation\\nPhysical health and fitness\\nSocial development\\nTeamwork\\nUnderstanding rules and boundaries\\nCoordination and motor skills\\nBasic common sports knowledge\\nToo often, PE classes become unstructured free play because there are not enough trained PE teachers, proper facilities, or adequate equipment.\\n\\n3. Classrooms Lack Tools for Diverse Learners\\nMany classrooms do not have the tools many students need to focus, self-regulate, and engage successfully in learning.\\nSuch as:\\n\\nFlexible seating\\nStanding desks\\nFidgets and sensory tools\\nVisual timers and schedules\\nHands-on learning materials beyond photocopies \\nIn many cases:\\nPACs must fundraise for these resources\\nTeachers pay out of pocket\\nParents contribute supplies themselves\\nThe same issue applies to art, music and shop-style learning activities. All students benefit from practical, hands-on experiences beyond paper-and-pencil tasks, but schools often lack the materials and funding to provide them. \\n\\n4. Teachers Need Better Curriculum Support\\n\\nProject-based learning can be highly effective for engaging diverse and “wiggly” learners, but teachers should not have to constantly imagine and create materials from scratch or purchase unsuitable American Ed templates online.\\nteachers need:\\n\\nResearched and prepared BC curriculum specific resource banks\\nGrade-level project-based learning sets  from K to 12. \\nBuilt-in adaptations for diverse learners, including both emerging and extending students\\n\\nWithout these systems:\\nTeachers repeatedly reinvent lessons every year\\nValuable time is lost creating duplicate and often inferior materials\\nStudents encounter repetitive projects across subjects and grade levels\\nFor example, the same “food truck” project may appear multiple times in different subjects and years because teachers are independently searching for workable resources.\\n\\n5. Phonics Instruction Needs to Be Reintroduced and Supported\\n\\nFoundational reading skills require structured and evidence-based phonics instruction. I don’t know why phonics went away, I don’t even know if parents know it went away. \\nEffective literacy development depends on:\\n\\nConsistent phonics programs\\nProper teacher training\\nHigh-quality instructional materials\\nClear school-wide implementation\\nA stronger system to teach older students who made it to high school with poor reading skills. \\n\\nReading instruction cannot rely on:\\nRandom worksheets\\nInconsistent teaching methods\\nGaps between classrooms or schools\\nStudents need systematic support in developing core reading skills.\\n\\n🤦 This is getting too long. But the system is not just broken for boys. They are just more able to show us how broken it is for everyone.\", \"replies\": []}]}, {\"id\": \"bias\", \"label\": \"Boys feel singled out and devalued\", \"count\": 32, \"color\": \"rgb(195,70,70)\", \"px\": 415, \"py\": 250, \"d\": 135, \"allLabel\": \"26 responses · 6 replies\", \"posts\": [{\"id\": 1097, \"aid\": 93, \"author\": \"Al-hafiz Virani\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"All the focus on Girls and Education and Girls are strong Girls are betrer, Girls can do it and Girls self-esteem ads and girrls only activities and over focus on Girls education and personal growth has left behind the boys as the boys do not get the same access or support. It should have been for both not a focus only on girls as boys also have the same issues. I know, I have been a teaxher afor 23 years. Growing up in the 90's I always felt it unfair that we boys did not have the same suport. Girls are encouraged, boys are discouraged especially for indeoendant or creative thinking. I could not understand how my sister got special marks for cresrive thinking for literally turning in a projext I did 100% for her but when I turned in nearly the same project for my class I was given zero for  going out of the box and not sticking to the scope of the project rather than being rewarded for the extra work. The projext was to invent a  board game. I invented a 3d board game with marbles and bridges and levels. Same project, two opposite results. I saw this later with complete focus on girls throighout the 200's and especially today; focus on training, girl power motivation ads, \\\"we are betrer than boys, we too can win at sports\\\". Not bad to motivate Girls abd help their self-esteem, I fully agree except please don't ignore the boys who suffer from the same issues. Even mental health education is primarilly to girls and girls issues like body image. I have been a teacher for 23 years and see the effect it has on the boys. They feel and have they are being left out. They know and they feel it. Boys also need mental health suport, educarional support and learning catered to them. But I agree with cbc, educarion primarily focuses on the way girls like to learn - but teachers beed to be taught that boys can learn if in a different way. A teaxher threw out a boy from her class, and a few minutes with me and I told him he was smart, that he could do this, because I believed in him. Teaxher was shocked that he finished the entire lesson for the fi. rst time tjat year. I told the teaxher what to do. Next lesson? She went baxk to the old way and threw him out for just not following along. (I was also throw out as a kid until they found out I had ADHD and Autism. I had the lowest scores and even failed a grade . Teacher acused me of being mentally retarded and and an IQ test proved I was not. Later when I got older where school required more crearivity in college technology and art classes, English literature , etc  90-100% grades.  So what was the difference? The support and acceptance of beinf crearive and not having to fail because you did it a different way and didn't colour in the lines but being rewarded for figuring it out\", \"replies\": []}, {\"id\": 1067, \"aid\": 65, \"author\": \"simon\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Truth is that this goes back 50 years when educators were rightly trying to resolve the disparity in educational outcomes for girls. But in creating a more inclusive and safe learning environment for girls, the needs of boys got neglected. The K-12 system has become totally feminized. Little/no focus on sports, collaboration over competition, focus on verbal over physical expression, need for discussion over implementing rules and discipline - these all sound great ... to girls. But that's not how boys (or tbh men, when women aren't looking) naturally operate. So we've basically swapped a patriarchical, muscular structure with a matriarchical, feminine one. In other words, we just discriminate against boys now rather than discriminate against girls. As a parent of both, I've watched how that discrimination impacts education outcomes. We had to work really hard to level the playing field between our kids.\\n\\nI also worked in K12 for years dealing with senior K12 leaders across North America. They all know this is a major problem. But the issue isn't even measured, let alone managed, so they have no mandate to take action. Provincial/State Education Ministries and School Board trustees just don't care. The attitude is \\\"It's just the boys, right?\\\". Yet if the numbers favoured boys to the same degree it currently favours girls, it would be a national crisis. Its actually a disgrace, and with the impacts of education of life outcomes, its a predictable societal crisis in the making.\\n\\nWe need to wake up to this huge issue.\", \"replies\": []}, {\"id\": 1201, \"aid\": 165, \"author\": \"Larry mor\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"it is not surprise that males are falling behind. More  Emphasises  is put on girls and minorities to ensure sure they succeed, it is just expected that males will figure it out for them selves over time, Take a look at how the male has been shifted to just a provider, little or no recognition for the achievements of there children, or there upbringing.  Equal is not what is used to be, there has been a total shift,\", \"replies\": []}, {\"id\": 1193, \"aid\": 160, \"author\": \"calebb\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I'm friends with 5 people who are educators, most at the elementary level. All of them women. All of them, in one way or another, have made it clear that they have a strong bias against men in their personal life. I would say with great confidence that all of them hate men. I find it difficult to believe that that bias doesn't get passed on to their professional work. If I had a son going through school, I would assume that at least one of his teachers is going to be prejudiced against him.\", \"replies\": []}, {\"id\": 1195, \"aid\": 162, \"author\": \"Ernest Patrick\", \"meta\": \"May 12 · reply to calebb\", \"stance\": \"\", \"text\": \"Frankly your anecdotal \\\"evidence\\\" is ridiculous on its face. They clearly don't \\\"have a strong bias against men in their personal life\\\" if they're all friends with a a person (you) who is likely a man.\", \"replies\": []}, {\"id\": 1203, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a parent and grandparent of boys, I have seen this as progressively becoming an issue. Ironically, as a child of the fifties and sixties, despite the women's lib. movement which had its purpose, in school as a female I felt equally entitled to be successful and attend post-secondary education. Did not need the focus away from boys. For years, I have said we are leaving boys behind. Boys need competition and both genders need phys. ed. added back to the curriculum in a major way. A kindergartner does not need computer time supervised by a grade 8 student. Find another way to provide prep time to the teacher. I have  been a volunteer and have seen the declining engagement of boys, in general. Girls begin to see themselves as superior academically. In group, they take over and are dismissive of the boys contributions even before engaging. I have seen this at the post-secondary level, too. I know that teachers are aware and I wonder if they feel powerless to solve this. I have observed fewer male teachers in the system. Why? I work in post-secondary and have been concerned for many years. Ensuring one group has opportunity should not have been at the expense of another group. Surely, we can manage multiple goals....we expect our students to.\", \"replies\": []}, {\"id\": 1141, \"aid\": 127, \"author\": \"Brad Douglas\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Hard to imagine that a decade plus of telling boys that their inherent traits are \\\"toxic\\\", curbing their desire to succeed, feminizing them at every turn, denying employment opportunities on the basis of their gender, and presenting a societal-wide hostility towards them would have ill effects. \\n\\nYou reap what you sow.\", \"replies\": []}, {\"id\": 1132, \"aid\": 119, \"author\": \"Donald Rogers\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The bias against men, especially in today's environment is unfortunate. The idea that you can't help boys succeed because it takes away from girls is an inaccurate zero-sum argument.\\n\\nDecades ago there were efforts to help girls succeed and continue on to University and the University graduate percentages flipped.  But there is push-back to countering what was obviously an over-correction. \\n\\nAs far as the small percentage of men in those high-earning leadership roles, a significant percentage of men work in high paying but dangerous roles that, while financially beneficial, lead to other social issues.\\n\\nMen struggle much more with substance abuse and thoughts of self-harm. Caused by what I believe is a world where there is less support and less focus on the value that men bring to the table.\", \"replies\": []}, {\"id\": 1194, \"aid\": 161, \"author\": \"Kay Vega\", \"meta\": \"May 12 · reply to calebb\", \"stance\": \"\", \"text\": \"As a mom with a boy and girl in school I believe from conversations with their educators that some women teachers just don’t like boys.\", \"replies\": []}, {\"id\": 1192, \"aid\": 159, \"author\": \"walter williams\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"ever heard the saying \\\"boys will be boys\\\". Was at an elementary school spring open house with singing and dancing, both boys and girls (still allowed to say that?). Boys wearing flowery hats and bird or bunny costumes, no wolves or bears. Grooming aggression out of them at an early age.\", \"replies\": []}, {\"id\": 1183, \"aid\": 153, \"author\": \"Mic Mellosz\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Where is the womansphere? Everywhere else. Men are denigrated and feel victimized by current socialization particulars. Naturally, an overshoot from earlier corrective action. Tricky subject.\", \"replies\": []}, {\"id\": 1197, \"aid\": 22, \"author\": \"Bala Viswa\", \"meta\": \"May 12 · reply to calebb\", \"stance\": \"\", \"text\": \"And you would not be wrong. Over the past decade, there have been studies showing that a percentage of teachers want to \\\"right historical wrongs\\\" by being biased in favour of girl students (in addition to the ways the classroom has been remodelled to be more welcoming to girls), which in extreme cases may exhibit as bias against boys. That is why the article also worries that making things better/easier for boy students would make the classroom harder for girl students: they are retracing the process that occurred historically over the past 40 years.\", \"replies\": []}, {\"id\": 1211, \"aid\": 169, \"author\": \"dean\", \"meta\": \"May 13 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"Historical institutional male dominance with reflexive gender bias/favoritism reinforced the old boys club, significant pay disparity, restrictions on women's autonomy, and countless other disadvantages levied against women. There is no denying it.\\n\\nHowever, early childhood education is now increasingly female-dominant (85-90%), and no institution is immune to reflexive gender bias/favoritism.\\n\\nEquitable treatment should be the destination. Equal treatment can drive out equal expectations, resulting in boys generally being viewed as \\\"malfunctioning girls\\\" who can’t sit still and are immature. This framework effectively pathologizes male-typical development by treating biological and developmental variance as a behavioral deficit. When \\\"equal treatment\\\" is defined by a standard that favors one gender’s natural developmental timeline, it is an inevitable consequence that girls will see greater success than boys.\", \"replies\": []}, {\"id\": 1123, \"aid\": 115, \"author\": \"Bernadette Warren\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"While raising my now adult children, I was happy to discover all the programs available to support and encourage my daughter.  I was dismayed to find there we no such programs for my son.  In fact it was difficult to find male role models in media, outside of sports figures, with most men at the time being portrayed as the \\\"bumbling fool\\\".  I am a feminist and strong champion of women's rights, but one gender should never be upraised at the expense of another.  Children need access to the best educators who understand that we all learn differently and there is no one size fits all.\", \"replies\": []}, {\"id\": 1075, \"aid\": 71, \"author\": \"sd1980\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"It’s very sad, I have personally seen this for my highly energetic 11yr old. He keeps getting penalised despite his A grades, just because he is restless and disorganised. In a class of 30, 20 are girls and the teachers have clearly tried turning the other 10 into girls too. I believe :\\n\\n1- Having male teachers/mentors in Elementary school will change the way of Canadian education system that wants boys to behave like girls- be clean, be calm & organised \\n2-Have assessments and activities that encourages boys to feel good in their skin. It’s very discouraging to see young boys getting name shamed constantly by their teachers for being too sporty or dirty as they play sports \\n\\n3-Conduct audits and surveys to check number of complaints and issues raised at schools against the system. In my personal case, my son has been very vocal about the number of times the boys in his class get unnoticed or ignored as the female teacher has huge bias against boys. It’s sad to see the frustration growing at that young an age.\\n\\n4-Independent audits to be conducted to ensure there’s balance of boy-girl ratio\\n\\n5- Increase awareness programs as part of curriculum to encourage acceptance of the differences between boy and girl students.\\nJust by constantly berating boys for being untidy isn’t a healthy way of teaching anything to anyone.\\n\\nThank you CBC for taking up such a crucial topic, I can totally relate to this study and the concerns being a boy mom myself.\", \"replies\": []}, {\"id\": 1196, \"aid\": 163, \"author\": \"Ingrid Raudsepp\", \"meta\": \"May 12 · reply to calebb\", \"stance\": \"\", \"text\": \"They \\\"hate\\\" men? They should not be educators.\", \"replies\": []}, {\"id\": 1128, \"aid\": 117, \"author\": \"Don Richardson\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Our twin sons entered junior kindergarten. On the first meet the teacher session, their teacher, female, stated quite seriously and with great conviction that things would be so much better in the classroom if the boys behaved more like the girls!! That just about sums up their entire education from JK to graduation.\", \"replies\": []}, {\"id\": 1112, \"aid\": 105, \"author\": \"joseph beaudin\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Boys are falling behind because the system is not allowing them to be boys, This is not rocket science , the system decided that boys need to be trained out of male toxic behaviours, except a certain amount of that is biologically who we are . Then on top of that the current male is subject to increasing , men are bad, men suck at this and that. We must understand the differnces between the sexes and modify the system to accommodate that.\", \"replies\": []}, {\"id\": 1105, \"aid\": 100, \"author\": \"Kerrie Jaques\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"This is entirely normal any more. Systemic misandry is everywhere. Just watch tv for a night; if there is a buffoon, an idiot, a loser, etc it's always the man. Teen TV is even worse. Women are allowed into medical school, law school, and doctorate programs at a higher rate than men. Suicide rates are much higher among men, so nothing is done about it. Violence against men is be coming more and more common on social media, and nothing will be done about it. But if the roles were reversed.... Boys are falling behind in school... nothing  be done about it.\", \"replies\": []}, {\"id\": 1104, \"aid\": 99, \"author\": \"Grant Richards\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"The \\\"progress\\\" of society has overridden the true nature of the male.\", \"replies\": []}, {\"id\": 1098, \"aid\": 94, \"author\": \"John Dammeyer\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I read the first of what is now a 4 book series on this over 20 years ago.  Published in 2001 \\\"Spreading Misandry\\\" by Paul Nathan's and Katherine K. Young is an in depth look at how society views males and how subtle the signals are.\", \"replies\": []}, {\"id\": 1094, \"aid\": 90, \"author\": \"farmer\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Lack of ambition, failing to launch, mental health challenges, suicide!! Boys dont even rebel the same anymore. I have a daughter that is a farmer. Fully educated, socially capable, supports community, and will be able to run a large farming operation. Our other daughter equally capable but not a farmer. Our son is also capable but he doesnt know it. Stuggles with confidence, social situations, stressful situations, even time managment. My wife and I raised the kids the same. Solid fundamental parenting, lots of love and structure. Consitancy and discipline. Why the differance?? Society and its pressure on males to be less. It starts in toddler play groups and is compounded every step of the way as they mature. In societies push for women's equality, which was well over due,  boys suffered by being less. This is not equality. Unfortunately as women were empowered to be more boys are actually suppressed. It wasnt ment to happen but it has. Strong independent women need strong independent men! Trust, respect and compassion is what needs to be the early focus. Genders will figure it out.\", \"replies\": []}, {\"id\": 1088, \"aid\": 84, \"author\": \"Ralph Furley\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Canadian society and the Canadian education system has changed too much and has changed for the worse. Schools no longer have a school nurse. A lot of schools do not have enough counselors. Sports has been taken away from many Elementary School students as well as high school students. Children and young teenagers need to have exercise to drain the excess energy while learning sportsmanship, teamwork and improving all of their skills and abilities. The new \\\"woke\\\" method is turning our boys into feminine versions of themselves. \\n\\nI have been overseas to multiple countries and the education system is the same as Canada used to be in the past. Recess is filled with playtime and there are lunch intramurals for students who want to have fun during their break time playing sports and games. There are no more clubs for students to join and that is a huge problem not to mention that most students have both parents working and no one to drive them to and from soccer or baseball practice. Children used to play an organized sport for their school and a lot of the times the same sport for their community. Even the USA still has a very normal school system and curriculum but because Canada wants to be this new style of Education, the Educators need to accept the blame for this. For example at my son's Elementary School, they have banned playing soccer at recess and lunch because people have been getting injured but that is a normal passage of life. The feminization of boys in this country is going to lead to huge issues and problems. Let boys be boys and stop trying to make them what they are not. Boys climb trees, ride bikes, skateboard, do gymnastics, play team sports, and enjoy their childhood and if they are allowed to enjoy their childhood they will be normal boys who do their homework and try to do their best in school.\\n\\nMy son and daughter go to the same Elementary School. Sports day at the end of the year is ridiculous compared to what we all had growing up in Canada. They have taken away Mother's Day and Father's Day and the school only celebrates family day. They are not allowed to celebrate Halloween because it might offend someone and the Christmas concerts that we all grew up to are now gone.\\n\\nThis is my honest opinion and I should be allowed to voice my honest opinion without AI telling me that I'm going against Community guidelines because that is just complete and utter censorship and that is not what life should be about.\", \"replies\": []}, {\"id\": 1087, \"aid\": 83, \"author\": \"Luke Derksen\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As a millennial man, I grew up both with and without the advanced technology we have now. I believe that is one problem. The other I would say, is that many of my female teachers would never recognize my needs as a boy and would overlook everything I did as trash. I think female teachers need to treat boys with respect.\", \"replies\": []}, {\"id\": 1082, \"aid\": 78, \"author\": \"T Ro\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"The persecution of young men is finally beginning to show some consequences.  You can’t have girls only summer camps and girls only scholarships and girls only social clubs before boys start to feel like second class citizens.  2/3 of university graduates are female.  Young men realize very early that the current system is stacked against them.  No matter how hard a young man works he will never get rewarded on the same level as an equal female. If you don’t believe me take a look at the local high school graduating class and look at how many scholarships aren’t available to young men because they committed the sin of being born male. Congratulations to the CBC for having the courage to produce a segment that runs counter to the current cultural zeitgeist.\", \"replies\": []}, {\"id\": 1062, \"aid\": 60, \"author\": \"nailz71\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I have a daughter and son that are 2 years apart. My daughter's confidence and assertiveness is beyond my son's. In speaking with peers with similar offspring their challenges are very similar. The covid years were devastating to males. Most had all their sports interrupted suddenly with no return, missed prom and started their first 2 years of University at home.  Girls for some reason reacted or rebounded much more aggressively.  We spent the last 20 years over indexing in female STEM programs and the last 5 years focusing on DEI initiatives and making white males feel guilty for their so called white privilege. We told our boys to be respectful and treat women with respect. We hammered our boys to the point of feeling inferior.  We have allowed boys from other countries enter without following the same expectations. My daughter fears these new immigrants, meanwhile our boys are afraid to ask a girl out on a date? Don't get me wrong these initiatives are not wrong and and am proud to see females and equity thrive however the way we approached and making our boys feel guilty has been completely offside.\", \"replies\": []}, {\"id\": 1042, \"aid\": 40, \"author\": \"Ralph Mousseau\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys are taught that being male means your are toxic. Men are represented as bumbling idiots in pop culture. I am a single father of four. I can tell you that from family court to supports for single moms only our culture is replete with sexism toward men. It's accepted and even encouraged. Boys are made to feel weak if they ask for equality. Since the 80s the focus has been on girls in education. We need to re align it so focus in on kids.\", \"replies\": []}, {\"id\": 1039, \"aid\": 36, \"author\": \"vocationcaptain\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I experienced emotional and physical abuse from employees within the public school system. I was a boy with endless curiosity, and I later grew up to become talented in the fields of physics and mathematics. I learned a vocation and earned my Red Seal certification only because people in my life kept pushing me forward and refused to give up on me, no matter what I said or how difficult things became. From there, I went on to become an engineering technician, and I am now enrolled in university.\\n\\nAll of that success exists because of the people in my life who continued to believe in me and push me forward. As it turns out, many of the things people in public school said about me when I was a young boy were not true at all. In fact, those experiences caused me a great deal of harm.\\n\\nEntering university in the middle of my life has created enormous challenges for building a career. If I could have chosen my own path, I would have preferred to complete the education and courses that allowed me to pursue these opportunities much earlier in life.\", \"replies\": []}, {\"id\": 1018, \"aid\": 17, \"author\": \"Mark Bradley\", \"meta\": \"May 14\", \"stance\": \"\", \"text\": \"Pure discrimination against males since 1970s.\\n\\nDefund the organization’s who discriminate against males.\\n\\nDefund the CBC\", \"replies\": []}, {\"id\": 1013, \"aid\": 12, \"author\": \"norwester03\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"The bar is raised high for boys compared to the other percentage in their class. They become underachievers as comparison is too favorable for the girls in grading and recognition, acknowledgment and what previous commenters have said it is true that going against our impulse to be confined in sitting and lack of male roles in the education system and being taught to repress our natural instincts and conform to something that has boys discouraged and feel not treated equitably after putting in same determination and effort and yet feeling that they cannot measure up to the expectations around them. Most boys especially due to life circumstances have chosen to drop out to support their family or a widow in family and would find labor and energy - fueled employment adopting new skills and trades that paid well and provided for the community / economy and employers didn’t require a high school diploma for these career paths. Perhaps every school in Canada differs but follows same protocol and curriculum set by the Education board and is trying to diversify and not leave one of the student body feel left behind and disadvantaged and yet as boys are continually criticized pushed with unreasonable expectations and yet not given the patience time and attention to succeed with the tools that will help them with feeling self validation and have the proper manageable mental health that carries into their adulthood and maturity. No blame can be all on one side, the environment nurturing in safe place within the home and the institution that molds and inspires and encourages everyone to be driven to succeed academically and to be motivated after school graduation so that they see the skills talents that they have honed and been blessed with. \\nI thank the opportunity for me to be able to share my own experience and to do so without bias just observation of what was observed within our schooling system in early 2000’s\", \"replies\": []}, {\"id\": 1011, \"aid\": 10, \"author\": \"ludo\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"There are a range of systemic issues in our modern society contributing to creating a \\\"non-ideal\\\" boy/young man environment:\\n\\n1) The \\\"go-girl\\\" attitudes in general, focused on female-focused successes; these permeate all aspects of society and send a strong latent (and psychological) series of implicit messages to young males - society is not routing for them. I think this a primary issue.\\n2) The number of \\\"new family\\\" types: this leaves many young males without a strong male role model, which can disengage them from being able to deal with challenges specific to males, without an understanding mentor.\\n3) Males and females DO have differences in the way they learn and think, and some of the new programs may not address this aspect very well. I am not saying that men or women are \\\"better\\\" than their counterparts, but these differences need be addressed. ADHD may not be as common, but disengagement and boredom more likely a cause. \\n4) Too many sports related focuses for males. Young boys need outlets like Cubs, Scouts, and other programs which are not as common as they were several decades ago. I think that these bonding outlets are important to help young men and boys learn to cooperate and do tactile activity OTHER than purely sports related activities.\\n5) With many new cultures integrating into Canada, I think we have lost some of the focus on what worked in the past, and with new challenges some minority males are already having to deal with within their cultural contexts, this may amplify other above issues. \\n6) The workload of parents in many cases has prevented them form taking as strong an active role in involving themsleves with their children, or being able to have a more \\\"village/neighbour\\\" situation which was more common back in the 60s/70s, and earlier. Back then, kids could stay afterschool at a friend's place and play. We have overly institutionalized our children's time when not with parents. This may have an effect on male development as well. \\n7) Society's current attitudes with males in general has affected their ability to BE men and boys. IMO, to the point where a boy may not understand what it IS to be male, and how they fit into a novel society with gender expression/expansion and being able to discover themselves within a spectrum that is now present.\\n8) It is possible that some societal changes over past recent decades has disconnected educators from these challeges and left them with little internal solutions to help reduce these impacts. An unbalanced gender representation at levels of education may also be a cause. \\n9) Virtual and actual peer pressures and social-media causes certainly amplify challenges, and even though some virtual bullying has been addressed, there may be more here than educators realize. I suggest limiting access to these media during school hours for primary schools - no exceptions. \\n10) Having too high a virtual learning tool may be putting young men into a category of diffuculty for those more \\\"tactile\\\" learning groups. This also may create or start early the path to falling behind. I think that all young peopleshould have to do a more complete learning/skills assessment earlier on to determine WHERE they are deficit and what paths to address these more early on to re-balance all students in class. This will assist educators in refining a better pathway to success for all. It is done with special needs groups, but not as common in general. \\n\\nMORE teachers are also needed - they're workload is such that they cannot or start to only be able to do SO MUCH with what they have. Not a good recipe to face these new challenges well in general. If more time and attention is needed, they NEED to have the TIME to address these with various students. This may not universally be the case anymore, where it may have been pre-1990.\\n\\nFinally: Let us remember than MEN and WOMEN are supposed to be equal. This includes all people on the gender \\\"rainbow\\\". We need to focus on PEOPLE, ABILITIES  and NEEDS, and address them all equally. If we wish successful outcomes. If the boys are falling behind, it is OUR collective fault - let's get to work providing a pathway to male success such that the result is a nuturing, wise, and productive male who can be a role model and someone to aspire to like. They don't need to be Hockey Players, or MBA stars - they need to be husbands, friends, dads, brothers, and female support (emotional/cooperation mostly) members of our communities. \\n\\nA lot of work to do, let's get this dealt with. It is NOT going away.\\nLudo\", \"replies\": []}, {\"id\": 1143, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to Brad Douglas\", \"stance\": \"\", \"text\": \"Maybe one simple fact is an illustration. Where is the term 'toxic femininity, yet it exists? I am female and my son and grandsons have encountered this.\", \"replies\": []}]}, {\"id\": \"home\", \"label\": \"It starts at home: expectations and discipline\", \"count\": 27, \"color\": \"rgb(63,63,128)\", \"px\": 130, \"py\": 238, \"d\": 131, \"allLabel\": \"25 responses · 2 replies\", \"posts\": [{\"id\": 1043, \"aid\": 41, \"author\": \"Cici Ford\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As a mom of a 12-year-old boy, I know I did some things, early on, that helped my son do well in school: established bedtime reading routine/love of books, I made sure he could read and write before starting JK, and I took him to pre-school playgroups so he could get a \\\"feel\\\" for a classroom-like setting.\\n\\nIn retrospect, I know I should have done more regarding general discipline and directly teaching empathy and consideration of others. I also feel a piece I missed was building his tolerance for WAITING. HAVING to sit and wait, sometimes, for others to be served, talked to, or dealt with BEFORE HIM. I think the things I did well have gotten him through, but the things I did poorly have cost him even better learning, mastering self-regulation sooner, and possibly quality friendships, as well.\\n\\nI believe many mothers favour (not quite what I mean, but I will use that word as a catch-all for the biological and psychological baggage that comes with women rearing little men) and pamper their boys. I don't think this is necessarily conscious, nor is the \\\"toughen up, it's a tough world\\\" philosophy often delivered to girls (\\\"for their own good\\\"). Moms commonly set the family tone, and if these two approaches exist AND combine with \\\"gentle parenting\\\" it spells more disaster for boys than girls.\\n\\nAs a teacher, recently having switched from secondary to elementary teaching, I feel I see proof of this theory very often. I taught grade one last year and, when held to a certain standard, boys have no problem - through prolonged training - meeting standards for sitting still, increasing the length of time they can focus, and learning. Maybe these skills don't come as naturally to all boys as they do most girls, but that doesn't mean the work put in isn't worth doing. \\n\\nAs a woman, I wonder why girls (I am speaking in generalities which can be exclusionary AND useful, which is challenging) are expected to sit by quietly and patiently while boys collect themselves or while adult educators in the room have to deal with boy antics and outbursts BEFORE the class can get down to learning? Again, this is delivering the same two messages: \\\"boys will be boys\\\" and let's give them the priority time and space to do that, and girls should \\\"toughen up, it's a tough world\\\"...and a lot of that has to do with all the space you have to make for boys.\\n\\nI think both genders/sexes, wherever they feel they fit, suffer - albeit in differing ways - when the basic self-discipline required to exist in a considerate society are lost. How are these regained? Through the direct teaching of having to wait at times, by parents modeling empathy and consideration for others, and by helping kids develop an internal locus of control.\\n\\nI'm sure there's more to the issue - and I didn't even touch on the disruptions of technology - but these are my thoughts on the issue.\", \"replies\": []}, {\"id\": 1044, \"aid\": 42, \"author\": \"Jake Thornton\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As I look at this issue, I see several contributing factors:\\n\\n1. All of this starts at home. Children’s home situation, whether they’re boys or girls, is the number one predictor of future success. Having 2 present and engaged parents is the best thing to set up children to be successful adults. There’s a societal disconnect from this historic norm that is contributing greatly to this issue. \\n\\n2. Boys need to be allowed to be masculine. This is going to sound like ‘Manosphere’ indoctrination, but the evidence is out there; masculinity is discouraged in boys from the get go. I’m not talking about chauvinism or misogyny though, these should indeed be discouraged. But boys and men are wired differently than girls and women and those differences in both need to be nurtured. \\n\\n3. Kids are not allowed to fail. School systems are systemically flawed nowadays where kids who are underperforming are pushed through with a low passing grade rather than being failed on homework and assignments. All this does is undermine the teachers’ authority and the need to put in effort for the kids. Eventually these kids are going to fail; it’s just going to happen when it truly counts. As adults, they will not have the tools to cope with society, and society isn’t going to give them anything for free so understanding that there are consequences to not performing is an essential piece of education. \\n\\n4. Kids have so much energy, boys and girls alike. Boys seem to tend to need the outlet of sports and free play to then be able to sit in the classroom. Having outlets for this throughout the day, whether it be physical education, recess, or even a more interactive portion of other education seems vital to me. \\n\\n5. Parents need to work with teachers better. Too often, parents think their children can do no wrong and will just fight teachers on every little piece of constructive criticism. This is not to say that some teachers won’t get it wrong and it’s important to know your children well and be able to recognize where something simply doesn’t fit your child’s character. But far more often than not, teachers are trying to help, not trying  to sabotage our child.\", \"replies\": []}, {\"id\": 1172, \"aid\": 146, \"author\": \"Sean Berry\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"It starts with not allowing students to fail.... Automatic passing has done nothing to create a motivation to learn, but what do I know? I've only been an educator for 10 years, married to an educator, and surrounded by educators for most of my life. My degree in behavioral psychology aside....\", \"replies\": []}, {\"id\": 1145, \"aid\": 129, \"author\": \"Martin Oubliette\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Not once in this whole big long article about how boys \\\"have more trouble\\\" in early grades than girls is it even suggested that it might have something to do with parents (and media) setting different cultural expectations for boys and girls in those critical first five years.\", \"replies\": []}, {\"id\": 1174, \"aid\": 42, \"author\": \"Jake Thornton\", \"meta\": \"May 13 · reply to Sean Berry\", \"stance\": \"\", \"text\": \"Couldn’t agree more. Kids not being able to fail only sets them up for failure in later life when society WILL allow them to fail\", \"replies\": []}, {\"id\": 1207, \"aid\": 166, \"author\": \"Sue Clarke\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Doesn't start or end in schools, this starts shortly after birth, that little blue  or pink sleeper and bonnet. Call it what you want but I call it patriarchal grooming and it's been happening for centuries.\", \"replies\": []}, {\"id\": 1081, \"aid\": 77, \"author\": \"Leesha C\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Follow Japanses schooling system. Showing kids about respect, accountability, responsibility and pride.  Our kids are ways to spoiled especially boys.  They think they know at all, it is our society and up bringing, lack of respect, gratitude and patient practice and focus.\", \"replies\": []}, {\"id\": 1154, \"aid\": 134, \"author\": \"Linda Cochrane\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The problem starts long before kindergarten: girl and boy babies are treated differently from the very beginning.  Girl babies tend to be held still, while boy babies are encouraged to play roughly; parents speak much more to girls than to boys; girls are given dolls, while boys are given bricks or similar toys. Just look at toy stores to see how toys are differentiated. I hope daycare staff are paying attention.\", \"replies\": []}, {\"id\": 1218, \"aid\": 173, \"author\": \"Rae Swearengen\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Our job as parents and educators is to help prepare adults. That's it. We worry far too much about giving them \\\"childhood\\\" about preserving their \\\"innocence\\\" and about making every dream and wish a reality and removing every wee bit of discomfort for them, that all we end up doing is failing them. We are not preparing these children. Not teaching them how to fall and get back up. Not demonstrating that discomfort equals growth. This is on us.\", \"replies\": []}, {\"id\": 1162, \"aid\": 139, \"author\": \"Brian Rosborough\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Some reasons -\\nMainly poor parenting, entitled children, lack of discipline, male children running households - making family decisions for example family meal decisions, entertainment, bed times, easy rewards before finished effort, parents too free with social media for children, male peer pressures, etc. \\nVery, very poor school education systems now, too much government bureaucracy, classrooms are chaos  - Teaches try in early career but then reduce their dreams of being teacher superstars and key on retirement pensions.\\nFemale children are more mature.\", \"replies\": []}, {\"id\": 1122, \"aid\": 114, \"author\": \"Ken Breadner\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"And what about those boys who do well? Does nobody even look at how they differ from those who don't? No, instead those boys are called nerds, geeks, and every manner of gay slur imaginable....and then beaten up by the lunkheads.\", \"replies\": []}, {\"id\": 1110, \"aid\": 103, \"author\": \"Arthur Pelton\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Academic achievement is not rewarded or encouraged in boys, neither by parents nor peers.  Far more emphasis is placed on excelling in sports.  In fact, academic achievement can often be actively discouraged through labels like \\\"sissy\\\" or \\\"brown noser.\\\"\", \"replies\": []}, {\"id\": 1079, \"aid\": 75, \"author\": \"parent33\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Consequences would help. There are no more consequences due to the parents being too involved in the kid's lives to the point the administration is terrified of being targeted online. Too many permissive parents outraged about their dysregulated, entitled children who trashed a classroom got suspended. Or the fact that they can't fail a grade. Or IEPs to lower the bar ( that's already on the floor). Why should I work my butt off to write 5 pages while Timmy who has autism and a behavioral problem can write 2 sentences and keep moving forward? What's the incentive? Why should they try? They need consequences and goals, especially boys. They need healthy competition. Young men are angry and unfamiliar to failure by the time high school and university come around that they can and will react violently and impulsively when they don't get things their way. We are raising babies, not strong men who can embrace and express their feelings in healthy ways. We're not setting them up for success. Put more money in sports, arts and music programs in elementary schools. Send unacceptable behaviors home. Fail kids who put in no effort. Stop giving parents that amount of power and make going to the principal's office an intimidating experience again. Oh, and make a law that prohibits children from having phones/YouTube/tiktok until 16 years of age. Every behavioral problem or learning disability I've seen were the kids who had access to those platforms. School can't compete with the dopamine rush of phones, so their nervous systems freak out when it's boring or difficult.\", \"replies\": []}, {\"id\": 1072, \"aid\": 69, \"author\": \"Joel B\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"We need to stop feeding our children processed garbage packed with sugar and acting like that doesn’t have a profound trickle down effect on how they act/ learn/ behave.\", \"replies\": []}, {\"id\": 1069, \"aid\": 67, \"author\": \"khkw\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"It’s parenting. No one wants to say it - not enough discipline. Kids are allowed to be wild. Taking away spankings was worse for boys than girls. All this ADHD and other labels... Back in the day we called them bad kids. The elephant in the room is that certain races don’t have a problem with their boys. My two kids are grown, on their and successful. I’m done. People that have problems with their boys can look longingly at those boys that do well and instead of attributing that to luck, they need to know that we’re they a lot tougher with them when they were little, they too could have had great kids, including their boys.\", \"replies\": []}, {\"id\": 1058, \"aid\": 56, \"author\": \"cob\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Parents need to take more responsibility for their children and quit blaming 'the system'.  It's been known for decades that in elementary school boys are at a disadvantage because of the structure of needing to 'sit still' in class or learn passively and they are generally more physically wired at that age than girls.  But studies have also shown that by grade 8 and beyond, boys take over in that they are a 'louder' more 'outspoken' presence in class.  So yes the system needs improvement and let's advocate for it.  But parents, until change comes advocate for your child and work with their teachers.  My kids are now adults. I have 2 girls and a boy, the oldest girl and youngest boy both have ADHD.  And I had to advocate and work with teachers and counsellors from K through to Gr 12 to support their success in school.  LOTS of meetings.  But it was worth it.  For my son in partucular who was EXTREMELY physical, teachers came up with ways to allow him to move in class while not disturbing others AND get his work done.  In pre school at story time he was given his own chair behind the other kids sitting on the carpet.  As long as he stayed on the chair (i.e. not run around the room) he could move anyway he wanted.  Sometimes he was sitting upside down on the chair, wriggling and wriggling but listening and not disrupting the class.  Genius teachers.  In gr 2, his teacher let him do 1 math question then quietly get up, take a turn about the room, then do the next question.  It worked for him and the other kids accepted that was how he worked.  His teacher understood moving helped him concentrate. I love that teacher to this day for accepting all her students for who they are and for not labelling them as being 'bad' for different behaviour. I understand that not all teachers may be as understanding but most are willing to work out a solution with you.  And for those that aren't, it's an early lesson for your child on how to handle adversity and for parents to teach their children resilliency and to accept themselves.  They are wonderful just as they are.\", \"replies\": []}, {\"id\": 1053, \"aid\": 51, \"author\": \"fundaybay\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Parents need to work very closely with teachers and staff on what works for their child.  My 24 year old son was always a challenge and he is now working as an insurance adjuster and loves it.  My son always wanted to be the centre of attention, the one who made kids laugh.  Having him work in a room in the principal's office worked for him because he was very focussed when working independently.  Also, two teachers engaged him in stimulating conversation.  He loved to read and know facts about sports and history. I always told teachers to keep him busy.  Always make sure that he had something to do.  High school guidance encouraged him into tech courses and I said no.  I told him that he is a thinker and does not have the aptitudes or interest for skilled labour.  I had to fight hard to ensure that he was directed to university level courses.  Now he is happy and focussed because he can talk to people and think to navigate claims.  Both of which he thrives on.\", \"replies\": []}, {\"id\": 1048, \"aid\": 46, \"author\": \"David Neil\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Apathetic parenting, too much screen time, not enough exercise, lack of nutrition. Young boys need regiment.  Cod liver oil can help support brain development in young children, primarily due to its high content of omega-3 fatty acids (DHA and EPA) and vitamins A and D. DHA is a crucial structural component of the brain and retina, supporting cognitive function, memory, and visual development.Key Benefits for Young Brains:Cognitive and Behavioral Support: Rich in DHA, it supports memory, learning, and overall brain cell communication. Improved Focus and Attention: Studies have linked omega-3 intake in children to improved attention spans and better performance in tasks requiring cognitive effort. Neuroprotection: The nutrients in cod liver oil are thought to aid in reducing inflammation and promoting long-term brain health. Early Life Development: It is particularly valuable during infancy and childhood for maintaining healthy brain function.\\nhttps://www.google.com/url?sa=i&source=web&rct=j&url=https://www.healthline.com/health/parenting/cod-liver-oil-kids&ved=2ahUKEwiM1dCQo7aUAxV9MlkFHbZgCEYQy_kOeggIAggACBcQBA&opi=89978449&cd&psig=AOvVaw2UvyBTeu6_oOTHhx20gAfR&ust=1778762046475000\", \"replies\": []}, {\"id\": 1038, \"aid\": 37, \"author\": \"Celia Kennedy\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As I watched this story being reported on The National during my morning coffee, all I could say was, \\\"It's about time they said it out loud\\\". I am a retired environmental scientist with 2 grown sons and a husband of 40 years. One of my sons has a hearing disability. Both are established professionals holding positions of authority in their disciplines. I have 4 siblings and neither of my parents completed high school. When I was 39, I returned to high school with 2 young boys at home and the support of my husband. Five years later, I completed my first (of 3) post-secondary degrees, the first in my family. Now you have context. We were fortunate to find a preschool that specialized in children with disabilities, with some of the most insightful staff I have ever known. They taught my husband and I how to communicate with our older son and how to parent. How to constructively parent bright, energetic, misunderstood little boys whose potential is fragile if not nurtured in a positive, demonstrative way. In our family, learning was not confined to the classroom. We became coaches, scout leaders, community advocates and guest speakers at local schools. I could speak/write on the topic much longer, but I think my key message here is that if you want to produce thoughtful, intelligent, open-minded, gentle men, who are strong leaders with high-energy multi-tasking capacity, confidence and humility, you have to put in the time and effort to give them the tools and strategies to set them up for success as they make the journey from early childhood to adulthood. It's difficult, demanding, and the public school system will not support you in these efforts. Experience has taught me that it's broken. There will be times when your sons resent you and society offers easier options, but find the strength to stay the course.  Activities (athletic, tactile, artistic, social, indoor, outdoor) are your tools of leverage to reinforce learning and to help him navigate the challenge of growing up and finding peace of mind. My 2 cents' worth.\", \"replies\": []}, {\"id\": 1036, \"aid\": 35, \"author\": \"Barbara Johnstone Grimmer\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"It starts before school. I have three boys, two whose dad died when they were in diapers and I raised them alone until school age. They had good daycare, stable home with consistent expectations and love.  I remarried and had a third boy, and he was mostly raised the same but had a dad and less daycare. They each had different issues with school but made it through and graduated, two graduated from university, one with a trade. Life isn’t easy but perseverance is important. Preparing young children for school when they are little is important. In my day, the bias towards boys was very evident. I was able to succeed and received postgraduate degrees. I shared my experiences with my boys, especially the joy of learning, how to succeed in learning, and I would read to them and encourage reading, and let them know you can learn anything if you read.\", \"replies\": []}, {\"id\": 1035, \"aid\": 34, \"author\": \"Damien Hollett\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Just have witnessed a interview on CBCNEWS, not judging o
