r giving negative feedback, I am giving back positive observation feed back. The boy swinging around on a swing in the middle of a climbing jungle gym. No parent physcal connection, no interpretation of learning skills, numbers, alphabets, math, reading , words, writing into the child's physical activity. Use pictures of words, writing, directions, make a game out those skills. Otherwise parents stop being on your phones, and create ideas for your kids. Your phone has those ideas, options, and teachings. \\nFrom:\\nLifesaving Swimming Instructor since 2005 age 47.\", \"replies\": []}, {\"id\": 1034, \"aid\": 33, \"author\": \"mari\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I’m a retired elementary school teacher. I raised a son and have a grandson. I have taught boys and girls aged 5 to 12. I agree that the problem starts before school. Parents are a child’s first teachers. Children emulate what they see. If you read for enjoyment, your child will too. If you value learning, your child will too. School is not the only place where learning happens.\", \"replies\": []}, {\"id\": 1033, \"aid\": 32, \"author\": \"Matilda Dillon\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Perhaps the problem begins at home where expectations for boys and girls are different. Parents might push ideas of what boys should be interested in and what they think girls should take an interest in. Boys are generally nudged towards sports, cars and trucks. Girls are nudged towards being sweet, kind, obedient and quiet.\", \"replies\": []}, {\"id\": 1032, \"aid\": 31, \"author\": \"Vickie Jones\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I taught for over 7 years in the public schools and 30+ years in a university. Boys are so much fun and high spirited; they are in your face expecting you pay attention to them. The girls are quieter, and heres the main difference, they try harder, they do their homework, they study and they don't complain. Boys would rather play or go out for the night or act out while the girls complete their assignments, and often help the boys to complete theirs. Schools today use grades to make placement decisions, and bottom line, they boys are not competing very well. My advice to parents is teach and expect your boys to study, complete their assignments and fill their heads with visions of how to be successful. And they will do fine. Ask yourself if perhaps you believe \\\"boys will be boys\\\" and you don't expect head work and have high expectations for them. In my opinion that is the problem.\", \"replies\": []}, {\"id\": 1014, \"aid\": 13, \"author\": \"olivia\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"I think the way this issue is approached in the article is all wrong. I saw someone else mention on this discussion board that the issue for boys begins much earlier than school and extends much later - I agree. We are raising our boys from birth in such a different way than we are raising our girls. Not teaching them to sit still, to listen carefully, and very importantly not encouraging them to read. There is certainly an aspect on the school's end that students are expected to sit still for far too long, however, this is an issue that affects girls as well as boys. The girls simply respond differently and tend to find a way to manage due to differences in expectations from birth. Also, this article cites learning disabilities/ADHD as a reason boys are struggling more, saying that the rates of learning disabilities/ADHD are higher in boys. This is a great moment to consider that the rates are higher due to an underdiagnosis of learning disabilities in girls, which is a well-documented issue. Many girls are diagnosed later in their teens or early adulthood with learning disabilities/ADHD after they have burnt out from trying to manage for so long. The solution to this is not a changed/special curriculum for boys. The solution is much broader than that and will need to be a combination of school adjustments, parenting adjustments, and perhaps some government laws particularly around screen time for children (known to cause attention span issues.) Overall, the wrong way to frame this issue as schools disadvantaging boys, because that is simply not true.\", \"replies\": []}, {\"id\": 1005, \"aid\": 5, \"author\": \"Larry Van Pelt\", \"meta\": \"May 16\", \"stance\": \"\", \"text\": \"According to Google’s Gemini AI ...\\n“... collectivist and individualistic societies differ significantly in how they socialize males, largely because they aim to produce different types of men tailored to different societal needs. In collectivist cultures, socialization emphasizes interdependence, obedience, duty, and maintaining harmony, whereas individualistic cultures prioritize independence, self-reliance, and personal achievement.”\\n          I was brought up in an individualist society i.e. North America, but my early childhood was spent mostly on my own in a rural setting. My mother thought I was not getting sufficient socialization, so she put me in school—although I was several months younger than the average for first grade. There was no kindergarten or preschool then. Mom asked my first-grade teacher to inflate my grades. According to her they did. The point was to build up my confidence. \\n          My mom’s socialization plan for me did not work in the way she expected. My identity was already too strong. School society could not change me.  I tended to have independent  friends. I married an independent  woman. We were blessed with two sons that grew up to be like us—adjusted and successful. \\n          My solitary early life and my age upon entering school affected my attitude. I was appalled at the way my schoolmates behaved towards one another. My best school playmate had a great interest in baseball, so I played pitch and catch with him every day. This association lasted until grade 3. Boys tended to play at competitive sports and football, while girls gravitated towards games like hide and seek, and cliques of friends.\\n          Society prepares girls and boys for different social roles. Males are expected to compete, and females are expected to socialize. The education system of today suffers because today’s social roles are evolving. Our entertainments and professions are still highly competitive and individualistic. \\n          There have been attempts to understand the development of children by people like Piaget. BF Skinner and Montessori proposed changes to the education system. I remember studying these ideas in college. Perhaps they should be revisited. \\n         The human world is more conflicted now than when I was young. I would like to see society become less individualistic,  more cooperative, and more adaptable.  \\n                                          Larry Van Pelt,  Stratford, Ontario.\", \"replies\": []}, {\"id\": 1173, \"aid\": 147, \"author\": \"Jim Smith\", \"meta\": \"May 13 · reply to Sean Berry\", \"stance\": \"\", \"text\": \"Totally agree. As a high school teacher and parent of 3 boys, I see both home and school as \\\"safe\\\" environments where kids learn incrementally how to operate in the \\\"real world\\\", i.e. when they graduate. \\\"Not failing\\\" is not the only problem, but it is definitely a contributing factor.. What is the point of graduating a student from grade 12 when they can't even read instructions, fill out a job application, determine that their grocery bill is wrong, follow a recipe, or figure out how many tiles they need for a floor? It's not fair to the students, and it's not fair to employers or post-secondary educational institutions who need some kind of baseline represented by those high school diplomas.\", \"replies\": []}]}, {\"id\": \"differently\", \"label\": \"Boys mature and learn differently\", \"count\": 26, \"color\": \"rgb(5,130,135)\", \"px\": 340, \"py\": 127, \"d\": 130, \"allLabel\": \"24 responses · 2 replies\", \"posts\": [{\"id\": 1040, \"aid\": 38, \"author\": \"Maxine Bertolini\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As a grandparent of 3, who has raised a son and daughter in two Northern communities. I have experience with both my children and now grandchildren. The education system does not take into consideration the developmental differences between girls and boys. Little girls most often develop their fine motor skills first so they often enjoy sitting and colouring, cutting, whatever the task of the day is. Whereas little boys are most often the opposite they develop their large motor skills first. So they have a need to run and climb and move. I say most often as every child is unique and we really can’t be sorting by gender. But rather by individual preference. \\n\\nEarly and middle school isn’t designed for this. \\nBoth my children have become successful adults partly due to both myself and husband being involved with our children’s education and good communication with their teachers. \\nEarly on in our home community of Inuvik both my children were able to attend a Montessori preschool. It was a wonderful experience as each child could learn in different ways.  In our current community of Yellowknife, NT both my children and now my grandchildren have access to some on the land learning with indigenous Elders. It’s such a great opportunity for them. Something all schools should do more of. \\n\\nIn closing, it is important for children to learn how to sit and learn in a classroom but finding great ways to learn outside the classroom is just as important.\", \"replies\": []}, {\"id\": 1073, \"aid\": 70, \"author\": \"jacrobs\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"More of a movement/play based structure for school to for a little longer would likely be beneficial for boys and wouldn’t harm girls. A proper Montessori style of classroom where you kids are encouraged to get up and move around regularly and have some more choice on when they learn things as long as they end up where they need to be after a three year cycle would help. Another option could be having it be standard for boys to start school a year later to better match boy and girl maturity levels. Boys who are ready “on time” could still start early, and girls who would benefit from waiting a year could, but the default would be boys do an extra year of kindergarten.\", \"replies\": []}, {\"id\": 1188, \"aid\": 157, \"author\": \"theresa\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The education curriculum needs reform. We need midterm and final exams to properly measure how much knowledge children have actually mastered, so we can tell whether a student is truly falling behind academically or simply has discipline and behavior issues. Boys are naturally less obedient and compliant than girls, and elementary school report cards don’t really reflect a child’s true academic ability.\\n\\nParents with money and time can provide extra tutoring and support for their children, but families without those resources have to rely entirely on schools, and the current system is failing them. Society no longer provides real upward mobility for children from poor families. In the end, “all inclusive” policies hurt low-income families the most.\", \"replies\": []}, {\"id\": 1116, \"aid\": 109, \"author\": \"Ian Brown\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"There's nothing new here.  Dr. Leonard Sax wrote about this 20 years ago (see his book Boys Adrift, published in 2007), in which he describes the research on the negative effects of video games, changes at school, medications, endocrine disruptors, and the lack of role models for boys.  I was a school psychologist for 34 years and saw first-hand how quickly boys get turned off school and fall behind.  Now I volunteer in a primary class and see the girls enjoying learning and moving ahead, while the boys lag behind and are discouraged.  Boys learn differently than girls, and need to be taught differently, including the opportunity for more movement.\", \"replies\": []}, {\"id\": 1213, \"aid\": 167, \"author\": \"Ryan Carey\", \"meta\": \"May 13 · reply to Linda Cochrane\", \"stance\": \"\", \"text\": \"Fair point on the statistics. You are right that the data could reflect girls improving rather than boys declining. Both things can be true simultaneously and the honest answer is probably that it is some of both.\\nBut here is where I respectfully push back.\\nThe worldwide nature of this trend is actually the strongest argument that something systemic is happening to boys specifically. Not in the curriculum. In the culture. Across every developed nation we have seen the same pattern emerge at roughly the same time. Boys disengaging. Men checking out. The mental health of young males declining sharply.\\nThat is not a curriculum problem. That is a rite of passage problem. A purpose problem. A belonging problem.\\nAs for Sweden in the 1960s, that is an interesting data point but it does not address what has changed in the last 30 years specifically. Something shifted. The rates of male disengagement, suicide, addiction, and dropout accelerated. That acceleration needs an explanation beyond girls simply being naturally better students.\\nAnd to your final point. Perhaps treating boys and girls equally will always result in girls doing better in school. Maybe. But equal treatment does not mean identical treatment. Boys and girls develop differently, learn differently, and need different things at different stages. Acknowledging that is not inequality. It is just biology.\\nThe goal is not for boys to outperform girls. It is for every young person to reach their potential. Right now boys are not doing that. That should concern all of us.\", \"replies\": []}, {\"id\": 1176, \"aid\": 149, \"author\": \"Ken Davies\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Go figure, you  demonize their natural behaviour, and education that ignores boys and girls learn differently.   Education/teachers try to force boys to act like girls, guess what, mother nature prevails.  We need to let kids be kids and not try and force them in to mold.\", \"replies\": []}, {\"id\": 1080, \"aid\": 76, \"author\": \"Marilyn Elliott\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"In the early 1970’s, I read a book by A.S. Neill who started a school called Summerhill.  He believed boy’s brains developed later than girl’s brains and forcing boys to attend classes before they were ready to learn did immeasurable damage. He believed boys should attend school and play sports or other such activities and when the boy was ready to learn, his brain would soak up knowledge like a sponge. Our school system is set up to accommodate teachers, and students must conform. Summerhill school still operates. I suggest you seek out his book and read it.\", \"replies\": []}, {\"id\": 1028, \"aid\": 27, \"author\": \"philature99\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Many studies identified that boys simply mature later compared to girls making it difficult for them to keep up. The simplest solution is to simply provide one more year of kindergardern to boys to allow them to mature enough prior to the 1st grade.\\n\\nAlso, boys also suffer from higher rates of autism and ADHD so it could also be an issues with the lack of supporting ressources.\", \"replies\": []}, {\"id\": 1166, \"aid\": 138, \"author\": \"Tony Johnson\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Boys have more variance. There are more high flyers and there are more bottom dwellers. Modern society works so hard to ensure equity for everyone, this tends to benefit girls, IMO, who have less variance.\", \"replies\": []}, {\"id\": 1163, \"aid\": 140, \"author\": \"joleen2026\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"My sister was the Principal of a \\\"test\\\" school in Calgary that was set up by one of the main school boards. It wanted to test the research on \\\"single gender\\\" education, which meant that in academic subjects, girls and boys were separated. On average, girls preferred having desks they could keep their belonging in, whereas boys preferred sitting at tables or standing desks, using exercise balls to sit on, and having to get up and go to their cubbies to retrieve school supplies. \\n\\nThe point isn't that we have to have gender-differentiated classrooms, perhaps just more individuated choice for how kids use their classroom in a way that helps to keep them focused. In my daughter's elementary school now, teachers do their best to let kids stand if they want, or sit on the carpet, etc. I know this is asking alot of teachers as it might make it harder for them to manage, but I think all of us (regardless of gender) have our own preferences as to what keeps us motivated to get our work done (eg, I have tasks that I prefer my standing desk for, and others I prefer sitting). The sooner we all figure out how we work best, the more successful we will be.\", \"replies\": []}, {\"id\": 1138, \"aid\": 124, \"author\": \"novascotia18\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The age in which students begin primary school has a very late cut off date of December 31st... far too late, in my experiences and opinion. Sure parents can keep them home another year if they choose, but I believe the cut off date urgently needs to be addressed and changed so that all kids can benefit positively. If you look at countries with higher levels of success across all areas, they all begin school at a later age. Even if female students do well academically compared to males,  social emotional aspects may be impacted. My belief is that they are impacted across the board, and even if on the surface things look okay, it can  have huge impacts throughout school and into adulthood. If we change the cut off dates, then I believe we will see higher rates of employment, happiness, and improved mental health for all.\", \"replies\": []}, {\"id\": 1136, \"aid\": 122, \"author\": \"David Burke\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I, a male, always hated school. My IQ is quite high, but I don't think it is that, at least not mainly. I found that as I progressed through the school system from grade school to university, the system was becoming increasingly biased against learning styles that favoured males. There was far too much sitting around listening to run on lessons with little or no hands on activities. In university there was no tolerance for actual debate about ideas as it was viewed that debate was too confrontational and it may upset some people. There were very few ways for boys to confront and overcome challenges. I have to say that the whole school system is almost completely useless if not counterproductive for males, especially in a society where individual thought and creativity are highly valued in the economy. The system is lacking for femaes too, but shockingky useless and even bad for most males. It needs major overhaul and for some males and some females, segregation may even be beneficial. On a side note, government taxes should not fund any separate (religious or lingual) education systems - it is far too inefficient, from transport to admin. We simply can't afford it.\", \"replies\": []}, {\"id\": 1134, \"aid\": 120, \"author\": \"Roger Curtis\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"This is old news. Sadly, really old.  There was a time when it was girls who were the least likely to graduate; hence, the introduction of the novel study, night school, commercial subjects and more.  Can we do the same for boys?  Sure we can.  Let's make certain content fits, offer a boys-only option and ensure that the teachers they encounter represents as many males as possible.. \\n\\nAs for giving up, parents must govern themselves accordingly.  After all, failure is not an option.\", \"replies\": []}, {\"id\": 1121, \"aid\": 113, \"author\": \"S W\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The education model originates from the 1850s to keep children off of the streets and supervised. To train them to sit still for future work in the factories. One could say that model still exists to some extent today. It is a matter of maturity - girls are generally more mature and able to sit and listen longer than boys. Boys tend to be more physical and need to get out and run around often. It also has to do with emotional maturity - boys are not encouraged to express their sadness the way girls are. The focus of schools is more about academic testing and grades instead of actual learning. Children feel shame when they compare their marks to their peers. Children should be allowed to learn at their own pace and be able to pick and choose what they want to learn and how they want to learn it.\", \"replies\": []}, {\"id\": 1084, \"aid\": 80, \"author\": \"Denise Kemp\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys are made differently. They are active, high energy, chaotic and girls are the complete opposite. Boys need to be taught differently. In the ancient ways boys were taught self defence, aggression, strategy. Boys have not changed. Our way of teaching is based on the way girls learn. Teach boys through strategy and activity. Place their attention on challenges that trigger those aspects of what they are made for.. it will not only enable learning but raise their self esteem as well.\", \"replies\": []}, {\"id\": 1083, \"aid\": 79, \"author\": \"Jennifer Blake\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I doubt there is any one reason, but I do think that our current mantra that everyone is different is missing the social dimensions of childhood of learning and motivation. Suggesting or acknowledging that- for the most part, boys and girls are different is challenged by   how to hold that and also recognize the needs of the gender diverse. Increasing physical exercise makes sense.- moving our bodies is vitally important- not elective. I went to a public school but in most of my elementary school the classes were all girls or all boys. I would like to know: Are boys falling behind and dropping out in the schools for boys?\", \"replies\": []}, {\"id\": 1063, \"aid\": 61, \"author\": \"nichole\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"What if we accept what girls have been taught from very early childhood - that girls are more mature than boys? Say the boys are about 2 years on average behind the girls in measurable metrics, reading, maths etc - what if we let the boys start school 2 years later than girls? \\n\\nThat way they can catch up, and have similar graduation/post secondary numbers as the girls.\", \"replies\": []}, {\"id\": 1060, \"aid\": 58, \"author\": \"Daniel Friedt\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"One factor is the teacher. I am a retired teacher and principal (39 years experience). Teachers need to move beyond worksheets. Secondly, I believe boys learn differently than girls. There is much valuable research already done on this topic. Teachers should be prepared to teach boys differently and maybe even separately from girls, especially in the early years. Active learning must be part of this learning process - for both student AND teacher. This is a sound bite. Much more needs to be shared, tried and learned from actual classroom experience.  Put our best teachers in the first three or four grades of school to establish a solid foundation of acceptance and learning.\", \"replies\": []}, {\"id\": 1056, \"aid\": 54, \"author\": \"Nick Pretty\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"There are many reasons why boys are falling behind in school academics. One would simply be the educational setting. A disciplined setting designed for a more innately compassionate female sex, not that boys cannot adapt but the nature vs nurture argument does have some relevance in this debate. Next is more societal based argument where aggressiveness is not a positive virtue in today's society. Males are inherently more aggressive, and these attributes are not welcomed in most setting in a 'civil' society.  The education system attempts to downplay and extinguish these traits which are more prevalent in males. Activities in school are also aimed towards a more passive nature, leaving persons with more aggressive traits attempting to find other activities. Fixing the issue will be no easy task but systematic discrimination (albeit unintended) must be addressed to equal the playing field between males and females.\", \"replies\": []}, {\"id\": 1051, \"aid\": 49, \"author\": \"elleb\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys, in particular, are started in school WAY too early. They should NOT start school until age six, maybe 7. Look at Sweden and Norway way where children don’t start until 6/7. There would be significant decrease in ADHD diagnosis in boys. Boys do significantly better when they start school later. Suggested reading “Boys Adrift” by Leonard Sax \\nAs long as parents want “free day care” in the form of formal schooling boys will struggle. That is not a slam on teachers whatsoever. I am a retired one, and teachers do amazing things. Boys just don’t fair well in these settings so early.\", \"replies\": []}, {\"id\": 1015, \"aid\": 14, \"author\": \"Lesley McVey\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"I believe that boys would do better (and so would girls) in gender specific schools after age12.  Having boys and girls together during those unsettled years of puberty puts unnecessary extra pressures on them to the detriment of concentrating on schoolwork.\", \"replies\": []}, {\"id\": 1010, \"aid\": 9, \"author\": \"Donna Angel\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"I knew the education systems was not for boys when my sons started kindergarten. The system is about academic learning and making children sit too long. My sons' intolerance peaked in junior high school. I asked administration and teachers to bring in speakers during education week to talk about various careers that are not university-focused. They told me it's not necessary!  My sons quit in high school and my husband and I understood. One son later did ABE grades 10, 11 and 12 completely self-directed without a teacher, in eight months! My sons are smart but they had no interest in any career that required a university degree. They are working in the automotive industry and enjoy their work. I don't have the answer for a better system and I know the educators are burnt out because this system doesn't work for them, either.\", \"replies\": []}, {\"id\": 1009, \"aid\": 8, \"author\": \"Christopher Marshall\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"The school system and its structure are designed for female learning and not male learning. Male and female learning are different and should be treated as so . Until this is corrected we have a failed system.\", \"replies\": []}, {\"id\": 1004, \"aid\": 4, \"author\": \"William Anderson\", \"meta\": \"May 21\", \"stance\": \"\", \"text\": \"I do NOT ever want to take away from women in the workforce or opportunities for their success at any age. I am a strong supporter that women are always fighting an uphill battle and I know because my wife and I are in the same profession that women are disadvantaged even in women dominated professions. BUT when I started as a teacher I was told my mentors and professors I can no longer say \\\"boys will be boys\\\" but now that I have one of my won, I was one and still have some of that in me, it is true. Also by the stats, articles and research coming out about this topic, I feel like people again went too far one way to try to correct an issue and have no caused more problems. Boys will be boys, what that looks like can be different. My boy is a wild boy and we spend the majority of the time outside, playing, hanging out with the neighbourhood and going on adventures. On those days, his regulation is right, when he does not get that - it is a much different experience parenting.\", \"replies\": []}, {\"id\": 1003, \"aid\": 3, \"author\": \"Teran Mundell\", \"meta\": \"May 22\", \"stance\": \"\", \"text\": \"[I posted this on the Youtube video and pasted it here]\\nAs many commenters have described, the phenomenon of females outpacing males in education is decades-old in both Canada and the United States.  I'm very happy for the progress of females, but society in English-speaking countries, writ large, has underemphasized young males for many years.  Nevertheless, I'm happy that CBC is coming to this late instead of never.  I'm also happy with how the CBC's editors framed the unnamed \\\"expert and activist\\\": they included her opinion, but the story was framed in such a way that her opinion was debunked by Heck immediately thereafter.  Yes, it is important to note that men currently hold the majority of high power and earning positions, but we're comparing entirely different age cohorts who grew up in different periods and with different cultural values.  What most of the people in this video are saying is that that if current educational trends continue into future occupational trends, then we should expect to see men lagging behind women in socioeconomic status.  We'll see if this actually happens. \\n\\nBear in mind that if it does happen that there will likely be more social disruption, because while men TEND to find physical attractiveness in women to be highly important in mate selection, women TEND to find a man's ability to provide (i.e., earnings) to be highly important in their mate selection.  As such, if women are earning more than men, then the prediction follows that we can expect to see even more sex and relationship-deprived males, and this often leads to very bad societal outcomes (e.g., mass unrest and revolutions).\\n\\nThe solution?  I generally bristle at the word \\\"equitable\\\", but in this case, it may be the right course of action. This is to say that, generally speaking, males and females thrive within slightly different learning environments, and we should try to couple these needs with these environments.  Another solution is for us, as Canadians, to value both sexes equally.  We really do compliment each other, and it is to any society's discredit to overemphasize demographic and underemphasize another, regardless of which demographic (e.g., sex, ethnicity, etc.) we're discussing.\", \"replies\": []}, {\"id\": 1074, \"aid\": 65, \"author\": \"simon\", \"meta\": \"May 13 · reply to jacrobs\", \"stance\": \"\", \"text\": \"I agree with all that. Based on my son and daughter's experience - both equally smart but maturing veey differently - I saw my daughter fully focused on high school straight away in Grade 8, whereas my son suddenly clicked into gear half way through Grade 10. Just in time as it turned out to get the grades needed to get into a decent university. He did well, but if he had started school at 7 and graduated at 20 rather than 18 I'm sure he would have had top grades and been a scholarship candidate like his sister. But I'll be first to admit, mine are privileged kids - two educated parents, warm home environment, great public schools, upper middle class neighbourhood. Not sure my son would have fared so well without those guardrails\", \"replies\": []}]}, {\"id\": \"move\", \"label\": \"Let them move: recess, PE and outdoor play\", \"count\": 25, \"color\": \"rgb(0,122,96)\", \"px\": 346, \"py\": 370, \"d\": 129, \"allLabel\": \"23 responses · 2 replies\", \"posts\": [{\"id\": 1130, \"aid\": 118, \"author\": \"cdnmomof2\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Boys aren't \\\"falling behind\\\" — our schools are failing to meet their developmental needs.\\n\\nThe research is unequivocal: recess and unstructured outdoor play are not privileges to be earned. They are developmental necessities for all children and most especially for boys.\\n\\nBoys develop executive function, impulse control, and emotional regulation skills through physical movement and free play. When we remove recess as punishment — which the studies also show disproportionately affects boys — we're actually removing the very tool they need to develop the self-regulation skills we're punishing them for lacking. It's a cruel feedback loop that the system has created.\\nOther jurisdictions have figured this out. Finland guarantees 15 minutes of outdoor time after every 45-minute lesson throughout the school day in addition to an long lunch period that also encourages outdoor play.  Finland's PISA scores consistently rank among the world's highest, suggesting their approach works. Japan mandates recess periods and views outdoor play as essential to academic success. Washington State adopted policies ensuring recess cannot be withheld for behavioral reasons, and that outdoor time happens daily except in specified weather conditions. Why? Because the evidence is clear:\\n\\n- Physical activity directly improves attention, focus, and classroom behavior\\n- Unstructured play builds social skills, conflict resolution, and emotional literacy\\n- Outdoor time reduces stress hormones and improves mental health\\n- Movement supports boys' developmental trajectories\\n\\nYet I've watched my son's school routinely remove recess and outdoor lunch time as punishment. A punishment that seems to be reserved for boys only.  For my daughter, I seen the entire school keep all classes inside for weeks on end in the spring because of \\\"rain\\\".  We're sacrificing children's health and development for adult convenience. \\n\\nMy recommendations:\\n- Adopt protected recess policies: Recess is a right, not a reward. Full stop.\\n- Increase recess time: it is recommended that elementary students get 60+ minutes daily of unstructured play, yet most of our schools provide 30 minutes or less.\\n-Train educators on gender differences in development: Boys' need for movement isn't \\\"bad behavior\\\" — it's biology.\\n- Redesign discipline approaches: Removing the tool a child needs to succeed is not discipline. I would argue that it's educational malpractice.\\n- Make outdoor time non-negotiable: Weather guidelines should be specific and evidence-based, and published at the School Board level in all communities. This should not be left to adult preference.\\n\\nOur boys aren't broken. Our system is. And until we acknowledge that sitting still and being quiet for 6+ hours isn't developmentally appropriate for most elementary-aged children — especially boys — we'll continue to see them \\\"fall behind\\\" in schools designed around a narrow definition of success.\\n\\nThe solution isn't to fix the boys. It's to fix the schools.\", \"replies\": []}, {\"id\": 1052, \"aid\": 50, \"author\": \"Jill Lawless\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I have two sons who went through the public school system. One is in high school and the other is in undergrad university level education. We are a highly educated family with both parents and health professions.  I was very involved in our boys education in elementary school and I observed firsthand the struggles they overcame to be successful in their higher level schooling.  Both of my boys recall feeling tortured at the grade 6 level due to the expectation that they would sit still and not move for didactic- style teaching.  Ever recall both sons asking if there was something wrong with them because they felt akathesic sitting in their seats, trying to pay attention. We even met with the teacher and had adaptations made for our younger son so that he could get  up and walk to the washroom without having to ask permission. My observation is that the classroom needs to be a more dynamic environment for both genders. I noticed that there seemed to be more understanding of the nature of boys “energy” with male teachers more so than female teachers.  I don’t think the answer is putting stationary bikes in the classroom. But I do think movement needs to be part of every classroom, less static learning.  Experiential learning needs to happen in the upper elementary grades where it seems that as  work gets more serious, the teaching becomes more stationary and more didactic. In the younger elementary teaching, experiential learning is embedded and a focus.  I believe there are ways to incorporate movement as children are learning more difficult concepts. My boys are intelligent and picked up concepts especially in math and science relatively quickly, however, I noticed their confidence was shaken during those upper elementary years of school and that fed into an attitude towards school for a period  time that was negative.\\nThey both enjoyed the movement from class to class in middle school and regained their confidence thereafter. From our experience, the upper elementary years were their most challenging.  Classroom size obviously plays a significant role in how creative teachers can be- smaller class sizes are needed to enact change.\", \"replies\": []}, {\"id\": 1189, \"aid\": 158, \"author\": \"edgradstud\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"If school is improved for kids who need to move their bodies to learn, everybody benefits. To do that requires $$$—for teachers to prep and run more labour-intensive activities, to elevate the prestige of teaching (one side effect of which might be more masculine role models on schools), to allow more observational assessments, etc. The problems are systemic and structural, and they come down to capitalism and patriarchy.\", \"replies\": []}, {\"id\": 1216, \"aid\": 131, \"author\": \"p3000g\", \"meta\": \"May 12 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"Definitely agree. Boys are more physical and need more physical stimulation to be disciplined and organized. Physical activity makes them feel like men and give them a sense of purpose. In the olden days, men used to go out, hunt and work in the farms and factories doing jobs that demand physical labour and they excelled in that. \\nIn the modern world, these things have been replaced by machines and robots, leaving only desk jobs available to them .. Add to that internet , online and social media access without restriction , mean that the current generation of boys is growing up completely detached from reality.. spending their times on screen and typing on their phones instead of doing real work.  The upcoming AI revolution will only exacerbate this issue , unless it is addressed urgently. We need to urgently think how to face this oncoming onslaught of AI, internet and social media combined..\", \"replies\": []}, {\"id\": 1089, \"aid\": 85, \"author\": \"Dirk Lepage\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys need to move. Studies abound that  have shown that intermingling exercise and shorter study periods improve concentration and academic success. Boys and girls  should have treadmills and stationary bikes accessible especially in grade school.\", \"replies\": []}, {\"id\": 1045, \"aid\": 43, \"author\": \"Bethany Waldie\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"So glad this is being discussed. As someone who is about to have their first child (a boy) I am already thinking about what his experience will be in school and how to set him up for success. By and large the education system structure and framework is not set up for most boys to succeed. The expectation to sit quietly for hours and pay attention is unreasonable for majority of children, let alone boys. More activity is needed throughout the day. \\n Also, as others have said below - there’s the critical component of boys needing more male role models present in their lives through community (not via social media) to help guide and direct them.\", \"replies\": []}, {\"id\": 1170, \"aid\": 144, \"author\": \"Jack Russ\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"my child's school incorporates movement breaks during class, has gym class, and two recesses.  My kids still has some trouble, they are diagnosed ADHD, its obvious and it shows, but they get chairs that wobble, can stand if needed, and I burn the crap out of any energy left over (there's LOTS) in the evenings and on weekends by being outside constantly and in an organized sports activity minimum 4 days a week.  Part of the consistency and expectations need to start at home and more parents need to get their kids moving.\", \"replies\": []}, {\"id\": 1146, \"aid\": 130, \"author\": \"Chris Reeve\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Recess is too short. Here in School District 57, in Northern B.C. recess is only 10 minutes long. Children need physical play  so  they can focus in the classroom. Parents can help by exercising with their children more & reduce screen time.  Children need screening for learning disabilities at age four and again at age six, but that means school boards should have adequate staffing levels of psychologists, speech/language pathologists and Resource teachers to facilitate remedial tutoring.\", \"replies\": []}, {\"id\": 1137, \"aid\": 123, \"author\": \"cmk26\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I think that somehow the school day in primary school should start with vigorous activity. It would make it easier for boys to sit still for those lessons where it's needed because they would have expended some of that fidgeting energy. It probably would be good for girls too. \\nI home schooled both of my sons for some of their school career and I noticed how they would change positions frequently while doing assignments seated at the table, sometimes standing, sometimes kneeling on the chair. I have also noticed that vigorous activity all their lives (they are now adult) such as Karate and other routines improves their mood. My daughter, while she has a more practical approach to learning also shows mood improvement after playing games such as tennis.\", \"replies\": []}, {\"id\": 1135, \"aid\": 121, \"author\": \"Krissy Pearson\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I was an Educational Assistant for many years with HRCE. Unfortunately  the school system is not set up for traditional \\\"boys\\\"(or rambunctious girls). There is too much sitting still, quiet and not enough movement breaks/outdoor breaks. The teachers HAVE to push a curriculum that is way  too much( a level ahead of what it used to be).Not their fault.  I get and agree that there HAVE to be rules and regulation and boundaries but also get that most boys need physical movement and stimulation and hands on learning. To me there should be more focus on music/art/gym/outdoor skills and cooking like The Nordic countries. Reading, writing and Math are extremely important but they will learn those WHILE learning these other skills. The classes are too big and the boys seem to get \\\"lost\\\" especially if they find it hard to sit still or be quiet for \\\"long periods\\\".  Its a  no win situation for active, creative boys.\", \"replies\": []}, {\"id\": 1109, \"aid\": 102, \"author\": \"Jack Abbott\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"The education system will go on to fail them forever, and we see the results in our city streets, in the subway, generations of homeless men lost due to lack of role models, inspiration, purpose and leadership. All the decades of talk of giving them more gym time and hands-on learning overruled out by stakeholder discussions of \\\"boosting subject time allocation in core subjects\\\" and \\\"raising test scores\\\". How often do we ask what interests them? Our teachers are better trained than ever, surrounded by technology and online resources, and yet we cannot meet the most basic needs of boys: give them sports, outdoor adventures, constant movement, hands-on learning, an inspirational teacher with a sense of humor, a chance to explore the outside world and a curriculum that will help them manage all the challenges of life. We can endlessly say that these things are not practical or feasible for our schools, that they fall on parental responsibility, and that there are more important things to address. Talk is cheap. For once, say yes and give it to them.\", \"replies\": []}, {\"id\": 1103, \"aid\": 98, \"author\": \"Robin Brinos\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"We all agree there is a problem - we all know the answer - physical stimulation + discipline , more male teachers , nutrition programs - will politicians act or just commission more studies - analysis paralysis!\", \"replies\": []}, {\"id\": 1096, \"aid\": 92, \"author\": \"ski\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"My son completely thrived in an alternative elementary program rooted in Scandinavian education practices. Learning through play and outdoor classrooms gave him an incredible foundation. Unfortunately, that beautiful approach abruptly ended when he entered high school. Transitioning from active, nature-based learning to a traditional, desk-bound environment has been a massive hurdle for him.\", \"replies\": []}, {\"id\": 1092, \"aid\": 88, \"author\": \"Eric Gervais\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"In my honest opinion, there isn't enough physical education. I have 2 sons and they only have 1 clasee per week. It just isn't enough..\", \"replies\": []}, {\"id\": 1091, \"aid\": 87, \"author\": \"Ben R\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I feel that adopting more of the Danish and Nordic approach in Canada with less early academic pressure and obsession over grades, more free play and outdoor activity, greater independence, and more focus on social development, resilience, and well-being  could drastically improve the confidence, mental health, and overall development of many young boys.\", \"replies\": []}, {\"id\": 1090, \"aid\": 86, \"author\": \"canadaproud67\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"As a police widow with a late husband who had a very strong personality in childhood and as a father, helped me raise our two boys, I agree boys at younger ages especially may need more physical programs not sitting and listening. Classrooms can be hard for active youngsters. I also feel teachers and parents need more support for challenging boys based on accepting their vigour with age appropriate accountability the child is also empowered to meet. It can be hard to raiae an active boy without making the child “the bad kid”. My husband was a handful, but also crazy smart, caring but sometimes misunderstood. He was successful as an adult thanks to strong parenting, a mother who was very communicative with teachers, and he thrived with structure. Not so much without. These folks, male or female need understanding not frustration, acknowledgement not labelling.\", \"replies\": []}, {\"id\": 1088, \"aid\": 84, \"author\": \"Ralph Furley\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Canadian society and the Canadian education system has changed too much and has changed for the worse. Schools no longer have a school nurse. A lot of schools do not have enough counselors. Sports has been taken away from many Elementary School students as well as high school students. Children and young teenagers need to have exercise to drain the excess energy while learning sportsmanship, teamwork and improving all of their skills and abilities. The new \\\"woke\\\" method is turning our boys into feminine versions of themselves. \\n\\nI have been overseas to multiple countries and the education system is the same as Canada used to be in the past. Recess is filled with playtime and there are lunch intramurals for students who want to have fun during their break time playing sports and games. There are no more clubs for students to join and that is a huge problem not to mention that most students have both parents working and no one to drive them to and from soccer or baseball practice. Children used to play an organized sport for their school and a lot of the times the same sport for their community. Even the USA still has a very normal school system and curriculum but because Canada wants to be this new style of Education, the Educators need to accept the blame for this. For example at my son's Elementary School, they have banned playing soccer at recess and lunch because people have been getting injured but that is a normal passage of life. The feminization of boys in this country is going to lead to huge issues and problems. Let boys be boys and stop trying to make them what they are not. Boys climb trees, ride bikes, skateboard, do gymnastics, play team sports, and enjoy their childhood and if they are allowed to enjoy their childhood they will be normal boys who do their homework and try to do their best in school.\\n\\nMy son and daughter go to the same Elementary School. Sports day at the end of the year is ridiculous compared to what we all had growing up in Canada. They have taken away Mother's Day and Father's Day and the school only celebrates family day. They are not allowed to celebrate Halloween because it might offend someone and the Christmas concerts that we all grew up to are now gone.\\n\\nThis is my honest opinion and I should be allowed to voice my honest opinion without AI telling me that I'm going against Community guidelines because that is just complete and utter censorship and that is not what life should be about.\", \"replies\": []}, {\"id\": 1086, \"aid\": 82, \"author\": \"Heather Moffat\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys require more physical activity throughout the day. \\n\\nThey also need to understand their emotions, fear, sadness, happiness, not just anger.\", \"replies\": []}, {\"id\": 1073, \"aid\": 70, \"author\": \"jacrobs\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"More of a movement/play based structure for school to for a little longer would likely be beneficial for boys and wouldn’t harm girls. A proper Montessori style of classroom where you kids are encouraged to get up and move around regularly and have some more choice on when they learn things as long as they end up where they need to be after a three year cycle would help. Another option could be having it be standard for boys to start school a year later to better match boy and girl maturity levels. Boys who are ready “on time” could still start early, and girls who would benefit from waiting a year could, but the default would be boys do an extra year of kindergarten.\", \"replies\": []}, {\"id\": 1066, \"aid\": 64, \"author\": \"andrew23\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I have been working with boys and girls as a community coach for over 20 years all ages. Boys have been more active and driven in sports than girls. But when it come to the class room i have noticed boy's struggle with simple tasks, and get labeled with adhd or other items. I think these labels are just the need for the boys to move and release their disconnected thoughts. You can see this as early as pre school. Where if you give kids boys and girls more freedom of movement they can then focus after these energy releases. Lots of teachers note boys especially after recess and lunch are more prepared to learn and have structure.\\n\\nI do not agree with the statements made in the article. That it doesn't matter as white middle aged men still hold all the economic power. Where I work, the white middle ages men are the lower income workers. Women well out weigh the men in our office and are 50/50 split over all in our industry. Many of which are earning much more then men. This a great thing more diversified workforce. But i am not sure statistics have caught up with real life. \\n\\nWe do need to help young boys from preschool and kindergarten to give them the tools to move on to future roles, not just side line them for hard labor work, because they can't sit still.\", \"replies\": []}, {\"id\": 1065, \"aid\": 63, \"author\": \"Jammy Jorza\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"We have a daughter that falls on the autism spectrum and much like boys she has tons of energy, cannot sit still, is messy and would be considered disruptive. When a child’s nervous system cannot regulate it is difficult for them to focus. I do believe there needs to be more programs and schools that approach teaching in a different manner. Providing more time for physical activity breaking up classroom time helps.\", \"replies\": []}, {\"id\": 1061, \"aid\": 59, \"author\": \"Vania Ivonne Vargas\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I think that boys need to be boys when they are kids or teens. They need physical activity, good food and protein, also emotional support and depending on their interests they should be guided to do what they like as kids. Playing sports, going into Arts or music, theatre, etc. A good father figure is also necessary and not only the father who \\\"brings money to the house\\\" or the one who is on the phone all the time. Having a good Tutor or Coach helps them to psychologically open up. Because Social Media and \\\"smart Phones\\\" are also modeling expectations of people or families about what do the kids \\\"should be\\\" or \\\"do\\\" or \\\"eat\\\" or \\\"achieve\\\". This can get depressing for anyone who is exposed too soon to those \\\"general expectations\\\" from their society. Having everything immediately is also not positive for their development. Kids should feel that their efforts are getting them what they dream of. Solving everything for them creates more frustration for them, when they should be thinking how to solve problems and feel useful and loved and accepted.\", \"replies\": []}, {\"id\": 1047, \"aid\": 45, \"author\": \"Yoga du Village\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Scandinavian approach to learning: outdoor classrooms, using nature as a teaching tool, play in younger children as been shown to develop skills that lead to higher success as they grow.  Get the kids out of rows and stuck in desks.  Kids learn faster through play.\", \"replies\": []}, {\"id\": 1041, \"aid\": 39, \"author\": \"Mike Gravelle\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I think I'm a perfect example. In early 90'  I was a good boy in grade 8 to grade 10 with a failing grade and at times barely passing. There wasn't any extra help for me or an Avenue to go down, I would just sit there in class and continue to struggle. It probably led me more to not even make an effort since I knew I was struggling. Thinking back now, The best case scenario would have been to go home in the evening and hit the books but after sitting in a classroom all day, there would be none of that.\\nI had no ADHD or anything wrong with me whatsoever. Just a normal kid. \\nIn Grade 11 I started skipping Wednesdays and my grades move to a b+. None of my classes was even close to a failing grade for 11 and grade 12.\\nI replaced school with an adventure. Not get up late, linger around, play outside or (now days stay home play video games).\\nLooking back now, I didn't do this purposely but It was a structured adventure. \\nI had a plan the night before and I had to lie to my parents because taking a day off school to go play was unaccepected in society. My parents now would agree it was a good decision. I got busted in June of grade 12 when teachers ask my parents \\\" what did you guys do to help his grades? Where did he go every Wednesday?\\\" \\nThey had no clue. They came home after that school meeting and I was probably going to get drastically punished and yelled at with disappointment. But what saved me was the teacher saying my grades were good and they had no issues with me at school, I was a good quiet student.\\n\\nOn Wednesdays,\\nI got up at the same time and had to borrow my parents car to get me to school because of team practice after school so I needed to bring my equipment that wasn't allowed on the bus. \\nThat lying meant that I needed to have a plan to follow all day long. That meant that this was a structured adventure. You can say it's kind of like school, I had a plan all day long and there was structure in my day. That is important.\\n\\nYou can assume what you would do today on Wednesdays as there are many options. \\nJust as an example, September to December and April to June, I mostly rode my bike in the forest all day long, and going fishing, or hiking up some little trail. I tried to stay away from the downtown to not be seen by others (like family or Parents Friends).\\nWhen I got comfortable skipping, I went to the arena and took advantage of the scheduled skating the city had in place. There was a senior skate and there was also an Old-Timers hockey ice time. I took advantage of both and the old-timers didn't mind having me around. \\nI also went to the YMCA or the local gym. 8am to 5pm was along day so I needed to keep busy.\\nDecember to March was my favorite. I went straight to the ski hill and I stayed there until everyone was gone and the lodge was locked. \\nThe ski hill was mostly loaded with men working graveyard shifts or retired seniors. \\nGrade 12, I even volunteered ski patrolled. \\n\\nAs of today, it is Wednesday, and it is my scheduled off work day. All the staff know that I'm golfing on Wednesdays. Or I'm at the gym, or I'm going skiing or biking. \\nI own 3 businesses, have 40 staff, two kids and a couple pieces of real estate. I'm for an healthy.\\nI don't think I would have come out the way I am today if I would have been stuck in that classroom 5 days a week sitting on a chair in grade 11 and 12. I never would have signed up for college.\\n\\nI structure my job so I never sit on a chair more than 2 hours a day. This has got to be one of the major issues for young boys and girls. \\n\\nOkay, some of you right now will say that most kids would have simply got into drugs and caused more issues and learn bad things by hiding out in a downtown core. That is true but I was fortunate enough to have these memberships in community buildings. If it wasn't for these memberships that my parents paid for or had access through school programs, I may have found myself hiding out in the forest or trying to blend in in the downtown core away from being seen. \\nI had access to hockey skates, a bike, fishing rod and luckily a ski pass. \\nI'd be curious to look at those schools that utilizes the outdoors on a regular basis or head out on field trips often. How are those kids doing. I know those schools are everywhere and there are pilot projects out there today. \\nI can safely say that my kids classes head outside frequently, and my kids don't mind skipping school for a ski day or an adventure. And their grades are pretty good.\", \"replies\": []}, {\"id\": 1070, \"aid\": 65, \"author\": \"simon\", \"meta\": \"May 13 · reply to khkw\", \"stance\": \"\", \"text\": \"Sorry but that's rubbish. Boys need rules and discipline, yes, but they don't need spanking. You don't have to hit a dog to train it, so why on earth would you need to hit a boy to regulate and educate them?\\n\\nBoys need exercise. They need to express their energy. They need to compete. Both parents and educators need to create that environment rather than try to shoehorn them into feminine-focused systems. But boys can be encourage and their energies can be channelled without the need to resort to violence.\", \"replies\": []}]}, {\"id\": \"rolemodels\", \"label\": \"More male teachers and role models\", \"count\": 20, \"color\": \"rgb(90,30,245)\", \"px\": 193, \"py\": 364, \"d\": 124, \"allLabel\": \"14 responses · 6 replies\", \"posts\": [{\"id\": 1208, \"aid\": 167, \"author\": \"Ryan Carey\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a veteran, strength coach, and someone who has worked with men from middle school to elite military, I want to offer a perspective that is missing from this conversation.\\n\\nThe boy crisis does not start at school. It starts long before that. And it does not end at graduation. You can draw a straight line from the boy who cannot sit still in kindergarten to the veteran who cannot regulate his nervous system at forty. Same boy. Same unaddressed wound.\\n\\nWe did not just fail boys in the classroom. We removed their rites of passage. We medicated their wildness instead of directing it. We told them to suppress the very energy that, properly channelled, builds men of character and purpose.\\n\\nBoys do not need a different worksheet. They need men in their lives who model what a regulated, purposeful, grace filled man looks like. They need to move. They need challenge. They need to be told they are capable of hard things and then shown how to do them.\\n\\nThe mental health crisis in young men, the dropout rates, the disengagement, these are symptoms. The root is a generation of boys who were never shown what it looks like to become a man.\\n\\nWe can fix the curriculum. But until we address what is happening at home and in community, we are treating the symptom and ignoring the wound.\\n\\nRyan Carey\\nVeteran. Coach. Dad. Man.\", \"replies\": []}, {\"id\": 1164, \"aid\": 141, \"author\": \"David Pollock\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"I am a 61 year old man that has Masters in both Comparative Theology and Classical Philosophy.  I am also an advocate of gender segregated schooling in the early years of education.  Not complete segregation, some mixed classes are necessary for social training obviously but in a classroom setting, for certain subjects, segregation helps.  I am also someone that has Asperger's that went undiagnosed till during the COVID crisis.  The changes to my routines sent me into a spin.  Why I bring this into the conversation is because I was labeled a \\\"problem child\\\" in the 70's by the school system.  They discovered then, even though they did not know of my neurodivergence, that I responded better to male teachers.  I feel that this is a large part of the problem - we do not have enough male teachers in the school system.  How many children come from homes where the male role model is missing, intermittent, or simply has no time for them?  This has a HUGE impact on boys.  It did me.  A male mentor or teacher helps to fill the gap that this poses.  The school system should be actively trying to equalize the ratio of male to female teachers.\\n\\nAs for teen boys - they are not unaware, they just see no hope - all you have to do is ask them.  They have been witnessing their fathers and brothers and other males in their families struggle day after day to get jobs, start careers and families.  There is an extremely high rate of depression among male youth today.  Yet, no one seems to be talking about it.\", \"replies\": []}, {\"id\": 1217, \"aid\": 172, \"author\": \"Mellissa Breault\", \"meta\": \"May 12 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"I agree that boys need men in their lives. They need a father who models these things. I think another contributing factor is that parents have no time or energy to be these things for their kids because the struggle to put food on the table and a roof over their heads is all-consuming. I have no solution for this because the problem is so enormous and world-wide. But part of the solution is to recognize that what we are doing is not sustainable if we want things to improve.\", \"replies\": []}, {\"id\": 1153, \"aid\": 133, \"author\": \"Nancy Carle\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"Boys have few role models in preschool and elementary school.  The vast majority of teachers in these years are women, so recruitment of more men as teachers for these early years, especially in the arts, I think would be crucial.  This is not to disparage the fine work and leadership of women but simply to point out how academic and artistic pursuits may be perceived by young boys.\", \"replies\": []}, {\"id\": 1078, \"aid\": 74, \"author\": \"Evanthia K\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"I think there are many factors, here are some based on my observations as a mom of boys:\\n1) there is a lack of good male role models at home and schools, society in general \\n2) education system is failing boys\\n- most teachers in elementary schools are women and unless they’re mothers of boys they do not understand boys and are quick to punish them or immediately label the boys or request for them to be assessed for either learning disabilities or ADHD; female teachers in general do not know how to handle boys and scream a lot in class \\n- girls are encouraged to succeed academically more than boys \\n- the literary reading material and topics in the classroom has forced boys to lose interest and focus, there are no more male heroes in all the books they read and in most cases the male character is a villain … quite frankly some of the books the kids are forced to read in school today are disturbing \\n- the curriculum needs to include more sports or physical activities as well as non academic courses like whatever happened to home economics and woodworking classes or even offer basic life skill classes like learning to change tires where both boys and girls can learn or team up together to learn how to work together \\n3) one or both parents not being present at home to provide guidance and open lines of communication \\n4) online content has become almost impossible to police, control and restrict as a parent especially as the boys get older and become more tech savvy than the parents \\n5) the pandemic did not help boys; the isolation during the lockdown destroyed their social circles and not being to play sports during that time was not easy for active boys \\n\\nIn the high school level more male teachers are needed in the education system and if required invite more male professionals or entrepreneurs or tradesmen to talk to boys once a month to show them options of what is available outside of schools or provide mentorship to boys. \\n\\nSports or physical activities should become more accessible especially after school and on weekends. \\n\\nParents should be encouraged to learn how to be more aware of the online dangers or given workshops at kids’ schools on how to monitor their kids’ online activities.\", \"replies\": []}, {\"id\": 1045, \"aid\": 43, \"author\": \"Bethany Waldie\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"So glad this is being discussed. As someone who is about to have their first child (a boy) I am already thinking about what his experience will be in school and how to set him up for success. By and large the education system structure and framework is not set up for most boys to succeed. The expectation to sit quietly for hours and pay attention is unreasonable for majority of children, let alone boys. More activity is needed throughout the day. \\n Also, as others have said below - there’s the critical component of boys needing more male role models present in their lives through community (not via social media) to help guide and direct them.\", \"replies\": []}, {\"id\": 1206, \"aid\": 112, \"author\": \"Glenna Landry\", \"meta\": \"May 12 · reply to edgradstud\", \"stance\": \"\", \"text\": \"While I said that girls were just as eligible to pursue science, etc. in the fifties and sixties; for example, my chemistry teacher in the sixties was a female likely in her fifties, but there were more male teachers than there are now which speaks to your statement that school success is perceived as a feminine trait by students currently. I understand, now, what you meant by the patriarchal influence. The lack of opportunities for movement may not be the only explanation for boys' 'acting out' behaviours.\", \"replies\": []}, {\"id\": 1204, \"aid\": 158, \"author\": \"edgradstud\", \"meta\": \"May 13 · reply to Glenna Landry\", \"stance\": \"\", \"text\": \"I think the numbers of male teachers at the high school level aren’t as bad—probably because that’s seen as being more specialized and prestigious, and the students are farther away from early childhood, which is seen as the women’s domain.\", \"replies\": []}, {\"id\": 1165, \"aid\": 142, \"author\": \"Geoff Tomlinson\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"As a coach and educator with 35 years of experience working with adolescents I could not agree more.\\nIf I have learned anything it are these 2 observations:\\n#1:  the 10% rule =. I speak for 10% of the time when Im with my students and athletes.  the rest of the time they perform.  The young move, they socialize, they perform\\n#2:  this is a controversial opinion - the hiring of early year educators (pre-school and elementary) is very weighted towards females.  Many of whom prize compliance and order.  Like hires like.  More males in the early years = more movement and physicality, which all students prize\", \"replies\": []}, {\"id\": 1134, \"aid\": 120, \"author\": \"Roger Curtis\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"This is old news. Sadly, really old.  There was a time when it was girls who were the least likely to graduate; hence, the introduction of the novel study, night school, commercial subjects and more.  Can we do the same for boys?  Sure we can.  Let's make certain content fits, offer a boys-only option and ensure that the teachers they encounter represents as many males as possible.. \\n\\nAs for giving up, parents must govern themselves accordingly.  After all, failure is not an option.\", \"replies\": []}, {\"id\": 1102, \"aid\": 97, \"author\": \"Skylar Petrah\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Boys need true role models from their early age. Way before school begins. It is very heard to expect a teacher to raise one’s child when at home things are not going well and the child has no moral grounds that will shape him as he grows up. \\n\\nWhat is the kid watching at home, are parents finding time to communicate or is daycare and Nannies doing the job? \\nIs the gaming and social media being regulated from early age? Because it’s going to be hard as they turn into their teenage with no foundational knowledge that shapes them into responsible kids both at school and in the adult phase. \\n\\nYou can see this with even mature men who one can easily tell that their childhood was not well and yes, mental health will be at a play.\\n\\nIt’s really hard but it does take a village to raise a child and teachers won’t do it alone if at home parents aren’t starting early to prepare their children for the world both at school and home.\\n\\nJust my thoughts.\", \"replies\": []}, {\"id\": 1101, \"aid\": 95, \"author\": \"Kelly Cooper\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"We need social and emotional intelligence in the schools.\\n\\nWe need men / fathers who role model these skills.\\n\\nWe need to help families with understanding that different roles between men and women is ok - with home and work responsibilities. ie. Evolve from the traditional roles to show it’s acceptable to have women bringing home the bacon and men doing the home front without judgment.\", \"replies\": []}, {\"id\": 1100, \"aid\": 96, \"author\": \"tomf\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Part of the issue is the high degree of females in the early years schools. Male teachers think and act differently than female teachers; not with regards to pedagogy, but thinking about interactions, acknowledging the need for much more physical play, “dad jokes”, bringing in stories activities that appeal to boys. Having watched many female educators restrict certain types of outdoor play for the boys, this bubble wrapping seem to stifle outdoor creativity and their need for active play. I often observed stories and activities that interested the girls, but not necessarily the boys. The movement to engage and encourage girls has been very successful, but it may have been detrimental to the needs of the boys.\", \"replies\": []}, {\"id\": 1095, \"aid\": 91, \"author\": \"jacques59\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"The impossible solution would be by establishing a 50/50 ratio between men and women as school teachers and not 98% women a 2% men as it is everywhere in primary schools.  Boys would find there place naturally.  I've been a suppleant teatcher for 7 years.  Taught thousands of children, grade 1 to 12.  Believe me.\", \"replies\": []}, {\"id\": 1077, \"aid\": 73, \"author\": \"christian\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"Ontario should respond with practical reforms. First, the province should recruit, hire, and retain more Black, Indigenous, and racialized male teachers, principals, guidance counsellors, graduation coaches, and child and youth workers. Students should see people who look like them in positions of intellectual authority and care. \\n\\nSecond, Ontario should decolonize and diversify the curriculum so that Black and Indigenous students are not only discussed through trauma, slavery, residential schools, or deficit narratives. Their histories, philosophies, leaders, legal traditions, scientists, artists, entrepreneurs, and communities should be part of the regular curriculum.\\n\\nThird, literacy should be treated as an equity issue. Boys who struggle with reading and writing need early intervention, culturally relevant books, structured literacy support, and smaller group instruction before they become disengaged. \\n\\nFourth, Ontario should reduce exclusionary discipline. Suspensions often remove students from learning and deepen the very behaviour and academic problems they are supposed to solve. Restorative practices, mental health supports, family engagement, and culturally appropriate intervention should be used before students are pushed out.\\n\\nFifth, high schools should start later. Teenagers need sleep, and later start times can improve attendance, attention, mental health, and learning. Sixth, schools should consider shorter periods, more breaks, and more active learning through projects, co-op, trades, arts, entrepreneurship, outdoor education, debate, and community-based learning. This is not about lowering standards. It is about creating more ways for students to enter academic success.\", \"replies\": []}, {\"id\": 1055, \"aid\": 53, \"author\": \"Steve TThompson\", \"meta\": \"May 13\", \"stance\": \"\", \"text\": \"When the ideal for boys in the media is presented as sports idols like Sidney Crosby or Tiger Woods or music stars or any of those popular entertainers, why would they want to achieve at school cuz those aren't relevant to those roles that have become what the media presents as ideal careers in science trades or economics are never presented as the ideal role for young men, especially boys. Why would they bother to you succeed academically when it's been shown that the academics aren't the ones that gain the popularity and that seems to be the new role\", \"replies\": []}, {\"id\": 1012, \"aid\": 11, \"author\": \"monroe2020\", \"meta\": \"May 15\", \"stance\": \"\", \"text\": \"I have a 5 year old son who has ADHD, and so far he likes going to school. But he needs to be more active. And I really feel there should be more male kindergarten teachers. There would be a big improvement in these boys lives if they had one. \\n\\nI did ask the Principal at my son’s school about hiring male kindergarten teachers, he gave me some answer about looking into it. I don’t believe there are many out there who want to teach young children, but they should be paid more as an incentive or something.\", \"replies\": []}, {\"id\": 1186, \"aid\": 155, \"author\": \"frostie1\", \"meta\": \"May 12 · reply to Jennifer Johnson\", \"stance\": \"\", \"text\": \"There are a whole myriad of factors that can influence behaviours. The biggest in my mind is having mentors to guide you through the decision points in your life. One has to learn that being responsible and accountable for your decisions and actions are extremely important.\", \"replies\": []}, {\"id\": 1210, \"aid\": 168, \"author\": \"brennan Fitzgerald\", \"meta\": \"May 13 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"Ryan, I resonate so strongly with what you're saying. As a new father, I often think about what it means to be that model for my children, to the best of my ability. \\nDo you have any favourite resources (books, authorities, role models, etc...) for men and fathers that speak more to this idea you're sharing?\\nI find myself searching for communities of like minded men who hold these values and are on the common mission of instilling them in our children, while simultaneously seeking to be better men, fathers, and community members.\", \"replies\": []}, {\"id\": 1209, \"aid\": 4, \"author\": \"William Anderson\", \"meta\": \"May 21 · reply to Ryan Carey\", \"stance\": \"\", \"text\": \"This is a fantastic reply by you. I am a teacher (middle school) and have a son that is 22 months old. Everything you have said is true and whenever I relflect on being a male role model, I think of exactly what you wrote: men need to be role models and show regulation and show humility and other tools for these young boys to learn from. The drastic difference in my teacher/student relationship with my students vs the female staff is very noticeable. The boys love me, my class and I understand their needs a lot more, even if they are moms of boys, they don't understand because they weren't an active boy. My son is and will always be wild - He will never be put into a category as a problem - even at his day-care they tried - imagine my response as an educator but as a fully present father and role model for my son who at the time was 20 months old - all these people tried to say he was a problem and then after they heard from me, imagine how many times I have heard from them since? ZERO - why? I rejected their therapy and resources from the region etc... I continued to take him outside evryday, even during the winter - exposed him to experiences, people and nature. He doesn't ever want to go inside (I also do no screens) and he lives the life I lived in the 90s. Ryanb, I love what you are saying, I support you and all men that are aligned in helpeing these young boys become men, the right way - even if it is hard for us in the moment!\", \"replies\": []}]}, {\"id\": \"handson\", \"label\": \"Hands-on learning, shop and the trades\", \"count\": 19, \"color\": \"rgb(140,96,30)\", \"px\": 205, \"py\": 127, \"d\": 123, \"allLabel\": \"14 responses · 5 replies\", \"posts\": [{\"id\": 1118, \"aid\": 111, \"author\": \"Mark Goldberg\", \"meta\": \"May 12\", \"stance\": \"\", \"text\": \"the article alluded to a key issue in learning, at any age: passive versus active. the former is what is prevalent at all levels (i teach in university and it applies there equally, namely the reliance on lectures and large classes) and what many people need, especially boys, is an active environment for learning. unfortunately the educators favour the former and this is what is taught, i believe, in educational curricula. women often do much better in a passive environment and given that they make up the majority of the teaching workforce the tendency will be to enforce that model and not likely appreciate that not everyone learns that way.  much \\\"hyperactivity\\\" is a result of this model being imposed on children. richard feynman, one of the most brilliant physicists who has ever lived, understood that clearly and indeed he wrote about that in some of his essays on learning.  it was not \\\"understanding\\\" quantum mechanics that led\\nhim to discove a new method to approach quantum electrody
