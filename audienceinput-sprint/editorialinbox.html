<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>PSI Editorial Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left nav + sticky top bar; inbox = summary row, then list (left) + action panel (right), like the PSI moderation screen */
:root{
  --bg:#f5f6f5; --surface:#ffffff; --surface-2:#f1f2f1; --sel:#f0f6f3;
  --border:#e3e5e3; --border-strong:#cfd3d0;
  --fg:#151816; --fg-2:#5b625e; --fg-3:#8b928e;
  --accent:#1d6b57; --accent-soft:#e2f2ec; --accent-mid:#93cfb9; --accent-fg:#175a49;
  --ink:#111312; --ink-fg:#ffffff;
  --warn-soft:#fdebd5; --warn-fg:#92490c;
  --info-soft:#e8edfb; --info-fg:#33489a;
  --sme-soft:#f4e7f7; --sme-fg:#7a3593;
  --alert:#d8432a;
  --c1:#1d6b57; --c2:#4a63c9; --c3:#c27a12; --c4:#9a4fb0;
  --scrim:rgba(12,16,14,.42);
  --shadow:0 12px 32px rgba(15,22,19,.12);
  --font:"IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111312; --surface:#191c1a; --surface-2:#222624; --sel:#1c2a24;
  --border:#2b302d; --border-strong:#3b423e;
  --fg:#edf0ee; --fg-2:#a8b0ab; --fg-3:#7a827d;
  --accent:#5cc29f; --accent-soft:#183a30; --accent-mid:#2f7d65; --accent-fg:#8fe0c3;
  --ink:#edf0ee; --ink-fg:#111312;
  --warn-soft:#3b2814; --warn-fg:#f1b77b;
  --info-soft:#1f2642; --info-fg:#aebcf2;
  --sme-soft:#35223d; --sme-fg:#dcb0ec;
  --alert:#ff7a61;
  --c1:#5cc29f; --c2:#8ea2f0; --c3:#e6a64a; --c4:#cf8fe2;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#191c1a; --surface-2:#222624; --sel:#1c2a24;
  --border:#2b302d; --border-strong:#3b423e;
  --fg:#edf0ee; --fg-2:#a8b0ab; --fg-3:#7a827d;
  --accent:#5cc29f; --accent-soft:#183a30; --accent-mid:#2f7d65; --accent-fg:#8fe0c3;
  --ink:#edf0ee; --ink-fg:#111312;
  --warn-soft:#3b2814; --warn-fg:#f1b77b;
  --info-soft:#1f2642; --info-fg:#aebcf2;
  --sme-soft:#35223d; --sme-fg:#dcb0ec;
  --alert:#ff7a61;
  --c1:#5cc29f; --c2:#8ea2f0; --c3:#e6a64a; --c4:#cf8fe2;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.tab-nums{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 18px 22px}
.brand{font-weight:600;font-size:16px;padding:0 14px 30px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:15px;color:var(--fg);text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--surface-2);font-weight:500}
.nav-badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--surface);font-size:12px;font-weight:600;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.reset{font-size:12.5px;color:var(--fg-3);text-align:left;text-decoration:underline;text-underline-offset:3px}
.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.crumb{color:var(--fg-2);font-size:15px}
.top-r{display:flex;align-items:center;gap:14px;position:relative}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;position:relative;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--alert);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.me .av{width:34px;height:34px}
main{padding:36px 40px 56px;max-width:1480px;width:100%}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;line-height:1.35;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.green{background:var(--accent-soft);color:var(--accent-fg)}
.pill.warn{background:var(--warn-soft);color:var(--warn-fg)}
.pill.info{background:var(--info-soft);color:var(--info-fg)}
.pill.sme{background:var(--sme-soft);color:var(--sme-fg)}
.pill.role{font-weight:600;letter-spacing:.02em}
.pill.outline{background:transparent;border:1px solid var(--border-strong);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.block{width:100%}
.link{color:var(--accent-fg);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--avb);color:var(--avf)}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:500;font-size:13.5px}
.input,.ta,.select{width:100%;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--fg)}
.ta{min-height:150px;resize:vertical;line-height:1.5}
.ta.short{min-height:70px}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}

/* Page head */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head h1{font-size:30px;letter-spacing:-.01em}
.head p{margin-top:6px;color:var(--fg-2);font-size:15.5px}
.head-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:9px 20px;font-weight:500}

/* Inbox top row */
.inbox-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
.brief{padding:22px 24px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:18px;display:flex;align-items:center;gap:8px}
.brief-text{margin-top:10px;color:var(--fg-2);font-size:14.5px;max-width:68ch}
.brief-text b{color:var(--fg);font-weight:500}
.clusters{margin-top:14px;display:flex;flex-direction:column}
.cluster{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.cluster-t{font-weight:500;font-size:15px}
.cluster-s{font-size:13px;color:var(--fg-2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.watch{padding:22px 24px}
.watch-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--border)}
.watch-row:first-of-type{border-top:0}
.watch-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2)}
.watch-ic.hot{background:var(--warn-soft);color:var(--warn-fg)}
.watch-ic.idea{background:var(--accent-soft);color:var(--accent-fg)}
.watch-k{font-size:12px;color:var(--fg-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.watch-t{font-weight:500;margin-top:1px}
.watch-s{font-size:13px;color:var(--fg-2)}
.watch-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start;margin-top:20px}
.list{overflow:hidden}
.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:16px 8px 14px;border-bottom:2px solid transparent;color:var(--fg-2);font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-color:var(--fg)}
.tab .n{font-size:12px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);font-variant-numeric:tabular-nums}
.tab.on .n{background:var(--ink);color:var(--ink-fg)}
.filters{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--border-strong);border-radius:999px;font-size:13px;font-weight:500;background:var(--surface)}
.chip:hover{background:var(--surface-2)}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .n{color:var(--fg-3);font-variant-numeric:tabular-nums}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.sort .select{width:auto;padding:6px 32px 6px 12px;border-radius:999px;font-size:13px}
.bulk{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--sel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.bulk b{font-weight:500;margin-right:auto}
.q{display:grid;grid-template-columns:18px 32px minmax(0,1fr);gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;width:100%;background:var(--surface)}
.q:last-child{border-bottom:0}
.q:hover{background:var(--surface-2)}
.q.sel{background:var(--sel)}
.q input{margin:8px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.q-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);flex-wrap:wrap}
.q-top b{color:var(--fg);font-weight:500}
.q-text{margin-top:4px;font-size:15px;line-height:1.45;color:var(--fg)}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.asking{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--fg-2);margin-right:4px;font-variant-numeric:tabular-nums}
.list-empty{padding:56px 24px;text-align:center;color:var(--fg-2)}
.list-empty .big{font-size:17px;color:var(--fg);font-weight:500;margin-bottom:4px}
.kbd{font-size:12px;color:var(--fg-3);padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg-2);background:var(--surface)}

/* Panel */
.panel{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.p-head .t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);min-width:0}
.p-head .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-sec{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:14px}
.p-sec:last-child{border-bottom:0}
.p-title{font-size:20px;font-weight:500}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:500;font-size:15px;display:block}
.who small{color:var(--fg-2);font-size:12.5px}
.q-big{font-size:17px;line-height:1.5}
.from{font-size:13px;color:var(--fg-2);display:flex;gap:6px;align-items:baseline}
.from b{color:var(--fg);font-weight:500}
.hint{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--fg-2)}
.hint b{color:var(--fg);font-weight:500}
.hint .ic{color:var(--accent);margin-top:1px}
.similar{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.similar-row{font-size:13.5px;color:var(--fg-2);display:flex;gap:8px}
.similar-row b{color:var(--fg);font-weight:500;flex:none}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--border-strong);border-radius:12px;font-size:13px;font-weight:500;text-align:center}
.act:hover{background:var(--surface-2)}
.act.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.menu{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.menu button{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);text-align:left}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--surface-2)}
.menu small{color:var(--fg-3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.note{font-size:12.5px;color:var(--fg-3)}
.people{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.person{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.person:last-child{border-bottom:0}
.person:hover{background:var(--surface-2)}
.person.on{background:var(--sel)}
.person b{font-weight:500;display:block}
.person small{color:var(--fg-2);font-size:12.5px}
.grp-label{font-size:12px;color:var(--fg-3);font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px 6px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.check-row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer}
.check-row:last-child{border-bottom:0}
.check-row input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px}
.check-row small{display:block;color:var(--fg-3);font-size:12px;margin-top:2px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--border)}
.step:last-child::before{display:none}
.step .b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--surface)}
.step.wait .b{background:var(--surface);border:2px solid var(--border-strong);color:var(--fg-3)}
.step b{font-weight:500;display:block}
.step small{color:var(--fg-2);font-size:12.5px}
.email{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.email-h{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 10px;padding:12px 14px;background:var(--surface-2);font-size:13px;border-bottom:1px solid var(--border)}
.email-h span:nth-child(odd){color:var(--fg-3)}
.email-h .input{padding:6px 8px;font-size:13px}
.email .ta{border:0;border-radius:0;min-height:260px}
.posted{border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.posted .by{display:flex;align-items:center;gap:8px;font-size:13px}
.posted .by b{font-weight:500}
.posted p{font-size:14px;white-space:pre-wrap}
.quote-card{border-radius:12px;background:var(--accent-soft);padding:16px;display:flex;flex-direction:column;gap:10px}
.quote-card .lab{font-size:12px;font-weight:600;color:var(--accent-fg);letter-spacing:.05em;text-transform:uppercase}
.quote-card .intro{font-size:14px;color:var(--fg)}
.quote-card blockquote{margin:0;padding-left:14px;border-left:3px solid var(--accent);font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.quote-card cite{font-style:normal;font-size:13px;color:var(--fg-2)}
.empty-p{padding:64px 32px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-p .ic{color:var(--fg-3)}
.empty-p b{color:var(--fg);font-weight:500;font-size:16px}
.only-narrow{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filters{flex-wrap:nowrap;align-items:flex-start}
.filters>.row{flex:1;min-width:0}
.filters>.sort{flex:none}
@media (max-width:640px){.filters{flex-wrap:wrap}}
.fsel{width:auto;padding:7px 34px 7px 14px;border-radius:999px;font-size:13.5px;font-weight:500}
.ov-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.ov-grid.after{margin-top:20px}
.spaces3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.stat{border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.stat:hover{background:var(--surface-2);border-color:var(--border-strong)}
.stat b{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12.5px;color:var(--fg-2)}
.stat.lead b{color:var(--accent-fg)}
@media (max-width:900px){.ov-row,.spaces3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Popover, modal, toast */
.pop{position:absolute;top:48px;right:150px;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}

  };

  let body='';
  switch(S.mode){
    case 'reply':body=qBlock(q,true)+composer('Reply','Your reply is published in the conversation and is visible to all readers.','Post reply','post-reply',true);break;

let tT;
function toast(msg,undo){S.toast={msg,undo};clearTimeout(tT);tT=setTimeout(()=>{S.toast=null;renderLayer()},6000);}

/* ---------- Actions ---------- */
function advanceFrom(id,ids){ // pick next item after acting on id
  const i=ids.indexOf(id),now=visible().map(q=>q.id);
  const next=ids.slice(i+1).find(x=>now.includes(x))||ids.slice(0,i).reverse().find(x=>now.includes(x));
  setSel(wide()?(next||null):null);
}
function resolve(q,res){const ids=visible().map(x=>x.id);q.status='done';q.res=res;q.done=++S.counter;S.checked=S.checked.filter(x=>x!==q.id);advanceFrom(q.id,ids)}
const byName=()=>S.replyAs==='team'?'PSI Editorial team':'Amelia Eqbal';
function selectFirst(){const v=visible();setSel(wide()&&v[0]?v[0].id:null)}
function toInbox(){S.view='inbox';if(location.hash!=='#inbox')history.replaceState(null,'','#inbox')}

const A={
  nav(d){S.view=d.v;S.notifOpen=false;if(d.v==='inbox')selectFirst();location.hash=d.v},
  tab(d){S.tab=d.t;S.checked=[];selectFirst()},
  'go-inbox'(d){toInbox();S.tab=d.t||'todo';S.conv='all';S.effort=d.e||null;S.checked=[];window.scrollTo(0,0);selectFirst()},

  check(d){S.checked=S.checked.includes(d.id)?S.checked.filter(x=>x!==d.id):[...S.checked,d.id]},
  'bulk-clear'(){S.checked=[]},
  'bulk-snooze'(){const u=snap(),n=S.checked.length;S.checked.forEach(id=>{const q=getQ(id);q.status='snoozed';q.snooze='Tomorrow, 9:00 am'});S.checked=[];selectFirst();toast(`${n} reminder${n>1?'s':''} set for tomorrow, 9:00 am`,u)},
  'group-sel'(){S.groupIds=[...S.checked];S.groupCluster=null;S.sel=S.groupIds[0];S.mode='group';S.draft=''},
  group(d){toInbox();window.scrollTo(0,0);S.checked=[];S.groupCluster=d.k;S.groupIds=clusterOpen(d.k).map(q=>q.id);S.sel=S.groupIds[0];S.mode='group';S.draft='';

  'group-toggle'(d){S.groupIds=S.groupIds.includes(d.id)?S.groupIds.filter(x=>x!==d.id):[...S.groupIds,d.id]},
  'ai-draft-group'(){const k=S.groupCluster||getQ(S.groupIds[0])?.cluster;S.draft=k?CLUSTERS[k].draft:"Thanks to everyone who asked about this. "+S.groupIds.map(id=>getQ(id).gist).join(' ')},
  'post-group'(){

    S.checked=S.checked.filter(x=>!S.groupIds.includes(x));const last=S.groupIds[0];S.groupIds=[];S.groupCluster=null;advanceFrom(last,ids);
    toast(`One answer posted to ${n} question${n>1?'s':''}`,u)},
  mode(d){S.mode=d.m;S.snoozeOpen=false;

  'post-ack'(){if(!S.draft.trim())return toast('Write a message before posting.');const u=snap(),q=getQ(S.sel);resolve(q,{type:'ack',by:byName(),at:'Just now',text:S.draft});toast(`Acknowledged ${first(q.author)}’s question`,u)},

    if(n.go.sel)setSel(n.go.sel);else selectFirst()},
  digest(){S.notifOpen=false;S.modal='digest'},
  'digest-open'(){S.modal=null;S.view='inbox';location.hash='inbox';S.tab='todo';S.conv='all';selectFirst()},
  'modal-x'(d,e){if(e&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return false;S.modal=null},
  'watch-review'(){toInbox();window.scrollTo(0,0);S.tab='todo';S.conv='tariffs';S.effort=null;selectFirst()},
  'watch-promote'(){S.watch.smartphone='promoted';toast('Added to the homepage promotion queue')},
  'watch-close'(){S.modal='close-conv'},
  'close-conv-yes'(){S.modal=null;S.watch.smartphone='closed';toast('Conversation closed')},
  'watch-undo'(){S.watch.smartphone='open'},
  'watch-idea'(){const u=snap();S.watch['climate-quiet']='saved';toast('Added to Journalist assignment ideas on the Overview',u)},
  undo(){const u=S.toast&&S.toast.undo;if(!u)return;Object.assign(S,JSON.parse(JSON.stringify(u)));S.toast=null;clearTimeout(tT);S.mode='view';
    if(S.sel&&!visible().some(q=>q.id===S.sel))selectFirst()},
  'toast-x'(){S.toast=null},
  reset(){try{localStorage.removeItem(KEY)}catch(e){}Object.assign(S,seed(),{tab:'todo',conv:'all',effort:null,checked:[],mode:'view',toast:null,modal:null});S.view='inbox';selectFirst()}
};
function copy(text,fallbackId,msg){
  const done=()=>{toast(msg);renderLayer()};
  const fb=()=>{const el=document.getElementById(fallbackId);if(el){el.focus();el.select()}toast('Text selected. Press Ctrl/Cmd + C to copy.');renderLayer()};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
  return false;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(S.notifOpen&&!e.target.closest('.pop')&&!(t&&t.dataset.a==='notif')){S.notifOpen=false;if(!t){render();return}}
  if(!t)return;
  if(t.tagName==='A')return;
  const fn=A[t.dataset.a];if(!fn)return;
  if(t.type==='checkbox')e.stopPropagation();
  const r=fn(t.dataset,e);
  if(r===false)return;
  save();render();
  if(t.dataset.a==='mode'&&['reply'].includes(t.dataset.m)){const d=document.getElementById('draft');d&&d.focus()}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.b;if(!k)return;
  if(k.startsWith('np.'))S.np[k.slice(3)]=e.target.value;else S[k]=e.target.value;
  if(k==='search'){const el=document.getElementById('people');if(el)el.innerHTML=peopleList(getQ(S.sel))}
  if(e.target.dataset.live){const el=document.getElementById('qprev');if(el)el.innerHTML=quoteCard(S.quoteIntro,S.quoteText,S.quoteAttr)}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.b;
  if(k==='sort'){S.sort=e.target.value;render()}
  else if(k==='conv'){S.conv=e.target.value;S.checked=[];selectFirst();render()}
  else if(k==='effort'){S.effort=e.target.value||null;S.checked=[];selectFirst();render()}
  else if(k==='replyAs'){S.replyAs=e.target.value}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal){S.modal=null}else if(S.notifOpen){S.notifOpen=false}else if(S.mode!=='view'){S.mode='view'}else if(!wide()){S.sel=null}else return;render();return}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey||S.view!=='inbox'||S.modal)return;
  const v=visible().map(q=>q.id),i=v.indexOf(S.sel);
  if(e.key==='Enter'&&e.target.classList.contains('q')){A.select({id:e.target.dataset.id});render();return}
  if(e.key==='j'||e.key==='k'){if(!v.length)return;S.sel=v[e.key==='j'?Math.min(i+1,v.length-1):Math.max(i-1,0)];S.mode='view';S.snoozeOpen=false;render();
    document.querySelector('.q.sel')?.scrollIntoView({block:'nearest'});e.preventDefault()}
  const q=getQ(S.sel);
  if(e.key==='r'&&q&&q.status==='open'){if(S.mode!=='view'){S.mode='view';S.draft=suggest(q);render()}document.getElementById('draft')?.focus();e.preventDefault()}
  if(e.key==='l'&&q&&q.status==='open'){S.snoozeOpen=true;S.mode='view';render()}
});
let wasWide=wide();
addEventListener('resize',()=>{const w=wide();if(w!==wasWide){wasWide=w;if(w&&!S.sel)selectFirst();render()}});
function fromHash(){const h=location.hash.slice(1);if(['overview','inbox','spaces','stories','staff'].includes(h))S.view=h}
addEventListener('hashchange',()=>{fromHash();render()});

load();fromHash();selectFirst();render();
</script>
