<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Answered questions prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#e3e3e3;--hero:#fff3ec;--chip:#f1f1f1;--red:#e2231a;--beta:#4b3bff;--card:#fafafa;--hl:#eeebff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161616;--fg:#f2f2f2;--mut:#aaa;--line:#333;--hero:#2a211c;--chip:#2a2a2a;--card:#202020;--hl:#26214d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:430px;margin:0 auto;min-height:100vh;border-inline:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.beta{background:var(--beta);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-right:10px}
.me{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.mav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7a6bff,#4b3bff);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:none;border:0;font-size:22px;padding:0}
.hero{background:var(--hero);padding:22px 18px}
.hero h1{font-size:21px;line-height:1.25;margin:0 0 18px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px}
.tab{background:none;border:0;padding:14px 4px;margin-right:22px;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
.tab.on{color:var(--fg);border-color:var(--fg)}
.dot{background:var(--beta);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.sec{padding:18px}
.post{border-bottom:1px solid var(--line);padding:16px 0}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.ph{width:36px;height:36px;border-radius:50%;background:#8a5a1c;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.small{font-size:13px;color:var(--mut);font-weight:400}
.chip{display:inline-block;background:var(--chip);border-radius:99px;font-size:13px;padding:3px 12px;margin:10px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.q.hl{background:var(--hl);border-color:var(--beta);border-width:2px}
.q h3{margin:0 0 8px;font-size:17px;line-height:1.3}
.ans{margin:12px 0}
.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
.pcount{background:var(--chip);border:0;border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.back{background:none;border:0;color:var(--fg);padding:0;margin-bottom:12px;font-weight:600}
.cta{background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:12px 18px;font-weight:600;width:100%}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card);width:100%;text-align:left}
.qr{width:96px;height:96px;background:repeating-conic-gradient(var(--fg) 0 25%,var(--bg) 0 50%) 0 0/16px 16px;border:6px solid var(--bg);outline:1px solid var(--line)}
.note{font-size:12px;color:var(--mut);text-align:center;padding:10px 18px 24px}
.mock{background:#243447;color:#fff;border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:flex-end;min-height:150px;margin-bottom:12px}
</style></head><body><div class="app" id="app"></div>
<script>
const Q=[
{id:1,n:61,q:"How exposed is Canada’s economy to a new round of U.S. tariffs?",a:"Some, yes — but unevenly. Tariffs on imported inputs like packaging, machinery parts and specialty ingredients pass through to shelf prices within a few months. Bulk staples grown domestically, like grain and dairy, are largely insulated.",
 posts:[["Marcus T.","Apr 9","Will grocery prices really go up, or is that overstated?"],["Priya S.","Apr 10","Which products would be hit first at the store?"],["Dana L.","Apr 11","Are dairy and grain prices safe?"]]},
{id:2,n:29,q:"Could new trade deals with Europe or Asia replace lost U.S. trade?",a:"Not quickly, and not fully. CETA and CPTPP have opened real doors, but building new supply chains and distributor relationships takes years, not months. They matter more as insurance for the next decade than as a fix for this year’s tariff bill.",
 posts:[["Jordan K.","Apr 9","Can we just sell more to Europe instead?"],["You","Apr 10","Do CETA and CPTPP actually make up for the U.S. market?"],["Sam R.","Apr 12","How long would new trade routes take to build?"]]},
{id:3,n:14,q:"Will tariffs affect my job if I work in manufacturing?",a:"It depends on whether your employer exports to the U.S. or relies on imported parts. Auto, steel and aluminum workers face the most near-term risk; federal support programs are being expanded for affected sectors.",
 posts:[["Chris M.","Apr 10","I work at a parts plant. Should I be worried?"],["Lee W.","Apr 13","What support exists for laid-off workers?"]]}];
const app=document.getElementById('app');
let s={screen:'launch',tab:'all',open:null,hl:false};
const go=o=>{Object.assign(s,o);render();scrollTo(0,0)};
const ex=(c,t)=>`<div class="${c}">${t}</div>`;
function hdr(){return `<div class="top"><button class="ibtn" onclick="go({screen:'launch'})" aria-label="Close">✕</button><div style="display:flex;align-items:center"><span class="beta">BETA</span><span class="me"><span class="mav">MW</span>Meghan W.</span></div></div>`}
function hero(){return `<div class="hero"><h1>How exposed is Canada’s economy to a new round of U.S. tariffs?</h1><div class="meta"><span>👥 204 participants</span><span><span class="av">CBC</span></span></div></div>`}
function launch(){return `<div class="sec"><h2 style="margin-top:8px">Prototype: answered questions</h2>
<p class="small">“I want to see that my question was answered, so I feel heard.” Pick an entry point from the user flow.</p>
<button class="card" onclick="go({screen:'story'})"><b>📰 Reading a story</b><div class="small">Tap the conversation teaser inside an article</div></button>
<button class="card" onclick="go({screen:'video'})"><b>📺 Watching a news story</b><div class="small">Scan the on-screen QR code</div></button>
<button class="card" onclick="go({screen:'email'})"><b>✉️ Email notification</b><div class="small">A reply to your post → “See reply”</div></button></div>`}
function story(){return `${hdr()}<div class="sec"><div class="small">CBC NEWS · BUSINESS</div><h2 style="margin:4px 0 10px">What a new round of U.S. tariffs could mean for your grocery bill</h2><p class="small">Economists say the impact will be uneven across the country…</p>
<button class="card" onclick="go({screen:'space',tab:'all',hl:false})" style="margin-top:20px"><b>💬 Join the conversation</b><div class="small">204 participants · 3 questions answered by an expert</div></button></div>`}
function video(){return `<div class="sec"><div class="mock"><div><b>Tariffs: what’s next?</b><div class="small" style="color:#ccc">Join the conversation</div></div><div class="qr"></div></div>
<button class="cta" onclick="go({screen:'space',tab:'all',hl:false})">Scan QR code</button></div>`}
function email(){return `<div class="sec"><div class="small">From CBC Conversations · Today</div><h3 style="margin:4px 0 12px">An expert replied to your question</h3>
<p>Your question “Do CETA and CPTPP actually make up for the U.S. market?” was answered by Dr. Aisha Bergeron.</p>
<button class="cta" onclick="go({screen:'space',tab:'answered',hl:true})">See reply</button></div>`}
function answered(){return `<div class="sec">${s.hl?ex('small','Your question was answered ✓'):ex('small','Ranked by most asked')}<div style="height:10px"></div>`+
[...Q].sort((a,b)=>b.n-a.n).map(x=>{const mine=s.hl&&x.id==2;return `<div class="q ${mine?'hl':''}">${mine?'<div class="badge" style="margin-bottom:8px;display:inline-block;background:var(--beta);border-color:var(--beta);color:#fff">Your question</div>':''}<h3>${x.q}</h3>
<div class="ans"><div class="who"><span class="ph" style="background:var(--red)">AB</span><div>Dr. Aisha Bergeron<div class="small">Verified expert · U of Toronto</div></div></div><p style="margin:10px 0 0">${x.a}</p></div>
<button class="pcount" onclick="go({screen:'detail',open:${x.id}})">👥 ${x.n} participants asked ›</button></div>`}).join('')+`</div>`}
function all(){return `<div class="sec">${[['ladyofavalon7','May 13','Strongly yes','Do I need to worry about prices going up?'],['Tyler Bloomfield','Apr 10','It’s complicated','Conversation Host: share your questions and an expert will respond.']].map(p=>`<div class="post"><div class="who"><span class="ph">${p[0][0].toUpperCase()}</span><div>${p[0]}<div class="small">${p[1]}</div></div></div><span class="chip">${p[2]}</span><div>${p[3]}</div></div>`).join('')}</div>`}
function detail(){const x=Q.find(y=>y.id==s.open);return `<div class="sec"><button class="back" onclick="go({screen:'space',tab:'answered'})">‹ Answered questions</button>
<div class="q"><h3>${x.q}</h3><div class="small">${x.n} participants asked · posts below sorted oldest first</div></div>`+
x.posts.map(p=>`<div class="post"><div class="who"><span class="ph">${p[0][0]}</span><div>${p[0]}<div class="small">${p[1]}</div></div></div><p style="margin:8px 0 0">${p[2]}</p></div>`).join('')+`<div class="small" style="padding-top:12px">+ ${x.n-x.posts.length} more similar posts</div></div>`}
function space(){return `${hdr()}<div class="hero" style="padding-top:18px"><h1>Are you following the tariff story? Ask us anything.</h1><div class="meta"><span>👥 204 participants</span><span class="av">CBC</span></div></div>
<div class="tabs"><button class="tab ${s.tab=='all'?'on':''}" onclick="go({tab:'all',hl:false})">All posts</button><button class="tab ${s.tab=='answered'?'on':''}" onclick="go({tab:'answered'})">Answered questions<span class="dot">3</span></button></div>${s.tab=='all'?all():answered()}`}
function render(){app.innerHTML={launch,story,video,email}[s.screen]?.()||(s.screen=='detail'?hdr()+detail():space());if(s.screen=='launch')app.insertAdjacentHTML('beforeend','<div class="note">Clickable prototype · mock data</div>')}
render();
</script></body></html>
